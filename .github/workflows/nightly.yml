name: Nightly

# The end-to-end run, against both CLIs.
#
# OpenTofu is a fork, not a rename, and a provider that only ever runs under
# terraform finds out about the differences from whoever files the issue. The
# demo drives the whole lifecycle against a local fake and needs no credential,
# so there is no reason not to run it on both every night.
on:
  schedule:
    # 02:30 UTC, off the hour so it does not queue behind everything else.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One nightly at a time. A run started by hand while the scheduled one is
# going waits for it, so two runs never report on the issue at once.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.10"

jobs:
  demo:
    name: demo (${{ matrix.cli }})
    runs-on: ubuntu-latest
    strategy:
      # Both CLIs always run. Without this one failure hides the other, which
      # is the one case this job exists to catch.
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Both CLIs pinned, as ci.yml pins terraform, so a nightly that turns
      # red is the provider's change or the fake's and not a CLI that shipped
      # that day. scripts/check-workflow-actions.sh holds every job to one
      # version of each. Raise them deliberately, in every workflow at once.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        id: setup-terraform
        if: matrix.cli == 'terraform'
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2
        if: matrix.cli == 'tofu'
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - name: demo
        env:
          TF_BIN: ${{ matrix.cli }}
        run: make demo
      # terraform only. terraform-plugin-testing builds a
      # registry.terraform.io provider address and relies on terraform's
      # reattach behaviour, so under tofu it tries to download the provider
      # from registry.opentofu.org and fails. Tofu's coverage is the demo
      # above, which drives the same lifecycle.
      - name: acceptance
        if: matrix.cli == 'terraform'
        run: make testacc
      # A perpetual difference is a defect, and the check for it runs
      # on a schedule. `make testacc` above already includes it. This runs it
      # again on its own, whether or not the demo or acceptance step
      # passed, so a failure names the requirement rather than hiding
      # among the rest of the suite. It needs the setup, though: it runs only
      # once setup-terraform has succeeded, which it can't do after anything
      # before it failed. Terraform only, for the same reason as the
      # acceptance step. How the same check runs against a live stack is in
      # TESTING.md under `make drift`.
      - name: perpetual diff
        if: ${{ !cancelled() && matrix.cli == 'terraform' && steps.setup-terraform.outcome == 'success' }}
        run: make drift
      # The published performance figures, held to account. It
      # runs the benchmark docs/performance.md describes at the sizes and the
      # -parallelism the published limit rests on, and fails when a figure
      # breaks internal/tools/bench/budget.json: more requests a resource, a
      # list read per resource that wasn't there, plan or refresh time a
      # resource that grows with the size of the configuration, or a time
      # past the limit's headroom. The figures are printed in the log either way. Terraform
      # only, since the published figures and the budget are Terraform's, and
      # most of a large apply's time is the CLI's own work rather than the
      # provider's. On its own condition like the step above, so a red
      # benchmark names itself.
      - name: performance budget
        if: ${{ !cancelled() && matrix.cli == 'terraform' && steps.setup-terraform.outcome == 'success' }}
        run: make bench BENCH_SIZES=100,500,1000 BENCH_PARALLELISM=10 BENCH_BUDGET=internal/tools/bench/budget.json

  # The committed release key, read without any secret. It fails when the
  # signing subkey or the parent has under 90 days left, so a red nightly says
  # so while there's still time to rotate, and hands what's due to rotate to
  # signing-key-reminder. The secret itself is checked by
  # release-signing-check.yml.
  signing-key:
    name: signing key dates
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.dates.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The output is written before the step's own result, so a key near
      # expiry fails the job and still reaches the reminder.
      - name: the committed signing key isn't near expiry
        id: dates
        run: |
          status=0
          SIGNING_KEY_DUE_FILE="$RUNNER_TEMP/due" make signing-key-check || status=$?
          {
            echo "due<<DUE_END"
            if [ -f "$RUNNER_TEMP/due" ]; then cat "$RUNNER_TEMP/due"; fi
            echo "DUE_END"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

  # One open issue while the key is due to rotate, so the yearly rotation
  # reaches a person rather than a log annotation. Its own job, so the
  # issues token never sits in a job that runs make. It opens the issue, or
  # updates the open one, and closes it once nothing is due.
  # scripts/signing-key-reminder.sh has the rules.
  signing-key-reminder:
    name: signing key rotation reminder
    needs: signing-key
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: open, update or close the signing-key-rotation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DUE: ${{ needs.signing-key.outputs.due }}
          RESULT: ${{ needs.signing-key.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' "$DUE" > "$RUNNER_TEMP/due"
          ./scripts/signing-key-reminder.sh "$RUNNER_TEMP/due"

  # A failed scheduled run only emails whoever last touched the schedule, so
  # nobody else hears of it. One open issue, found by its label, says the
  # nightly is red. A failure opens it. A later failure edits its body to name
  # the latest run, and comments only when the set of failing steps changed,
  # so a red week is one notification, not seven. A pass closes it. A
  # cancelled or skipped run says nothing either way.
  report:
    name: report the result
    needs: [demo, signing-key]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: open, update or close the nightly-failing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEMO: ${{ needs.demo.result }}
          SIGNING_KEY: ${{ needs.signing-key.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="nightly-failing"
          # Red if either job failed, green only if both passed.
          RESULT=other
          if [[ "$DEMO" == failure || "$SIGNING_KEY" == failure ]]; then
            RESULT=failure
          elif [[ "$DEMO" == success && "$SIGNING_KEY" == success ]]; then
            RESULT=success
          fi
          number="$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty')"
          if [[ "$RESULT" == success ]]; then
            [[ -z "$number" ]] || gh issue close "$number" --comment "Passing again: $RUN_URL"
            exit 0
          fi
          [[ "$RESULT" == failure ]] || exit 0
          failing="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | .name as $job
              | (.steps[] | select(.conclusion == "failure") | "\($job): \(.name)")' | sort -u | paste -sd ';' -)"
          [[ -n "$failing" ]] || failing="a job failed before any step"
          body="$(printf 'The nightly is failing.\n\nFailing: %s\nLatest failing run: %s\n\n<!-- failing: %s -->\n' "$failing" "$RUN_URL" "$failing")"
          if [[ -z "$number" ]]; then
            gh issue create --title "Nightly is failing" --label "$label" --body "$body"
            exit 0
          fi
          before="$(gh issue view "$number" --json body --jq '.body' | sed -n 's/^<!-- failing: \(.*\) -->$/\1/p')"
          gh issue edit "$number" --body "$body"
          [[ "$before" == "$failing" ]] || gh issue comment "$number" --body "Now failing: $failing. $RUN_URL"
