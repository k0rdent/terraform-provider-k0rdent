name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Raised from 1.24 by lane 1c, and not a preference: golang.org/x/net
  # v0.60.0 declares `go 1.26.0`, and Go will not build a module against a
  # dependency that requires a newer language version than the main module
  # declares.
  GO_VERSION: "1.26.9"

jobs:
  # Keeps build and module caches from being committed.
  tracked-ignored:
    name: no tracked ignored files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: check that no tracked file matches .gitignore
        run: scripts/check-tracked-ignored.sh

  # What tracked-ignored above does not cover. That job answers "is anything
  # here already forbidden"; this one answers "has the tree grown in a way
  # nobody meant", which is the question the 1.6 GB push would have failed
  # first: the cache averaged 38 KB a file, so no size rule caught it and
  # counting did.
  #
  # Like tracked-ignored, it needs no client checkout and no App token, so it
  # cannot be taken down by the thing that took every other job in this
  # repository's history down.
  hygiene:
    name: repo hygiene and signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # rev-list needs the history, and the signature check walks the range
          # this event introduced.
          fetch-depth: 0
          persist-credentials: false
      - name: repository hygiene
        run: ./scripts/repo-hygiene.sh
      - name: the hygiene gates can still fail
        run: make hygiene-test
      - name: shell blocks in the docs paste into zsh
        run: make doc-commands
      - name: the doc-commands gate can still fail
        run: make doc-commands-test
      - name: the public-text gate can still fail
        run: make public-text-test
      # Needs bash, python3 and jq, and no client checkout: curl and go are
      # shims, and the only server is on 127.0.0.1.
      - name: the live scripts keep credentials on https and off the command line
        run: make script-credentials-test
      - name: the storage run cleans up and ignores KUBE_* settings
        run: make live-storage-script-test
      - name: the helpers the scripts share
        run: make script-lib-test
      # shellcheck comes with the ubuntu-latest image.
      - name: shellcheck the scripts
        run: make shellcheck
      - name: work out what this event added
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # A first push to a branch reports an all-zero base, and a
          # workflow_dispatch reports none at all. Both mean "no range to
          # compare", so check the head commit alone rather than the whole
          # history of the repository.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "range=${HEAD}~1..${HEAD}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
          fi
      - name: every commit is signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-signatures.sh "${{ steps.range.outputs.range }}"

  # The deny-list in .github/public-text/: ticket keys, internal links and
  # hosts, people, home paths, deal names and AI trailers. GitHub's secret
  # scanning can't hold custom patterns on a public repository, so this is
  # the only gate for them.
  public-text:
    name: public text
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: no text that isn't for a public repository
        run: make public-text-check

  # gitleaks over the tracked tree, and over every commit this event adds, so
  # a secret added then removed inside one pull request is still caught. The
  # CLI, pinned and checksum-checked by scripts/check-secrets.sh, not
  # gitleaks-action, which needs a license on an organization's repositories.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the secrets gate can still fail
        run: make secrets-test
      - name: no secrets in the tracked files
        run: make secrets-check
      - name: no secrets in the commits this event adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # The same range as the signature check in the hygiene job. No base,
          # or an all-zero one, means a first push or a dispatch: the tree
          # scan above is the whole check then.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No range for this event. The tree scan covers it."
            exit 0
          fi
          ./scripts/check-secrets.sh --range "${BASE}..${HEAD}"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: make build
      - name: cross-compile for every release platform
        run: make cross-build
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: provider name audit
        run: make name-audit
      - name: the generated API client matches its spec
        run: make client-check

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        run: make test
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - name: acceptance
        run: make testacc

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9  # v8.0.0
        with:
          version: v2.13.2
          args: --timeout=5m

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Gate S6. Both modules: the provider here, tools/providerbar in the
      # research tree, which has its own CI. It scans twice, under GO_VERSION
      # and under the release Go in .go-release-version, because standard
      # library advisories belong to the Go govulncheck runs under.
      - name: reachable known vulnerabilities
        run: make vulncheck

  docs:
    name: generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: .go-release-version
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "1.16.3"
      - name: verify generated provider documentation
        run: make docs-check

  against-fake:
    name: against the fake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - name: plan the examples against the fake, over both tiers
        run: make plan-fake

      - name: the hardware walkthrough works as written
        run: make walkthrough-test

      - name: the curl walkthrough works as written
        run: make walkthrough-api-test

  # Its own job because the walkthrough already takes most of that job's
  # time, and this applies the same directories again.
  plan-quality:
    name: plan quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - name: refresh-only plans find nothing, and plans stay within the unknown budget
        run: make plan-quality

  release-validation:
    name: release artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: verify release dispatcher configuration
        run: make release-config-test
      # Every job that holds a secret also runs actions from other
      # repositories, so this keeps each of them pinned to a commit.
      - name: verify action pins and checkout credentials
        run: make workflow-actions-test
      # Nothing else runs these two.
      - name: verify the major version gate
        run: make major-release-gate-test
      - name: verify the setup doctor
        run: make doctor-script-test
      # The rehearsal takes most of this workflow's time, and a pull request
      # that touches no release input cannot change its result. The build job
      # still compiles every platform. Pushes and tags always rehearse.
      - name: did this change a release input
        id: inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # The diff is taken first, so a git failure fails the step instead
          # of reading as "nothing changed" and skipping the rehearsal.
          rehearse=true
          if [ -n "$BASE" ]; then
            changed="$(git diff --name-only "$BASE" HEAD)"
            if ! echo "$changed" |
              grep -E '^(\.goreleaser\.yaml|\.go-release-version|terraform-registry-manifest\.json|main\.go|go\.(mod|sum|work)|\.syft\.ya?ml|Makefile|scripts/.*(release|manifest).*|\.github/)' >/dev/null; then
              rehearse=false
            fi
          fi
          if [ "$rehearse" = false ]; then
            echo "No release input changed, so the release rehearsal is skipped."
            echo "rehearse=false" >> "$GITHUB_OUTPUT"
          else
            echo "rehearse=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        if: steps.inputs.outputs.rehearse == 'true'
        with:
          go-version-file: .go-release-version
          cache: true
      # goreleaser shells out to syft for the SBOMs, so this job needs it as
      # much as the signing job does. Without it `make release-validate` fails
      # at the catalog step, which is the one thing about a release this job
      # exists to rehearse. Same commit pin as release-dispatch.yml, for the
      # same reason: an SBOM generator that changes underneath a release
      # changes the release.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        if: steps.inputs.outputs.rehearse == 'true'
      - name: build and verify unsigned release artifacts
        if: steps.inputs.outputs.rehearse == 'true'
        run: make release-validate

  # Branch protection requires a context named CI, and GitHub publishes one per
  # job, not per workflow. A skipped required check satisfies protection, so a
  # bare needs would pass here.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()
    needs:
      - tracked-ignored
      - hygiene
      - public-text
      - secrets
      - build
      - test
      - lint
      - vulncheck
      - docs
      - against-fake
      - plan-quality
      - release-validation
    steps:
      - name: require every job to have succeeded
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS"
          not_ok=$(printf '%s' "$JOB_RESULTS" |
            jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$not_ok" ]; then
            echo "::error title=CI did not pass::$(printf '%s' "$not_ok" | tr '\n' ' ')"
            exit 1
          fi
          echo "all jobs succeeded"
