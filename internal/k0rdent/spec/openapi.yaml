        **Visibility:** `internal` · `public` (x-visibility)

        Retrieve one peering created under this VPC. A peering that exists in the project but hangs off a different VPC returns 404 through this path.
      tags:
        - vpc-peerings
      x-visibility:
        - internal
        - public
      responses:
        '200':
          description: VPC peering details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPCPeering'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectRegionMismatch'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteVPCPeering
      summary: Delete VPC peering
      description: |
        **Visibility:** `internal` · `public` (x-visibility)


        Withdraw THIS side of the peering. The peering transitions to `state: deleting` and is removed once the fabric declaration is torn down.
        The counterpart project's peering is not affected: it remains as a half-open declaration pointing at your VPC, and stops carrying traffic. Clearing it is that project's call.
        An explicit delete is not the only way a peering is removed: deleting the cluster or instance group that owns its `localVpc` removes it too, since that VPC ceases to exist.
        Losing the REMOTE end is the asymmetric case. When the cluster or instance group owning the VPC named in `remoteVpc` is deleted, your peering is NOT removed: it stays listed and `active`, names a VPC that no longer exists, and carries no traffic. Clearing it is yours to do, and this operation is one of the two ways — the other is deleting the owner of your own `localVpc`, whose teardown removes it along with that VPC's other peerings. It does not hold up that teardown in the meantime.
      tags:
        - vpc-peerings
      x-visibility:
        - internal
        - public
      responses:
