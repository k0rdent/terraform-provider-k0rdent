          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete project
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Delete a project and tear down its dedicated Kubernetes namespace.

        Asynchronous, and a 204 does NOT mean the project is gone. The project moves
        to `status: deleting` and stays visible to GET and LIST while its namespace
        is removed on the management cluster and on every configured region. It
        disappears only once the teardown reports completion, so poll
        `GET .../projects/{id}` and treat the first 404 as the success signal. The
        namespace may still be terminating after that: objects inside it holding
        finalizers can keep it there.

        While a project is `deleting` its identifier stays reserved and it accepts no
        new work — a cluster create in it is rejected with 409. Both matter.
        Releasing the identifier at acceptance would let a new project take the name
        while the old teardown was still running, and that teardown would then delete
        the new project's namespace; allowing new clusters would let a create
        re-create the namespace after the teardown removed it, leaving the namespace
        behind with no project to own it.

        Tear down the project's clusters first. A delete is refused with 409 while
        the project still holds clusters, because removing the namespace would remove
        every object inside it — including the ClusterDeployment resources backing
        those clusters — without their normal teardown running. CAPI would never
        reconcile them, leaving the clusters listed by the compute API with their node
        reservations still held while their Kubernetes objects were gone. This check
        is best-effort: it reads the quota records the platform already keeps, so it
        cannot see a cluster created while quota enforcement was unconfigured, or one
        admitted under the quota fail-open override before the reconcile sweep caught
        up.

        Two exceptions to the contract above, both on deployments that cannot
        schedule a teardown at all — no workflow integration configured, or an
        identifier too long to have ever named a namespace. There the project is
        deleted outright and 204 means what it says, because no completion report
        will ever arrive. The service logs an Error naming the namespace it left
        behind, and reports the disabled integration at startup.

        Once the delete finalizes, the project's id becomes available for reuse:
        creating a project with the same id afterwards succeeds. It is not available
        before then, so wait for the first 404 rather than retrying a create. Before
        the id is released, the project's project-scoped service accounts are
        disabled, its IAM role bindings are purged, and its quota limits are
        removed, so a re-created project does not inherit them. That is the order
        the service uses, and the first two are deliberately in that sequence.

        Disabling the service accounts is a side effect worth planning for: a
        service account scoped to this project stops authenticating once the delete
        finalizes, because its roles are held on the account itself rather than as
        bindings, and would otherwise pass to a project re-created with this id.
        Provision a new service account against the new project rather than reviving
        the old one.

        Reviving one is possible and is not safe: the disable leaves the account's
        roles in place, and setting its status back to `active` restores them
        against whatever project now holds this id, with no check that the id still
        names the same project. Anyone with permission to update service accounts in
        the organization can do it, so treat these accounts as retired rather than
        as suspended.

        Project-scoped API keys are NOT disabled at all, so treat any that named
        this project as still live and revoke them explicitly.

        Granting
        a member's roles through this API is refused with 409 while the project is
        `deleting`, which narrows the window in which a grant can slip in behind the
        purge without closing it: the refusal is decided before the grant is
        written, so a grant already in flight can still land after the purge, and on
        the two immediate-delete deployments described above there is no `deleting`
        window for it to refuse in at all. A binding created directly through the
        IAM policy API is not covered either, because IAM has no notion of a
        project's lifecycle. Treat "wait for the 404, then grant" as the rule rather
        than relying on the refusal.

        The binding purge and the quota clear run as part of the step that releases
        the id, so if they cannot complete, the project keeps its id. On the normal path the platform retries
        it automatically, so a failure there is self-healing; if the failure lands
        after the bindings were purged, the members are locked out until that retry
        converges. On the two deployments described above, where the delete completes
        immediately because no teardown could be scheduled, nothing retries it, so
        repeat the DELETE; there the same lockout lasts until a human does, because
        the role bindings can have been purged before the write that was supposed to
        finish the delete failed. Retrying the DELETE completes it; keeping the
        project instead means re-granting its bindings.

        Two limits apply to a re-created project. First, its predecessor's resources
        in other services (networks, subnets, VPCs and the like) key the project id
        and are NOT removed by this call, so they remain addressable under the new
        project; the 409-while-it-holds-clusters check above reduces the cluster part
        of that exposure, and only that part: it counts clusters, so resources of
        every other kind are not covered by it, and even for clusters it is a
        best-effort check rather than a proof. Its own caveat above says why it
        cannot see a cluster created while quota enforcement was unconfigured or
        admitted under the fail-open override, and a ledger read that fails lets the
        delete through as well. Second, quota consumption is accounted per
        organization rather than per project, so deleting a project does not free
        quota; the resources it held must themselves be deleted.
      operationId: deleteProjectInOrg
      x-status: mvp
      x-visibility:
        - internal
        - public
      tags:
        - projects
      responses:
        '204':
          description: |
            Delete accepted. The project is now `deleting` and its namespace teardown
            has been scheduled; it is not yet gone. On a deployment that cannot
            schedule a teardown, the project is deleted outright.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/regions/global/organizations/{orgId}/quota:
    parameters:
      - name: orgId
        in: path
        required: true
        description: Unique organization identifier
        schema:
          type: string
    get:
      summary: Get the organization's quota view
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Read the organization's tenant-scope quota: one row per dimension that is limited, or enforced with recorded usage, with its unit, whether it is enforced, and a single `tenant` entry in `scopes` carrying the configured limit, recorded usage, headroom and over-limit flag. Usage is summed across regions. A dimension the admission check does not refuse on (nothing charges it, or its enforcement is switched off) reports enforced false and omits used and headroom rather than showing 0. An organization that holds no limits of its own is not an error; its rows report usage with limit and headroom absent (unlimited). The top-level limit, used and remaining are deprecated in favor of scopes. Returns 404 if the organization does not exist or the caller is not scoped to it.
      operationId: getTenantQuota
      x-status: mvp
      x-visibility:
        - internal
        - public
      tags:
        - quota
      responses:
        '200':
          description: Tenant quota view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantQuotaView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/global/organizations/{orgId}/projects/{id}/quota:
    parameters:
      - name: orgId
        in: path
        required: true
        description: Unique organization identifier
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Project identifier within the organization
        schema:
          type: string
    get:
      summary: Get a project's quota view
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Read a project's quota: the same rows as getTenantQuota, with the project's own scope after the organization's in `scopes` when the project has a quota assignment of its own. The organization's and the project's limits are independent gates, so `headroom` is the smaller remaining across them and `bindingScope` names the one it came from; a project limit above the organization's is legal and usually shows the organization as binding, but the project binds when its own usage leaves it the smaller headroom (for example when both scopes are over their limits). A project with no assignment of its own is bounded by its organization alone and has only the `tenant` scope. The organization's limit and usage are totals across every region it uses; a project is locked to one region, so its own limit and usage are that region's. The deprecated top-level limit, used and remaining carry the organization scope's values. Returns 404 if the organization or the project does not exist, the project belongs to another organization, or the caller is not scoped to the organization.
      operationId: getProjectQuota
      x-status: mvp
      x-visibility:
        - internal
        - public
      tags:
        - quota
      responses:
        '200':
          description: Project quota view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantQuotaView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/global/auth/token:
    post:
      operationId: mintToken
      summary: Mint access token
      description: |
        **Visibility:** `public` · `internal` (x-visibility)

        Exchange a credential for a self-contained JWT access token.
        This endpoint proxies to the underlying identity provider
        for token issuance.

        Three grant types are supported. Interactive sign-in does not use this
        endpoint: it goes through `login/initiate` and the login callback, which
        record a session and set the `k0r_refresh_token` cookie.

        **api_key** — Programmatic access via an API key. The caller
        presents the opaque, prefixed API key token. Effective privileges
        are evaluated as the intersection of the key's role list (if set)
        and the creating user's current roles within the key's scope. An
        organization- or project-scoped key's token carries only that
        organization or project and no platform roles; a project-scoped
        key's token also carries no organization-level roles.

        **client_credentials** — Service account authentication. The
        caller presents a client_id and client_secret pair. Effective
        privileges are the service account's directly assigned roles
        within its scope.

        **refresh_token** — Renew an access token without re-authenticating.
        The caller presents a previously issued refresh token to obtain a new
        access token. Browser clients present it via the httpOnly
        `k0r_refresh_token` cookie (set by the login callback and rotated on each
        refresh) rather than the request body; non-browser callers send it in the
        body. On success the rotated refresh token is delivered via `Set-Cookie`
        for cookie-based callers (and omitted from the response body for them) and
        in the response body for body-based callers.

        All grant types accept optional `scope_narrowing`, which mints an
        access token limited to one organization or project, to a subset of
        roles, or both (see `ScopeNarrowing`). Asking for an organization,
        project or role the credential does not hold returns `403`.
      tags:
        - token
      x-visibility:
        - public
        - internal
      x-status: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - grant_type
              discriminator:
                propertyName: grant_type
                mapping:
                  api_key: '#/components/schemas/ApiKeyGrant'
                  client_credentials: '#/components/schemas/ClientCredentialsGrant'
                  refresh_token: '#/components/schemas/RefreshTokenGrant'
              oneOf:
                - $ref: '#/components/schemas/ApiKeyGrant'
                - $ref: '#/components/schemas/ClientCredentialsGrant'
                - $ref: '#/components/schemas/RefreshTokenGrant'
      responses:
        '200':
          description: Token successfully minted.
          headers:
            Set-Cookie:
              description: |
                Sets the httpOnly, Secure, SameSite `k0r_refresh_token` cookie —
                scoped to this endpoint's path — carrying the issued/rotated refresh
                token, keeping it out of the URL. Set only on the `refresh_token`
                grant; when that refresh was sourced from the cookie, the rotated
                token is delivered via this header only and omitted from the
                response body. Not set for machine grants (`client_credentials`,
                `api_key`), which have no refresh token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/regions/global/organizations/{orgId}/iam/roles:
    parameters:
      - $ref: '#/components/parameters/OrganizationPathParam'
    get:
      operationId: listRoles
      summary: List RBAC roles
      description: |-
        **Visibility:** `public` · `internal` (x-visibility)

        List the roles that can be bound in this organization: the built-in roles and the organization's custom roles whose `scopes` include `org` or `project`. Roles bindable only at platform scope are not listed here; they are listed by `GET /v1/regions/global/iam/platform/roles` and remain readable by id through `getRole`. The filter reads only each role's `scopes`, never the caller, so every principal listing the same organization receives the same set. A role with mixed scopes (for example `iam-admin`, scopes `platform` and `org`) appears both here and in the platform list. `totalCount` counts this filtered set.
      tags:
        - roles
      x-visibility:
        - public
        - internal
      x-status: mvp
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/global/organizations/{orgId}/iam/service-accounts:
    parameters:
      - $ref: '#/components/parameters/OrganizationPathParam'
    get:
      operationId: listServiceAccounts
      summary: List service accounts
      description: |
        **Visibility:** `public` · `internal` (x-visibility)

        List service accounts within the caller's tenant. Only tenant
        administrators can access this endpoint. Supports filtering by
        scope level, scope target, and status.
      tags:
        - serviceaccounts
      x-visibility:
        - public
        - internal
      x-status: mvp
      parameters:
        - name: scope
          in: query
          required: true
          description: Filter by scope level.
          schema:
            type: string
            enum:
              - organization
              - folder
              - project
        - name: scopeId
          in: query
          required: true
          description: |
            Filter by a specific scope target (folder ID or project ID).
            Typically used with the scope parameter.
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status.
          schema:
            type: string
            enum:
              - active
              - disabled
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated list of service accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/global/organizations/{orgId}/iam/service-accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationPathParam'
      - name: id
        in: path
        required: true
        description: Service account resource identifier.
        schema:
          type: string
    get:
      operationId: getServiceAccount
      summary: Retrieve service account details
      description: |
        **Visibility:** `public` · `internal` (x-visibility)

        Retrieve metadata for a single service account. Only tenant
        administrators can access this endpoint. Non-admin callers
        receive 404 to prevent resource enumeration.
      tags:
        - serviceaccounts
      x-visibility:
        - public
        - internal
      x-status: mvp
      responses:
        '200':
          description: Service account metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/global/organizations/{orgId}/iam/service-accounts/{serviceAccountId}/credentials:
    parameters:
      - $ref: '#/components/parameters/OrganizationPathParam'
      - name: serviceAccountId
        in: path
        required: true
        description: Service account resource identifier.
        schema:
          type: string
    get:
      operationId: listServiceAccountCredentials
      summary: List service account credentials
      description: |
        **Visibility:** `public` · `internal` (x-visibility)

        List credentials for a service account. Only tenant
        administrators can access this endpoint. The client_secret
        is never included in list responses.
      tags:
        - serviceaccounts
      x-visibility:
        - public
        - internal
      x-status: mvp
      parameters:
        - name: status
          in: query
          description: |
            Filter credentials by status.

            Filters on the stored `status` field, which a background sweep
            updates on an interval, so a credential that has only just
            passed `expiresAt` may still be returned by `status=active` for
            a short time. Compare `expiresAt` against the current
            time if you need an exact usable/unusable split.

            `status=expired` returns recent history, not a complete audit
            log. Expired credentials are deleted after a server-side
            retention period, so a credential that lapsed long enough ago is
            absent from this list entirely rather than returned as
            `expired`. The retention period is a deployment setting and is
            not exposed through the API. Do not treat this endpoint as the
            record of every credential a service account ever held.

            Because that deletion happens in the background, rows can be
            removed between one page request and the next, so a page boundary
            can shift under an offset-based scan of expired history. This is
            inherent to paginating a list whose rows expire, and it is scoped
            to expired history: active credentials are never deleted this
            way, so listing active credentials is unaffected. Do not rely on
            paging this endpoint for a stable snapshot of expired history.
          schema:
            type: string
            enum:
              - active
              - expired
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated list of credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountCredentialPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using OAuth2/OIDC tokens
  parameters:
    ClusterRuntimeEventLevelFilter:
      name: level
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - ok
            - info
            - warn
            - error
      description: Return only lines at any of the given levels; repeat the parameter per level.
    ClusterRuntimeEventOperationFilter:
      name: operation
      in: query
      required: false
      schema:
        type: string
      description: Execution id to scope to, or `all` for the whole retained history; omit for everything since the current or last operation started.
    ClusterRuntimeEventSinceFilter:
      name: since
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Return only lines that occurred at or after this instant.
    ClusterRuntimeEventStageFilter:
      name: stage
      in: query
      required: false
      schema:
        type: string
        enum:
          - reserving-hardware
          - configuring-network
          - configuring-access
          - deploying-cluster
          - bootstrapping-cluster
          - waiting-for-nodes
          - configuring-load-balancer
          - updating-cluster
          - reconciling-cluster
          - selecting-nodes
          - removing-nodes
          - releasing-hardware
          - deleting-cluster
          - cleaning-up
          - releasing-network
      description: Return only lines tagged with the given provisioning stage key.
    EffectiveObjectId:
      name: objectId
      in: query
      required: true
      schema:
        type: string
        pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
        minLength: 1
        maxLength: 63
      description: |
        The `id` of the object named by `objectKind`, within the caller's project —
        a cluster's `id`, an instance group's `id`, or a VPC's `id`. Not a `uid`.

        Required; omitting it is rejected with `422`. An id that does not resolve in
        the caller's project is `404`, and an id belonging to another project is
        indistinguishable from a missing one, deliberately.
    EffectiveObjectKind:
      name: objectKind
      in: query
      required: true
      schema:
        type: string
        enum:
          - cluster
          - instance_group
          - vpc
      description: |
        The kind of object to report the effective security groups of. Required
        together with `objectId`; omitting either is rejected with `422`, since the
        answer is only meaningful for one named object.

        A `cluster` or `instance_group` read returns the MERGED set — the object's own
        binding plus the floor of each VPC it materialized. A `vpc` read returns only
        that VPC's own binding; the owner's groups also filter traffic on interfaces
        inside it, and are read from the owner.

        `nodepool` is not accepted: a node pool's id is unique only within its parent,
        so it cannot be addressed by `objectId` alone, and pool-level scoping would be
        a second parameter alongside the owner rather than an object kind of its own.
        `instance` is not accepted either — an instance carries no reference to the
        node pool, cluster or instance group it belongs to, so there is no path from
        one to a security-group binding.

        An unrecognized value is rejected with `422` naming the accepted kinds, rather
        than with `404`, which would read as "your object does not exist".
    FileStoreConsumerFilter:
      name: consumer
      in: query
      required: false
      schema:
        type: string
      description: |
        Return only file stores that have the given consumer attached — matched
        against the `ref` of an entry in each store's `consumers` list. Because
        attachment is a field on the store rather than a separate resource, this is
        how the host-centric question is answered: "which stores is this address
        still holding" before decommissioning it.

        The value is a consumer `ref`, so it takes either shape that field takes: a
        literal IPv4 address, normalized the same way as a consumer `ref` so
        different spellings match, or the bare `id` of an instance group. There is no
        schema-level format because the two shapes differ; a value that is neither is
        rejected with `422` and `details[].reason: INVALID_ARGUMENT` rather than
        returning an empty list.

        **A group-valued filter matches the group `ref` only, never the addresses it
        resolved to.** Passing a group id finds the stores that entry was written on;
        passing the address of one of that group's members does not, because no entry
        on those stores has that address as its `ref`. The two questions are
        different — "which stores did I attach this group to" and "which stores did I
        attach this address to directly" — and the filter answers only the one that
        matches the shape it was given.

        Omit to return stores regardless of their consumers. Combined with the other
        filters using `AND`; the response envelope is unchanged.
    FileStoreShareTypeFilter:
      name: shareType
      in: query
      required: false
      schema:
        type: string
      description: |
        Return only file stores provisioned from the given capability class, as
        listed by `GET .../storage/share-types`. The question this answers is
        "how much capacity is committed against this class" when accounting for a
        project. Matching is exact; the value is a class id, never a vendor name.
        A value that is not a well-formed class id is rejected with `422` rather
        than returning an empty list. Omit to return stores of every class.
        Combined with the other filters using `AND`; the response envelope is
        unchanged.
    FileStoreStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - creating
          - active
          - deleting
          - failed
      description: |
        Return only file stores in the given lifecycle state. Valid values are
        `creating`, `active`, `deleting` and `failed`. The question this answers
        is "which stores are stuck or broken" — `creating` surfaces provisioning
        that has not converged, `failed` surfaces provisioning that gave up. Omit
        to return stores in every state. An unrecognized value is rejected with
        `422` rather than returning an empty list, so a typo cannot be mistaken
        for "no stores exist". Combined with the other filters using `AND`; the
        response envelope is unchanged.
    IncludeTotal:
      name: includeTotal
      in: query
      required: false
      description: |-
        Whether to compute `totalCount`. Defaults to `true`.

        Set to `false` to skip the count query on hot paths, or for callers that page through an entire collection and never need a page count. When `false`, `totalCount` is omitted from the response body.

        The offset style (`offset`, `limit`, `includeTotal`) and the deprecated cursor style (`pageToken`, `pageSize`) are mutually exclusive. Supplying any parameter from both styles in one request is rejected with 422 — the rule is style-wide, not pairwise, so `?offset=5&pageSize=10` and `?limit=5&pageToken=abc` are rejected too.

        With `includeTotal=false` the response carries neither `totalCount` nor `nextPageToken`, so the end-of-list rule published on the `offset` response field is not computable. Fall back to page length: a page shorter than the requested `limit` is the last page.
      schema:
        type: boolean
        default: true
    Limit:
      name: limit
      in: query
      required: false
      description: |-
        Maximum number of items to return in one page. Values outside the accepted range are rejected with 422 rather than clamped, so the page size applied is always the page size requested.

        The offset style (`offset`, `limit`, `includeTotal`) and the deprecated cursor style (`pageToken`, `pageSize`) are mutually exclusive. Supplying any parameter from both styles in one request is rejected with 422 — the rule is style-wide, not pairwise, so `?offset=5&pageSize=10` and `?limit=5&pageToken=abc` are rejected too.
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 500
    NetworkOwnerFilter:
      name: owner
      in: query
      required: false
      schema:
        type: string
        enum:
          - cluster
          - tenant
      description: |
        Filter by ownership. `cluster` returns only read-only, cluster-provisioned
        networks; `tenant` returns only tenant-writable networks. Omit for both.
    NetworkTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
          - evpn
          - infiniband
          - nvlink
      description: Filter to networks of the given fabric kind (exact match).
    NetworkVpcFilter:
      name: vpc
      in: query
      required: false
      schema:
        type: string
      description: |
        Filter to networks attached to the given fabric VPC (exact match). Matches
        only cluster-provisioned networks, which carry a `vpc`.
    Offset:
      name: offset
      in: query
      required: false
      description: |-
        Number of items to skip in the filtered, searched, and sorted result set. Zero-based, so `0` returns the first page. Combines with `limit` to select a page.

        An offset past the end of the result set is not an error: the response carries an empty items array, so a client holding a stale page number renders an empty page rather than an error. `totalCount` accompanies it unless the request set `includeTotal=false`, in which case no total is returned on any page.

        Clients must send identical filter, search, and sort parameters on every page request. Changing any of them changes the result set `offset` indexes into, so the client must reset `offset` to `0`.

        The offset style (`offset`, `limit`, `includeTotal`) and the deprecated cursor style (`pageToken`, `pageSize`) are mutually exclusive. Supplying any parameter from both styles in one request is rejected with 422 — the rule is style-wide, not pairwise, so `?offset=5&pageSize=10` and `?limit=5&pageToken=abc` are rejected too.

        Bounded above by the signed 32-bit maximum, `2147483647`. A larger value is rejected with 422 rather than wrapped. Any offset near the bound returns an empty page long beforehand, so this is a type-range ceiling and not a limit on how far a client may page.
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
        maximum: 2147483647
    OrganizationPathParam:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
      description: 'Organization slug — the public-facing identifier used in API paths and JWT `k0r.orgs[].org_id`. Examples: `vendor`, `provider`, `my-org`. The pattern accepts 1-63 chars starting with a lowercase letter, with no trailing hyphen, matching the canonical slug grammar. Empty or non-conforming values are rejected at the handler with 400.'
      example: vendor
    PageSize:
      name: pageSize
      in: query
      required: false
      deprecated: true
      x-deprecated-reason: >-
        Page sizing is being replaced by `limit`. Operations migrate individually; this parameter remains the only pagination style on operations that do not yet document `limit`.
      description: |-
        **Deprecated.** Page sizing is being replaced by `limit`.

        Maximum number of results per page. `0` is accepted and applies the default page size, so a client that cannot easily omit the parameter can still ask for the default. This differs from `limit`, which rejects `0`: `limit` is echoed back as applied, and a zero-length page is never a useful request.

        This component is shared, and operations are migrating individually. On an operation whose parameter list also documents `limit`, the two styles are mutually exclusive and supplying both is rejected with 422. An operation that does not yet document `limit` accepts only cursor pagination — consult that operation's own parameters.
      schema:
        type: integer
        default: 50
        minimum: 0
        maximum: 500
    PageToken:
      name: pageToken
      in: query
      required: false
      deprecated: true
      x-deprecated-reason: >-
        Cursor pagination is being replaced by offset pagination. Operations migrate individually; this parameter remains the only pagination style on operations that do not yet document `offset` and `limit`.
      description: |-
        **Deprecated.** Cursor pagination is being replaced by offset pagination (`offset` and `limit`).

        Opaque cursor for the next page. Retained for existing clients during the migration and removed in a future major version.

        This component is shared, and operations are migrating individually. On an operation whose parameter list also documents `offset` and `limit`, the two styles are mutually exclusive and supplying both is rejected with 422. An operation that does not yet document `offset`/`limit` accepts only cursor pagination — consult that operation's own parameters rather than assuming the offset style is available.
      schema:
        type: string
    ProjectPathParam:
      name: project
      in: path
      required: true
      schema:
        type: string
      description: Project identifier
      example: proj-a1b2c3d4
    RegionPathParam:
      name: region
      in: path
      required: true
      schema:
        type: string
      description: Region identifier
      example: us-texas-1
    SecurityGroupStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - creating
          - active
          - updating
          - deleting
          - failed
      description: |
        Return only security groups in the given lifecycle state. Valid values are
        `creating`, `active`, `updating`, `deleting` and `failed`. `deleted` is
        not accepted: tombstoned groups are excluded from live reads, so the
        filter would always match zero rows and is rejected with `422`. Omit to
        return groups in every live state. An unrecognized value is rejected with
        `422` rather than returning an empty list, so a typo cannot be mistaken
        for "no security groups exist".
    VPCClusterIDFilter:
      name: clusterId
      in: query
      required: false
      schema:
        type: string
      description: |
        Filter by the owning cluster. Only VPCs whose `ownerKind` is `cluster`
        and whose `ownerId` matches this value are returned.
    VPCInstanceGroupIDFilter:
      name: instanceGroupId
      in: query
      required: false
      schema:
        type: string
      description: |
        Filter by the owning instance group. Only VPCs whose `ownerKind` is
        `instance_group` and whose `ownerId` matches this value are returned.
    VPCOwnerFilter:
      name: owner
      in: query
      required: false
      schema:
        type: string
        enum:
          - cluster
          - instance_group
      description: |
        Filter by owner category. `cluster` returns only cluster-owned VPCs;
        `instance_group` returns only VPCs owned by a standalone instance
        group. Omit for all.
    VPCOwnerIDFilter:
      name: ownerId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Direct filter on the VPC's `ownerId` column. Prefer the
        `clusterId` / `instanceGroupId` shortcut params; use `ownerKind` +
        `ownerId` together when a caller wants to pass the exact
        `(owner_kind, owner_id)` pair. Passed without `ownerKind` this
        matches any owner-kind with the given id.
    VPCOwnerKindFilter:
      name: ownerKind
      in: query
      required: false
      schema:
        type: string
        enum:
          - cluster
          - instance_group
      description: |
        Direct filter on the VPC's `ownerKind` column. Prefer the
        `clusterId` / `instanceGroupId` shortcut params; use `ownerKind` +
        `ownerId` together when a caller wants to pass the exact
        `(owner_kind, owner_id)` pair. Alone (without `ownerId`) it narrows
        by kind — equivalent to `owner=<kind>` for the same enum values.
  schemas:
    AddressPool:
      type: object
      description: |
        AddressPool resource — a regional, admin-owned catalog of IP prefixes referenced by `ClusterType.networkSchema.subnets[].addressPool`. At cluster creation the platform allocates a CIDR from the pool for each materialized Subnet and exposes it on the resulting Subnet resource. Tenants do not allocate from an AddressPool directly; they only need `GET`/`LIST` access to resolve pool URIs referenced by ClusterTypes.
      required:
        - routable
        - ipVersion
        - prefixes
        - excludeRanges
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/networking/address-pools/pool-mgmt-v4
        uid:
          type: string
          format: uuid
          description: Server-generated unique identifier.
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        id:
          type: string
          description: Resource name. Client-provided or server-generated. Immutable once set. Pattern `[a-z]([-a-z0-9]*[a-z0-9])?`, 1-63 chars.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: pool-mgmt-v4
        displayName:
          type: string
          description: Human-friendly display name.
          example: Management network IPv4 pool
        description:
          type: string
          description: Free-form description.
        routable:
          type: boolean
          description: |
            When `true`, subnets allocated from this pool are reachable from outside the tenant VPC (shared regional VPC + per-tenant peering). When `false`, the pool's subnets are cluster-local. Immutable.
        ipVersion:
          type: string
          description: IP family for the pool. Currently IPv4-only. Immutable.
          enum:
            - IPV4
          example: IPV4
        prefixes:
          type: array
          description: 'One or more IP prefixes available for allocation. Prefixes within a single pool must not overlap each other; cross-pool overlap is intentionally not enforced in MVP.'
          minItems: 1
          items:
            type: string
            example: 10.0.0.0/8
          example:
            - 10.0.0.0/8
            - 172.20.0.0/14
        minPrefixLength:
          type: integer
          format: int32
          description: Minimum allocation prefix length. Defaults to `8` for IPv4.
          minimum: 0
          maximum: 32
          example: 8
        maxPrefixLength:
          type: integer
          format: int32
          description: Maximum allocation prefix length. Must be ≤ `32` for IPv4 (`/32` is the single-host case, e.g. a control-plane VIP subnet). Defaults to `30` for IPv4.
          minimum: 0
          maximum: 32
          example: 30
        excludeRanges:
          type: array
          description: |
            IPs or ranges within `prefixes` that must never be allocated. Forms: single IP `1.2.3.4`, CIDR `1.2.3.0/24`, or hyphenated range `1.2.3.10-1.2.3.15`. Always present; `[]` when none are excluded.
          items:
            type: string
          example:
            - 10.0.0.1
            - 10.0.0.10-10.0.0.20
        state:
          type: string
          description: Observed lifecycle state. `creating` while backend provisioning is in flight, `active` once ready, `updating` during a mutation, `deleting` during teardown, `failed` if backend provisioning errored.
          readOnly: true
          enum:
            - creating
            - active
            - updating
            - deleting
            - failed
        stateMessage:
          type: string
          readOnly: true
          description: Debug-only diagnostic for the current `state`; supersedes the deprecated `statusReason`, not stable across releases and not for verbatim display.
        statusReason:
          type: string
          description: Human-readable diagnostic shown when `state=failed` or a recoverable warning is active. Debug-only; not a stable client-parseable code.
          readOnly: true
          deprecated: true
        stateReason:
          allOf:
            - $ref: '#/components/schemas/StateReason'
          readOnly: true
          description: Machine-readable cause of a `failed` state; the stable counterpart to the free-text `statusReason`.
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 creation timestamp.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 last-modification timestamp.
          readOnly: true
    AddressPoolPage:
      type: object
      required:
        - addressPools
      properties:
        addressPools:
          type: array
          items:
            $ref: '#/components/schemas/AddressPool'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total address pools in the region, so `ceil(totalCount / limit)` is the page count. Pools are a regional catalog with no project partition and this list takes no filters, so the total is the size of the region's whole pool set.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    ApiKeyGrant:
      type: object
      required:
        - grant_type
        - api_key
      properties:
        grant_type:
          type: string
          enum:
            - api_key
        api_key:
          type: string
          description: |
            The opaque, prefixed API key token (e.g., plt_sk_...).
        scope_narrowing:
          $ref: '#/components/schemas/ScopeNarrowing'
    CancelClusterRequest:
      type: object
      description: |
        Request to cancel a cluster's in-flight operation. `executionId` pins the
        specific operation the caller intends to cancel: it must match the operation
        currently in flight, as read from the cluster's `operation.executionId`
        immediately before cancelling. If `executionId` does not match the operation
        now in flight — whether the cluster has since settled and begun a different
        operation, or a wrong id was supplied — the cancel is refused with `409`
        rather than aborting the operation now running, so a cancel acted on a stale
        view cannot stop the wrong operation.
      additionalProperties: false
      required:
        - executionId
      properties:
        executionId:
          type: string
          minLength: 1
          description: |
            The execution id of the operation to cancel. Echo the value from the
            cluster's `operation.executionId` read just before this request.
    ClientCredentialsGrant:
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
        client_id:
          type: string
          description: |
            Service account client identifier.
        client_secret:
          type: string
          description: |
            Credential secret for the service account.
        scope_narrowing:
          $ref: '#/components/schemas/ScopeNarrowing'
    Cluster:
      type: object
      description: 'Kubernetes cluster resource.'
      required:
        - id
        - uid
        - selfLink
        - nodePools
        - state
        - health
        - securityGroups
        - systemTags
        - tags
        - createdAt
        - updatedAt
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/compute/clusters/cls-0h2wq6dt5m8pjzk3xn4vbr7fcy
        uid:
          type: string
          description: Server-generated UUID.
          format: uuid
          readOnly: true
        id:
          type: string
          description: Name of the resource. Provided by the client when the resource is created, or generated by the server if not specified. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. Cannot be changed after the resource is created.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: cls-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Optional human-friendly display name for the cluster.
        description:
          type: string
          description: An optional description of this resource.
        clusterType:
          type: string
          format: uri-reference
          readOnly: true
          description: |
            URL of the specific ClusterType version this cluster is currently
            bound to. Set to the versioned URI the binding resolved to at creation
            time — an unversioned create is pinned to the latest `available`
            version, so this is always a versioned URL whichever form was sent —
            and advances to the requested target on a successful upgrade (upgrade
            always advances exactly one version — never a multi-version jump); a
            failed upgrade leaves it unchanged, since nothing new ever landed.
            Never changes any other way. Omitted for pre-cutover clusters that
            predate the ClusterType binding.
          example: /v1/regions/us-texas-1/compute/cluster-types/ct-0h2wq6dt5m8pjzk3xn4vbr7fcy/versions/1f2e3d4e-a5b6-7c8d-9e0f-a1b2c3d4e5f6
        clusterTypeName:
          type: string
          readOnly: true
          description: |
            Human-readable display name of the bound ClusterType version, for
            rendering a "Cluster type" column without dereferencing `clusterType`
            or making a second call. As-of-binding: reflects the name of the
            pinned version (the same version `clusterType` points to), so a later
            rename of the ClusterType's current version does not change it.
            Omitted for pre-cutover clusters with no binding.
          example: GPU Training
        nextAvailableClusterTypeVersion:
          type: string
          format: uri-reference
          readOnly: true
          description: |
            URL of the cluster's ClusterType's next `available` version beyond
            `clusterType`: the smallest `available` version on the same ClusterType
            greater than the bound one, skipping any `draft` or `deprecated`
            version in between. Purely informational — it advertises that a newer
            version exists and never implies the cluster will move to it
            automatically.

            Populated only on the read paths (`getCluster`, `listClusters`).
            Mutation responses — create, update, scale, security-group update —
            never populate it, so its absence there carries no information;
            re-read the cluster to learn whether a newer version exists.

            On `getCluster` and `listClusters`, presence is the signal: the field
            is omitted exactly when no readable `available` version *newer than
            the bound version* exists. That covers each of:

              - the cluster is already at the newest `available` version;
              - the ClusterType has no `available` version at all;
              - every `available` version is older than the bound one — e.g. the
                cluster is bound to a since-deprecated v2 while only v1 remains
                `available`. The field is still omitted: it never advertises a
                downgrade;
              - the bound ClusterType itself has been deleted. Its versions are
                no longer readable — every ClusterType endpoint reports it as
                not found — so the field advertises nothing rather than a URI
                that would `404`;
              - the cluster is a pre-cutover row with no ClusterType binding
                (`clusterType` is itself omitted).
          example: /v1/regions/us-texas-1/compute/cluster-types/ct-0h2wq6dt5m8pjzk3xn4vbr7fcy/versions/9c8b7a6f-5e4d-3c2b-1a0f-e9d8c7b6a5f4
        targetClusterTypeVersionId:
          type: string
          format: uuid
          readOnly: true
          description: |
            Target ClusterType version id (the cluster's next AVAILABLE version —
            not necessarily `clusterType`'s version + 1, since an intervening
            draft or deprecated version is skipped) while a ClusterType-version
            upgrade is in flight; omitted when no upgrade is in flight (the
            settled version is `clusterType`). `clusterType` advances to this
            value on success; on failure it is cleared and `clusterType` is left
            unchanged.
        nodePools:
          type: array
          description: |
            Fully materialized node pools — one entry per `ClusterType.nodePools[]`
            on the bound version. Every pool on the bound version is materialized and
            returned here whether or not the create request named it; a pool the
            request omitted materializes at the ClusterType's `nodeCountDefault` when
            that pool defines one, and otherwise the create is rejected with `422`
            (`nodeCount` must be supplied for a pool with no default).
            Each entry's `id` mirrors the corresponding `ClusterTypeNodePool.id` on
            the bound version; duplicates are impossible by construction. Always
            present; `[]` only when the bound version defines no pools.
          items:
            $ref: '#/components/schemas/ClusterNodePool'
        systemTags:
          type: object
          additionalProperties:
            type: string
          description: Server-owned tags. Always present; `{}` when there are none.
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
          description: |
            User-defined metadata labels for this cluster. Always present; `{}` when
            none were set (the server echoes an empty object, never `null` and never
            omitted).
        state:
          type: string
          readOnly: true
          enum:
            - creating
            - updating
            - deleting
            - active
            - failed
            - deleted
          description: |
            Lifecycle state of the cluster. `creating` / `updating` /
            `deleting` are transient; `active` is the steady state; `failed`
            indicates the last lifecycle transition failed (see
            `stateMessage`) and is not a stop condition for a poller — a
            watchdog-force-failed cluster may still return to `active` with no
            user action; `deleted` is a short-lived tombstone returned
            until the row is garbage-collected — clients should treat a
            subsequent `404` as the canonical end state.

            A cluster with a hosted control plane also shows `updating` while the
            platform rolls a change of its control plane settings into it, with the
            other actions refused (409) meanwhile. If that roll fails, the cluster
            turns `failed` and can be deleted; the platform's retry returns it to
            `active`. **Not yet applied:** declared ahead of its implementation.
        stateMessage:
          type: string
          readOnly: true
          description: Caller-safe detail for the current `state`; omitted when there is none and not stable across releases.
        stateReason:
          allOf:
            - $ref: '#/components/schemas/StateReason'
          readOnly: true
          description: Stable machine-readable form of the failure that put the cluster in `failed`; carried by failures recorded from this release onward, omitted otherwise.
        runtime:
          allOf:
            - $ref: '#/components/schemas/ClusterRuntime'
          readOnly: true
          description: |
            Advisory runtime status observed from the underlying
            ClusterDeployment. Observability-only; never reflects or drives
            the lifecycle `state`. Omitted until a runtime status has been
            observed.
        health:
          allOf:
            - $ref: '#/components/schemas/Health'
          readOnly: true
          description: |
            Canonical typed health for the cluster. Always present;
            observability-only and never drives the lifecycle `state`.
            `unknown` until the status-sync path populates it, and `unknown`
            (with a `reason`) while `state` is `creating` or `deleting`, even
            when a fresh observation exists. The
            `health` list filter matches this surfaced value.
        operation:
          allOf:
            - $ref: '#/components/schemas/Operation'
          readOnly: true
          description: |
            Reference to the cluster's current or last lifecycle operation.
        progressUpdatedAt:
          type: string
          format: date-time
          readOnly: true
          description: >-
            When the node pools' in-flight progress (`nodePools[].progress`) last changed. Present only while an operation is in flight and has reported progress.
        nodeCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Total number of nodes across all pools.
        storage:
          $ref: '#/components/schemas/ClusterStorage'
        controlPlane:
          allOf:
            - $ref: '#/components/schemas/ClusterControlPlane'
          readOnly: true
          description: Control-plane details, including the API server endpoint.
        controlPlatform:
          type: string
          format: uri-reference
          readOnly: true
          description: |
            Operator-only. On a cluster whose control plane is hosted on a Control
            Platform: that platform's URI. Shown only to callers holding
            `compute.controlplatforms.read`; absent otherwise. Populated on
            `getCluster`, `listClusters` and the create's response; other mutation
            responses omit it, so its absence there carries no information.
            **Not yet applied:**
            a create that would place the cluster's control plane is still refused
            (see `createCluster`), so no cluster carries it yet.
          example: /v1/regions/us-texas-1/compute/control-platforms/cp-prod-a
        backingControlPlatform:
          type: string
          format: uri-reference
          readOnly: true
          description: |
            Operator-only. On the backing Cluster of a managed Control Platform: the
            Control Platform whose host cluster it is. Such a Cluster with a hosted
            control plane carries both fields. Shown only to callers holding
            `compute.controlplatforms.read`; absent otherwise. **Not yet applied:**
            declared ahead of its implementation; always absent today.
          example: /v1/regions/us-texas-1/compute/control-platforms/cp-prod-a
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        securityGroups:
          type: array
          description: |
            Security groups filtering this cluster's machines, by id, within the caller's
            project. Order is significant and preserved end to end: the list reaches the
            fabric as sent. A group named both here and on one of this cluster's VPCs is
            applied once, at its position in this list. (Rule order WITHIN a group is
            significant too — see `SecurityGroupRules`.)

            Applied to EVERY NetworkBundle the cluster materializes, on one interface per
            bundle: the first ethernet — by sorted interface name — whose
            `connectToNetwork` names a network on a NICo-backed VPC. The groups of that
            network's VPC are appended after these, so a cluster-level group takes
            precedence over the VPC-wide floor.

            A cluster whose node pools have no such interface anywhere is rejected with
            `422`: only the NICo fabric has a security-group construct, so groups
            applied elsewhere would record a posture nothing enforces.

            Always present; `[]` when none. A group deleted out from under the binding
            is omitted rather than echoed, so every id listed here resolves.
          items:
            type: string
            pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
            minLength: 1
            maxLength: 63
          example:
            - sg-a1b2c3
            - sg-d4e5f6
    ClusterControlPlane:
      type: object
      description: |
        Control-plane details for the cluster. Read-only; populated as the control
        plane is provisioned. Absent until there is something to report.
      additionalProperties: false
      properties:
        endpoint:
          allOf:
            - $ref: '#/components/schemas/ClusterEndpoint'
          description: |
            Cluster API server endpoint. Populated from a different source per
            control-plane kind, and never from both:

            * **standalone** — for a ClusterType declaring a
              `controlPlane.vipSubnet`, the `url` is the allocated VIP
              (`https://<vip>:<apiServerPort>`), populated once the control plane
              is reachable and absent during early provisioning.
            * **hcp** — derived from the observed `K0smotronControlPlane`'s
              `spec.externalAddress` and `spec.service.apiPort`. It carries no
              `caCertificate`, because k0smotron reports no CA on that resource.
              It is absent until a resource carrying both an address and a
              usable port has been observed; no default port is assumed. "Usable"
              is the whole test on each half, and either one failing it leaves the
              endpoint absent while the `hosted` block is unaffected:

              * An address longer than a DNS name can be is discarded rather than
                shortened — a truncated host is still a well-formed one and would
                point a client somewhere else.
              * An address that cannot stand as the host of a URI is discarded
                too. k0smotron puts no pattern on the field, so a value carrying
                a space or any other character a host may not hold unescaped
                would otherwise be spliced into this `url`, which is declared
                `format: uri`. An IP literal or an ordinary name is unaffected.
              * A port outside the 16-bit TCP range is discarded rather than
                published. There is nothing to connect to above it, and a URL that
                cannot be dialled is worse than no URL: a caller can retry an
                absent endpoint, and can only fail on a malformed one.

            Retrieving a working kubeconfig does not depend on this field for
            either kind, so an absent endpoint does not block cluster access.
        hosted:
          allOf:
            - $ref: '#/components/schemas/HostedControlPlane'
          readOnly: true
    ClusterCreateRequest:
      type: object
      description: 'Request to create Kubernetes cluster.'
      additionalProperties: false
      required:
        - clusterType
      properties:
        kubernetesVersion:
          type: string
          description: |
            Desired Kubernetes version. Deprecated — accepted for backwards
            compatibility with clients that pre-date the ClusterType binding,
            but ignored: the version is determined by the bound ClusterType's
            ClusterTemplate. Listed here only so the schema's strict
            `additionalProperties: false` gate does not reject old payloads.
          deprecated: true
        id:
          type: string
          description: Name of the resource. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. If not specified, the server will generate a name.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: cls-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Optional human-friendly display name for the cluster.
        description:
          type: string
          description: An optional description of this resource.
        clusterType:
          type: string
          format: uri-reference
          description: |
            URL of the ClusterType to create this cluster from. The
            `/versions/{id}` segment is optional: omit it to bind the
            ClusterType's latest `available` version, or include it to pin a
            specific version (rejected with `422` when that version is not
            `available`). Required. The binding is resolved to that exact version
            and is immutable after creation, and the cluster reads back with
            `clusterType` pinned to the resolved versioned URL regardless of which
            form was sent.
          example: /v1/regions/us-texas-1/compute/cluster-types/ct-0h2wq6dt5m8pjzk3xn4vbr7fcy/versions/1f2e3d4e-a5b6-7c8d-9e0f-a1b2c3d4e5f6
        nodePools:
          type: array
          description: |
            Optional sparse per-pool overrides applied on top of the bound
            ClusterType version. The server materializes one node pool for
            every entry in `ClusterType.nodePools[]`, using each pool's
            `nodeCountDefault` when no override is supplied. Each entry's
            `id` must equal the `id` of a pool on the bound ClusterType
            version (unknown id ⇒ 422); duplicate ids ⇒ 422; pools omitted
            from this array materialize with ClusterType defaults.
          items:
            $ref: '#/components/schemas/ClusterNodePoolCreateRequest'
        auditPolicy:
          type:
            - string
            - 'null'
          description: |
            Optional control over the child cluster's API-server audit logging.
            Names the `ClusterAuditPolicy` to bind. Three cases:
            omit the field (or send `null`) to bind the platform default policy;
            send an explicit empty string `""` to opt the cluster out of audit
            logging (refused with **422** when the service runs in audit-compliance
            mode); send a non-empty value to bind that named policy. When non-empty
            it must be a valid Kubernetes object name (DNS-1123 subdomain, max 253
            chars).
          maxLength: 253
          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)?$
          example: k0rdent-child-v1
        storage:
          $ref: '#/components/schemas/ClusterStorage'
        tags:
          type: object
          additionalProperties:
            type: string
          description: User-defined metadata labels for this cluster.
        sshAccess:
          type: array
          maxItems: 32
          description: |
            Optional SSH access baked into every node at provisioning time — one or
            more Linux users, each with one or more authorized public keys, an
            optional sudo grant, and an optional displayName. Immutable after create
            (a key cannot be removed from a running cluster). Like every other cluster
            field, `sshAccess` does not require a client-supplied `id`; an omitted `id`
            is server-generated.
            A `sshPublicKeyCredentials` reference that fails to resolve (unknown, foreign, wrong type or placement) fails the create asynchronously with `INVALID_CONFIGURATION`.
          items:
            $ref: '#/components/schemas/SshUser'
        securityGroups:
          type: array
          description: |
            Security groups filtering this cluster's machines, by id, within the caller's
            project. Order is significant and preserved end to end: the list reaches the
            fabric as sent. A group named both here and on one of this cluster's VPCs is
            applied once, at its position in this list. (Rule order WITHIN a group is
            significant too — see `SecurityGroupRules`.)

            A VPC's platform-managed default group cannot be named here: it is
            attachable only to the VPC that owns it, and naming one is refused with
            `422`. It would also be redundant — a VPC's own groups already reach this
            cluster's network attachments through the VPC — and wrong, because those
            rules are derived from one VPC's subnet prefixes while a cluster-level
            group is rendered onto every node pool, including pools attached to other
            VPCs' networks.

            Applied to EVERY NetworkBundle the cluster materializes, on one interface per
            bundle: the first ethernet — by sorted interface name — whose
            `connectToNetwork` names a network on a NICo-backed VPC. The groups of that
            network's VPC are appended after these, so a cluster-level group takes
            precedence over the VPC-wide floor.

            A cluster whose node pools have no such interface anywhere is rejected with
            `422`: only the NICo fabric has a security-group construct, so groups
            applied elsewhere would record a posture nothing enforces.

            Unknown or cross-tenant ids are rejected with `422`, naming every
            unresolvable id at once; a group already being deleted does not resolve.
          maxItems: 16
          items:
            type: string
            pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
            minLength: 1
            maxLength: 63
          example:
            - sg-a1b2c3
            - sg-d4e5f6
    ClusterEndpoint:
      type: object
      description: |
        Cluster API server endpoint. Populated once the control plane is
        reachable; absent during early provisioning.
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Cluster API server URL.
          example: https://api.cls-0h2wq6dt5m8pjzk3xn4vbr7fcy.example.k0rdent.ai:6443
        caCertificate:
          type: string
          description: |
            PEM-encoded certificate bundle for the cluster's API server. Use
            this when configuring a kubeconfig that pins the CA out-of-band.
    ClusterNodePool:
      type: object
      description: |
        Node pool belonging to a Cluster — the minimal materialized counterpart of
        a `ClusterTypeNodePool`. `id` and `clusterTypeNodePoolId` both carry the
        slug of the source pool on the bound ClusterType version; structural fields
        (role/network/subnet/machineType) live on that bound `ClusterTypeNodePool`
        and are not echoed here. `displayName` is the exception — it is read-only and
        resolved from that bound `ClusterTypeNodePool`. `nodeCount` is the per-cluster
        override; `targetNodeCount` is the in-flight scale target.

        Mutability, scalability and defaults are properties of the bound
        `ClusterTypeNodePool`, not of this materialized pool, so they are not echoed
        here: dereference `clusterTypeNodePoolId` on the bound ClusterType version to
        obtain the scale bounds (`nodeCountMin` / `nodeCountMax`, each enforced only
        when set), the default (`nodeCountDefault`), and the `role`. `scaleCluster`
        admits a `nodeCount` change only within those bounds, and a control-plane-role
        pool is not scalable at all — a scale targeting one is rejected with `422`.

        `nodeCount` is the only client-mutable field on this pool, and it changes only
        through `scaleCluster` — not through `updateCluster` (which does not touch pools)
        nor by re-sending it on any request. The identity fields (`id`, `uid`,
        `clusterTypeNodePoolId`) and `createdAt` are fixed at materialization. The rest
        are server-managed and may change: `targetNodeCount` is set and cleared around a
        scale; `reservationId` appears once the pool is first reserved and then persists,
        naming the last reservation even after a scale to zero has released it;
        `displayName` is resolved from the bound
        `ClusterTypeNodePool`, so it (and `updatedAt`) follow the bound version when a
        ClusterType upgrade repoints the pool to the new version.
      additionalProperties: false
      required:
        - id
        - uid
        - clusterTypeNodePoolId
        - nodeCount
        - createdAt
        - updatedAt
      properties:
        uid:
          type: string
          description: Server-generated UUID.
          format: uuid
          readOnly: true
        id:
          type: string
          description: |
            Slug identifying this node pool within the cluster. Mirrors the
            source `ClusterTypeNodePool` slug on the bound version. Cannot be
            changed after creation.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: workers
        clusterTypeNodePoolId:
          type: string
          description: |
            Slug of the source `ClusterTypeNodePool` on the bound ClusterType
            version that this pool was materialized from. Equal to `id`.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          readOnly: true
          example: workers
        displayName:
          type: string
          readOnly: true
          description: |
            Human-friendly display name, resolved read-only from the bound
            `ClusterTypeNodePool`. Omitted when that pool has no display name.
        nodeCount:
          type: integer
          minimum: 0
          description: Settled number of nodes in the pool.
        targetNodeCount:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            Desired node count while a scale is in flight, and on a pool whose
            scale was force-failed until the retry window retires; omitted when
            the pool is idle (the settled count is `nodeCount`).
        reservationId:
          type: string
          format: uuid
          readOnly: true
          description: >-
            Infrastructure reservation most recently held for this pool. Absent until the pool is first reserved; a pool scaled to zero keeps the id of its last reservation, which has already been released, until the next scale-up reserves again. That scale-up may reserve under the same id, so an unchanged value does not mean the pool holds the same servers.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        progress:
          allOf:
            - $ref: '#/components/schemas/ClusterNodePoolProgress'
          readOnly: true
          description: >-
            In-flight progress while the cluster's operation runs, once the operation has reported progress for this pool. It can be absent early in an operation and for a pool the operation does not report on, and is always absent once the operation settles.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        instanceRefs:
          type: array
          readOnly: true
          description: |-
            Every instance this pool holds, as an id and the server it occupies, when the request asked for them with `includeInstanceRefs=true`. `[]` when the pool holds none, so an empty array means "none" and absence never does.

            Absent means exactly one thing here: you did not ask. Unlike the InstanceGroup embed, nothing auto-enables this one — a cluster read has no `showDeleted` — so an over-budget response is always one the caller named and is refused with `422` rather than silently dropped.

            The server slug is included because the instance id alone does not say which machine — a bare list of ids would send every caller straight back for the servers.

            The cheap half of the embed: both fields come from this service's own rows in a single query, with no call to the infrastructure service, so they are neither slowed nor omitted by that service being unreachable. What they cannot tell you is what each host is DOING — that needs `includeInstances` and the live read behind it. Complete rather than paged, and bounded by a response-wide limit — above which the array is never silently shortened: the request is refused with `422`.
          items:
            type: object
            required:
              - id
              - serverSlug
            properties:
              id:
                type: string
                pattern: ^inst-[0-9a-f]{32}$
                description: The instance's id — what `GET /compute/instances/{id}` takes.
                example: inst-8f14e45fceea467a9f1f9e1a2b3c4d5e
              serverSlug:
                type: string
                description: The infrastructure server this instance occupies.
                example: server-42bc614f
        instances:
          type: object
          readOnly: true
          description: |-
            A page of this pool's instances in full, when the request asked for them with `includeInstances=true`.

            The same envelope `GET /compute/instances` returns, deliberately: a caller decodes one shape whether it read them inline or followed the listing. The objects are identical to that endpoint's, because they are produced by the same code — including the per-instance rule that a host which cannot be attributed to its instance reports `state: unknown` and publishes nothing about the hardware. `degraded` means the host itself reported a problem, which is a different condition and the only one `inStates=degraded` finds.

            A PAGE, not the membership: a nested array cannot be paged, so an unbounded one would make this response unbounded. Follow `nextPageToken` on `GET /compute/instances?nodePoolUuid={uid}` to continue — the token is minted from the ordering that endpoint pages by, so it resumes rather than restarts.

            Only LIVE instances are embedded. A cluster read has no `showDeleted`, so unlike the InstanceGroup embed this page never interleaves tombstones and the continuation on `GET /compute/instances` resumes into the same set it came from.

            **Absent when the live host read could not answer** — for EVERY pool, and never a partial page. A page that carried only the members needing no read would be indistinguishable from a complete one, and its `nextPageToken` would skip the members that were dropped, so a caller following it would miss them permanently and silently. Absence is the only honest answer.

            Over budget is refused with `422`, never truncated — see `instanceRefs`.

            Unlike the single Instance endpoints, which fail with `503` because there the instance IS the response, a cluster read has its own content and does not fail over an enrichment — the same rule the InstanceGroup embed follows.

            `instanceRefs` is unaffected, because it needs no host read. When both are requested, it still names every instance the pool holds, so the membership survives an outage that costs the full objects. A caller that needs the host detail should read the instances listing, which reports the outage properly.
          properties:
            instances:
              type: array
              items:
                $ref: '#/components/schemas/Instance'
            nextPageToken:
              type: string
              description: Absent when the embed holds the pool's whole membership.
    ClusterNodePoolCreateRequest:
      type: object
      description: |
        Per-pool entry inside `ClusterCreateRequest.nodePools[]`. The pool itself
        is created by the server when materializing the cluster from the bound
        ClusterType; this entry only references the source `ClusterTypeNodePool`
        by `id` and sets its `nodeCount`. Role/network/machineType and any
        descriptive/tag fields are owned by the bound `ClusterTypeNodePool`.
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          description: |
            Slug of the source `ClusterTypeNodePool.id` on the bound
            ClusterType version. Unknown id (not on the bound version) ⇒ 422.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: workers
        nodeCount:
          type: integer
          minimum: 0
          description: |
            Override the number of nodes for this pool. Omit to use the source
            ClusterType pool's `nodeCountDefault`; must lie within
            `[nodeCountMin, nodeCountMax]` when those are set.
    ClusterNodePoolProgress:
      type: object
      description: >-
        In-flight progress of a cluster node pool while a cluster create, scale or upgrade runs (a cluster being deleted reports none): the servers of the pool's reservation by lifecycle state, and how many have a Ready Kubernetes node. Refreshed while the operation runs (see Cluster.progressUpdatedAt) and absent once it settles. Unlike `Cluster.operation.progress`, which counts the operation's stages, this counts the pool's servers.
      additionalProperties: false
      required:
        - servers
        - nodesReady
      properties:
        servers:
          type: object
          additionalProperties: false
          readOnly: true
          description: >-
            Servers held by the pool's reservation, each counted in `total` and in at most one other bucket. A server whose job is paused counts in the bucket of that job.
          required:
            - total
            - provisioning
            - provisioned
            - failed
            - deprovisioning
            - acquiring
            - releasing
          properties:
            total:
              type: integer
              minimum: 0
              description: >-
                Servers held by the pool's reservation, including those in no other bucket (claimed by the reservation but not yet moving). Once the pool's reservation is released, its servers are no longer counted.
            provisioning:
              type: integer
              minimum: 0
              description: Servers whose instance is being created.
            provisioned:
              type: integer
              minimum: 0
              description: Servers whose instance is ready.
            failed:
              type: integer
              minimum: 0
              description: Servers whose last lifecycle transition failed.
            deprovisioning:
              type: integer
              minimum: 0
              description: >-
                Servers being wiped after their instance was deleted, before they return to the reservation or leave it.
            acquiring:
              type: integer
              minimum: 0
              description: Servers joining the pool's reservation (a create, or the servers a scale-up adds).
            releasing:
              type: integer
              minimum: 0
              description: Servers leaving the pool's reservation (the servers a scale-down removes).
        nodesReady:
          type: integer
          minimum: 0
          readOnly: true
          description: Servers whose Kubernetes node is Ready.
    ClusterPage:
      type: object
      required:
        - clusters
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total live clusters in the project matching the active `state`, `health` and `search` filters, so `ceil(totalCount / limit)` is the page count for the current filter.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque token for the next page of results. Present only when more clusters remain; pass it back verbatim as `pageToken`.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    ClusterRuntime:
      type: object
      description: |
        Advisory runtime status observed from the underlying Kubernetes
        resource (the cluster's `ClusterDeployment`). Strictly
        observability-only — it never drives the lifecycle `state` machine and
        may lag or be absent. Present only once a runtime status has been
        observed; consumers read `observedAt` to judge staleness.
      additionalProperties: false
      required:
        - status
        - observedAt
      properties:
        status:
          type: object
          description: |
            Kind-specific runtime status payload extracted from the underlying
            Kubernetes object (for a ClusterDeployment: readiness, conditions,
            observedGeneration). Opaque shape — clients should treat unknown
            fields tolerantly.
          additionalProperties: true
        observedAt:
          type: string
          format: date-time
          readOnly: true
          description: |
            When the watcher last read the underlying Kubernetes object. Doubles
            as the staleness signal for this advisory block.
        resourceVersion:
          type: string
          readOnly: true
          description: |
            Opaque Kubernetes `resourceVersion` of the last observed runtime
            status. Provided for observability only; never compare numerically.
    ClusterRuntimeEvent:
      type: object
      description: One caller-safe line of the cluster's runtime event log.
      readOnly: true
      additionalProperties: false
      required:
        - occurredAt
        - level
        - component
        - message
      properties:
        occurredAt:
          type: string
          x-go-type: time.Time
          format: date-time
          readOnly: true
          description: When the underlying event occurred.
        level:
          type: string
          readOnly: true
          enum:
            - ok
            - info
            - warn
            - error
          description: Severity of the line.
        component:
          type: string
          readOnly: true
          enum:
            - cluster
            - machine
            - infrastructure
            - control-plane
            - services
          description: Part of the cluster the line is about.
        message:
          type: string
          readOnly: true
          description: Human-readable description of what happened.
        stage:
          type: string
          readOnly: true
          enum:
            - reserving-hardware
            - configuring-network
            - configuring-access
            - deploying-cluster
            - bootstrapping-cluster
            - waiting-for-nodes
            - configuring-load-balancer
            - updating-cluster
            - reconciling-cluster
            - selecting-nodes
            - removing-nodes
            - releasing-hardware
            - deleting-cluster
            - cleaning-up
            - releasing-network
          description: Provisioning stage key the line belongs to; absent when it maps to no single stage.
        operation:
          type: string
          readOnly: true
          description: Execution id of the operation in flight when the line was recorded; absent outside an operation.
    ClusterRuntimeEventList:
      type: object
      description: A page of cluster runtime event lines, oldest first.
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ClusterRuntimeEvent'
          example:
            - occurredAt: '2026-09-28T12:00:00Z'
              level: info
              component: machine
              message: Machine provisioning started
        cursor:
          type: string
          example: eyJrIjoic2VxIiwidiI6IjQyIiwiaWQiOiJteS1jbHVzdGVyIn0
          description: Opaque cursor after the last line, present only when `events` is non-empty and valid only for this cluster; on an empty page keep polling with the previous `after`.
    ClusterScaleRequest:
      type: object
      description: |
        Request to scale a cluster's node pools. Each entry identifies a
        materialized pool by `id` and supplies the absolute desired node count
        (not a delta). Only the pools listed are affected — any pool omitted from
        the request is left unchanged, and a request may target a single pool.
        A single request must move all the pools it lists in one direction — mixing
        increases and decreases in the same request is rejected. Each listed pool
        must actually change its count; a target equal to the pool's current
        `nodeCount` is rejected. A decrease removes machines from the pool (the
        system selects which, preferring not-Ready ones). While the scale
        workflow is in flight, the settled count remains in `nodeCount` and the
        in-flight target is exposed as `targetNodeCount` on the pool.
      additionalProperties: false
      required:
        - nodePools
      properties:
        nodePools:
          type: array
          minItems: 1
          description: |
            Per-pool scale targets. Duplicate ids ⇒ 422; unknown ids (not on
            the cluster) ⇒ 422; a target equal to the settled `nodeCount`
            (nothing to scale) ⇒ 422; a target outside the bound ClusterType's
            configured node-count bounds (`nodeCountMin`/`nodeCountMax`, each
            enforced only when set — a pool with no `nodeCountMin` may scale to 0)
            ⇒ 422; a request mixing increases and
            decreases ⇒ 422; pools with no bound infrastructure reservation
            (e.g. control-plane pools) ⇒ 422.
          items:
            allOf:
              - $ref: '#/components/schemas/ClusterNodePoolCreateRequest'
              - required:
                  - id
                  - nodeCount
    ClusterStorage:
      type: object
      description: Storage the cluster declares; charged against the storage_gib quota and not enforced on the storage array.
      additionalProperties: false
      required:
        - ceilingGiB
      properties:
        ceilingGiB:
          type: integer
          format: int64
          minimum: 1
          maximum: 1048576
          description: Storage ceiling in GiB; it can be raised but never lowered.
          example: 512
    ClusterType:
      type: object
      description: ClusterType catalog template — full response at the current version.
      additionalProperties: false
      required:
        - id
        - uid
        - selfLink
        - version
        - versionId
        - status
        - displayName
        - networkSchema
        - nodePools
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Slug identifying this ClusterType (e.g. ct-0h2wq6dt5m8pjzk3xn4vbr7fcy).
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          readOnly: true
          example: ct-0h2wq6dt5m8pjzk3xn4vbr7fcy
        uid:
          type: string
          format: uuid
          description: Server-generated UUID of the head row.
          readOnly: true
        selfLink:
          type: string
          format: uri-reference
          description: >-
            Server-defined URL for this resource. Its shape depends on which operation returned this body: `createClusterType`, `getClusterType`, and `addClusterTypeVersion` return the head-scoped form (`.../cluster-types/{id}`), matching "current version, whatever that is right now"; `getClusterTypeVersion` and `setClusterTypeVersionStatus` return the version-scoped form (`.../cluster-types/{id}/versions/{versionId}`), matching "this exact immutable snapshot". Both forms resolve via GET.
          readOnly: true
          example: /v1/regions/us-texas-1/compute/cluster-types/ct-0h2wq6dt5m8pjzk3xn4vbr7fcy
        version:
          type: integer
          format: int32
          description: Sequential version number (display only).
          readOnly: true
        versionId:
          type: string
          format: uuid
          description: UUID of the current version row.
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/ClusterTypeVersionStatus'
          description: >-
            Lifecycle status of this version. A `deprecated` version is hidden from list responses unless includeDeprecated=true.
        displayName:
          type: string
          description: Human-readable name for this ClusterType.
        description:
          type:
            - string
            - 'null'
          description: Optional description.
        networkSchema:
          allOf:
            - $ref: '#/components/schemas/NetworkSchema'
          description: Network configuration schema. Structurally invariant after creation.
        k8s:
          allOf:
            - $ref: '#/components/schemas/ClusterTypeK8s'
          description: >-
            Kubernetes-specific attributes. Present for a Kubernetes ClusterType; omitted for a BMaaS-only ClusterType.
        nodePools:
          type: array
          description: Node pool definitions effective at the current version.
          items:
            $ref: '#/components/schemas/ClusterTypeNodePool'
        createdAt:
          type: string
          format: date-time
          description: The returned version's creation time on getClusterTypeVersion, setClusterTypeVersionStatus and addClusterTypeVersion; the ClusterType's creation time otherwise.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When the ClusterType itself last changed, such as a version being added; a version status change does not move it, and it is the same on every version.
          readOnly: true
    ClusterTypeK8s:
      type: object
      description: |
        Kubernetes-specific ClusterType attributes, grouped as an optional unit.

        Presence of this object is the discriminator: a ClusterType that carries `k8s`
        provisions Kubernetes clusters; a ClusterType that omits it is a BMaaS-only
        template (just top-level `networkSchema` and `nodePools`).

        Cluster-wide settings (k0s version/CNI, CIDRs, service domain, ClusterTemplate,
        services) are flat; control-plane and worker-node settings are grouped under
        `controlPlane` and `workers`. When present, every field below keeps the
        required-ness and validation it had when these attributes lived at the top level.

        This is the read; a create request sends `ClusterTypeK8sCreateRequest`.
      additionalProperties: false
      required:
        - k0sNetworkProvider
        - k0sVersion
        - podCidrs
        - serviceCidrs
        - clusterTemplateName
        - clusterTemplateVersion
        - services
        - controlPlane
        - workers
      properties:
        k0sVersion:
          type: string
          description: >-
            k0s version, as `vX.Y.Z` or `vX.Y.Z+k0s.N`. Structurally invariant after creation. Must be at least `v1.34.0`: every Kubernetes-flavor cluster is provisioned with a CEL-based OIDC ClusterAuthentication whose groups expression needs kube-apiserver's CEL `ext.Lists` library, gated to Kubernetes 1.34+. A lower version is rejected with 422 at ClusterType creation, when adding a version (including a below-floor value inherited from the current version), and again at cluster creation. The format is validated strictly: a missing `v` prefix, a non-`+k0s.N` build suffix, or extra components are all rejected.
          example: v1.36.1+k0s.0
        k0sNetworkProvider:
          type: string
          description: k0s network provider (CNI). Structurally invariant after creation.
        podCidrs:
          type: array
          items:
            type: string
          description: Pod CIDR ranges. Structurally invariant after creation.
        serviceCidrs:
          type: array
          items:
            type: string
          description: Service CIDR ranges. Structurally invariant after creation.
        serviceDomain:
          type: string
          description: Kubernetes service domain. Structurally invariant after creation.
        clusterTemplateName:
          type: string
          description: Name of the ClusterTemplate to use.
        clusterTemplateVersion:
          type: string
          description: ClusterTemplate version applied to clusters of this type (e.g. `v1-31-0`).
        services:
          type: array
          description: >-
            Deployed service configurations, a list of per-service MCS configs (see `MCSServiceConfig`), each identified by a unique `name` (e.g. `metallb`) and carrying the `enabled`/`resources` keys, delivered as the Helm values of the corresponding service via MultiClusterService.
          items:
            $ref: '#/components/schemas/MCSServiceConfig'
        servicesLoadBalancerSubnet:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local `id` of a `networkSchema.subnets[]` entry that designates the
            LoadBalancer service-IP subnet — the pool from which service VIPs
            (e.g. MetalLB `IPAddressPool` addresses) are drawn. Same format as
            `controlPlane.vipSubnet`. Structurally invariant after creation. Omit
            when clusters of this type expose no LoadBalancer service VIPs.
            Must name a pool-allocated subnet (`addressPool` + `prefixLength`),
            not a fixed-`cidr` one: the pool is drawn from the CIDR the
            subnet's SubnetAllocation reports, which the fixed mode does not
            create.
          example: lb
        nodeNetwork:
          allOf:
            - $ref: '#/components/schemas/ClusterTypeK8sNodeNetwork'
          description: |
            Cluster-wide node addressing, applied to every node (worker pools
            and the standalone control plane). A node pool's own
            `nodeNetwork.interface` overrides the interface. Omit to use the
            interface holding the IPv4 default route. `interface` is
            structurally invariant after creation; `legacyAddressDetection`
            may change in a new version.
        controlPlane:
          type: object
          description: Control-plane topology and configuration.
          additionalProperties: false
          required:
            - type
            - replicas
            - bootstrapConfig
            - opConfig
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/ControlPlaneType'
              description: Control plane topology. Structurally invariant after creation.
            replicas:
              type: integer
              format: int32
              minimum: 1
              description: |
                Number of control plane replicas. Structurally invariant after
                creation, except with `hcpConfig`: the value is then the HCPConfig's
                current replica count, and changes with the HCPConfig.
            hcpConfig:
              type: string
              format: uri-reference
              description: |
                The HCPConfig supplying the replica count and every hosted control
                plane setting, by URI. `hcp` ClusterTypes only. The rest of the
                ClusterType (Kubernetes version, template, network schema, node
                pools, services) still applies. Set at create (see
                `ClusterTypeCreateRequest`).

                A property of the ClusterType, not of a version: it is shown in every
                ClusterType body, version bodies included, and applies to every
                Cluster of the type, whatever version the Cluster is pinned to.

                **Limited:** once set it never changes, also not through new
                versions; editing the HCPConfig covers every legitimate change. A
                legacy `hcp` ClusterType without it is given one once, through
                `PATCH /cluster-types/{id}`.

                Shown only to callers holding `compute.hcpconfigs.read`.
              example: /v1/regions/us-texas-1/compute/hcp-configs/hcp-small
            apiServerPort:
              type:
                - integer
                - 'null'
              format: int32
              description: API server port override. Structurally invariant after creation.
            vipSubnet:
              allOf:
                - $ref: '#/components/schemas/NetworkSchemaRef'
              description: |
                Local `id` of a `networkSchema.subnets[]` entry whose allocated address
                becomes the standalone control-plane endpoint VIP
                (`controlPlane.standalone.endpoint.vip`). Standalone control planes only.
                Structurally invariant after creation. Omit when the control plane needs
                no managed VIP. Must name a pool-allocated subnet (`addressPool` +
                `prefixLength`), not a fixed-`cidr` one: the VIP is taken from the
                CIDR the subnet's SubnetAllocation reports, which the fixed mode
                does not create.
              example: vip
            bootstrapConfig:
              allOf:
                - $ref: '#/components/schemas/ControlPlaneBootstrapConfig'
              description: Control plane bootstrap configuration. Structurally invariant after creation.
            opConfig:
              allOf:
                - $ref: '#/components/schemas/ControlPlaneOpConfig'
              description: |
                Control plane operational configuration. Structurally invariant
                after creation. With `hcpConfig`, `hcp` is omitted: the HCPConfig
                holds those settings, and they change with it.
        workers:
          type: object
          description: Worker-node configuration.
          additionalProperties: false
          required:
            - defaults
          properties:
            defaults:
              allOf:
                - $ref: '#/components/schemas/WorkerDefaults'
              description: Default worker node configuration.
    ClusterTypeK8sNodeNetwork:
      type: object
      description: |
        Cluster-wide node addressing. Selects the host network interface whose IPv4
        address each Kubernetes node registers as its node address (`InternalIP`,
        kubelet `--node-ip`). Use it on machines with more than one NIC — for
        example GPU servers with east-west fabric NICs — to keep Kubernetes traffic
        (kubelet API, NodePort services and, with Calico, pod traffic) on the
        intended network.

        The address is resolved on each machine when it boots, before Kubernetes
        starts. On a standalone control plane it is also used as the node's API
        server and etcd peer address. If no IPv4 address can be found on the
        selected interface within a few minutes, the machine's bootstrap stops and
        the node does not join the cluster, rather than registering an unintended
        address. With no interface set (neither here nor on the node pool), the
        interface holding the IPv4 default route is used.

        With the `calico` network provider, Calico is configured to use the same
        address as the node.

        Unknown keys are rejected (400), so a misspelt key cannot silently select
        the default-route interface.
      additionalProperties: false
      properties:
        interface:
          type: string
          description: >-
            Name of the host network interface (as shown by `ip link`) to take the node address from, identical on every machine it applies to. 1-15 characters from `A-Z a-z 0-9 _ . -`. Beyond the pattern, `.`, `..` and the loopback interface `lo` (any case) are rejected with 422. Omit the key to use the interface holding the IPv4 default route; an empty string is rejected. Structurally invariant after creation: to use a different interface, create a new ClusterType.
          pattern: ^[A-Za-z0-9_.-]{1,15}$
          example: enp1s0
        legacyAddressDetection:
          type: boolean
          default: false
          description: |
            Keeps the node addressing of clusters created before node addresses
            were pinned. When `true`, nodes without an interface (neither here nor
            on their node pool) are not pinned: each node, and on a standalone
            control plane the API server and etcd, keep the address the host picks
            by itself, and Calico keeps its own address detection. Nodes with an
            interface are pinned either way.

            Set it to `true` in the ClusterType version that existing clusters are
            upgraded to, before upgrading them: otherwise the upgrade pins every
            node to the default-route interface, which replaces standalone
            control-plane machines and can change node addresses. New clusters
            created from a version with `true` also keep legacy detection.

            Unlike `interface`, this may change from one version to the next.
            Moving a cluster from a version with `true` to one with `false` pins
            its nodes, with the same effect as above.
    ClusterTypeNodeNetwork:
      type: object
      description: |
        A node pool's node address interface: the host network interface whose
        IPv4 address each of the pool's Kubernetes nodes registers as its node
        address (`InternalIP`, kubelet `--node-ip`), overriding the ClusterType's
        cluster-wide `k8s.nodeNetwork.interface`. See ClusterTypeK8sNodeNetwork for
        how the address is resolved.

        Structurally invariant after creation: the address is fixed when a machine
        bootstraps, so a change could not reach existing nodes. To use a different
        interface, create a new ClusterType.
      additionalProperties: false
      required:
        - interface
      properties:
        interface:
          type: string
          description: >-
            Name of the host network interface (as shown by `ip link`) to take the node address from, identical on every machine it applies to. 1-15 characters from `A-Z a-z 0-9 _ . -`. Beyond the pattern, `.`, `..` and the loopback interface `lo` (any case) are rejected with 422.
          pattern: ^[A-Za-z0-9_.-]{1,15}$
          example: enp1s0
    ClusterTypeNodePool:
      type: object
      description: Node pool definition effective at a given ClusterType version.
      additionalProperties: false
      required:
        - id
        - uid
        - role
        - machineType
        - networkAttachment
        - versionIntroduced
      properties:
        id:
          type: string
          description: Slug identifying this node pool within the ClusterType. Used to anchor per-cluster overrides.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: workers
        uid:
          type: string
          format: uuid
          description: Server-generated UUID. Stable across ClusterType versions.
          readOnly: true
        displayName:
          type: string
          description: Optional human-friendly display name for the node pool.
        role:
          $ref: '#/components/schemas/NodePoolRole'
        machineType:
          type: string
          format: uri-reference
          description: |
            URI of the MachineType backing this pool. The MachineType pins the
            hardware selector and provisioning config copied onto every server
            reserved for this pool.
          example: /v1/regions/us-texas-1/infrastructure/machine-types/gpu-worker-h100
        nodeCountMin:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
          description: |
            Minimum number of nodes this pool may scale to.
            Null means no explicit floor above the API-level minimum of 0.
        nodeCountMax:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
          description: |
            Maximum number of nodes this pool may scale to.
            Null means unbounded.
        nodeCountDefault:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
          description: |
            Default number of nodes when the cluster create does not override.
            Null means the cluster create must supply `nodeCount` explicitly.
        networkAttachment:
          $ref: '#/components/schemas/NetworkAttachment'
        nodeNetwork:
          allOf:
            - $ref: '#/components/schemas/ClusterTypeNodeNetwork'
          description: |
            Node address interface for this pool's nodes, overriding the
            ClusterType's `k8s.nodeNetwork`. Absent when the pool does not
            override it. Invariant across versions.
        versionIntroduced:
          type: integer
          format: int32
          description: ClusterType version at which this node pool was introduced.
          readOnly: true
    ClusterTypePage:
      type: object
      required:
        - clusterTypes
      properties:
        clusterTypes:
          type: array
          items:
            $ref: '#/components/schemas/ClusterTypeSummary'
        totalCount:
          type: integer
          format: int64
          example: 42
          description: |-
            Total ClusterTypes in the region that the request's `includeDeprecated` setting lists, so `ceil(totalCount / limit)` is the page count.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent otherwise.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Never emitted: this list has no cursor pagination, and a request with no paging parameter returns the first page only.
    ClusterTypeSummary:
      type: object
      description: ClusterType summary returned in list responses.
      additionalProperties: false
      required:
        - id
        - uid
        - selfLink
        - version
        - versionId
        - status
        - displayName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Slug identifying this ClusterType (e.g. ct-0h2wq6dt5m8pjzk3xn4vbr7fcy).
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          readOnly: true
          example: ct-0h2wq6dt5m8pjzk3xn4vbr7fcy
        uid:
          type: string
          format: uuid
          description: Server-generated UUID of the head row.
          readOnly: true
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/compute/cluster-types/ct-0h2wq6dt5m8pjzk3xn4vbr7fcy
        version:
          type: integer
          format: int32
          description: Sequential version number (display only).
          readOnly: true
        versionId:
          type: string
          format: uuid
          description: UUID of the current version row.
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/ClusterTypeVersionStatus'
          description: Lifecycle status of this ClusterType's latest version.
        displayName:
          type: string
          description: Human-readable name for this ClusterType.
        description:
          type:
            - string
            - 'null'
          description: Optional description.
        k8s:
          type: object
          required:
            - controlPlane
          description: >-
            Kubernetes-specific summary attributes. Present for a Kubernetes ClusterType; omitted for a BMaaS-only ClusterType.
          properties:
            controlPlane:
              type: object
              required:
                - type
              properties:
                type:
                  allOf:
                    - $ref: '#/components/schemas/ControlPlaneType'
                  description: Control plane topology.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ClusterTypeVersion:
      type: object
      description: Immutable snapshot of a ClusterType at a specific version.
      additionalProperties: false
      required:
        - versionId
        - version
        - status
        - displayName
        - createdAt
      properties:
        versionId:
          type: string
          format: uuid
          description: UUID of this version row.
          readOnly: true
        version:
          type: integer
          format: int32
          description: Sequential version number (display only).
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/ClusterTypeVersionStatus'
          description: Lifecycle status of this version.
        displayName:
          type: string
          description: Name at this version.
        description:
          type: string
          description: Description at this version.
        createdAt:
          type: string
          format: date-time
          description: When this version was created.
          readOnly: true
    ClusterTypeVersionPage:
      type: object
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ClusterTypeVersion'
        totalCount:
          type: integer
          format: int64
          example: 42
          description: |-
            Total versions of this ClusterType matching the request's `status` filter, so `ceil(totalCount / limit)` is the page count.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent when the request carried no paging parameter and the whole history was returned.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
    ClusterTypeVersionStatus:
      type: string
      enum:
        - draft
        - available
        - deprecated
      description: |
        Lifecycle status of a ClusterType version. Forward-only:
        `draft` -> `available` -> `deprecated`; a version can never move
        backward. `draft` versions and `deprecated` versions cannot back new
        Cluster or InstanceGroup creation — only `available` versions can.
    ClusterUpdateRequest:
      type: object
      description: |
        Request to update cluster configuration. The ClusterType binding is pinned
        at create time and is read-only; a PATCH that carries an immutable field is
        rejected with 409.
      additionalProperties: false
      properties:
        kubernetesVersion:
          type: string
          description: |
            Upgrade to Kubernetes version. Deprecated — accepted for backwards
            compatibility with clients that pre-date the ClusterType binding,
            but ignored: the version is determined by the bound ClusterType.
            Listed here only so the schema's strict
            `additionalProperties: false` gate does not reject old payloads.
          deprecated: true
        displayName:
          type: string
          description: Updated human-friendly display name for the cluster.
        description:
          type: string
          description: Updated description of this resource.
        storage:
          $ref: '#/components/schemas/ClusterStorage'
        tags:
          type: object
          additionalProperties:
            type: string
          description: User-defined metadata labels for this cluster.
        securityGroups:
          type: array
          description: |
            Replace this cluster's whole security-group binding.

            **Asynchronous.** The binding is rendered into every NetworkBundle the
            cluster materializes, so the change is not complete when the request returns:
            the cluster moves to `UPDATING` with a workflow re-applying those bundles, and
            settles back to `ACTIVE` when it finishes. The response is `202`.

            A VPC's platform-managed default group cannot be named here: it is
            attachable only to the VPC that owns it, and naming one is refused with
            `422`. It would also be redundant — a VPC's own groups already reach this
            cluster's network attachments through the VPC — and wrong, because those
            rules are derived from one VPC's subnet prefixes while a cluster-level
            group is rendered onto every node pool, including pools attached to other
            VPCs' networks.

            **Send it on its own.** Combining it with the synchronous fields is
            rejected with `422` — the status code would otherwise depend on the body,
            and a caller could not tell which half had taken effect.

            Sending `[]` detaches everything. Omitting the field changes nothing; the
            two are distinct, so a dropped or misspelled field cannot silently clear
            the binding.

            Unknown or cross-tenant ids ⇒ `422`, naming every unresolvable id at once.
            A cluster that is mid-create or mid-delete ⇒ `409`: its bundles are being
            rendered or torn down, and changing the binding underneath that would race
            the workflow.
          maxItems: 16
          items:
            type: string
            pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
            minLength: 1
            maxLength: 63
          example:
            - sg-a1b2c3
    Consumer:
      type: object
      description: |
        One entry in a `FileStore`'s `consumers` list: a target that may mount the
        store and the level it is granted. Only `ref` is required — an entry can be
        written as just `{ref}`, taking `type: ipAddress` and `accessLevel: rw` by
        default. Naming the kind in `type` rather than inferring it from the shape
        of `ref` is what lets a second kind be added without changing how existing
        entries are read.

        An entry names either one address directly (`ipAddress`) or a set of
        machines that the platform resolves to addresses (`instanceGroup`). Either
        way what reaches the backing storage's export policy is a list of addresses;
        the kinds differ only in who computes that list.

        Presence in the list is the grant: a machine whose address the list does not
        cover cannot mount the store, and removing an entry revokes access. Observed
        progress for each entry — including the addresses it resolved to — is
        reported separately in the store's read-only `consumerStatus`, keyed by
        `ref`.
      additionalProperties: false
      required:
        - ref
      properties:
        type:
          type: string
          description: |
            Kind of attachment target, which determines how `ref` is interpreted
            and how the platform resolves it to the addresses written into the
            store's export policy.

            `ipAddress` is the direct kind: `ref` *is* the address, so resolution is
            the identity function and membership is knowable without consulting any
            other resource. It is not scaffolding left over from an earlier release —
            it is the substrate the other kind resolves down to, and it stays the way
            to attach a machine that belongs to no group at all: a jump host, an
            appliance, or a machine part-way through a migration.

            `instanceGroup` names a compute instance group, which the platform
            resolves to the addresses of the group's member machines on the interface
            selected by `network`. One entry therefore fans out to as many addresses
            as the group has members, all of them reported under the entry's `ref` in
            `consumerStatus[].resolvedAddresses`.

            Resolution is re-run on a freshness interval, and a membership or
            addressing change the platform can vouch for is re-applied on its own: a
            scale-up grants the new members, and an address that departed or moved is
            withdrawn. A resolution the platform cannot vouch for is still only
            reported, and so is any drift that survives repair — because repair is
            switched off, because its bounded attempts are spent, or because the
            re-resolution was unvouched-for. See `consumerStatus[].statusReason` on
            `FileStore`.

            Omitting `type` keeps the historical meaning, `ipAddress`, so a body
            written before this kind existed is read exactly as it was.
          enum:
            - ipAddress
            - instanceGroup
          default: ipAddress
          example: ipAddress
        ref:
          type: string
          description: |
            Reference to the target, shaped by `type`. The two kinds take different
            shapes, so there is no single schema-level format to declare here; the
            value is checked against `type` in-service, and one that does not fit the
            kind it was sent with is rejected with `422` and
            `details[].reason: INVALID_ARGUMENT`.

            **For `ipAddress`** — a single literal IPv4 address, for example
            `10.40.12.17`. It is normalized on write, so textually different
            spellings of the same address compare equal. A prefix is not accepted;
            grant a range by listing its addresses. The address must name a routable
            host: `0.0.0.0`, `255.255.255.255`, loopback, multicast and link-local
            addresses are all refused, because none of them names a single host that
            could mount the share, and `0.0.0.0` is the conventional NFS export
            wildcard — accepting it would turn a per-host grant into a world-readable
            or world-writable export that this API would then report as enforced.

            **For `instanceGroup`** — the bare `id` of an instance group in the
            store's own project, for example `ig-0h2wq6dt5m8pjzk3xn4vbr7fcy`. It is a
            plain identifier and **not a `selfLink` or any other URI**: a store and the
            groups it serves are necessarily in the same region and project, so a URI
            would carry nothing the request does not already establish, and the only thing
            it would add is the ability to *express* a cross-project attach that the
            platform must then refuse. A group that does not exist in the store's
            project, that has been deleted, or that is being deleted, is rejected
            with `422` and `details[].reason: INVALID_ARGUMENT` — not `404`, because
            the addressed resource is the store and the store was found. A group
            mid-teardown still exists and still lists, and is refused all the same:
            its machines are on their way back to the shared pool.

            Whichever kind it names, `ref` must be unique within a store's
            `consumers` list, and it is the key under which the entry's observed
            state appears in `consumerStatus`.
          example: 10.40.12.17
        network:
          type: object
          description: |
            Which of a resolved member's interfaces supplies the address to grant.
            Meaningful only for `type: instanceGroup`; sending it on an `ipAddress`
            entry is rejected with `422` and
            `details[].reason: INVALID_ARGUMENT`, because there `ref` already *is*
            the address and there is nothing left to select.

            **The operator names the network; the platform never infers it.** A
            member machine sits on several fabrics at once, and only the operator
            knows which one the store should be mounted over — so an `instanceGroup`
            entry that omits `network` is rejected with `422` rather than having an
            interface chosen on its behalf. It is optional at the schema level only
            because an `ipAddress` entry must not carry it.

            `type` alone selects every interface a member has on that fabric; adding
            the matching hardware identifier narrows the selection to one specific
            interface. Only the identifier that goes with `type` may be supplied —
            `macAddress` with `ethernet`, `guid` with `infiniband` — and supplying
            both, or the one that does not match `type`, is rejected with `422`.

            A selector that matches nothing is rejected with `422` as well — but the
            two terms are checked against different scopes, because they answer
            different questions.

            **`type` on its own is checked per member.** A fabric is something every
            machine in a group is expected to be on, so when `type` is the only term
            supplied, every member the group resolved to must have at least one
            interface on it, and one with none is rejected with a `422` naming that
            member. It is never quietly treated as a narrower grant that leaves that
            member out: an export policy missing a host is a broken mount that nobody
            asked for, and the request that caused it would otherwise have looked
            successful.

            **Adding a hardware identifier moves the check group-wide.** A
            `macAddress` or a `guid` names one interface on one machine, so on a group
            with more than one member it cannot match the others by construction —
            checking it per member would make narrowing unusable on every group but a
            group of one. A narrowed selector must therefore match at least one
            interface *somewhere* in the group, and one that matches nothing at all is
            rejected with `422`; every member it does not match — including any member
            not on the named fabric at all — simply contributes nothing to the grant
            rather than failing the request. Narrowing a group down to one machine's
            interface is a legitimate thing to ask for, and
            `consumerStatus[].resolvedAddresses` is where you confirm how many
            addresses the entry actually granted.

            Only IPv4 addresses on the selected interfaces are granted. An interface
            that is dual-stack contributes its IPv4 addresses and its IPv6 addresses
            are skipped, because the export policy is IPv4-only.
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              description: |
                Fabric the interface is on. The two hardware identifiers below are
                kept as distinct fields disambiguated by this value rather than as
                one overloaded field, because an InfiniBand interface has no MAC
                address to put in a shared one.
              enum:
                - ethernet
                - infiniband
              example: ethernet
            macAddress:
              type: string
              description: |
                Hardware address of the `ethernet` interface to select, matched
                against the interfaces recorded for each resolved member. Optional:
                omit it to select every `ethernet` interface a member has. Only valid
                with `type: ethernet`. Matched case-insensitively, but the separator
                form is significant: send the colon-separated spelling the platform
                records, which is what `pattern` admits.
              pattern: '^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$'
              example: 0c:42:a1:5f:9b:30
            guid:
              type: string
              description: |
                GUID of the `infiniband` interface to select, matched against the
                interfaces recorded for each resolved member. Optional: omit it to
                select every `infiniband` interface a member has. Only valid with
                `type: infiniband` — InfiniBand interfaces carry a GUID and no MAC
                address, which is why this is a separate field. Matched
                case-insensitively, but the spelling is significant: send the
                `0x`-prefixed 16-hex-digit form the platform records, which is what
                `pattern` admits.
              pattern: '^0x[0-9A-Fa-f]{16}$'
              example: '0x0002c90300a1b2c3'
        accessLevel:
          type: string
          description: |
            Mount level granted to this entry. Applies to the whole export;
            per-directory permissions are a POSIX concern on the filesystem itself,
            not an API concern. For an `instanceGroup` entry it applies uniformly to
            every address the group resolved to — access is not varied per member.

            **Only `rw` can be granted.** `ro` is refused with `422` and
            `details[].reason: INVALID_ARGUMENT`. The storage operator's access rule
            carries a target address only and has no read-only counterpart, so a
            read-only grant cannot be authored: accepting one would report a
            restriction no backend applies, and leave the mount read-write. Read-only
            access is available today only through a storage policy an operator
            authors for the whole store, which is outside this API. The enum keeps
            `ro` so that admitting it, once a backend can enforce it, is an additive
            change rather than a breaking one.
          enum:
            - ro
            - rw
          default: rw
          example: rw
        mountPath:
          type: string
          description: |
            Advisory mount point on the consumer, recorded so configuration
            management on the host has one place to read it from. The platform
            publishes the value and does not act on it: it never mounts the store
            on the tenant's behalf, and a host mounted elsewhere is not a drift
            condition the platform reports.

            Must be a clean absolute POSIX path when supplied: no relative path, no
            `.` or `..` segment, no repeated or trailing `/`, and no control
            characters. Anything else is rejected with `422` and
            `details[].reason: INVALID_ARGUMENT`.
          maxLength: 1024
          pattern: ^/([^/\x00-\x1f\x7f]+(/[^/\x00-\x1f\x7f]+)*)?$
          example: /mnt/training
    ControlPlaneBootstrapConfig:
      type: object
      description: |
        Install-time bootstrap configuration for the control plane. Two
        branches:

        - `k0sConfig.*` — k0s `ClusterConfig.spec` material (mode-agnostic).
          **Accepted and stored, but not currently applied.** It is validated
          and persisted on the ClusterType, and it is intended for
          `K0smotronControlPlane.spec.k0sConfig.spec` /
          `K0sControlPlane.spec.k0sConfigSpec.k0s.spec`, but nothing maps it
          to a chart destination today, so setting it has no effect on a
          created cluster. Do not rely on it until this note is removed. The
          settings it describes are configured on the cluster template
          itself; `featureGates.DynamicResourceAllocation` in particular is
          already enabled by the `cluster-nico` template's own default.
        - `standalone.*` — CABPK install-time hooks. Forwarded to
          `K0sControlPlane.spec.k0sConfigSpec.*`. Ignored when
          `ClusterType.controlPlaneType=hcp` (HCP runs the control plane as
          a pod with no install-time hook surface, and pulls its k0s bits
          from the container image set by
          `K0smotronControlPlane.spec.image`). Worker-side k0s download and
          bootstrap hooks live on `ClusterType.workerDefaults` (separate
          object).

        Convenience helpers like `disabledComponents` are not modelled
        separately: callers append `--disable-components=<csv>` to
        `standalone.args` (or to `k8s.controlPlane.opConfig.hcp.flags`) like any
        other CLI flag.

        Schema is open: unknown keys are accepted and stored on the
        ClusterType -- but accepted is not applied, and stored is not
        forwarded. The create path decodes this object into typed Go shapes
        and folds only the `standalone.*` branch, so an unknown key at the
        top level or directly under `standalone` is dropped on the way to the
        chart. Pass-through survives in one place only: `standalone.files[]`
        entries are carried verbatim, so an unknown member of a file entry
        does reach the chart values and is subject to the chart's own schema.
        Being declared here is no guarantee of being applied either --
        `k0sConfig` above is declared, validated and stored, yet reaches no
        chart destination; every such declared-but-unwired field is marked
        **not currently applied** on its own description. Structurally
        invariant: cannot change after the ClusterType is created (no new
        version is produced from a change here).
      properties:
        k0sConfig:
          type: object
          description: |
            k0s `ClusterConfig.spec` material. **Accepted and stored, but not
            currently applied** — see the note on this object's description.
            Keys mirror upstream so a controller can forward them verbatim
            into `K0smotronControlPlane.spec.k0sConfig.spec` /
            `K0sControlPlane.spec.k0sConfigSpec.k0s.spec` once that mapping
            exists. Network shape lives on `ClusterType.networkSchema`;
            storage and other ClusterConfig sub-sections are accepted as
            passthrough (schema is open).

            **Not modelled here:** `extensions` (k0s helm extension —
            auto-installed charts and their repositories). Helm-extension
            lifecycle is managed outside the ClusterDeployment by a
            separate services API surface, not via this catalog.
          properties:
            api:
              type: object
              description: |
                kube-apiserver settings (`ClusterConfig.spec.api`).
              properties:
                extraArgs:
                  type: object
                  additionalProperties:
                    type: string
                  description: |
                    Extra kube-apiserver CLI arguments (`map[string]string`).
                    Keys are flag names without leading dashes; values are
                    flag values. Merged with k0s defaults.
                  example:
                    authorization-mode: "Node,RBAC"
                rawArgs:
                  type: array
                  items:
                    type: string
                  description: |
                    Raw flag strings appended after `extraArgs`. Use for
                    flags that don't take a value or must repeat.
            featureGates:
              type: array
              description: |
                Kubernetes feature gates in the upstream k0s shape (array of
                `{name, enabled, components[]}`). When `components` is
                omitted the gate applies to every k0s-managed component.

                Recognized today by the cluster-nico template:
                  - `DynamicResourceAllocation` — chart enables it on
                    `kube-apiserver`, `kube-scheduler`,
                    `kube-controller-manager`, and `kubelet`, and adds the
                    `feature-gates=DynamicResourceAllocation=true` entry to
                    `api.extraArgs`.
              items:
                type: object
                required:
                  - name
                  - enabled
                properties:
                  name:
                    type: string
                    example: DynamicResourceAllocation
                  enabled:
                    type: boolean
                  components:
                    type: array
                    description: |
                      Subset of k0s-managed components the gate applies to.
                      Valid values today: `kube-apiserver`,
                      `kube-controller-manager`, `kube-scheduler`,
                      `kubelet`, `kube-proxy`.
                    items:
                      type: string
            telemetry:
              type: object
              description: |
                k0s telemetry settings (`ClusterConfig.spec.telemetry`).
              properties:
                enabled:
                  type: boolean
                  description: |
                    Send anonymous telemetry to k0sproject. k0s default
                    `true`; most templates set this to `false`.
                  example: false
        standalone:
          type: object
          description: |
            Standalone-mode install-time hooks (CABPK). Forwarded to
            `K0sControlPlane.spec.k0sConfigSpec.*`. Ignored when
            `ClusterType.controlPlaneType=hcp`.
          properties:
            downloadURL:
              type: string
              description: |
                Full URL the controller would fetch the k0s controller binary
                from. **Accepted and stored, but not currently applied** — it
                is intended for
                `K0sControlPlane.spec.k0sConfigSpec.downloadURL`, but the
                create path does not map it: this field carries a full URL,
                whereas the chart's `controlPlane.standalone.k0s.binURL` is a
                base URL it expands with version and architecture, so a
                verbatim-URL destination would have to be added first.
                Leave empty for k0sproject upstream defaults. The
                corresponding worker-side URL lives on
                `ClusterType.workerDefaults.downloadURL`.
              example: https://internal.mirror/k0s/v1.32.8+k0s.0/k0s-v1.32.8+k0s.0-amd64
            args:
              type: array
              description: |
                Extra k0s controller CLI args. Forwarded to
                `K0sControlPlane.spec.k0sConfigSpec.args`. Use this for any
                controller-binary flag — including
                `--disable-components=<csv>` (the contract intentionally
                does not split that into a separate structured field, to
                stay close to the upstream CLI surface).
              items:
                type: string
              example:
                - --enable-worker
                - --disable-components=konnectivity-server,kube-proxy
            useSudo:
              type: boolean
              description: |
                When `true`, the bootstrap user-data wraps each
                `preK0sCommands` / `postK0sCommands` entry with `sudo`
                before execution. Set `false` (or omit) for images that
                already run cloud-init steps as root. Chart-rendering
                knob, not a CABPK CRD field.
              default: false
              example: false
            preK0sCommands:
              type: array
              description: |
                Shell commands run before the control-plane k0s process
                starts. Forwarded to
                `K0sControlPlane.spec.k0sConfigSpec.preK0sCommands`. Takes
                priority over the deprecated `preStartCommands` when both
                are set.
              items:
                type: string
            postK0sCommands:
              type: array
              description: |
                Shell commands run after the control-plane k0s process
                starts. Forwarded to
                `K0sControlPlane.spec.k0sConfigSpec.postK0sCommands`. Takes
                priority over the deprecated `postStartCommands` when both
                are set.
              items:
                type: string
            preStartCommands:
              type: array
              deprecated: true
              description: |
                Deprecated pre-v1beta2 alias for `preK0sCommands`. Kept for
                backward compatibility with ClusterTypes created before the
                k0smotron v1beta2 migration; ignored when `preK0sCommands`
                is also set. New ClusterTypes should use `preK0sCommands`.
              items:
                type: string
            postStartCommands:
              type: array
              deprecated: true
              description: |
                Deprecated pre-v1beta2 alias for `postK0sCommands`. Kept for
                backward compatibility with ClusterTypes created before the
                k0smotron v1beta2 migration; ignored when `postK0sCommands`
                is also set. New ClusterTypes should use `postK0sCommands`.
              items:
                type: string
            files:
              type: array
              description: |
                Additional files written into the control-plane host during
                bootstrap. Forwarded to
                `K0sControlPlane.spec.k0sConfigSpec.files`. Shape matches
                `MachineTypeFile.yaml`.
              items:
                $ref: '#/components/schemas/MachineTypeFile'
    ControlPlaneOpConfig:
      type: object
      description: |
        CR-level / runtime operational configuration for the control plane.
        Mode-specific knobs live in symmetric branches keyed by
        `ClusterType.controlPlaneType`:
          - `standalone.*` mirrors `K0sControlPlane.spec.*` (CR-level fields
            only — install-time CABPK fields live in
            `ControlPlaneBootstrapConfig.standalone`).
          - `hcp.*` mirrors `K0smotronControlPlane.spec.*`.
        Common metadata (labels, kubeconfigSecretMetadata) sits at the top.

        Schema is open: unknown keys are accepted and stored on the
        ClusterType. "Accepted" is not "applied", and where an unknown key
        sits decides which of the two failure shapes it gets. The create path
        decodes this object into typed Go shapes, so an unknown key at the
        top level or directly under `hcp` is dropped on the way to the chart
        and fails nothing. Pass-through — by which new upstream k0smotron /
        k0s fields can be adopted without a contract change — survives only
        inside the sub-objects the create path carries verbatim:
        `hcp.resources`, `hcp.topologySpreadConstraints`, `hcp.service`,
        `hcp.persistence`, `hcp.etcd.persistence` and `hcp.etcd.resources`.
        An unknown key inside one of those is carried into the chart values
        and is therefore subject to the chart's own schema (under
        `hcp.service`, where the chart sets `additionalProperties: false`,
        that means the cluster create fails at render time). A key this
        schema *does* declare but the create path does not map is dropped
        silently, like an unknown key outside those sub-objects. Every such
        declared-but-unwired field is marked **not currently applied** on its
        own description. Version-snapshotted: snapshotted onto each
        ClusterTypeVersion; updates create a new immutable version.
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Kubernetes labels for the control-plane CR's metadata.
            **Accepted and stored, but not currently applied** — nothing maps
            this to a chart destination, so setting it renders no labels and
            has no effect on a created cluster. Intended for both modes:
            `K0sControlPlane.metadata.labels` /
            `K0smotronControlPlane.metadata.labels`.
        kubeconfigSecretMetadata:
          type: object
          description: |
            Metadata for the workload kubeconfig `Secret` that k0smotron /
            CABPK generates for the rendered control plane. Useful for GitOps
            selectors, RBAC scoping, and backup tooling. **Accepted and
            stored, but not currently applied** — nothing maps this to a chart
            destination, so setting it has no effect on a created cluster.
            Intended for both modes:
            `K0sControlPlane.spec.kubeconfigSecretMetadata` /
            `K0smotronControlPlane.spec.kubeconfigSecretMetadata`.
          properties:
            labels:
              type: object
              additionalProperties:
                type: string
              description: Labels written onto the kubeconfig `Secret`.
            annotations:
              type: object
              additionalProperties:
                type: string
              description: Annotations written onto the kubeconfig `Secret`.
        standalone:
          type: object
          description: |
            Standalone-mode CR-level settings. **Accepted and stored, but not
            currently applied** — the create path folds only the `hcp` branch
            of this object, so nothing here reaches a created cluster. It is
            intended for `K0sControlPlane.spec.*` (non-`k0sConfigSpec`
            fields), and is in any case ignored when
            `ClusterType.controlPlaneType=hcp`.
          properties:
            updateStrategy:
              type: string
              enum:
                - InPlace
                - Recreate
                - RecreateDeleteFirst
              description: |
                `K0sControlPlane.spec.updateStrategy`. Rolling-update policy
                on CR change events; runtime concern, not install.
              example: InPlace
        hcp:
          type: object
          description: |
            HCP-mode operational settings. Forwarded to
            `K0smotronControlPlane.spec.*`. Ignored when
            `ClusterType.controlPlaneType=standalone`.

            **Not modelled here, or anywhere in this API:** `kubeconfigRef` (host k8s
            pointer for the hosted control plane; `spec.remoteHostCluster.kubeconfigRef`
            in k0smotron v1beta2). Host-cluster targeting is fully platform-managed
            and invisible to API callers — tenants must never see or control
            control-plane placement — resolved internally by the create workflow
            from an operator-edited mapping, not from any ClusterType or Cluster
            field. `externalAddress` (`spec.externalAddress`) is likewise not
            modelled: the chart never sets it either, because k0smotron derives
            the address on its own for both service types the platform uses. It
            adopts the LoadBalancer's ingress address, and falls back to a host
            cluster node address under `NodePort`, which is the supported
            configuration on a host cluster with no usable LoadBalancer (see
            `service.type`).
          properties:
            image:
              type: string
              description: |
                k0s container image (no tag). **Accepted and stored, but not
                currently applied** — the create path does not decode this
                field, so it is dropped on the way to the chart and has no
                effect on a created cluster; the cluster-nico chart sets the
                image only from `global.registry`. It is intended for
                `K0smotronControlPlane.spec.image`. Leave empty to use the
                k0smotron operator default (`quay.io/k0sproject/k0s`). Useful
                for airgap mirroring once wired.
            kineDataSourceURL:
              type: string
              format: uri
              description: |
                **Currently rejected (422) at ClusterType create/update.** The
                platform is etcd-only for hosted control planes for now — kept
                declared here (not removed) so lifting the restriction later is
                additive, not a contract break.

                Plain DSN for the Kine (external SQL) datastore used by the
                hosted control plane in lieu of k0smotron-managed etcd.
                Forwarded to
                `K0smotronControlPlane.spec.storage.kine.dataSourceURL`
                (k0smotron v1beta2; the operator also sets
                `spec.storage.type=kine`).
                Prefer `kineDataSourceSecretName` for production
                (credentials should not sit in plaintext config); this field
                is appropriate for credential-free DSNs or for environments
                handling credentials in via a different mechanism. Either
                kine field is the escape hatch for environments that already
                run HA SQL — etcd-backed HA remains the catalog default.
              example: postgres://k0smotron@db.example.internal:5432/k0smotron
            kineDataSourceSecretName:
              type: string
              description: |
                **Currently rejected (422) at ClusterType create/update** — see
                `kineDataSourceURL`'s description.

                Name of a Kubernetes `Secret` (in the control-plane
                resource's namespace) carrying the Kine DSN under the
                k0smotron-conventional key. Forwarded to
                `K0smotronControlPlane.spec.storage.kine.dataSourceSecretName`
                (k0smotron v1beta2; the operator also sets
                `spec.storage.type=kine`).
                Production HA-SQL setups should prefer this over the
                plaintext `kineDataSourceURL` so credentials are never
                stored on the ClusterType.
              example: k0smotron-kine-dsn
            serviceAccount:
              type: string
              description: |
                ServiceAccount used by both the k0s and etcd StatefulSets in
                the hosted control plane. **Accepted and stored, but not
                currently applied** — the create path does not decode this
                field, so it is dropped on the way to the chart and has no
                effect on a created cluster. It is intended for
                `K0smotronControlPlane.spec.serviceAccount`.
            resources:
              type: object
              description: |
                Compute resource requests/limits for the control-plane pods
                (k0s controller). Standard Kubernetes `ResourceRequirements`
                shape. Forwarded to `K0smotronControlPlane.spec.resources`.
              properties:
                requests:
                  type: object
                  additionalProperties:
                    type: string
                  description: Resource requests (`cpu`, `memory`, …).
                limits:
                  type: object
                  additionalProperties:
                    type: string
                  description: Resource limits.
            topologySpreadConstraints:
              type: array
              description: |
                Kubernetes `TopologySpreadConstraint` entries applied to BOTH
                the etcd and k0s pods. Standard upstream shape (`maxSkew`,
                `topologyKey`, `whenUnsatisfiable`, `labelSelector`,
                `minDomains`, `matchLabelKeys`, `nodeAffinityPolicy`,
                `nodeTaintsPolicy`). Forwarded to
                `K0smotronControlPlane.spec.topologySpreadConstraints`.
              items:
                type: object
            service:
              type: object
              description: |
                Service exposing the hosted control plane. Forwarded to
                `K0smotronControlPlane.spec.service`.

                This branch is not open in practice, and it is the one place
                in this object where that is enforced loudly rather than
                silently. Only `type`, `apiPort` and `konnectivityPort` reach a
                created cluster: the cluster-nico chart's `values.schema.json`
                sets `additionalProperties: false` on
                `controlPlane.k0smotron.service`, matching k0smotron's v1beta2
                `ServiceSpec`, which has no other fields. Any extra key, such as
                `loadBalancerClass`, `externalTrafficPolicy`, `annotations` or
                `labels` (all of which exist on k0smotron's v1beta1 `ServiceSpec`
                but are pruned under v1beta2), is accepted here and stored on the
                ClusterType, then fails the chart render at cluster-create time
                rather than at ClusterType create. That is the distinction worth
                knowing: several sibling fields in this object are also not
                applied today (see `image`, `serviceAccount`, and the top-level
                `labels` / `kubeconfigSecretMetadata` / `standalone`), but those
                are dropped silently on the way to the chart, whereas an unknown
                `service` key stops the create. A host-cluster LoadBalancer
                that needs a class or a pool-selecting annotation is therefore
                not configurable through this API today; pin `type: NodePort` for
                such a host cluster instead.
              properties:
                type:
                  type: string
                  enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                  description: |
                    Service type for the hosted control plane. k0smotron
                    default is `ClusterIP`; the cluster-nico chart defaults
                    to `LoadBalancer` (chart 0.10.0 and later — previously
                    `NodePort`). `NodePort` binds ports
                    cluster-wide, so two hosted control planes on one host
                    cluster collide only if they reuse the same
                    `apiPort`/`konnectivityPort` pair; distinct pairs
                    coexist. This field is ClusterType-scoped with no
                    per-cluster override, so every cluster created from one
                    ClusterType shares its pair. `LoadBalancer` gives each hosted
                    apiserver its own address but requires the host cluster
                    to have a LoadBalancer implementation that claims a bare
                    `type: LoadBalancer` Service. **Applies to cluster
                    creation only.** Changing it on an existing cluster does
                    not move the endpoint: k0smotron carries the address the
                    cluster was created with forward (it only derives a new
                    one when the k0smotron `Cluster`'s `externalAddress` is
                    empty, and it is not on an existing cluster), and it does
                    not delete the Service it created under the old type. A
                    cluster that needs the other type must be recreated.

                    `ClusterIP` is in the enum but is not a usable exposure
                    mode. k0smotron derives an external address only for
                    `LoadBalancer` (the Service's ingress address) and
                    `NodePort` (a host cluster node address); under
                    `ClusterIP` it derives none, so the hosted control plane
                    comes up with an empty `externalAddress` and no reachable
                    `controlPlaneEndpoint`. That is not rejected at
                    ClusterType create and does not fail loudly at cluster
                    create either. Use `LoadBalancer`, or `NodePort` on a
                    host cluster with no usable LoadBalancer.

                    Constrained at the contract level to match the
                    cluster-nico chart's `values.schema.json`; adding a new
                    value is a backwards-compatible contract bump.
                  example: LoadBalancer
                apiPort:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                  description: |
                    kube-apiserver port. Not a `NodePort`-only knob: k0smotron
                    forwards it to the hosted k0s config's `spec.api.port`, the
                    apiserver container port, the Service `port` and
                    `targetPort`, and `Cluster.spec.controlPlaneEndpoint.port` —
                    so it is the port that appears in the cluster's kubeconfig
                    for every `service.type`. It also cannot be unset:
                    k0smotron's `ServiceSpec` defaults it to 30443 when absent.
                    k0smotron default 30443; the cluster-nico chart defaults to
                    6443 (chart 0.10.0 and later — previously 30443).
                    The catalog range 1-65535 now matches the chart's exactly
                    (chart 0.10.0 replaced its own 30000-33000 window, which
                    both rejected valid `LoadBalancer` ports and admitted
                    32768-33000). With `service.type=NodePort` the value must
                    fall inside the target cluster's NodePort range (Kubernetes
                    default 30000-32767) or the Service is rejected at
                    creation time. Neither the catalog nor the chart checks
                    that: the range is the host cluster's
                    `--service-node-port-range` and can be moved in either
                    direction, so an explicit port is passed through verbatim.
                    Omitting the port is safe for a new cluster — the chart
                    derives the default from `type` (6443 for
                    `LoadBalancer`/`ClusterIP`, 30443 for `NodePort`), so a
                    `service` carrying only `type: NodePort` still yields a
                    working NodePort control plane. It is NOT safe for an
                    existing cluster being rebound to chart 0.10.0 or later:
                    each port is pinned independently, so any port left
                    unpinned moves to the new type-derived default even when
                    its sibling is pinned and `type` is unchanged, and every
                    kubeconfig issued against the old port stops working. Pin
                    whatever port the cluster is serving today before
                    rebinding.
                  example: 6443
                konnectivityPort:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                  description: |
                    Konnectivity tunnel port, forwarded to the hosted k0s
                    config's `spec.konnectivity.agentPort`. Like `apiPort` it
                    cannot be unset — k0smotron's `ServiceSpec` defaults it to
                    30132 when absent. k0smotron default 30132; the cluster-nico
                    chart defaults to 8132, k0s's own agent port (chart 0.10.0
                    and later — previously 30132). The catalog range
                    1-65535 now matches the chart's exactly, and the same
                    NodePort-range caveat as `apiPort` applies when
                    `service.type=NodePort`. Omitting it likewise derives the
                    default from `type`: 8132 for `LoadBalancer`/`ClusterIP`,
                    30132 for `NodePort` — and likewise moves on rebind if
                    left unpinned, independently of whether `apiPort` is
                    pinned. See `apiPort` for the full caveat.
                  example: 8132
            persistence:
              type: object
              description: |
                Persistence backend. Forwarded to
                `K0smotronControlPlane.spec.persistence`. k0smotron defaults to
                `emptyDir`.
              properties:
                type:
                  type: string
                  description: |
                    Persistence backend (`emptyDir`, `hostPath`, `pvc`, …).
                  example: emptyDir
                size:
                  type: string
                  description: |
                    Volume size (Kubernetes quantity, e.g. `10Gi`). Applies
                    when `type=pvc`. k0smotron default `1Gi`.
                  example: "10Gi"
                storageClass:
                  type: string
                  description: |
                    StorageClass for the volume. Uses cluster default if
                    omitted.
            flags:
              type: array
              description: |
                Extra CLI flags appended to the k0smotron-managed
                control-plane container. Forwarded to
                `K0smotronControlPlane.spec.controlPlaneFlags`
                (k0smotron v1beta2; renamed from `controllerPlaneFlags`).
                Common usage: `--disable-components=kube-proxy` when the CNI
                provides a kube-proxy replacement (e.g. Cilium with
                `kubeProxyReplacement=true`).
              items:
                type: string
              example:
                - --disable-components=kube-proxy
            etcd:
              type: object
              description: |
                Etcd settings. Subset of
                `K0smotronControlPlane.spec.storage.etcd` recognized today
                (k0smotron v1beta2; moved under `spec.storage`, with the
                operator setting `spec.storage.type=etcd`).
              properties:
                image:
                  type: string
                  description: |
                    etcd container image (with tag). Forwarded to
                    `K0smotronControlPlane.spec.storage.etcd.image`. k0smotron
                    default `quay.io/k0sproject/etcd:v3.7.1`.
                autoDeletePVCs:
                  type: boolean
                  description: |
                    Delete etcd PVCs when the etcd cluster is deleted. Forwarded
                    to `K0smotronControlPlane.spec.storage.etcd.autoDeletePVCs`.
                    k0smotron default `false`; recommended `true` for hosted
                    CPs that are torn down with the `ClusterDeployment` (no
                    orphaned volumes).
                  example: true
                persistence:
                  type: object
                  description: |
                    Disk backing the etcd StatefulSet. Forwarded to
                    `K0smotronControlPlane.spec.storage.etcd.persistence`.
                    Required on bare metal for durable HA. No standalone
                    equivalent exists to compare this against: a standalone
                    control plane's etcd runs on the bare-metal NICo machine's
                    local disk, which has no StorageClass/PVC abstraction to size.
                  properties:
                    size:
                      type: string
                      description: |
                        Volume size (Kubernetes quantity, e.g. `10Gi`).
                        k0smotron default `1Gi`.
                    storageClass:
                      type: string
                      description: |
                        StorageClass for the etcd volume. Uses cluster
                        default if omitted.
                resources:
                  type: object
                  description: |
                    Compute resources for etcd containers. Same shape as
                    top-level `resources`.
                  properties:
                    requests:
                      type: object
                      additionalProperties:
                        type: string
                    limits:
                      type: object
                      additionalProperties:
                        type: string
                args:
                  type: array
                  description: |
                    Extra etcd CLI arguments, forwarded verbatim to
                    `K0smotronControlPlane.spec.storage.etcd.args`. Common usage:
                    auto-compaction tuning (`--auto-compaction-mode=periodic`,
                    `--auto-compaction-retention=1h`), mirroring the tuning knobs
                    established for the standalone etcd/kine path.
                  items:
                    type: string
                  example:
                    - --auto-compaction-mode=periodic
                    - --auto-compaction-retention=1h
    ControlPlaneType:
      type: string
      enum:
        - hcp
        - standalone
      description: |
        Control plane topology. `hcp` (Hosted Control Plane) runs the control
        plane components in a management cluster; `standalone` runs them on
        dedicated nodes in the workload cluster itself.
    CreateWebhookSubscriptionResult:
      type: object
      required:
        - id
        - signing_secret
        - created_at
      properties:
        id:
          type: string
          format: uuid
        signing_secret:
          type: string
        created_at:
          type: string
          format: date-time
    EffectiveSecurityGroup:
      type: object
      description: |
        One security group filtering interfaces in a VPC, with the binding that put it
        there.

        **An identity and an attribution, not a copy of the group.** Everything that
        describes the group itself — `displayName`, `state`, `ownerKind`/`ownerId`,
        `tags`, timestamps — is read from
        `GET .../networking/security-groups/{id}`, which is the one place that answers
        "what is this group". Repeating any of it here would be a second copy to keep
        in sync, and a stale one the moment the group is edited. What this operation
        adds is what the group resource cannot know: that the group applies in THIS
        VPC, and which binding put it there.

        Two consequences worth planning for:

        * **Liveness is not reported here.** A group listed in a block is what the
          platform will converge on, and may be `creating`, `updating` or `failed`
          rather than enforced. Read the group to find out.
        * **A platform-managed default is not distinguishable here** from a tenant
          group attached to the same VPC; `ownerKind` on the group says which.

        The group's rules are not nested either: they live in the same block's
        `securityGroupRules` lists, joined back to this entry by `securityGroupId`.
      additionalProperties: false
      required:
        - id
        - uid
        - source
        - sourceId
        - ruleCount
      properties:
        id:
          type: string
          description: The group's `id` within the project. Always resolves — a group soft-deleted out from under a binding is omitted rather than reported.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: sg-a1b2c3
        uid:
          type: string
          format: uuid
          description: The group's server-generated UUID — the durable handle, stable across a rename and never reused.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        source:
          type: string
          description: |
            The KIND of resource whose binding put this group in this VPC's block, using
            the same vocabulary as the `objectKind` query parameter. `cluster` or
            `instance_group` means the group is bound to the owner and therefore
            applies in every one of its VPCs; `vpc` means it is bound to this VPC alone
            and is part of its floor.

            A group attached to BOTH the owner and this VPC is reported once, with
            `source` naming the owner — matching the position the platform renders it
            at. Listing it twice would misreport the filter set.
          enum:
            - cluster
            - instance_group
            - vpc
          example: cluster
        sourceId:
          type: string
          description: |
            The `id` of that resource. Together with `source` it is a complete
            reference — a caller can resolve it to a URL without guessing whether the
            id names a cluster, an instance group or a VPC.

            It earns its place on a `cluster` or `instance_group` read, where one block
            mixes groups bound to the owner with groups bound to that VPC and the pair
            says which binding to change to remove a given group. On a `vpc` read it is
            constant — every entry is `vpc` and the VPC that was queried — and is kept
            only so the item has one shape across all three object kinds.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: c-abc
        ruleCount:
          type: integer
          format: int32
          description: |
            This group's combined `ingress` + `egress` entries in this block's
            `securityGroupRules`, so a client can size or rank a group without walking
            those lists. `0` for an empty group, which is legal: a group is applied
            whether or not it carries rules.
          minimum: 0
          example: 4
    EffectiveSecurityGroupRule:
      type: object
      description: |
        One rule in a VPC block's `securityGroupRules`, with the id of the group it
        belongs to.

        Every field except `securityGroupId` means exactly what it does on
        `SecurityGroupRule`, and `SecurityGroupRule` is the canonical definition —
        read it for the full semantics of `protocol`, `action`, the two prefixes and
        the port ranges.

        This schema restates those fields rather than composing with `allOf`, because
        `SecurityGroupRule` is `additionalProperties: false`: an `allOf` branch
        validates the whole instance on its own, so the closed base would reject
        `securityGroupId` and no effective rule would validate at all.

        **The restatement is not machine-checked.** Nothing links the two files, so a
        field added to `SecurityGroupRule` will not appear here until someone adds it,
        and the omission is invisible in review. Change the two together.

        There is no `direction` field: direction is implied by which of the block's
        `ingress` / `egress` lists the rule sits in, as it is everywhere else. There is
        no `priority` field either — position in the list is the only ordering signal,
        and the stored priority is a server-derived array index rather than a value a
        client ever sets.
      additionalProperties: false
      required:
        - securityGroupId
        - protocol
        - action
        - sourcePrefix
        - destinationPrefix
      properties:
        securityGroupId:
          type: string
          description: |
            The `id` of the security group this rule belongs to — always one of the
            entries in the same block's `securityGroups`. It is what marks where one
            group's run of rules ends and the next begins.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: sg-a1b2c3
        name:
          type: string
          description: Optional human-friendly label for this rule. See `SecurityGroupRule.name`.
          maxLength: 253
          example: allow-https
        protocol:
          type: string
          description: |
            IP protocol the rule matches. Only `tcp` and `udp` are port-bearing. See
            `SecurityGroupRule.protocol`.
          enum:
            - tcp
            - udp
            - icmp
            - icmp6
            - any
          example: tcp
        action:
          type: string
          description: What to do with traffic this rule matches. See `SecurityGroupRule.action`.
          enum:
            - permit
            - deny
          example: permit
        sourcePrefix:
          type: string
          description: |
            Source address range the rule matches, as an IPv4 or IPv6 prefix in CIDR
            notation with the host bits zero. See `SecurityGroupRule.sourcePrefix`.
          minLength: 1
          maxLength: 43
          example: 0.0.0.0/0
        destinationPrefix:
          type: string
          description: |
            Destination address range the rule matches, in the same form as
            `sourcePrefix`. See `SecurityGroupRule.destinationPrefix`.
          minLength: 1
          maxLength: 43
          example: 10.5.44.0/24
        sourcePortRange:
          type: string
          description: |
            Source ports the rule matches, as a single port (`"80"`) or an inclusive
            range (`"80-81"`) — a string on the wire, never an integer. Absent when the
            rule matches any source port. See `SecurityGroupRule.sourcePortRange`.
          pattern: ^[0-9]{1,5}(-[0-9]{1,5})?$
          example: '1024-65535'
        destinationPortRange:
          type: string
          description: |
            Destination ports the rule matches, in the same form as `sourcePortRange`.
            Absent when the rule matches any destination port. See
            `SecurityGroupRule.destinationPortRange`.
          pattern: ^[0-9]{1,5}(-[0-9]{1,5})?$
          example: '443'
    EffectiveSecurityGroupRules:
      type: object
      description: |
        Every rule of every security group in one VPC block, split by direction —
        mirroring `SecurityGroupRules` on a `SecurityGroup`, so the nest is what
        implies each rule's direction.

        **Ordering.** Within each list the rules run group by group, in the order the
        block's `securityGroups` reports, and inside a group in the order that group
        was written with. Position is the order, exactly as on
        `GET .../networking/security-groups/{id}`.

        **Position is the precedence, across groups as well as within one.** The order
        reported here is the order the fabric receives: a group earlier in the block's
        `securityGroups` is applied ahead of a later one, and within a group the first
        matching rule wins. Use `securityGroupId` to find where each group's run begins
        and ends.

        Ingress and egress are independent, and rules are stateless by default —
        return traffic must be permitted by its own rule in the opposite list. The
        exception is an egress rule carrying a protocol and a destination port range
        but no source port range, which the `nico` fabric makes stateful
        automatically. See `SecurityGroupRule`.
      additionalProperties: false
      required:
        - ingress
        - egress
      properties:
        ingress:
          type: array
          description: Rules matching traffic INTO the interfaces in this VPC. Always present; `[]` when no group in this block carries an ingress rule.
          items:
            $ref: '#/components/schemas/EffectiveSecurityGroupRule'
        egress:
          type: array
          description: Rules matching traffic OUT of the interfaces in this VPC. Always present; `[]` when no group in this block carries an egress rule.
          items:
            $ref: '#/components/schemas/EffectiveSecurityGroupRule'
    EffectiveSecurityGroups:
      type: object
      description: |
        What actually filters an object's machines, grouped by VPC.

        `Cluster.securityGroups` and `InstanceGroup.securityGroups` report only the
        object's own binding; `VPC.securityGroups` reports only a VPC's. The platform
        merges the two — the owner's groups first, then the VPC's floor, a group in
        both applied once — when it renders the fabric. This resource is that merged
        answer, with each group's rules, so a tenant does not have to reproduce the
        merge from two id lists and one `GET` per group.

        A `cluster` or `instance_group` read returns one block per VPC the object
        materialized. A `vpc` read returns a single block carrying that VPC's own
        binding only — the owner's groups also filter traffic on interfaces inside it,
        and are read from the owner.

        This is DESIRED configuration: it reports what the platform will converge on,
        not what the fabric is enforcing at this instant. Each entry identifies a group
        and attributes it to a binding; the group's own `state`, `displayName` and
        ownership are read from `GET .../networking/security-groups/{id}` rather than
        copied here.
      additionalProperties: false
      required:
        - object
        - vpcs
      properties:
        object:
          type: object
          description: The object this answer is about, echoed so a response is self-describing once detached from its request.
          additionalProperties: false
          required:
            - kind
            - id
            - uid
          properties:
            kind:
              type: string
              description: The object kind, as supplied in `objectKind`.
              enum:
                - cluster
                - instance_group
                - vpc
              example: cluster
            id:
              type: string
              description: The object's `id`, as supplied in `objectId`.
              pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
              minLength: 1
              maxLength: 63
              example: c-abc
            uid:
              type: string
              format: uuid
              description: The object's server-generated UUID — the durable handle to record against this answer.
              example: 761fd6c2-be41-419e-a3f7-8ff8c11a7495
        vpcs:
          type: array
          description: |
            One block per VPC in scope. Always present; `[]` when the object has no
            VPCs at all, which is not an error.

            For a `cluster` or `instance_group` this is every VPC it materialized, so
            a machine's filter set is the block for the VPC its interface sits in —
            never the union of all of them. For a `vpc` it is a single block, that VPC.
          items:
            $ref: '#/components/schemas/EffectiveSecurityGroupsVPC'
    EffectiveSecurityGroupsVPC:
      type: object
      description: |
        One VPC's block: every security group filtering interfaces in that VPC, and
        every one of their rules.

        **Read one block, not the union.** Security groups reach the fabric on one
        interface per node pool — the first ethernet, by sorted interface name, whose
        `connectToNetwork` names a network on a `nico`-backed VPC — and that interface
        belongs to exactly one VPC. So a machine attached through this VPC is filtered
        by this block and no other. That is why the response is per VPC rather than one
        flat list: a single list across an owner with several VPCs would union their
        floors and overstate what any one machine sees.

        **Self-contained, and therefore repetitive.** A group bound to the owner
        applies in every one of its VPCs and so appears in every block, rules included,
        rather than being listed once elsewhere with a cross-reference. A group in two
        blocks is the same group — same `uid`, same rules. Answering "what filters a
        machine in this VPC" is one block and nothing else.

        **A block reports the BINDING that reaches this VPC, not a per-interface
        computation.** It is an upper bound on what filters a machine here, exact in
        the ordinary case and over-reporting in one: if no node pool's selected
        interface actually connects to this VPC — because every pool's first eligible
        ethernet landed on a different one — then nothing here carries these groups,
        and the block still lists them. A VPC whose backend has no security-group
        construct is NOT such a case: it filters nothing, so its lists are empty rather
        than over-reported.

        Resolving the selected interface per node pool is what would close that gap,
        and is what the planned `nodePool` query parameter will do. Until then, treat a
        block as "these groups are bound to reach this VPC" rather than "these groups
        are on every NIC in it".
      additionalProperties: false
      required:
        - id
        - securityGroups
        - securityGroupRules
      properties:
        id:
          type: string
          description: The VPC's `id` within the project.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: vpc-1
        securityGroups:
          type: array
          description: |
            The groups bound to reach interfaces in this VPC, owner-bound first and
            then this VPC's own, deduplicated. Always present; `[]` means nothing
            filters interfaces here — not an error, and always the case for a VPC on a
            backend with no security-group construct, where neither this VPC's binding
            nor its owner's can be enforced.

            The order is the order the fabric receives, so it is also the precedence:
            the owner's groups are applied ahead of this VPC's floor, and a group listed
            earlier takes precedence over one listed later. (Rule order WITHIN a group
            is significant too — see `EffectiveSecurityGroupRules`.)
          items:
            $ref: '#/components/schemas/EffectiveSecurityGroup'
        securityGroupRules:
          description: Every rule of every group above, split into `ingress` and `egress`.
          allOf:
            - $ref: '#/components/schemas/EffectiveSecurityGroupRules'
    Error:
      type: object
      description: >-
        Standard error response. A machine-readable failure class may appear in one of two places depending on the operation: at the top level as `error.reason` (used where the status alone is ambiguous, e.g. iam 403s), or per-entry inside `error.details[].reason` (used where structured recovery data accompanies the class, e.g. compute/infrastructure). Clients that branch on the failure class should check both locations.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
              description: HTTP status code
            message:
              type: string
              description: Error message
            requestId:
              type: string
              description: >-
                Optional opaque correlation id for this request, mirrored from the gateway's `X-Kong-Request-Id` response header (and the services' `X-Request-Id`). It is non-sensitive — a random per-request token, not derived from any client or resource identifier — so it is safe to surface in the body without reintroducing the generic-body hardening the envelope otherwise preserves. Quote it to support: the same id appears in the gateway audit stream and, for backend-origin failures, the upstream service log. Present whenever an id is available for the request.
            reason:
              type: string
              description: >-
                Optional top-level machine-readable failure class, present when the HTTP status alone does not distinguish it (e.g. NON_INTERACTIVE_PRINCIPAL on 403s denied by the non-interactive principal policy). Clients can branch on this without parsing the human-readable message. When the class instead rides with structured recovery data it appears in `details[].reason` rather than here. Well-known top-level classes: `NON_INTERACTIVE_PRINCIPAL` (403); `IDENTITY_MISMATCH` (401 on the sign-in callback — the identity provider authenticated a different account than the email address sent to initiateLogin; no token is issued and the other account is not named); `CONFLICT_BACKEND_CAPACITY_EXCEEDED` (409 on compute createFileStore/updateFileStore — the storage system serving the requested class has no sellable capacity left; it also rides in `details[].reason`); `DOMAIN_NOT_OWNED` (422 on organizations createOrganizationInvitation — the invitee's email domain is not registered to any of the target organization's enabled identity providers. Applies to ANY organization that has at least one such provider, and to the platform-tier organizations `vendor`/`provider` unconditionally. An ORDINARY organization with no enabled provider is not subject to it and accepts any valid domain; a platform-tier one with no registered domain is the opposite and refuses every invitation); `PRINCIPAL_TYPE_COLLISION` (409 on the same operation — a platform account already exists for that address with a principal type the organization cannot accept; terminal, retrying does not clear it); `INVALID_DISCOVERY_URL` (422 on iam createProvider/updateProvider — `oidcConfig.discoveryUrl` is not an allowed outbound destination; the server fetches it during login, so by default it must be an `https` URL naming a publicly reachable host, and a deployment may relax the private-address and/or `https` requirement through operator configuration — see the field's own description); `QUOTA_EXCEEDED` (409 on quota-gated compute operations — today createCluster, scaleCluster, updateCluster, createInstanceGroup, scaleInstanceGroup, createFileStore and updateFileStore — the request was well-formed and the resource is in a valid state, but admitting it would exceed a quota limit at the organization or project scope. Distinct from the lifecycle conflicts on the same operations, which carry no reason, and from `INSUFFICIENT_CAPACITY`, which means no matching hardware, or no host for a hosted control plane. The same class is repeated on one `details[]` entry per refused dimension, whose `metadata` is a `QuotaRefusal`. `requested` and `admissible` are amounts in the refused dimension, not target sizes: for createCluster they are the new cluster's node count or storage ceiling, so requesting at most `admissible` is admitted; for updateCluster they are the ceiling increase in GiB; for scaleCluster they are the aggregate node-count INCREASE across the request's pools, so the client must reduce that increase to at most `admissible` (the pool targets stay absolute — with 4 nodes today, requested 3 and admissible 1, the admitted target is 5, not 1); for createFileStore they are the new store's GiB, and for updateFileStore the GiB increase over the capacity the store's quota hold already covers. Retrying without freeing usage, without reducing the request accordingly, or without raising the binding limit returns the same result); `QUOTA_UNASSIGNED` (409 on the same seven quota-gated compute operations — the organization holds no quota limits while the platform requires them, because a default profile is designated. No limit was measured, so there are no `details[]`, and retrying returns the same result until an operator gives the organization limits, by applying a profile or setting them directly); `QUOTA_ENFORCEMENT_ACKNOWLEDGEMENT_REQUIRED` (409 on organizations updateQuotaDimensionEnforcement: switching a dimension's enforcement on must acknowledge the live number of scopes at or over their limit on it, which the switch would start refusing; the same class is repeated on one `details[]` entry whose `metadata` is a `QuotaEnforcementAcknowledgement`, carrying the near/over-limit report listing those scopes. Review it and repeat the request with `acknowledgedBlockedScopes` = `blockedScopes`); `QUOTA_DIMENSION_NOT_CHARGED` (409 on the same operation: nothing charges the dimension yet, so its usage is always zero and its enforcement cannot be switched on; terminal until the platform charges it); `PROJECT_REGION_MISMATCH` (409 on every compute, networking and storage operation under `/v1/regions/{region}/projects/{project}`: the project is locked to a different region than the one in the URL. A project's region is set once and is immutable thereafter, so retrying the same URL returns the same result; address the project's own region, which the project read returns. The message does not name that region. Also 409 on compute createControlPlatform with `source: managed`, and on updateControlPlatform when `allowedOrganizations` changes while a backing Cluster's control plane is placed on the platform, when the region's operator project is locked to another region. Organizations' internal bootstrap project create also returns it, naming both regions, when the slug already exists in another region); `CONFLICT_IMMUTABLE` (409 on organizations updateProjectInOrg: the request names `region`, which cannot be changed after the project is created; the same reason also rides in `details[].reason`, where compute's immutable-field 409s carry it); `INSUFFICIENT_CAPACITY` (422 on compute createCluster when the hosted control plane of a cluster whose ClusterType references an HCPConfig cannot be placed on any host, and on createControlPlatform when a backing Cluster's own control plane cannot be placed; the request was refused before anything was created. The same class rides in `details[].reason`; see there); `INVALID_EMAIL_TEMPLATE` (422 on organizations putInvitationEmailTemplate and previewInvitationEmailTemplate: the submitted invitation email template breaks one or more syntax or variable rules; every violation is listed as its own `details[]` entry, see the details description. A missing, empty or control-character `html` is a plain 422 without this reason); `CONFIRMATION_REQUIRED` (409 on credential revoke and rotate: a target is unrecoverable and the request did not send `confirm: true`; nothing was changed).
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
              description: Additional error details
    ErrorDetail:
      type: object
      description: |-
        A structured failure detail. Conventionally carries a `reason` (machine-readable class), an optional `message`, and an optional `metadata` object of recovery data. The entry's `reason` tells a client which metadata shape applies: `QUOTA_EXCEEDED` entries carry `QuotaRefusal`, `QUOTA_ENFORCEMENT_ACKNOWLEDGEMENT_REQUIRED` entries carry `QuotaEnforcementAcknowledgement`, and every other class carries a free-form object.
        Well-known metadata keys on the free-form classes: `clusterId` (string) and `selfLink` (string) on compute createCluster 504s; `instanceGroupId` (string) and `selfLink` (string) on compute createInstanceGroup 504s; `addressPoolId` (string) and `selfLink` (string) on compute createAddressPool 504s; `fileStoreId` (string) and `selfLink` (string) on compute createFileStore 504s; `storageBackendId` (string) and `selfLink` (string) on compute createStorageBackend 504s; `securityGroupId` (string) and `selfLink` (string) on compute createSecurityGroup 504s; `controlPlatformId` (string) and `selfLink` (string) on compute createControlPlatform 504s; `batchId` (string) on infrastructure batchCreate 409s; `invalidRoles` and `validRoles` (string arrays) on organizations 422 role-assignment errors; `reservationErrorCode` (string, `not_enough_servers` or `not_enough_symmetric_servers`) on infrastructure addReservationServers 422s; on `INVALID_EMAIL_TEMPLATE` 422s, one entry per violation whose `metadata` carries only the keys that apply: `line` and `column` (integers, 1-based position in the submitted template; `column` is absent when only the line is known, as on a `TEMPLATE_PARSE_ERROR` or `RENDER_ERROR`), and `variable` (string, the template variable).
        Placement refusals and the refusals of changes to what is placed (operator-only, compute): `controlPlatform` (string, the Control Platform's URI) on each per-platform entry; `dimension` (string: `cpu`, `memory`, `disk` or `loadBalancerAddresses`), `needed` and `free` (integers, in the dimension's capacity unit) on `INSUFFICIENT_CAPACITY` entries; `topologyKey` (string) on a `TOO_FEW_NODES` entry whose count left out workers without a `DoNotSchedule` spread constraint's key, naming that key, and absent otherwise; `cluster` (string, the Cluster's URI) on `HOST_NOT_CONNECTED` and per-Cluster `CONFLICT_IMMUTABLE` entries; `removable` and `requested` (integers, worker counts) on `NODES_HOLD_ETCD_VOLUMES`. Not yet applied: `cluster`, `removable` and `requested`, and every key on the refusals of changes to what is placed, are declared ahead of their implementation.
        Well-known detail classes: `INSUFFICIENT_CAPACITY` (422 on infrastructure addReservationServers — the region has no matching servers left, as opposed to the request being invalid; the caller can retry later or ask for fewer hosts); `RESERVATION_ID_CONFLICT` (409 on infrastructure createReservation — the caller-supplied `reservationId` cannot be used for this request; generate a new id and retry, or retry the same id once a release in progress completes); `RESERVATION_ID_COUNT_MISMATCH` (409 on the same operation — the id names a live reservation that differs only in `numberOfServers`, typically the caller's own after a resize; do not mint a new id for it); `RESERVATION_REQUEST_EXPIRED` (409 on the same operation — the request came after its `notAfter` and reserved nothing); `QUOTA_EXCEEDED` (409 — the per-dimension breakdown of the top-level class of the same name); `CONFLICT_BACKEND_CAPACITY_EXCEEDED` (409), `CONFLICT_CAPACITY_BELOW_USAGE` (409 on updateFileStore), `CONFLICT_SHARE_TYPE_MISMATCH` (409 on createFileStore) and `STORAGE_BACKEND_MISSING` / `STORAGE_BACKEND_OUT_OF_SERVICE` / `STORAGE_PLACEMENT_NOT_APPLIED` (422) on compute createFileStore/updateFileStore — see those operations for which precondition each names; on `INVALID_EMAIL_TEMPLATE` 422s, one of `TEMPLATE_TOO_LARGE`, `INVALID_ENCODING` (the template is not valid UTF-8), `TEMPLATE_PARSE_ERROR` (the template does not parse), `DISALLOWED_TEMPLATE_ACTION`, `UNKNOWN_VARIABLE`, `MISSING_REQUIRED_VARIABLE` (a required variable is not referenced, or `AcceptURL` is referenced but the accept link does not reach the sent email), `RENDER_ERROR` (the template parses but cannot be rendered, for example `{{if}}` branches that end in different HTML contexts), and a final `TOO_MANY_VIOLATIONS` entry when the list was truncated at 100.
        `INSUFFICIENT_CAPACITY` also means a hosted control plane that does not fit (422 on compute createCluster and createControlPlatform; 409 on updateHCPConfig, updateClusterType and the scale-down of a Control Platform's backing Cluster). A tenant caller gets a single entry with a generic message; a caller holding `compute.controlplatforms.read` gets one entry per candidate Control Platform with its own reason, one of the `PlacementReason` codes, or, with no candidate, a single `HCPCONFIG_NOT_ACCEPTED` entry naming none. The 409s carry their codes in `details[].reason` only, with no top-level reason. Further compute classes: `HOST_CLUSTER_TYPE_UNSUITABLE` (422 on createControlPlatform — the ClusterType cannot back a host cluster); `OPERATOR_PROJECT_NOT_CONFIGURED` (503 on the same operation, and on updateControlPlatform when `allowedOrganizations` changes while a backing Cluster's control plane is placed on the platform — the region has no operator project, or names one that does not exist); `HOST_NOT_CONNECTED` (409 on updateClusterType — a live Cluster of the type runs on a host cluster not connected as a Control Platform); `NODES_HOLD_ETCD_VOLUMES` (409 on the scale-down of a backing Cluster — fewer workers without etcd volumes than asked to remove). Not yet applied: `HOST_NOT_CONNECTED` and `NODES_HOLD_ETCD_VOLUMES` are declared ahead of their implementation.
      properties:
        reason:
          type: string
          description: Machine-readable failure class of this entry.
        message:
          type: string
          description: Human-readable description of this entry.
        metadata:
          description: Recovery data for this entry. The shape depends on `reason`.
          anyOf:
            - $ref: '#/components/schemas/QuotaRefusal'
            - $ref: '#/components/schemas/QuotaEnforcementAcknowledgement'
            - $ref: '#/components/schemas/ErrorDetailFreeFormMetadata'
      allOf:
        - if:
            required:
              - reason
            properties:
              reason:
                const: QUOTA_EXCEEDED
          then:
            required:
              - metadata
            properties:
              metadata:
                $ref: '#/components/schemas/QuotaRefusal'
        - if:
            required:
              - reason
            properties:
              reason:
                const: QUOTA_ENFORCEMENT_ACKNOWLEDGEMENT_REQUIRED
          then:
            required:
              - metadata
            properties:
              metadata:
                $ref: '#/components/schemas/QuotaEnforcementAcknowledgement'
    ErrorDetailFreeFormMetadata:
      type: object
      description: Free-form recovery data for every detail class other than `QUOTA_EXCEEDED` and `QUOTA_ENFORCEMENT_ACKNOWLEDGEMENT_REQUIRED`.
      additionalProperties: true
    ExportLocation:
      type: object
      readOnly: true
      description: |
        One mount target published by the platform for a file store. Locations
        appear only once the store reaches `state: active`; a store that is still
        `creating` publishes none. A store may publish several locations — for
        example one per data-network VIP — in which case `preferred` marks the one
        a client should mount unless it has a reason to do otherwise. Entirely
        server-produced: clients never send this object.
      properties:
        server:
          type: string
          description: |
            Host the export is served from — the storage system's data endpoint,
            not an address of the platform API. Combine it with `path` to form the
            NFS mount source `<server>:<path>`. Optional: a location published
            before the serving endpoint is known omits it, and a client that has
            the endpoint from its own network configuration can mount without it.
          readOnly: true
          example: 10.60.4.10
        path:
          type: string
          description: Mountable export path, published whole, in the form the consuming host passes to `mount`; combine it with `server` as `<server>:<path>`.
          example: /fs/prj-proj-a1b2c3d4-fs-a1b2c3d4-e5f6-7890-abcd-ef1234567890
        options:
          type: string
          description: |
            Mount options the storage system recommends for this location, in the
            comma-separated form `mount -o` takes. Advisory and passed through
            verbatim: the platform neither validates the string nor mounts on the
            tenant's behalf. Absent when the storage system recommends none.
          readOnly: true
          example: vers=4.1,hard,timeo=600
        protocol:
          type: string
          description: |
            Protocol this location is served over. NFS-only in v1; the enum is
            closed to `nfs`, and adding a protocol later is an additive change to
            it.
          enum:
            - nfs
          example: nfs
        preferred:
          type: boolean
          description: |
            Advisory hint that this is the recommended location to mount when
            several are published — typically the topologically closest data
            path. Advisory only: every published location is functional, and the
            platform does not reject a client that mounts a non-preferred one. At
            most one location per store is marked preferred.
          example: true
        adminOnly:
          type: boolean
          description: |
            Marks a location intended for operator use rather than tenant mounts,
            for example a management data path. Published rather than filtered out
            so that an operator reading the store can see the full set of targets
            and a tenant client can skip them deliberately instead of being
            surprised by a location that will not mount. Absent or `false` means
            the location is for normal tenant use.
          example: false
    FileStore:
      type: object
      description: |
        A shared filesystem exported to bare-metal consumers over NFS, managed as
        a single declarative object. The client edits the store — its capacity and
        the set of consumers attached to it — and the platform reconciles the
        backing storage to match. There are no separate access-rule or binding
        resources: attachment and access are expressed by the `consumers` list on
        this object, and changing who may mount the store is an update to that
        list.

        The tenant selects capability, not hardware: `shareType` names a class
        such as `general` or `high-speed`, and which array satisfies it is the
        platform's business and is never disclosed here.

        The object is declarative-friendly: writable fields describe the desired
        state, read-only fields report the observed state, and `reconciling` is
        `true` whenever the two differ — for example while a newly added consumer
        is being applied to the backend. A create or update returns immediately;
        poll the object until `reconciling` is `false` and `state` is `active`.
      required:
        - id
        - uid
        - selfLink
        - shareType
        - capacityGiB
        - state
        - reconciling
        - etag
        - createdBy
        - createdAt
        - updatedAt
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/storage/file-stores/store-0h2wq6dt5m8pjzk3xn4vbr7fcy
        uid:
          type: string
          format: uuid
          description: |
            Server-generated UUID. Stable for the lifetime of the resource and
            never reused, so it is the durable handle to record in external
            systems; `id` and `displayName` are for humans.
          readOnly: true
        id:
          type: string
          description: |
            Name of the resource. Provided by the client when the resource is
            created, or generated by the server if not specified. Must be 1-63
            characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? —
            the first character must be a lowercase letter, and all following
            characters must be lowercase letters, digits, or hyphens, with the
            last character being a letter or digit. Cannot be changed after the
            resource is created. Supplying it makes a retried create safe — the
            duplicate is rejected with `409` instead of provisioning a second
            resource.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: store-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Optional human-friendly display name. Free text, not unique, and not used for lookup.
          example: Training dataset store
        description:
          type: string
          description: An optional description of this resource.
        shareType:
          type: string
          description: |
            Capability-named class this store is provisioned from, as listed by
            `GET .../storage/share-types` — for example `general` or
            `high-speed`. Chosen at create time and immutable afterwards: moving a
            store between classes is a data migration, not a field update. The
            class describes what the storage does, never who makes it.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: general
        capacityGiB:
          type: integer
          format: int64
          minimum: 1
          description: |
            Declared capacity of the store in binary gibibytes (GiB), set by the
            client. It is the size the store is requested and accounted at — not
            the amount currently consumed.

            **Not enforced on the backend.** The storage systems behind this API do
            not currently apply it as a hard quota, so a store may consume beyond
            this figure. It is charged against the `storage_gib` quota; do not rely
            on it to cap consumption.

            An update may raise or lower it; the value counts against the `storage_gib` quota.
          example: 1024
        consumers:
          type: array
          description: |
            The desired set of consumers attached to this store — the declarative
            replacement for a separate binding or access-rule resource. Each entry
            grants the stated mount level to one address (`type: ipAddress`) or to
            every member of an instance group (`type: instanceGroup`); a machine
            that no entry covers cannot mount the store. Edit the attachment set by
            sending the desired list on update: entries added are attached, entries
            removed are detached, and the platform reconciles the backend's export
            policy to match. Observed per-consumer progress — and, for a group, the
            addresses it resolved to — is reported in the read-only `consumerStatus`
            field, keyed by `ref`. A detached entry leaves this list at once but
            stays in `consumerStatus` with `state: deleting` until the backend
            confirms the revocation.

            An update that would take the list past `maxItems` is rejected with
            `422` and `details[].reason: INVALID_ARGUMENT`. The bound is
            provisional and tracks the backing storage's export-rule limit.

            Only `accessLevel: rw` can be granted — see that field on the consumer
            object.

            **`maxItems` counts entries, not resolved addresses.** A single
            `instanceGroup` entry can fan out to as many addresses as the group has
            members. That fan-out is bounded by a second, independent ceiling: the
            addresses are coalesced into contiguous ranges and the resulting rule
            count may not exceed 256, the limit the backing storage enforces on one
            store's rule set. A request past it is refused with `422` and
            `details[].reason: INVALID_ARGUMENT`, naming the ceiling. The two bounds
            are different units and neither implies the other — one entry can breach
            the rule ceiling, and 64 entries whose addresses are contiguous can
            coalesce to a single rule.

            A further ceiling is outside this API's reach: the backing storage merges
            the rule sets of every store that shares its storage policy, and that
            merged set has its own limit. Exceeding it surfaces as a failed store
            rather than as a partially granted one.
          maxItems: 64
          items:
            $ref: '#/components/schemas/Consumer'
        reconciling:
          type: boolean
          description: |
            `true` while the observed state differs from the desired state — for
            example while a capacity change or a newly added consumer is being
            applied to the backend — and `false` once it settles; a failed consumer
            stays visible in `consumerStatus`. Set by the server; poll on it rather
            than assuming a `201` or `200` means the change has taken effect.

            **Break your polling loop on `state`, not on this flag alone.** A store
            whose provisioning failed reaches `state: failed` with `reconciling`
            still `true`, because the desired state genuinely was never delivered —
            reporting `false` there would hide a failed expansion behind a green
            object. The same holds for a day-2 change that failed against a store
            that stays `active`: `statusReason` and the affected
            `consumerStatus[].state` carry the diagnosis. Treat `state: failed`, or
            a non-empty `statusReason`, as terminal for the poll.
          readOnly: true
          example: false
        state:
          type: string
          description: |
            Observed lifecycle state. `creating` while the platform is first
            materializing the store, `active` once it is usable, `deleting` during
            teardown, `failed` if materialization errored — inspect `statusReason`
            in that case. Set by the server and not writable. A teardown that failed
            settles back to `deleting` and carries its cause in `statusReason` too.
          readOnly: true
          enum:
            - creating
            - active
            - deleting
            - failed
          example: active
        stateMessage:
          type: string
          readOnly: true
          description: 'Debug-only diagnostic for the current `state`; same value as the deprecated `statusReason` — closed-vocabulary codes plus `(ref: <executionId>)`, not stable across releases and not for verbatim display.'
        statusReason:
          type: string
          description: |
            Diagnostic explaining the current `state`, typically populated when
            `state=failed`. Debug-only: the wording is not stable across releases and
            must not be parsed by clients. Use `state` and `reconciling` for control
            flow and the HTTP error envelope's `details[].reason` for machine-readable
            causes.

            The value is shaped as one or more codes from a closed vocabulary followed
            by `(ref: <executionId>)`, which joins the failure back to the platform
            execution that produced it — quote that reference when reporting a store
            that will not converge. The vocabulary itself is internal and may grow;
            `unclassified_failure` covers anything the platform could not match. A
            failure whose rollback left a backing object behind carries
            `storage_compensation_incomplete` in addition to its cause, and such a
            store is refused a plain `DELETE` until the object is cleaned up by hand.
            Codes introduced alongside per-project namespaces are
            `storage_namespace_unknown` and `storage_policy_ambiguous`.
          readOnly: true
          deprecated: true
        stateReason:
          allOf:
            - $ref: '#/components/schemas/FileStoreStateReason'
          readOnly: true
          description: Machine-readable cause of the recorded failure.
        operation:
          allOf:
            - $ref: '#/components/schemas/Operation'
          readOnly: true
          description: Reference to the file store's current or last lifecycle operation, absent when none is recorded, including after a platform re-drive that failed to start; `status` is `failed` when the run settled at `deleting`, recorded a `stateReason`, or left the store `reconciling` (per-consumer cause in `consumerStatus`); never `cancelled`, and `reason` is never set.
        exportLocations:
          type: array
          description: Mount targets published by the platform for this store. Empty while the store is `creating` or `failed`, populated by the time it reaches `active` wherever a storage operator runs; on `deleting` they may still be listed but must not be mounted.
          readOnly: true
          items:
            $ref: '#/components/schemas/ExportLocation'
        consumerStatus:
          type: array
          description: |
            Observed state of each consumer, keyed by `ref`. This is a SUPERSET of
            the desired `consumers` list: an entry with `state: deleting` is a
            revocation still in flight and has already been removed from
            `consumers[]`. `active` means the grant is enforced on the backing
            storage — not merely recorded — so poll here rather than assuming a
            successful update means a host can mount.

            **`state` is deliberately coarse and stays that way.** It is one
            aggregate verdict per entry, and it does not gain a value or a sub-object
            as consumer kinds are added. `resolvedAddresses` is where the evidence
            lives: for an `instanceGroup` entry it is the list of addresses that
            entry actually authored, so "which machines did this grant reach" is
            answered by reading the addresses, not by decoding a richer state. Where
            `state` alone is not enough to act on, `statusReason` names the cause.
          readOnly: true
          items:
            type: object
            properties:
              ref:
                type: string
                description: |
                  The consumer `ref` this status corresponds to — the address for an
                  `ipAddress` entry, the instance-group `id` for an `instanceGroup`
                  entry. One status entry per desired entry, however many addresses
                  that entry resolved to.
                example: 10.40.12.17
              state:
                type: string
                description: |
                  Observed state of this consumer's grant on the backend. `creating`
                  while it is being applied, `active` once enforced, `deleting` while
                  a revocation is in flight, `failed` when the grant could not be
                  established or the platform can no longer vouch for it. Consult
                  `statusReason` before treating `failed` as an outage — see below.
                enum:
                  - creating
                  - active
                  - deleting
                  - failed
                example: active
              resolvedAddresses:
                type: array
                description: |
                  Addresses this consumer resolved to. `state` is what says whether
                  they are enforced yet: an entry that has not settled reports what
                  it resolved to, not what the backend has authored. For an
                  `ipAddress` entry this is the one address in `ref`; for an
                  `instanceGroup` entry it is one address per member machine on the
                  interface selected by the entry's `network`, and it is the record
                  of which machines the grant was derived from. IPv4-only — the
                  export policy admits no other family, and IPv6 addresses on a
                  dual-stack interface are skipped rather than rejected — and
                  normalized to the spelling used for duplicate detection.

                  Two entries that resolve to the same address produce one policy
                  entry on the backend, and that address is reported here under both
                  of them. The overlap is legal: one address is one export-policy
                  entry, and every entry grants the same level, since `rw` is the
                  only level that can be granted.
                items:
                  type: string
                  example: 10.40.12.17
              statusReason:
                type: string
                description: |
                  Cause behind this consumer's `state`. The field never carries free
                  text: it holds either one of the **stable tokens** below — the
                  platform's own verdict on the entry, which a client may compare
                  against exactly — or a classified backend failure code reported by
                  the materialization workflow. A backend diagnostic that matches no
                  known code is reduced to `unclassified_failure` with an opaque
                  execution reference, so raw backend wording never reaches this
                  field. Only the tokens below are stable enough to branch on.

                  - `group_no_ready_hosts` — the group resolved, but none of its
                    members is ready to be granted. The group exists and is coming
                    up; wait, then re-send the entry.
                  - `group_member_set_empty` — the group's recorded member set is
                    empty. Distinct from the above on purpose: nothing has ever been
                    written here, which is a different problem with a different fix.
                  - `network_matched_no_interface` — the entry's `network` selector
                    matched no interface: either it names a fabric that a resolved
                    member has no interface on, or its hardware identifier matches
                    nothing anywhere in the group. Normally a `422` at write time; it
                    appears here when a member drifts out from under a grant that was
                    already established.
                  - `group_membership_drifted` — the group's membership no longer
                    matches what this entry resolved to. The platform re-resolves and
                    re-authors the grant on its own within one freshness interval, and
                    while that repair is under way the entry reads `creating` with no
                    reason at all — so this token means the repair did not happen or
                    did not stick, because its bounded attempts are spent, because
                    the re-resolution was one the platform could not vouch for, or
                    because repair is switched off in this deployment. An empty or
                    otherwise unvouched-for member set is still never applied: it
                    cannot be told apart from a legitimately emptied group, and
                    guessing wrong would break a live mount or hand a machine access
                    it was never granted.
                    Re-send the consumer entry to force an immediate re-resolve.
                  - `group_no_longer_grantable` — the group this entry was derived
                    from is gone or on its way out: it is being deleted, or its id
                    now names a different group than the one the grant came from. Its
                    machines are returning to the shared pool while the grant still
                    names them, so unlike drift this is **not** routine. The grant is
                    not altered on its own here — this branch is never repaired
                    automatically; drop the entry or re-send it against a group that
                    should hold the access.

                  `group_no_ready_hosts`, `group_member_set_empty` and
                  `network_matched_no_interface` clear on their own the same way: the next
                  re-resolution that agrees with the grant returns the entry to `active`, and one
                  that finds a moved set is repaired like `group_membership_drifted`.

                  **This makes `statusReason` part of the alerting contract, not just
                  a debugging aid.** A scale-up the platform repairs never reaches
                  `failed` at all, but an alert on `state == failed` alone still
                  pages on the routine case where infrastructure has stopped
                  reporting a member. The predicate that means "a grant is not
                  working" is
                  `state == failed AND statusReason != group_membership_drifted` —
                  excluded because drift is transient, so alert instead on drift that
                  PERSISTS across several drift intervals, which means the repair
                  failed or is switched off. `group_no_longer_grantable` is
                  deliberately NOT in that exclusion — it is the one comparison
                  verdict that pages on first sight.
              stateReason:
                allOf:
                  - $ref: '#/components/schemas/FileStoreConsumerStateReason'
                readOnly: true
                description: The token from `statusReason` on its own, upper-cased; the alerting predicate above reads `state == failed AND stateReason != GROUP_MEMBERSHIP_DRIFTED`.
              stateMessage:
                type: string
                description: Whatever `statusReason` carries besides the token — unlike the store-level `stateMessage`, this omits the token itself. Debug-only; never branch on it.
                readOnly: true
        createdBy:
          type: string
          description: |
            Identifier of the principal that created this store — a user (`usr-…`),
            a service account (`sa-…`), or `svc:<service-id>` when the store is
            created over the platform-internal listener. Recorded at creation and
            never changed.
          readOnly: true
          example: usr-4f2c8a1b
        etag:
          type: string
          readOnly: true
          description: |
            Opaque concurrency token for the object's current revision. Echo it
            back on update to make the change conditional: if the store has been
            modified since you read it the update is rejected with `409` and
            `details[].reason: CONFLICT_VERSION`, so a concurrent edit to the
            `consumers` list cannot be silently overwritten. Omit it to update
            unconditionally.
          example: '"7"'
        createdAt:
          type: string
          format: date-time
          description: Timestamp at which the resource was accepted by the platform.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last modification to the resource, including server-driven state transitions.
          readOnly: true
    FileStoreConsumerStateReason:
      type: string
      description: Machine-readable cause of this consumer's `state` — the platform's own comparison verdict, or the classified backend failure code behind it. Absent when no cause is recorded.
      readOnly: true
      enum:
        - GROUP_NO_READY_HOSTS
        - GROUP_MEMBER_SET_EMPTY
        - NETWORK_MATCHED_NO_INTERFACE
        - GROUP_MEMBERSHIP_DRIFTED
        - GROUP_NO_LONGER_GRANTABLE
        - STORAGE_UNCONFIGURED
        - STORAGE_BACKEND_UNCONFIGURED
        - STORAGE_NOT_READY
        - STORAGE_UNAVAILABLE
        - STORAGE_WAIT_TIMEOUT
        - STORAGE_FAILED
        - STORAGE_COMPENSATION_INCOMPLETE
        - STORAGE_OBJECT_NOT_FOUND
        - STORAGE_NAMESPACE_UNKNOWN
        - STORAGE_PERMISSION_DENIED
        - STORAGE_REQUEST_REJECTED
        - STORAGE_CONFLICT
        - STORAGE_THROTTLED
        - STORAGE_ERROR
        - STORAGE_EXPORT_PATH_REJECTED
        - STORAGE_EXPORT_PATH_EMPTY
        - STORAGE_POLICY_AMBIGUOUS
        - GRANT_ENFORCEMENT_UNAVAILABLE
        - WORKFLOW_EXECUTION_MISSING
        - WORKFLOW_WEDGED
        - UNCLASSIFIED_FAILURE
      example: GROUP_MEMBERSHIP_DRIFTED
    FileStoreCreateRequest:
      type: object
      description: |
        Request to provision a file store in a project. The client declares the
        capability class and the capacity it wants, and optionally the consumers
        to attach up front; the platform selects the backing storage, provisions
        the export and reconciles the attachments asynchronously. Nothing about
        the backing hardware is selectable or visible here.

        A store created with an empty `consumers` list is mountable by nobody,
        which is the intended default: attach consumers now, or add them later by
        updating the store. A consumer is either a single address or an instance
        group whose members the platform resolves to addresses on the interface the
        entry names.

        Server-owned fields (`selfLink`, `uid`, `reconciling`, `state`,
        `stateMessage`, `statusReason`, `exportLocations`, `consumerStatus`,
        `createdBy`, `etag`, `createdAt`, `updatedAt`) are not accepted;
        sending them is rejected.
      additionalProperties: false
      required:
        - shareType
        - capacityGiB
      properties:
        id:
          type: string
          description: |
            Name of the resource. Must be 1-63 characters long and match the
            pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a
            lowercase letter, and all following characters must be lowercase
            letters, digits, or hyphens, with the last character being a letter
            or digit. If not specified, the server will generate a name. Supplying
            it makes a retried create safe: a repeat with the same `id` is rejected
            with `409` instead of provisioning a second store. There is no separate
            idempotency key header.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: store-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Optional human-friendly display name for the store. Free text; not unique and not used for lookup.
          example: Training dataset store
        description:
          type: string
          description: An optional description of this resource.
        shareType:
          type: string
          description: |
            Capability-named class to provision from, taken from
            `GET .../storage/share-types` — for example `general` or
            `high-speed`. A class that does not exist in the region is rejected
            with `422` and `details[].reason: INVALID_ARGUMENT` rather than silently
            substituted. Immutable once the store exists.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: general
        capacityGiB:
          type: integer
          format: int64
          minimum: 1
          maximum: 1048576
          description: |
            Capacity to declare for the store, in binary gibibytes (GiB). It can be
            raised or lowered later by updating the store. A value above
            `maximum` (1 PiB) is rejected with `422` and
            `details[].reason: INVALID_ARGUMENT`.

            **Not enforced on the backend.** The storage systems behind this API do
            not currently apply it as a hard quota; it is charged against the `storage_gib`
            quota and does not cap what the store can consume.
          example: 1024
        consumers:
          type: array
          description: |
            Optional set of consumers to attach at creation. Same shape as the
            store's `consumers` field: each entry names either one address
            (`type: ipAddress`) or an instance group whose members the platform
            resolves to addresses (`type: instanceGroup`). Omit or send an empty list
            to create a store that is mountable by nobody until consumers are added
            later.

            Entries are resolved and validated before the store is accepted, so an
            unresolvable group, a group with no members or no grantable address yet,
            or a `network` selector that matches nothing fails the whole create with
            `422` rather than producing a store with a partial export policy. A group
            that is still provisioning is therefore refused rather than recorded as a
            degraded entry: an entry that granted nothing carries no work to
            re-drive, and the store could never finish converging.

            A list longer than `maxItems` is rejected with `422` and
            `details[].reason: INVALID_ARGUMENT`. The bound counts entries, not the
            addresses they resolve to; it is provisional and tracks the backing
            storage's export-rule limit.
          maxItems: 64
          items:
            $ref: '#/components/schemas/Consumer'
    FileStorePage:
      type: object
      properties:
        fileStores:
          type: array
          description: The matching file stores, ordered by creation time descending.
          items:
            $ref: '#/components/schemas/FileStore'
        totalCount:
          type: integer
          format: int64
          example: 42
          description: |-
            Total file stores in the project matching the active `state`, `shareType` and `consumer` filters, so `ceil(totalCount / limit)` is the page count for the current filter.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    FileStoreStateReason:
      type: string
      description: Machine-readable cause of the current lifecycle `state`, drawn from the storage vocabulary (disjoint from `StateReason`); stable and safe to branch on. Absent when no failure is recorded.
      readOnly: true
      enum:
        - STORAGE_UNCONFIGURED
        - STORAGE_BACKEND_UNCONFIGURED
        - STORAGE_NOT_READY
        - STORAGE_UNAVAILABLE
        - STORAGE_WAIT_TIMEOUT
        - STORAGE_FAILED
        - STORAGE_COMPENSATION_INCOMPLETE
        - STORAGE_OBJECT_NOT_FOUND
        - STORAGE_NAMESPACE_UNKNOWN
        - STORAGE_PERMISSION_DENIED
        - STORAGE_REQUEST_REJECTED
        - STORAGE_CONFLICT
        - STORAGE_THROTTLED
        - STORAGE_ERROR
        - STORAGE_EXPORT_PATH_REJECTED
        - STORAGE_EXPORT_PATH_EMPTY
        - STORAGE_POLICY_AMBIGUOUS
        - GRANT_ENFORCEMENT_UNAVAILABLE
        - WORKFLOW_EXECUTION_MISSING
        - WORKFLOW_WEDGED
        - UNCLASSIFIED_FAILURE
      example: STORAGE_UNAVAILABLE
    FileStoreUpdateRequest:
      type: object
      description: |
        Partial update of a file store. Only the fields present in the body are
        changed, and at least one *updatable* field — `displayName`, `description`,
        `capacityGiB` or `consumers` — must be supplied. An `etag`-only body is not
        an update and is rejected with `400`. Returns the full resource.

        Identity (`id`) and class (`shareType`) are fixed for the life of the
        store. Everything else the tenant controls is here: display fields settle
        immediately; `capacityGiB` records a new declared capacity immediately while
        the backing storage catches up (not enforced as a quota on
        the backend); and `consumers` is the attachment set.

        `consumers` is replaced wholesale by the list you send — it is the desired
        state, not a patch. To attach an address or an instance group, send the
        current list plus the new entry; to detach one, send the current list
        without it. The platform reconciles the backend to match and reports
        per-consumer progress in the store's read-only `consumerStatus`. Supply the
        store's current `etag` to make the update conditional and avoid clobbering a
        concurrent edit.

        Re-sending an `instanceGroup` entry unchanged is not a no-op: it re-resolves
        the group and re-authors its addresses. It is no longer the only way to re-resolve — the platform also does so
        on its own freshness interval — so it is the
        way to force a grant reported as `group_membership_drifted` back in line
        immediately instead of waiting for that interval.
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          description: Replace the human-friendly display name. Send an empty string to clear it.
          example: Training dataset store (2026 run)
        description:
          type: string
          description: Replace the free-text description. Send an empty string to clear it.
        capacityGiB:
          type: integer
          format: int64
          minimum: 1
          maximum: 1048576
          description: |
            New declared capacity for the store, in binary gibibytes (GiB). A value
            above `maximum` (1 PiB) is rejected with `422` and
            `details[].reason: INVALID_ARGUMENT`.

            **Not enforced on the backend.** The storage systems behind this API do
            not currently apply it as a hard quota; a new value is passed to the
            backend and charged against the `storage_gib` quota, but does not cap
            what the store can consume.

            May grow or shrink; a value below the store's measured usage is refused with `409` `CONFLICT_CAPACITY_BELOW_USAGE` only when a usage has been measured, otherwise the size change goes to the backend.
          example: 2048
        shareType:
          type: string
          description: |
            Immutable. Present here only so that sending it produces a diagnosis
            rather than a bare rejection: any value is refused with `409` and
            `details[].reason: CONFLICT_IMMUTABLE`. Moving a store between capability classes is a data
            migration — create a store in the new class and migrate the data.

            Every other field the store does not accept on update is refused with
            `400` and `details[].reason: INVALID_ARGUMENT` under
            `additionalProperties: false`.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: general
        consumers:
          type: array
          description: |
            The desired set of consumers, replacing the store's current list in
            full. Adding an entry attaches that address or that instance group;
            removing one detaches it, and for a group that revokes every address the
            group resolved to. Send the store's existing consumers alongside any new
            ones to avoid detaching them by omission.

            A list longer than `maxItems` is rejected with `422` and
            `details[].reason: INVALID_ARGUMENT`. The bound counts entries, not the
            addresses they resolve to; it is provisional and tracks the backing
            storage's export-rule limit.
          maxItems: 64
          items:
            $ref: '#/components/schemas/Consumer'
        etag:
          type: string
          description: |
            The `etag` read from the store, echoed back to make this update
            conditional. If it does not match the store's current revision the
            update is rejected with `409` and
            `details[].reason: CONFLICT_VERSION`. Omit to update
            unconditionally.
          example: '"7"'
    HardwareSpecs:
      type: object
      description: >-
        Hardware specifications for a server, sourced at read time from the latest `server_inventory` snapshot — the same source the servers summary classifies CPU/GPU from, so per-server rows and the project summary reconcile. An empty object when no inventory has been collected for the server yet (never absent).
      properties:
        cpu:
          type: object
          description: CPU specifications
          properties:
            model:
              type: string
              description: CPU model name.
              example: AMD EPYC 9654
            vendor:
              type: string
              description: CPU vendor.
              example: AMD
            cores:
              type: integer
              description: Total physical cores across all sockets.
              example: 96
            sockets:
              type: integer
              description: Number of populated CPU sockets.
              example: 2
            frequencyMhz:
              type: integer
              description: Base clock frequency in MHz.
              example: 2400
        ram:
          type: object
          description: RAM specifications
          properties:
            totalGiB:
              type: integer
              description: Total installed memory in GiB.
              example: 512
        gpu:
          type: object
          description: >-
            GPU SKU and details. Present only for servers that report one or more installed GPUs.
          properties:
            model:
              type: string
              description: GPU model name.
              example: H100 SXM5
            vendor:
              type: string
              description: GPU vendor.
              example: NVIDIA
            family:
              type: string
              description: GPU family / architecture.
              example: Hopper
            count:
              type: integer
              description: Number of GPUs installed.
              example: 4
            vramGiB:
              type: integer
              description: VRAM per GPU in GiB.
              example: 80
        internalStorage:
          type: object
          description: |-
            Storage installed IN the chassis, as the last inspection found it.

            Named `internalStorage` rather than `storage` deliberately: storage reached over the network — a file store this machine's instance group consumes — is a separate resource with its own lifecycle, attached at the GROUP level rather than per machine, and nothing in this block describes it. A caller asking "how much storage does this machine have" is asking one of two different questions, and this answers only the local one.

            Omitted when the inspection collected no storage figures, rather than published as zeroes, which would read as a machine with no disks.
          properties:
            bootDeviceSizeGiB:
              type: integer
              description: Size of the device the host boots from, in GiB.
              example: 480
            nvmeDevices:
              type: integer
              description: Number of NVMe drives installed.
              example: 8
            nvmeDeviceSizeGiB:
              type: integer
              description: >-
                Capacity of EACH NVMe drive in GiB, not the total. The inventory records per-drive size; multiplying by `nvmeDevices` is the caller's to do and is only meaningful for a uniform set.
              example: 3840
        nics:
          type: object
          description: |-
            Data-plane network interface counts, as the last inspection found them. Counts only — the per-slot detail is `pciDevicesLayout` below. These are data-plane NICs; the management interface is never described here.

            There is no DPU count: a machine type can SELECT on one, but the inspection snapshot does not collect it, so reporting one would be an invention. Omitted when no counts were collected.
          properties:
            ethernet:
              type: integer
              description: Number of Ethernet ports/cards installed.
              example: 2
            infiniband:
              type: integer
              description: Number of InfiniBand ports/cards installed.
              example: 8
        pciDevicesLayout:
          type: array
          readOnly: true
          description: >-
            Per-slot PCI network/InfiniBand device layout from the latest inventory snapshot. Omitted when no layout was collected (e.g. metal3, or a NICo host whose inventory carries no metadata).
          items:
            $ref: '#/components/schemas/PciDevice'
    Health:
      type: object
      description: |
        Canonical health of a managed object. A summary judgement surfaced
        consistently across services. It never drives a lifecycle `state` machine,
        though a resource may state its own rule for consulting it — see the health
        field on each resource.

        `state` is always present: it is
        `unknown` before the first observation, whenever the record has gone stale
        (read-time substitution once `now` is past `expiresAt`), and while the owning
        resource withholds its verdict during a lifecycle phase.
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          readOnly: true
          enum:
            - healthy
            - degraded
            - unhealthy
            - unknown
          description: |
            Current canonical health. `healthy`, `degraded` and `unhealthy` are
            observed states; `unknown` means no current verdict — never observed,
            the last value has passed `expiresAt`, or the owning resource withholds
            it during a lifecycle phase (`reason` says which).
        reason:
          type:
            - string
            - 'null'
          x-go-type: string
          readOnly: true
          description: |
            Optional human-readable explanation for the current state. Null when
            unset, and cleared when a stale value is substituted with `unknown`.
        observedAt:
          type:
            - string
            - 'null'
          x-go-type: time.Time
          format: date-time
          readOnly: true
          description: When health was last confirmed. Null before the first observation.
        expiresAt:
          type:
            - string
            - 'null'
          x-go-type: time.Time
          format: date-time
          readOnly: true
          description: |
            Staleness boundary — once `now` is past this the read path returns
            `state: unknown`. Null when no staleness boundary applies (for example a
            watch-based producer that relies on a separate liveness signal).
    HostedControlPlane:
      type: object
      description: |
        Advisory status observed from the cluster's backing `K0smotronControlPlane`
        resource. Present only for a **hosted** (`hcp`) control plane that
        has actually been observed.

        Observability-only. Like the sibling `runtime` and `health` blocks it never
        reflects or drives the lifecycle `state` machine, and it may lag — read
        `observedAt` to judge staleness.

        **Read `state` first.** It is a single value that answers "is the control
        plane ready", and `message` answers "why not" for every value that is not
        `ready`. The counters beside them are the evidence behind that judgement,
        published so a client can show detail without deriving the judgement itself.
        Nothing here requires a second request or a calculation.

        **Presence is the signal.** The block is omitted entirely when there is no
        hosted control plane to observe (a standalone cluster), when the watcher has
        not reported yet, or when what it reported was not a complete observation —
        every field listed as required must have been observed, or nothing is
        published. It is also omitted in the rare case where the observation could
        not be brought within its storage size limit at all, even after the shedding
        described under `message`. That says nothing about the control plane. It is
        never emitted partially populated: a zero-valued summary is indistinguishable
        from a genuine "control plane is down" reading, so the only safe answer to
        "we did not observe this" is to omit the block. A client must therefore test
        for the block's presence, and must NOT read its absence as a set of zeros.

        The converse holds inside the block, without exception: once it is present
        every field carries a real observation, so a zero is data.
        `readyReplicas: 0` on a control plane that is still coming up is exactly
        the signal a caller needs, which is why no field here is omitted when empty.

        **`readyReplicas` of `desiredReplicas` is the pair to render**, and the two
        are the only counters here that are not deprecated.

        `ready`, `initialized`, `replicas`, `updatedReplicas` and
        `unavailableReplicas` are **deprecated** but still always present, and still
        carry exactly the values they did before `state` existed. Each is documented
        with the field that replaces it, or with a note that nothing here replaces
        it.
      additionalProperties: false
      required:
        - state
        - message
        - version
        - desiredReplicas
        - readyReplicas
        - observedAt
        - ready
        - initialized
        - replicas
        - updatedReplicas
        - unavailableReplicas
      properties:
        state:
          type: string
          readOnly: true
          enum:
            - ready
            - progressing
            - degraded
            - unavailable
            - provisioning
            - deleting
            - unknown
          description: |
            Summary judgement of the hosted control plane, computed by the platform
            from the resource's deletion timestamp, desired replica count, status
            counters and `Available` condition.

            **The decision order, first match wins.** It is listed as the checks the
            platform actually runs rather than as a ranking of the states, because
            `progressing` is reached at two different points and no ordering of the
            states alone can say that.

            1. A deletion timestamp is set → `deleting`. Checked ahead of everything
               else so a normal teardown does not surface as a fault.
            2. The control plane has never reported itself initialized →
               `provisioning`. This is initial bring-up: `Available` is legitimately
               false or unknown for minutes here, and that is not a failure.
            3. `Available` is **true** — the tenant API server answers — and then,
               in this order:
               1. `replicas` != `desiredReplicas` → `progressing`. Pods are still
                  being created or drained.
               2. `readyReplicas` < `desiredReplicas` → `degraded`. Every pod the
                  spec asks for exists, and one of them is not passing its readiness
                  probe.
               3. `updatedReplicas` < `desiredReplicas` → `progressing`. A version
                  rollout is in flight.
               4. otherwise → `ready`.
            4. `Available` is **false** → `degraded` if any replica is ready,
               `unavailable` if none is.
            5. `Available` is unknown or absent → `unknown`.

            `Available` is k0smotron's own condition on the resource — it reports
            whether k0smotron could reach the tenant API server and read its
            kube-system namespace. It is read to compute this field and is not
            published; `message` carries whatever it had to say.

            Two of the four counters above — `replicas` and `updatedReplicas` — are
            deprecated fields, which is not an accident of this list: the judgement is
            made from what the resource reports, and those are among the counters it
            reports. Check 3.2 compares the two that are not deprecated, which is the
            same comparison a client renders as "X of Y ready".

            Note that check 3.1 precedes 3.2 and 3.2 precedes 3.3, which is what the
            state names alone would not tell you:

            * A scale in flight outranks a readiness shortfall, so `progressing`
              does **not** promise every existing replica is ready. While `replicas`
              is short of `desiredReplicas` a low `readyReplicas` is the expected
              shape of a replica still starting, and the resource carries no signal
              separating that from one that failed. Read `readyReplicas` against
              `replicas` if you need the distinction; it becomes `degraded` once the
              scale completes.
            * A readiness shortfall outranks a rollout, so a control plane that is
              both mid-upgrade and missing a ready replica reports `degraded`, not
              `progressing`. The failure is the more actionable of the two.

            What each value means on its own:

            * `deleting` — being torn down.
            * `provisioning` — coming up for the first time.
            * `progressing` — serving, with a scale or a version rollout in flight.
            * `degraded` — serving, or partly serving, below the strength its spec
              asks for.
            * `unavailable` — came up at some point and is now down: no replica is
              ready and the API server does not answer. The tenant has lost
              scheduling, scaling and self-healing on their cluster, though
              already-running pods keep running.
            * `ready` — the API server answers, every desired replica is ready, and
              every one of them runs the requested version.
            * `unknown` — initialized, but k0smotron has reported no usable
              `Available` condition, so no honest claim can be made.

            The set is closed and a response will never carry a value outside it.
            The judgement is computed by a service that deploys independently of the
            API, so a state added there before this enum learns about it is
            normalized to `unknown` at the API boundary rather than passed through —
            a value outside the enum would put the response in violation of its own
            schema. `message` is free text and is **not** normalized, so the detail
            behind such a state still reaches you.

            A scale-up and a failed replica are told apart by which counter is short:
            `replicas` counts control-plane pods that **exist**, so `replicas` below
            `desiredReplicas` means pods are still being created (check 3.1,
            `progressing`), while `replicas` at strength with `readyReplicas` short
            means a pod exists and is failing its readiness probe (check 3.2,
            `degraded`). That is the only signal the resource carries that separates
            the two, and it is the reason `replicas` is still published while
            deprecated.
        message:
          type: string
          readOnly: true
          description: |
            Human-readable explanation of `state`, safe to render as-is. Never empty,
            including when `state` is `ready`.

            **The only "why" this block publishes, and free text.** Render it; do not
            parse it, and do not branch on it — `state` is the sole stable
            discriminator here. The text has two sources and nothing in the response
            says which one you are looking at:

            * k0smotron's own `Available` condition message, verbatim — at checks 2,
              3.4, 4 and 5 of the decision order under `state`, and only when that
              condition is present with a non-empty message. That text belongs to
              k0smotron and may change, in any release, without a version change
              here.
            * A sentence rendered by this platform, such as
              `2 of 3 control-plane replicas are ready`. This covers check 1
              (`deleting`, which is decided by the deletion timestamp, not by a
              counter), checks 3.1, 3.2 and 3.3 (the counter-derived states), and —
              the part worth knowing — checks 2, 3.4, 4 and 5 whenever the
              `Available` condition is absent or its message is empty.

            So the split is not "which check fired" but "did k0smotron have anything
            to say". At checks 3.1 to 3.3 its message is deliberately ignored even
            when present: it still reads as available while a replica is down, so
            passing it through would actively mislead. At checks 2, 3.4, 4 and 5 it
            is used when non-empty and stood in for otherwise — and k0smotron writes
            no message on its success path, so a `ready` control plane normally
            reports this platform's sentence, not k0smotron's.

            One check is not decided by whatever supplies its text: `provisioning`
            (check 2) is chosen from the lifecycle flag rather than from the
            condition, yet still reports the condition's message when there is one.

            Rarely, a note that the real text was dropped to fit the stored
            observation's size limit. k0smotron's messages may be up to 32 KiB, the
            whole payload budget, so an extreme one is truncated, and at the last
            step replaced outright, rather than allowed to cost this block and the
            `endpoint` derived beside it. It is never shed to empty — an empty
            message would be indistinguishable from a control plane with nothing to
            say — and every other field here is unaffected when it happens.
          example: 2 of 3 control-plane replicas are ready
        version:
          type: string
          readOnly: true
          description: |
            The Kubernetes/k0s version actually running on the hosted control plane.
            This lags the requested version while an upgrade rolls out, so it is not
            necessarily the version implied by the cluster's bound ClusterType.
            Comparing the two is how a client shows upgrade progress, and it is the
            only way to identify a rollout specifically: `state: progressing` does
            **not** mean "upgrading". It is reached from two different checks — a
            scale in flight (3.1) and a version rollout (3.3) — and a scale outranks
            a rollout, so a control plane doing both reports the scale. `message`
            names which one it is in prose; this field against the requested version
            is what answers it in data.

            Empty until k0smotron reports one, which it does not do until at least
            one replica is ready. An empty string says exactly that; the key is still
            present, like every other field in this block.

            k0smotron puts no length limit on the field, so this platform bounds it:
            an implausibly long value is truncated, ending in `…` as shed text does
            elsewhere. Unlike the text shedding described under `message`, this limit
            is not a response to size pressure — it holds on every observation,
            whatever the payload's size. It is never truncated to empty, because
            empty already means the sentence above, and a value of ordinary length is
            never touched.
          example: v1.36.1+k0s.0
        desiredReplicas:
          type: integer
          format: int32
          readOnly: true
          description: |
            How many control-plane replicas the hosted control plane's spec asks for.
            This is the **Y** in "X of Y ready": published alongside `readyReplicas`
            so a client can render the pair without a second request or a
            calculation.
        readyReplicas:
          type: integer
          format: int32
          readOnly: true
          description: |
            Number of control-plane pods passing their readiness probe. This is the
            **X** in "X of Y ready" — read it against `desiredReplicas`, which is the
            comparison `state` itself makes at check 3.2.

            Read against `replicas` instead, it answers a different question: how many
            of the pods that currently **exist** are ready, which is what separates a
            replica still starting during a scale-up from one that exists and is
            failing. `state` already reports that distinction, so most clients only
            need the pair with `desiredReplicas`.

            The resource also reports an `availableReplicas` counter, which this block
            does not publish because on a **K0smotronControlPlane** it is always equal
            to this field, and not by coincidence: k0smotron writes it as
            `replicas - unavailableReplicas`, with both terms accumulated by a loop
            over the pods that exist. The desired count never enters that arithmetic,
            so the two cannot diverge. This one is the better of the pair to publish
            regardless, being counted directly rather than subtracted — on
            k0smotron's sibling K0sControlPlane controller, which this block is never
            read from, `availableReplicas` goes negative mid-scale-up.
        observedAt:
          type: string
          x-go-type: time.Time
          format: date-time
          readOnly: true
          description: |
            When the watcher last read the underlying `K0smotronControlPlane`.
            Doubles as the staleness signal for every field in this block. Always
            present when the block is — a summary without an observation timestamp is
            not published at all.
        ready:
          type: boolean
          readOnly: true
          deprecated: true
          description: |
            **Deprecated:** use `state`.

            Whether at least one control-plane pod passes its readiness probe, which
            is exactly `readyReplicas > 0` and nothing more. It does **not** mean the
            tenant API server answers, which is what it is most often read as and
            what `state: ready` actually reports.

            The underlying resource has no such field: the platform now reads the
            `K0smotronControlPlane` at `v1beta2`, where `ready` does not exist, and
            this value is reconstructed with the same `readyReplicas > 0` arithmetic
            k0smotron's own `v1beta2` → `v1beta1` conversion applied. It is therefore
            byte-identical to what it was before, deliberately including the
            imprecision — a deprecated field that quietly became stricter would break
            callers more quietly than removing it.

            Still always present. It will be removed in a future version.
        initialized:
          type: boolean
          readOnly: true
          deprecated: true
          description: |
            **Deprecated:** use `state`.

            Whether the hosted control plane has come up at least once. Per the
            Cluster API contract this is never unset once provisioning completes, so
            it is **not** a liveness signal, which is what it is most often read as.

            `state: provisioning` is the replacement, and the correspondence is
            close but not exact: it means this field is false *and* the control plane
            is not being torn down. A control plane deleted before it ever came up
            reports `deleting`, because a teardown is checked first. So
            `state != provisioning` does not by itself prove this field is true —
            `state: deleting` leaves it unanswered — and every other state does.

            Still always present. It will be removed in a future version.
        replicas:
          type: integer
          format: int32
          readOnly: true
          deprecated: true
          description: |
            **Deprecated:** read `readyReplicas` against `desiredReplicas`.

            How many control-plane pods currently exist. Below `desiredReplicas`
            while a scale-up creates them, above it while a scale-down drains them.

            Nothing here replaces it exactly, and that costs one distinction: this is
            the only counter that separates a scale-up in flight from a replica that
            exists and is failing, which is why `state` still reads it (see check 3.1
            there). While it is still published you can make that call yourself; once
            it is gone, `state` and `message` are where that answer lives.

            Still always present. It will be removed in a future version.
        updatedReplicas:
          type: integer
          format: int32
          readOnly: true
          deprecated: true
          description: |
            **Deprecated:** no field here replaces it. Read `state` together with
            `message`: a rollout in flight reports `progressing`, and the message
            names the counts. Note that `progressing` alone does not identify a
            rollout — a scale in flight reports it too, and outranks one — so compare
            `version` against the requested version if you need to be sure.

            Number of control-plane pods running the requested version. Trails
            `replicas` during an upgrade. `v1beta2` of the underlying resource calls
            this `upToDateReplicas`; the value is identical and this block publishes
            it under the older name only.

            Still always present. It will be removed in a future version.
        unavailableReplicas:
          type: integer
          format: int32
          readOnly: true
          deprecated: true
          description: |
            **Deprecated:** read `readyReplicas` against `desiredReplicas`, which is
            the question this field is usually asked. The exact quantity below has no
            non-deprecated equivalent.

            Exactly `replicas` minus the resource's own `availableReplicas` counter,
            which is how k0smotron's `v1beta2` → `v1beta1` conversion defined it; the
            resource reports no such field itself. That counter is read but not
            published — it is always equal to `readyReplicas` here, so this is
            `replicas - readyReplicas` in every reading you will actually see.

            Note that it is measured against the pods that exist, not against the pods
            the spec asks for, so it does not count a replica that has yet to be
            created. The subtraction is unclamped, matching that conversion, so a
            status reporting more available replicas than existing ones yields a
            negative number here exactly as it did before.

            Still always present. It will be removed in a future version.
    Instance:
      type: object
      description: |-
        A provisioned host of an InstanceGroup or of a Cluster. An instance is a
        server held by a reservation: it is materialized automatically when its owner
        reserves the host, and there is no way to create one directly.

        Exactly one owner, always. A group-owned instance publishes
        `instanceGroupUuid`/`instanceGroupId`; a cluster-owned one publishes
        `clusterUuid`/`clusterId`. Branch on which pair is PRESENT — neither pair is
        `required`, and the absent one is omitted rather than empty.

        Identity and ownership are stored by the compute service; everything about the
        host itself lives in the infrastructure service and is read on every request
        rather than duplicated here. An Instance IS a host, so
        that read is not an enrichment: when the infrastructure service cannot be
        reached the request fails with `503` instead of returning a stored skeleton.
      required:
        - id
        - uid
        - nodePoolUuid
        - nodePool
        - serverSlug
        - state
      dependentRequired:
        instanceGroupUuid:
          - instanceGroupId
        instanceGroupId:
          - instanceGroupUuid
        clusterUuid:
          - clusterId
        clusterId:
          - clusterUuid
      properties:
        id:
          type: string
          description: |-
            Server-generated identifier, and the value every path and filter takes.

            The same identity as `uid`, spelled the way every other resource in this
            API spells an `id`: the `inst-` prefix followed by `uid` without its
            hyphens. It is not a second identifier, so there is nothing that could
            disagree between the two, and a client may treat either as canonical.

            Stable for the lifetime of the host's membership in its owner: it is
            derived from an identity minted by this service, not by the infrastructure
            provider, so it survives the provider's own instance being destroyed and
            re-created (as a deprovision followed by a re-provision does).
          pattern: ^inst-[0-9a-f]{32}$
          readOnly: true
          example: inst-8f14e45fceea467a9f1f9e1a2b3c4d5e
        uid:
          type: string
          format: uuid
          description: |-
            The same identity as `id`, in canonical UUID form. Published because the
            platform convention pairs a slug `id` with a UUID `uid`; both spell the
            one value this instance is keyed by.
          readOnly: true
          example: 8f14e45f-ceea-467a-9f1f-9e1a2b3c4d5e
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/compute/instances/inst-8f14e45fceea467a9f1f9e1a2b3c4d5e
        instanceGroupUuid:
          type: string
          format: uuid
          description: |-
            Uid of the owning InstanceGroup; the value the list endpoint's
            `instanceGroupUuid` filter takes. Absent when the instance belongs to a
            cluster instead.
          readOnly: true
        instanceGroupId:
          type: string
          description: |-
            Id (slug) of the owning InstanceGroup — what
            `GET .../compute/instance-groups/{id}` is keyed by, so the group can be
            fetched straight from this instance. Read from the group on every request
            rather than stored here, so the two can never disagree. Absent when the
            instance belongs to a cluster instead.
          readOnly: true
          example: ig-0h2wq6dt5m8pjzk3xn4vbr7fcy
        clusterUuid:
          type: string
          format: uuid
          description: |-
            Uid of the owning Cluster; the value the list endpoint's `clusterUuid`
            filter takes. Absent when the instance belongs to an instance group
            instead.
          readOnly: true
        clusterId:
          type: string
          description: |-
            Id of the owning Cluster — what `GET .../compute/clusters/{id}` is keyed
            by, so the cluster can be fetched straight from this instance. This is the
            cluster's `id` as that resource publishes it; the service's internal
            primary key is a different value and never appears here. Read from the
            cluster on every request rather than stored, so the two can never
            disagree. Absent when the instance belongs to an instance group instead.
          readOnly: true
          example: my-training-cluster
        nodePoolUuid:
          type: string
          format: uuid
          description: Uid of the owner's node pool this host was provisioned into; the value the list endpoint's `nodePoolUuid` filter takes.
          readOnly: true
        nodePool:
          type: string
          description: Id (slug) of the owner's node pool this host was provisioned into — the name it carries in that owner's `nodePools`. A pool has no route of its own.
          readOnly: true
          example: worker
        reservationUuid:
          type: string
          format: uuid
          description: Infrastructure reservation holding this server, or absent when none is recorded.
          readOnly: true
        serverSlug:
          type: string
          description: The host's name as registered in the infrastructure service. This is what identifies it across the service boundary.
          readOnly: true
          example: server-42bc614f
        state:
          type: string
          description: |-
            The instance's lifecycle state, and the only state this resource reports.
            The vocabulary is the platform's, so the same value means the same thing
            here as on any other resource that reports one.

            Derived on every request from the host the infrastructure service reports
            — never from a stored copy, which is exactly the value that goes stale.
            The host's own finer-grained state is NOT published alongside it: two
            lifecycle vocabularies on one object would leave a caller to reconcile
            them by hand. Where one value covers more than one host state,
            `stateMessage` names the step in words.

            The lifecycle in order: `not_provisioned` (the server is held for this
            instance and nothing has been provisioned onto it — allocated and idle,
            with nothing asked of it), `provisioning` (provisioning has been accepted
            or is under way), `running`, then on teardown `deprovisioning` (the
            instance is being wiped off the host) and `deleting` (the host itself is
            on its way back). `degraded` is reachable from anywhere.

            `state` is read live from the infrastructure service — from the host and
            from the reservation holding it. An operation this API has accepted but
            not yet pushed there is not visible here: a host whose deprovision was
            accepted a moment ago is still running, and that is what it reports. Two
            other fields carry the acceptance — `execution`, which appears on this
            instance with `requestedAt` set and no `completedAt`, and the owning
            instance group's own `updating` state. Both are committed before the
            request is answered.


            Once the infrastructure service has the request, `state` moves: a host
            targeted at `reserved` reports `deprovisioning` before anything has
            touched the machine, and one targeted at `provisioned` reports
            `provisioning`.


            `deleting` covers the IDLE windows of a teardown — from the point its
            group's reservation starts being released until the host's wipe begins,
            and again from the wipe finishing until the host itself is handed back.
            A host actively being wiped reports `deprovisioning` throughout, including
            during a group delete: the wipe and the hand-back are separately
            observable and take very different amounts of time. Without the
            reservation those idle windows would report a settled state identical to a
            finished deprovision's, which would tell a tenant mid-teardown that their
            instance is allocated and idle. Before the release begins, a
            still-provisioned host reports `running`.
            `stateMessage` distinguishes accepted-but-not-started from in-progress.

            `deleted` is the terminal state, and it is only ever returned when the
            caller asked for tombstones with `showDeleted=true`. A default read stops
            seeing the instance the moment it is deleted: the listing omits it and the
            single GET answers `410 Gone` — gone rather than not-found, because the id
            named a real instance of this project and ids are never reused.

            A `deleted` instance carries no host DATA, and nothing is read from the
            infrastructure service for it. That is deliberate: the server was released
            and may now be held by another project, so a live read would report the
            current state of a machine that is no longer this tenant's.

            What it does carry is the stored record — identity, the owner and pool it
            belonged to, `serverSlug`, timestamps. `serverSlug` is published because it
            is a stored record of which machine this instance used to occupy, not a
            fact about that machine today.

            The host-derived fields are still PRESENT, in their empty form:
            `networkConfiguration` is `[]`, `health.state` is `unknown`, and
            `inventory` is `{}`. They are never populated for a tombstone, so branch
            on `state` or on `deletedAt` rather than on whether a key is present.

            `degraded` means THE HOST REPORTED A PROBLEM — its last transition
            failed, or it is paused or awaiting operator input. It is derived from the
            host's lifecycle alone and never from `health`: a host reporting
            `health.state: unhealthy` while provisioned is `running` here and says so
            in `health`. The two are deliberately separate judgements.

            An instance whose host cannot be ATTRIBUTED to it — unknown to the
            infrastructure service, held by a different reservation, or with no
            reservation recorded — is `unknown`, not `degraded`. Nothing is impaired
            in that case; the machine may be fine and simply not this instance's, so
            the honest answer is that its state could not be determined. Keeping the
            two apart is also what makes `degraded` answerable by a filter.

            `stopping` and `stopped` are part of the vocabulary but are not reachable
            yet: nothing models machine power, so no host state produces them. They
            become reachable when power operations land.

            `unknown` means the state could not be determined — the host reported
            nothing nameable, the infrastructure service has widened its vocabulary
            ahead of this one, the host reported a state from outside this instance's
            lifetime (before it was provisioned onto, or after it was released), or
            the host could not be attributed to this instance at all. `stateMessage`
            says which.
          readOnly: true
          enum:
            - not_provisioned
            - provisioning
            - running
            - degraded
            - stopping
            - stopped
            - deprovisioning
            - deleting
            - deleted
            - unknown
          example: running
        stateMessage:
          type: string
          description: |-
            Why the instance is in the `state` it reports. Present for every state except `running`, which needs none.

            This is also where the host's finer-grained step is reported. Where one `state` covers more than one underlying step — `provisioning` covers being provisioned and being recovered after a failure, `degraded` covers failed, paused and awaiting-operator — this sentence is what tells them apart.

            A STABLE, self-contained sentence, never a passthrough of the underlying failure: the infrastructure service builds its own error text from raw internal errors, which can carry service endpoints, driver output and workflow identifiers. That text is recorded against the host there and logged by this service against the instance; an operator has both. Do not parse this field — branch on `state` instead.
          readOnly: true
        hostname:
          type: string
          description: The host's effective hostname, as the infrastructure service reports it right now. Not stored by this service — a captured copy would only be a second value to go stale. Usually the same as `serverSlug`, but automation may suffix it.
          readOnly: true
          example: server-42bc614f
        networkConfiguration:
          type: array
          description: The host's runtime network interfaces, as the infrastructure service reports them right now. Not stored by this service.
          readOnly: true
          items:
            $ref: '#/components/schemas/NetworkInterfaceConfig'
        health:
          allOf:
            - $ref: '#/components/schemas/Health'
          readOnly: true
          description: |-
            Canonical host health as infrastructure observes it, with `reason`
            carrying the explanation. Observability-only: it never drives
            `state`. `unknown` means never observed, or the last
            observation has gone stale.
        inventory:
          allOf:
            - $ref: '#/components/schemas/HardwareSpecs'
          readOnly: true
          description: Hardware the host actually has, from its latest infrastructure inventory snapshot. An empty object when none has been collected.
        lastPowerActionError:
          type: string
          description: Explains why the most recent power operation on this instance's server is known to have failed (NICo refused it, was unreachable after retries, or the workflow itself failed). That operation is any power action or BMC reset (`resetBmc`) against the server this instance occupies, whether requested on this instance or by an operator on the server directly — all are recorded here. Absent when no failure is known for the current/most recent operation — a success is never distinguished from "not yet known" here. Independent of `state` — a failed power operation does not mean this instance itself is unhealthy.
          readOnly: true
        execution:
          type: object
          readOnly: true
          description: |-
            The most recent operation requested on this instance through this API, and how it ended — the one question the live host cannot answer. A deprovision and an operator-driven cleaning reach the server identically, and the server's own failure reason is cleared when a retry re-arms it, so this is the only durable record that the REQUEST succeeded or failed. Absent when none has ever been requested.
            Independent of `state`: `state` is what the host IS right now, read live from the reservation; this is what was ASKED FOR and what became of it.
          required:
            - id
            - type
            - requestedAt
          properties:
            id:
              type: string
              description: Identifier of the execution, for correlation with the operation's workflow.
            type:
              type: string
              description: The operation this execution performs.
              enum:
                - deprovision
            requestedAt:
              type: string
              format: date-time
              description: When the operation was accepted.
            completedAt:
              type: string
              format: date-time
              description: When the operation reached a terminal state. Absent while it is still in flight, which is what distinguishes a running operation from a finished one without consulting the workflow.
            error:
              type: string
              description: |-
                Why the operation did not succeed. Absent on success and while in flight — so `completedAt` present with no `error` is the only shape that means the operation succeeded.

                A STABLE sentence chosen by the terminal the operation reached, not a passthrough of the underlying failure. Quote `execution.id` to an operator for the specific cause. Do not parse this field.
        deletedAt:
          type: string
          format: date-time
          description: >-
            When this instance was deleted. Present ONLY on a tombstone, which is only returned when the request asked with `showDeleted=true` — so its presence identifies a deleted instance without parsing `state`.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
    InstanceGroup:
      type: object
      description: |
        InstanceGroup resource — a BMaaS simple-mode unit of bare-metal provisioning. The tenant references an admin-defined `ClusterType` version and sizes each of its node pools; the platform provisions all of them. The group reports aggregate `state` and per-pool counts; its individual hosts are Instances in their own right, listed with `GET /compute/instances?instanceGroupId={id}`. It reuses the cluster materialization path minus the Kubernetes `ClusterDeployment`.
      required:
        - id
        - uid
        - selfLink
        - clusterType
        - nodePools
        - state
        - securityGroups
        - sshAccess
        - serialConsole
        - createdAt
        - updatedAt
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/compute/instance-groups/ig-0h2wq6dt5m8pjzk3xn4vbr7fcy
        uid:
          type: string
          format: uuid
          description: Server-generated unique identifier.
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        id:
          type: string
          description: Resource name. Client-provided or server-generated. Immutable once set. Pattern `[a-z]([-a-z0-9]*[a-z0-9])?`, 1-63 chars.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: ig-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Human-friendly display name.
          example: GPU training pool
        description:
          type: string
          description: Free-form description.
        clusterType:
          type: string
          format: uri-reference
          description: |
            URI of the bound `ClusterType` version (`/v1/regions/{region}/compute/cluster-types/{slug}/versions/{versionId}`). The pools' hardware (`machineType`) and NIC `networkAttachment`, plus the `networkSchema`, come from this ClusterType. Its Kubernetes/control-plane fields are unused. Immutable.
          example: /v1/regions/us-texas-1/compute/cluster-types/gpu-training/versions/a1b2c3d4-e5f6-7890-abcd-ef1234567890
        nodePools:
          type: array
          description: |-
            The group's node pools — one object each, carrying both what was asked for
            and where the pool got to. Always present; `[]` only when the group has no
            pools.

            `nodePool` names the source `ClusterTypeNodePool`; `desiredCount` is the
            number of hosts requested for it, within that pool's
            `[nodeCountMin, nodeCountMax]` and defaulting to `nodeCountDefault`. A
            pool requested at `0` provisions no hosts. The set of pools is immutable
            after create; their sizes change through the scale endpoint.

            The create and scale REQUESTS name the same number `size`. The response
            calls it `desiredCount` because here it sits beside `readyCount` and
            `notReadyCount`, and the three are read together.
          readOnly: true
          items:
            $ref: '#/components/schemas/NodePool'
        sshAccess:
          type: array
          maxItems: 32
          description: |-
            Host-login SSH access baked into every host in the group at provisioning
            time — one entry per Linux user (username, one or more authorized public
            keys, optional sudo, optional displayName). Read-only echo of the access
            set at create; the group is the unit and has no per-entry revoke. Immutable.
            Keys supplied inline at create are registered as managed credentials and
            read back as `sshPublicKeyCredentials` references, not literal
            `sshPublicKeys`; a group created before that behavior may still read back
            literal keys.
            Always present; `[]` when the group was created with no SSH access. The
            same value is returned on every response, including the asynchronous
            (`202`) securityGroups update.
          readOnly: true
          items:
            $ref: '#/components/schemas/SshUser'
        serialConsole:
          allOf:
            - $ref: '#/components/schemas/InstanceGroupSerialConsole'
          readOnly: true
          description: Serial-console state of the group. Always present, including on a tombstone, where all flags are `false`.
        state:
          type: string
          description: |
            Aggregate lifecycle state. `creating` while provisioning is in flight, `active` once all pools are provisioned, `updating` during a mutation, `deleting` during teardown, `failed` if provisioning errored.
          readOnly: true
          enum:
            - creating
            - active
            - updating
            - deleting
            - deleted
            - failed
        stateMessage:
          type: string
          readOnly: true
          description: Debug-only diagnostic for the current `state`; supersedes the deprecated `statusReason`, not stable across releases and not for verbatim display.
        statusReason:
          type: string
          description: Human-readable diagnostic shown when `state=failed`. Debug-only; not a stable client-parseable code.
          readOnly: true
          deprecated: true
        stateReason:
          allOf:
            - $ref: '#/components/schemas/StateReason'
          readOnly: true
          description: Machine-readable cause of the recorded failure; also set on a group that settled back to `active` after a failed scale, and the stable counterpart to the free-text `statusReason`.
        executionId:
          type: string
          readOnly: true
          description: |
            Workflow execution ID for an in-progress or recently failed operation.
            Present while state is `creating`, `updating`, or `deleting`, and while
            state is `failed` when an execution was attempted; absent when state is
            `active`, or when a `failed` group never attempted an execution (for
            example, a create cancelled before any workflow began). A present value
            on a `failed` group identifies the attempted execution for
            troubleshooting and recovery — it is not a guarantee that the workflow
            engine ever confirmed starting it (the start request itself may have
            failed before any callback could arrive).
        progressUpdatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of the latest persisted in-flight per-pool progress.
        deletedAt:
          type: string
          format: date-time
          description: >-
            When this group was deleted. Present ONLY on a tombstone, which is only returned by the listing with `showDeleted=true`.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 creation timestamp.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 last-modification timestamp.
          readOnly: true
        securityGroups:
          type: array
          description: |
            Security groups filtering this instance group's machines, by id, within the caller's
            project. Order is significant and preserved end to end: the list reaches the
            fabric as sent. A group named both here and on one of this instance group's
            VPCs is applied once, at its position in this list. (Rule order WITHIN a
            group is significant too — see `SecurityGroupRules`.)

            Applied to EVERY NetworkBundle the instance group materializes, on one interface per
            bundle: the first ethernet — by sorted interface name — whose
            `connectToNetwork` names a network on a NICo-backed VPC. The groups of that
            network's VPC are appended after these, so an instance group-level group takes
            precedence over the VPC-wide floor.

            An instance group whose node pools have no such interface anywhere is rejected with
            `422`: only the NICo fabric has a security-group construct, so groups
            applied elsewhere would record a posture nothing enforces.

            Always present; `[]` when none. A group deleted out from under the binding
            is omitted rather than echoed, so every id listed here resolves.
          items:
            type: string
            pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
            minLength: 1
            maxLength: 63
          example:
            - sg-a1b2c3
            - sg-d4e5f6
    InstanceGroupCreateRequest:
      type: object
      description: Request body for creating a new InstanceGroup (BMaaS simple mode).
      required:
        - clusterType
        - nodePools
      properties:
        id:
          type: string
          description: Optional client-provided resource name. When omitted the server generates a slug. Pattern `[a-z]([-a-z0-9]*[a-z0-9])?`, 1-63 chars.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: ig-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Human-friendly display name.
        description:
          type: string
          description: Free-form description.
        clusterType:
          type: string
          format: uri-reference
          description: |
            URI of the `ClusterType` version to bind (`/v1/regions/{region}/compute/cluster-types/{slug}/versions/{versionId}`). The version segment is optional — an absent version binds the current head. Its node pools, `machineType`/`networkAttachment`, and `networkSchema` drive provisioning; the Kubernetes/control-plane fields are unused.
          example: /v1/regions/us-texas-1/compute/cluster-types/gpu-training/versions/a1b2c3d4-e5f6-7890-abcd-ef1234567890
        nodePools:
          type: array
          description: |
            One entry per node pool to provision — `{ nodePool, size }`. `nodePool` is the source `ClusterTypeNodePool` id (slug). `size` is optional; when omitted the pool's `nodeCountDefault` is used. Each `size` must lie within the pool's `[nodeCountMin, nodeCountMax]`. All listed pools are provisioned; a pool sized `0` provisions no hosts.
          minItems: 1
          items:
            type: object
            required:
              - nodePool
            properties:
              nodePool:
                type: string
                description: Source `ClusterTypeNodePool` id (slug).
                pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                minLength: 1
                maxLength: 63
                example: worker
              size:
                type: integer
                format: int32
                minimum: 0
                description: Number of hosts to provision. Defaults to the pool's `nodeCountDefault` when omitted.
                example: 8
        sshAccess:
          type: array
          maxItems: 32
          description: |
            Optional host-login SSH access for the group — one or more Linux users, each with one or more authorized public keys and an optional sudo grant. Same `SshUser` shape and behavior as a cluster create: keys may be supplied inline (`sshPublicKeys`) or as `sshPublicKeyCredentials` references to `ssh_public_key` credentials in the request's region and project. Inline keys are registered as managed credentials and read back as references. Rendered into every host's login configuration. Immutable after create.
          items:
            $ref: '#/components/schemas/SshUser'
        securityGroups:
          type: array
          description: |
            Security groups filtering this instance group's machines, by id, within the caller's
            project. Order is significant and preserved end to end: the list reaches the
            fabric as sent. A group named both here and on one of this instance group's
            VPCs is applied once, at its position in this list. (Rule order WITHIN a
            group is significant too — see `SecurityGroupRules`.)

            A VPC's platform-managed default group cannot be named here: it is
            attachable only to the VPC that owns it, and naming one is refused with
            `422`. It would also be redundant — a VPC's own groups already reach this
            instance group's network attachments through the VPC — and wrong, because those
            rules are derived from one VPC's subnet prefixes while an instance group-level
            group is rendered onto every node pool, including pools attached to other
            VPCs' networks.

            Applied to EVERY NetworkBundle the instance group materializes, on one interface per
            bundle: the first ethernet — by sorted interface name — whose
            `connectToNetwork` names a network on a NICo-backed VPC. The groups of that
            network's VPC are appended after these, so an instance group-level group takes
            precedence over the VPC-wide floor.

            An instance group whose node pools have no such interface anywhere is rejected with
            `422`: only the NICo fabric has a security-group construct, so groups
            applied elsewhere would record a posture nothing enforces.

            Unknown or cross-tenant ids are rejected with `422`, naming every
            unresolvable id at once; a group already being deleted does not resolve.
          maxItems: 16
          items:
            type: string
            pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
            minLength: 1
            maxLength: 63
          example:
            - sg-a1b2c3
            - sg-d4e5f6
    InstanceGroupPage:
      type: object
      required:
        - instanceGroups
      properties:
        instanceGroups:
          type: array
          items:
            $ref: '#/components/schemas/InstanceGroup'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total instance groups in the project that the `showDeleted` setting selects — live groups only by default, live and deleted with `showDeleted=true` — so `ceil(totalCount / limit)` is the page count for the current request.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Token for the next page of results; pass it back verbatim as `pageToken`. Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    InstanceGroupScaleRequest:
      type: object
      description: |
        Request to scale an InstanceGroup's node pools. The body states a direction by
        which field it carries, and the two are mutually exclusive: supply exactly
        one.

        `nodePools` scales UP — per-pool absolute target host counts. `instancesToDelete`
        scales DOWN — the exact instances to remove, which is all a shrink needs:
        each instance names its own pool, and each pool's new size is what it holds
        minus the instances named from it. Supplying both, or neither, is rejected
        with `422`.

        The accepted scale atomically moves the group to `updating` and dispatches the
        asynchronous workflow for its direction — `instance-group-scale-up`, which
        adds servers to each pool's existing reservation and provisions the new hosts,
        or `instance-group-scale-down`, which removes the named instances' hosts from
        their reservation and hands them back to the available pool.
      additionalProperties: false
      allOf:
        - if:
            required:
              - instancesToDelete
          then:
            not:
              required:
                - nodePools
          else:
            required:
              - nodePools
      properties:
        nodePools:
          type: array
          minItems: 1
          description: |
            Per-pool absolute target host counts, for a scale-up. Duplicate slugs ⇒
            422; unknown slugs (not on the group) ⇒ 422; a pool with no bound
            infrastructure reservation ⇒ 422.

            Mutually exclusive with `instancesToDelete`. A shrink is never expressed
            here: a target below what a pool holds would say how MANY hosts to remove
            without saying WHICH, and the platform does not choose hosts on a
            tenant's behalf.
          items:
            type: object
            additionalProperties: false
            required:
              - nodePool
              - size
            properties:
              nodePool:
                type: string
                description: Source `ClusterTypeNodePool` id (slug) — the pool to grow.
                pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                minLength: 1
                maxLength: 63
                example: worker
              size:
                type: integer
                format: int32
                minimum: 0
                description: >-
                  Absolute desired host count. A scale-up must EXCEED the hosts the pool holds; a size equal to them is the desired-size correction described on the endpoint, which is the one case a size that does not grow the pool is accepted. A size BELOW them is rejected — shrinking is `instancesToDelete`. `0` is therefore only ever a correction, recording that a pool's reservation holds nothing.
                example: 8
        instancesToDelete:
          type: array
          description: |
            Instance identifiers to remove from the group, for a scale-down. This is
            the whole request: each instance names its own node pool, and each pool's
            new size is derived as the hosts it holds minus the instances named from
            it, so neither is supplied. The hosts are released from their pools'
            reservations and return to the available pool; the instances are then
            gone and their ids stop resolving.

            Every instance must be a member of this instance group, and they MAY span
            several of its pools. Naming every host a pool holds drains it — see the
            endpoint for what that costs.

            Only an instance whose host is settled `not_provisioned` can be removed.
            Any other state refuses the whole request, naming each instance and its
            state; destroy what is running on those hosts first with
            `POST .../instance-groups/{id}/deprovision`.

            Mutually exclusive with `nodePools`.
          items:
            type: string
          minItems: 1
          maxItems: 200
          uniqueItems: true
          example:
            - inst-0123456789abcdef0123456789abcdef
            - inst-fedcba9876543210fedcba9876543210
    InstanceGroupSerialConsole:
      type: object
      description: >-
        Serial-console state of an instance group. The platform generates one SSH keypair per group for the serial-console proxy, registers its public half as a NICo ssh key, and binds that key into a site-scoped NICo ssh-key group shared by every host in the group. Presence flags only: neither the key material nor the NICo identifiers are exposed. All `false` until the create workflow gets to them. The flags keep their values while the group is `deleting` and all read `false` once the group is a `deleted` tombstone. Groups created before this field was introduced always report all `false`.
      required:
        - generated
        - nicoKeyRegistered
        - nicoKeyGroupRegistered
      properties:
        generated:
          type: boolean
          readOnly: true
          description: The group's serial-console SSH keypair has been generated and stored.
        nicoKeyRegistered:
          type: boolean
          readOnly: true
          description: The keypair's public half is registered as a NICo ssh key.
        nicoKeyGroupRegistered:
          type: boolean
          readOnly: true
          description: The NICo ssh key is bound into a site-scoped NICo ssh-key group.
    InstanceGroupUpdateRequest:
      type: object
      description: |
        Request body for updating an InstanceGroup. Only `displayName` and `description` are mutable. Immutable fields (`id`, `clusterType`, `nodePools`, `sshAccess`) present in the body are rejected with `409 CONFLICT_IMMUTABLE`; unknown keys are rejected with `400 INVALID_ARGUMENT`. At least one mutable field must be supplied.
      properties:
        displayName:
          type: string
          description: Human-friendly display name.
        description:
          type: string
          description: Free-form description.
        securityGroups:
          type: array
          description: |
            Replace this instance group's whole security-group binding.

            **Asynchronous.** The binding is rendered into every NetworkBundle the
            instance group materializes, so the change is not complete when the request returns:
            the instance group moves to `updating` with a workflow re-applying those bundles, and
            settles back to `active` when it finishes. The response is `202`.

            A VPC's platform-managed default group cannot be named here: it is
            attachable only to the VPC that owns it, and naming one is refused with
            `422`. It would also be redundant — a VPC's own groups already reach this
            instance group's network attachments through the VPC — and wrong, because those
            rules are derived from one VPC's subnet prefixes while an instance group-level
            group is rendered onto every node pool, including pools attached to other
            VPCs' networks.

            **Send it on its own.** Combining it with the synchronous fields is
            rejected with `422` — the status code would otherwise depend on the body,
            and a caller could not tell which half had taken effect.

            Sending `[]` detaches everything. Omitting the field changes nothing; the
            two are distinct, so a dropped or misspelled field cannot silently clear
            the binding.

            Unknown or cross-tenant ids ⇒ `422`, naming every unresolvable id at once.
            An instance group that is mid-create or mid-delete ⇒ `409`: its bundles are being
            rendered or torn down, and changing the binding underneath that would race
            the workflow.
          maxItems: 16
          items:
            type: string
            pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
            minLength: 1
            maxLength: 63
          example:
            - sg-a1b2c3
    InstancePage:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total instances in the project matching every active filter — `inStates` included, judged on the same live host state the page carries — so `ceil(totalCount / limit)` is the page count for the current filter. Deleted instances are counted only when `showDeleted=true` (or `inStates` includes `deleted`).

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Token for the next page of results; pass it back verbatim as `pageToken`. Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    Kubeconfig:
      type: object
      description: >-
        Kubeconfig connection-descriptor resource for a cluster. It carries the cluster's server URL and CA only — it grants nothing on its own, is not a credential, and is not a secret to be revoked; a caller's usable kubeconfig is assembled by minting a short-lived OIDC token for them at request time.
      required:
        - id
        - uid
        - selfLink
        - status
        - createdAt
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/compute/clusters/cls-0h2wq6dt5m8pjzk3xn4vbr7fcy/kubeconfig
        id:
          type: string
          description: Server-generated identifier for this kubeconfig.
          pattern: ^kc-[0-9a-f]{32}$
          readOnly: true
          example: kc-9f2c1d4b8e7a4c3f9b1d6e0a2c5f8b31
        uid:
          type: string
          description: Server-generated UUID.
          format: uuid
          readOnly: true
        displayName:
          type: string
          description: Optional human-friendly display name for the kubeconfig.
        description:
          type: string
          description: An optional description of this resource.
        issuedFor:
          type: string
          description: User or role for which kubeconfig was issued
        status:
          type: string
          description: Lifecycle status, set by the server. `pending` is transient, `active` is usable, `revoked` means the record was kept but the descriptor cleared (cluster teardown), `failed` is terminal and may carry `failureReason`. `revoking` is a legacy waypoint from the retired credential-revocation workflow and is no longer reachable.
          readOnly: true
          enum:
            - pending
            - active
            - revoking
            - revoked
            - failed
        failureReason:
          type: string
          description: Diagnostic present only on a `failed` kubeconfig and not guaranteed even then; debug-only, not a stable code.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: Server-set creation timestamp.
          readOnly: true
    KubeconfigPage:
      type: object
      description: A page of issued kubeconfigs.
      required:
        - kubeconfigs
        - total
      properties:
        kubeconfigs:
          type: array
          items:
            $ref: '#/components/schemas/Kubeconfig'
        nextPageToken:
          type: string
        total:
          type: integer
          format: int64
          description: Total kubeconfigs this endpoint returns across all pages — the same `active`/`failed` set the items are drawn from, so `pending`, `revoking` and `revoked` configs are excluded.
    MCSServiceConfig:
      type: object
      additionalProperties: false
      required:
        - name
      description: |
        Configuration for a single service delivered to clusters of this type via a
        MultiClusterService (MCS). This is the shape shared by every MCS-delivered
        service (with `metallb` the first concrete service). Only `name`, `enabled`,
        and `resources` are supported; any other keys are rejected at the API boundary.
      properties:
        name:
          type: string
          minLength: 1
          description: >-
            Service identifier (e.g. `metallb`). Required, non-empty, and unique across the k8s.services list.
        enabled:
          type: boolean
          description: Whether this service is deployed for clusters of this type.
        resources:
          type: object
          description: >-
            For services that emit custom resources (e.g. MetalLB `IPAddressPool`/`BGPAdvertisement`/`Community`), the CR values handed to the catalog chart verbatim (mirrors the `metallb.resources` chart shape 1:1). Free-form; validated only as an object.
    MachineTypeFile:
      type: object
      description: Extra file to write into cloud-init user-data at provisioning time. Stored on the MachineType and copied verbatim onto every server provisioned from it.
      required:
        - path
        - content
      properties:
        path:
          type: string
          description: Absolute path including filename on the target host.
          example: /etc/k0rdent/extra.conf
        permissions:
          type: string
          description: 'Octal mode applied via chmod, e.g. "0644". Defaults to "0644" when omitted.'
          example: "0644"
          default: "0644"
        content:
          type: string
          description: File content. UTF-8 plain text. Multi-line content is allowed (use the YAML block-scalar form when authoring requests by hand).
    Network:
      description: |
        Fabric network resource for bare-metal instances. A network is either
        tenant-writable (created and managed via POST/PATCH/DELETE) or
        cluster-provisioned and read-only (`clusterId` set): the latter is
        materialized by the cluster lifecycle from the ClusterType's `networkSchema`, and
        tenant PATCH/DELETE on it returns `409`. `type` selects the fabric kind:
        ethernet (`evpn`) carries the optional `vlan`/`mtu`/`dhcpEnabled`/`dnsServers`
        attributes; specialised fabrics (`infiniband`, `nvlink`) carry the
        corresponding sub-block instead. Each `type` maps to a full,
        mutually-exclusive branch schema (`additionalProperties: false`), so the
        discriminator resolves a single concrete network kind. L3 / IP allocation is
        not modelled here — it lives on the Subnet.
      oneOf:
        - $ref: '#/components/schemas/NetworkEVPN'
        - $ref: '#/components/schemas/NetworkInfiniBand'
        - $ref: '#/components/schemas/NetworkNVLink'
      discriminator:
        propertyName: type
        mapping:
          evpn: '#/components/schemas/NetworkEVPN'
          infiniband: '#/components/schemas/NetworkInfiniBand'
          nvlink: '#/components/schemas/NetworkNVLink'
    NetworkAttachment:
      type: object
      description: |
        Per-pool NIC layout. Each top-level key groups interfaces by kind;
        each value is a map keyed by opaque interface ids (e.g. `eth0`,
        `ib0`, `bond0`). Every cross-reference (`ipFromSubnet`,
        `connectToNetwork`, etc.) is the local `id` of an entry in the
        parent ClusterType's `networkSchema`.

        Validity of individual keys and fields depends on the parent
        ClusterType's provider; the server enforces provider applicability.
      additionalProperties: false
      properties:
        ethernets:
          type: object
          description: Ethernet interfaces keyed by interface id.
          additionalProperties:
            $ref: '#/components/schemas/NetworkAttachmentEthernet'
        bonds:
          type: object
          description: Bond aggregations keyed by interface id.
          additionalProperties:
            $ref: '#/components/schemas/NetworkAttachmentBond'
        vlans:
          type: object
          description: VLAN sub-interfaces keyed by interface id.
          additionalProperties:
            $ref: '#/components/schemas/NetworkAttachmentVlan'
        infinibands:
          type: object
          description: InfiniBand HCA attachments keyed by interface id.
          additionalProperties:
            $ref: '#/components/schemas/NetworkAttachmentInfiniband'
        nvlinks:
          type: object
          description: NVLink GPU attachments keyed by interface id.
          additionalProperties:
            $ref: '#/components/schemas/NetworkAttachmentNvlink'
        host_agent:
          $ref: '#/components/schemas/NetworkAttachmentHostAgent'
    NetworkAttachmentAddress:
      type: object
      description: |
        An IP address binding on a network attachment. The actual IP is
        allocated from the referenced NetworkSchema subnet at cluster
        materialization time.
      additionalProperties: false
      required:
        - ipFromSubnet
      properties:
        ipFromSubnet:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local `id` of an entry in `networkSchema.subnets[]` to allocate the IP
            from; resolved to the materialized UFO Subnet name at cluster creation
            and rejected at create if it names no declared subnet. Either subnet
            mode is valid — a fixed-`cidr` subnet allocates through its
            `addressAllocator`.
          example: mgmt
    NetworkAttachmentBond:
      type: object
      description: A bonded interface aggregating multiple Ethernet members.
      additionalProperties: false
      required:
        - interfaces
      properties:
        parameters:
          type: object
          description: Bonding parameters.
          additionalProperties: false
          properties:
            mode:
              type: string
              minLength: 1
              description: Linux bonding mode (e.g. `active-backup`, `802.3ad`, `balance-rr`).
              example: active-backup
        interfaces:
          type: array
          description: Ids of Ethernet interfaces (from `ethernets`) that participate in this bond.
          minItems: 1
          items:
            type: string
            minLength: 1
            pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
            example: eth1
        mtu:
          type: integer
          minimum: 68
          maximum: 65535
          description: Maximum transmission unit.
        addresses:
          type: array
          description: IP address bindings for this bond.
          items:
            $ref: '#/components/schemas/NetworkAttachmentAddress'
        gatewayv4:
          $ref: '#/components/schemas/NetworkAttachmentGatewayV4'
        nameservers:
          $ref: '#/components/schemas/NetworkAttachmentNameservers'
    NetworkAttachmentEthernet:
      type: object
      description: An Ethernet interface attached to a node pool.
      additionalProperties: false
      properties:
        match:
          type: object
          description: Match criteria for selecting the physical NIC on the node.
          additionalProperties: false
          properties:
            macAddress:
              type: object
              description: Source of the NIC MAC address (used to pin the interface to a specific physical port).
              additionalProperties: false
              properties:
                fromAnnotation:
                  $ref: '#/components/schemas/NodeMacAddressFromAnnotation'
            pciSlot:
              type: string
              description: >-
                Match the NIC by its PCI bus address in domain:bus:device.function form (e.g. "0000:a3:00.0"). Optional; may coexist with macAddress.
              pattern: ^[0-9a-fA-F]{4}:[0-9a-fA-F]{2}:[0-9a-fA-F]{2}\.[0-7]$
            fabricLocation:
              $ref: '#/components/schemas/NetworkAttachmentFabricLocation'
        connectToNetwork:
          type: object
          description: >-
            Connect this interface to a network defined in `networkSchema.networks[]`. Its `name` is the local schema id; the worker resolves it to the materialized UFO Network name.
          additionalProperties: false
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              description: Local `id` of an entry in `networkSchema.networks[]`.
        dhcp4:
          type: boolean
          description: >-
            Enable IPv4 DHCP on this interface. When omitted it is inferred from `addresses` alone: `false` when static `addresses` are set (e.g. rail-optimised east-west NICs), `true` otherwise. `routes` and `gatewayv4` do not affect it — they configure where traffic goes, not how the interface acquires an address, so DHCP with static routes on top is a valid combination. Explicit `true`/`false` always wins.
        mtu:
          type: integer
          minimum: 68
          maximum: 65535
          description: Maximum transmission unit.
        addresses:
          type: array
          description: IP address bindings for this interface.
          items:
            $ref: '#/components/schemas/NetworkAttachmentAddress'
        routes:
          type: array
          description: |
            Static routes for this interface, rendered into UFO NetworkBundle
            `networkv2.ethernets[].routes`. Destinations may use
            `cidrFromSubnet` / `cidrFromRailsubnet`; next hops may use
            `gatewayFromSubnet`. Schema ids in nested `name` fields are
            resolved to materialized UFO Subnet names at cluster creation.
          items:
            $ref: '#/components/schemas/NetworkAttachmentRoute'
        gatewayv4:
          $ref: '#/components/schemas/NetworkAttachmentGatewayV4'
        nameservers:
          $ref: '#/components/schemas/NetworkAttachmentNameservers'
    NetworkAttachmentFabricLocation:
      type: object
      description: |
        Match an ethernet NIC by fabric rail (and optional plane) coordinates,
        resolved via the host's Link CR `spec.location`. One of the two match
        forms that give a `cidrFromRailsubnet` route its per-host rail context
        (`match.pciSlot` is the other).
      additionalProperties: false
      required:
        - railId
      properties:
        railId:
          type: integer
          minimum: 0
          maximum: 7
          description: Fabric rail index (0–7).
          example: 0
        planeId:
          type: integer
          minimum: 0
          maximum: 3
          description: |
            Optional fabric plane index (0–3). Narrows the match when `railId`
            alone is ambiguous across planes.
          example: 0
    NetworkAttachmentGatewayV4:
      type: object
      description: IPv4 default-gateway source for a network attachment.
      additionalProperties: false
      properties:
        gatewayFromSubnet:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local `id` of an entry in `networkSchema.subnets[]` whose gateway
            address is used. The target must have a gateway: either an
            `addressPool`-allocated subnet that has not set `gateway: false`
            (the carve supplies one), or a fixed-`cidr` subnet with
            `addressAllocator.backend: rail-optimised` (the P2P allocator
            derives one per rail on the fabric side). A fixed-`cidr` subnet on
            any other backend, and a pooled subnet with `gateway: false`, have
            none and are rejected at create.
          example: mgmt
    NetworkAttachmentHostAgent:
      type: object
      description: |
        Host agent settings for the pool's hosts. Rendered into the pool's UFO
        NetworkBundle as `spec.host_config`; omit the object, or a field, to leave it
        at UFO's default (`null` is rejected). Allowed only when the attachment
        declares at least one interface, since a pool without one renders no
        NetworkBundle. Requires a UFO whose NetworkBundle supports
        `spec.host_config`.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: |
            Whether the pool's hosts get the ufo-host-agent, its credentials and a
            HostConfig. `false` gives them none, and removes them from hosts already
            provisioned. This API applies no default: an omitted value is left out of
            the NetworkBundle, and UFO then enables the agent.
          example: true
        template:
          type: string
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          description: |
            Name of the cluster-scoped UFO HostConfigTemplate that seeds each host's
            HostConfig. It applies when the HostConfig is created only: a later change
            to the template does not reach hosts already provisioned. Without it the
            HostConfig starts with an empty spec. A DNS-1123 subdomain: each
            dot-separated label is at most 63 characters.
          example: spectrumx-rdma
    NetworkAttachmentInfiniband:
      type: object
      description: An InfiniBand HCA attachment.
      additionalProperties: false
      required:
        - connectToNetwork
      properties:
        connectToNetwork:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local `id` of an entry in `networkSchema.networks[]` with
            `type: infiniband`. The HCA joins that network's partition / PKey.
          example: gpu-fabric
        type:
          type: string
          enum:
            - phy
          description: HCA attachment type. Currently only `phy` (physical HCA).
        macAddress:
          type: object
          description: |
            Source of the HCA MAC address. Required on UFO; ignored on NICo
            (NICo uses `deviceInstance` instead).
          additionalProperties: false
          properties:
            fromAnnotation:
              $ref: '#/components/schemas/NodeMacAddressFromAnnotation'
        deviceInstance:
          type: integer
          minimum: 0
          description: Index of the InfiniBand adapter on the node. Unique within this pool's `infinibands`.
        isPhysical:
          type: boolean
          default: true
          description: |
            Whether the partition is attached over a physical interface. When
            `false`, `virtualFunctionId` must be supplied to identify the SR-IOV
            VF that carries the partition.
        virtualFunctionId:
          type: integer
          minimum: 0
          description: |
            SR-IOV virtual function index for the partition. Required when
            `isPhysical` is `false`; ignored otherwise.
      if:
        properties:
          isPhysical:
            const: false
        required:
          - isPhysical
      then:
        required:
          - virtualFunctionId
    NetworkAttachmentNameservers:
      type: object
      description: DNS resolver source for a network attachment.
      additionalProperties: false
      properties:
        addresses:
          type: object
          description: DNS server addresses, sourced from a network schema entry.
          additionalProperties: false
          properties:
            dnsFromNetwork:
              allOf:
                - $ref: '#/components/schemas/NetworkSchemaRef'
              description: Local `id` of an entry in `networkSchema.networks[]` whose DNS servers are used.
              example: mgmt
    NetworkAttachmentNvlink:
      type: object
      description: An NVLink GPU attachment.
      additionalProperties: false
      required:
        - connectToNetwork
      properties:
        connectToNetwork:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local `id` of an entry in `networkSchema.networks[]` with
            `type: nvlink`. The GPU joins that network's logical partition.
          example: gpu-nvl
        deviceInstance:
          type: integer
          minimum: 0
          description: |
            Optional GPU index. Validated and stored, but NOT honored yet: neither the
            UFO NetworkBundle (whose `networkv2.nvlinks` entry takes only
            `connectToNetwork`) nor NICo carries a client-chosen index, so the fabric
            derives it. Unique within this pool's `nvlinks` and within the GPU
            count exposed by the pool's machine type — neither uniqueness rule is
            enforced by the server.
    NetworkAttachmentRoute:
      type: object
      description: |
        A static route on an ethernet interface, forwarded to UFO NetworkBundle
        `networkv2.ethernets[].routes`. `to` and `via` each accept a literal
        string or a Subnet-derived object; forms may be mixed across entries.
      additionalProperties: false
      required:
        - to
      properties:
        to:
          allOf:
            - $ref: '#/components/schemas/NetworkAttachmentRouteDestination'
          description: |
            Route destination. Literal CIDR (e.g. `0.0.0.0/0`, `192.0.2.0/24`)
            or a Subnet object (`cidrFromSubnet` / `cidrFromRailsubnet`).
            Required — a route with no destination is rejected rather than
            silently dropped by the NetworkBundle translator.
        via:
          allOf:
            - $ref: '#/components/schemas/NetworkAttachmentRouteNextHop'
          description: |
            Route next hop. Literal IPv4 address or `{ gatewayFromSubnet: { name } }`.
        metric:
          type: integer
          minimum: 0
          description: Route metric.
    NetworkAttachmentRouteDestination:
      description: |
        Route destination: a literal CIDR or a Subnet-derived object.
      oneOf:
        - type: string
          minLength: 1
          description: |
            Literal destination CIDR in canonical form (host bits zero).
            Unlike `networkSchema.subnets[].cidr`, `/0` is allowed here:
            `0.0.0.0/0` is the default route.
          pattern: ^((25[0-5]|2[0-4]\d|[01]?\d?\d)\.){3}(25[0-5]|2[0-4]\d|[01]?\d?\d)/(3[0-2]|[12]?\d)$
          example: 0.0.0.0/0
        - $ref: '#/components/schemas/NetworkAttachmentRouteTo'
    NetworkAttachmentRouteNextHop:
      description: |
        Route next hop: a literal IPv4 address or a Subnet-derived gateway.
      oneOf:
        - type: string
          minLength: 1
          description: Literal next-hop IPv4 address.
          pattern: ^((25[0-5]|2[0-4]\d|[01]?\d?\d)\.){3}(25[0-5]|2[0-4]\d|[01]?\d?\d)$
          example: 10.0.0.1
        - $ref: '#/components/schemas/NetworkAttachmentRouteVia'
    NetworkAttachmentRouteTo:
      type: object
      description: |
        Route destination as a Subnet-derived object. Exactly one of
        `cidrFromSubnet` or `cidrFromRailsubnet` must be set (UFO
        `RouteToOrFromSubnet`). A literal CIDR string is also accepted on the
        parent route's `to` field via oneOf.
      additionalProperties: false
      properties:
        cidrFromSubnet:
          allOf:
            - $ref: '#/components/schemas/NetworkAttachmentSubnetNameRef'
          description: |
            Use the referenced Subnet's full allocated CIDR as the route
            destination.
        cidrFromRailsubnet:
          allOf:
            - $ref: '#/components/schemas/NetworkAttachmentSubnetNameRef'
          description: |
            Use the rail-scoped prefix of a rail-optimised Subnet
            (`addressAllocator.backend: rail-optimised`) for this host's
            fabric location. Requires a Link-location match on the same
            ethernet — either `match.fabricLocation` or `match.pciSlot`;
            UFO resolves the host's Link location from either form.
      allOf:
        - oneOf:
            - required:
                - cidrFromSubnet
            - required:
                - cidrFromRailsubnet
    NetworkAttachmentRouteVia:
      type: object
      description: |
        Route next hop as a Subnet-derived object. `gatewayFromSubnet` names a
        `networkSchema.subnets[]` entry whose gateway is used as `via` (UFO
        `RouteViaOrFromSubnet`). A literal IPv4 string is also accepted on the
        parent route's `via` field via oneOf.
      additionalProperties: false
      required:
        - gatewayFromSubnet
      properties:
        gatewayFromSubnet:
          allOf:
            - $ref: '#/components/schemas/NetworkAttachmentSubnetNameRef'
          description: |
            Local `id` of a `networkSchema.subnets[]` entry whose gateway
            address is the next hop. Same rule as `gatewayv4`: an
            `addressPool`-allocated subnet that has not set `gateway: false`,
            or a fixed-`cidr` one whose `addressAllocator.backend` is
            `rail-optimised` (the P2P allocator derives the gateway per rail).
            Other fixed-`cidr` backends, and a pooled subnet with
            `gateway: false`, have no gateway and are rejected at create.
    NetworkAttachmentSubnetNameRef:
      type: object
      description: |
        Reference to a `networkSchema.subnets[]` entry by local `id`. Used under
        route `to`/`via` objects (`cidrFromSubnet`, `cidrFromRailsubnet`,
        `gatewayFromSubnet`) in the UFO NetworkBundle shape; the worker resolves
        `name` to the materialized UFO Subnet name.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: Local `id` of an entry in `networkSchema.subnets[]`.
          example: ew-subnet
    NetworkAttachmentVlan:
      type: object
      description: A VLAN sub-interface carried on top of an Ethernet or Bond interface.
      additionalProperties: false
      required:
        - vlan
        - link
      properties:
        vlan:
          type: object
          description: VLAN id source. The VLAN tag is sourced from a network schema entry rather than supplied inline so the schema-id stays the single source of truth.
          additionalProperties: false
          required:
            - vlanIdFromNetwork
          properties:
            vlanIdFromNetwork:
              allOf:
                - $ref: '#/components/schemas/NetworkSchemaRef'
              description: Local `id` of an entry in `networkSchema.networks[]` whose VLAN id is used.
              example: data
        link:
          type: string
          minLength: 1
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          description: Id of the parent interface (an `ethernets` or `bonds` entry) this VLAN rides on.
          example: bond0
        mtu:
          type: integer
          minimum: 68
          maximum: 65535
          description: Maximum transmission unit.
        addresses:
          type: array
          description: IP address bindings for this VLAN.
          items:
            $ref: '#/components/schemas/NetworkAttachmentAddress'
    NetworkCreateRequest:
      description: |
        Request to create a tenant fabric network. `type` selects the fabric kind:
        ethernet (`evpn`) carries the optional `vlan`/`mtu`/`dhcpEnabled`/`dnsServers`
        attributes; specialised fabrics (`infiniband`, `nvlink`) carry the
        corresponding sub-block instead. Each `type` maps to a full,
        mutually-exclusive branch schema (`additionalProperties: false`), so the
        discriminator resolves a single concrete network kind. L3 / IP allocation is
        not part of this request — it lives on the Subnet.
      oneOf:
        - $ref: '#/components/schemas/NetworkCreateRequestEVPN'
        - $ref: '#/components/schemas/NetworkCreateRequestInfiniBand'
        - $ref: '#/components/schemas/NetworkCreateRequestNVLink'
      discriminator:
        propertyName: type
        mapping:
          evpn: '#/components/schemas/NetworkCreateRequestEVPN'
          infiniband: '#/components/schemas/NetworkCreateRequestInfiniBand'
          nvlink: '#/components/schemas/NetworkCreateRequestNVLink'
    NetworkCreateRequestEVPN:
      type: object
      description: 'Ethernet (EVPN) network create request. Selected when `type: evpn`.'
      additionalProperties: false
      required:
        - type
        - evpn
      properties:
        id:
          type: string
          description: Name of the resource. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. If not specified, the server will generate a name.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: net-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Optional human-friendly display name for the network.
        description:
          type: string
          description: An optional description of this resource.
        type:
          type: string
          const: evpn
          description: Fabric kind discriminator — always `evpn` for this branch.
        evpn:
          type: object
          description: EVPN-specific attributes.
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - l2vpn
                - l3vpn
              description: |
                EVPN service type, matching the UFO Network `type`: `l2vpn` for an
                L2 EVPN fabric, `l3vpn` for an L3 EVPN fabric.
        vlan:
          type: object
          description: VLAN attributes.
          additionalProperties: false
          properties:
            id:
              type: string
              pattern: ^(auto|[1-9][0-9]{0,3})$
              description: |
                VLAN id — an integer literal as a string (e.g. `"100"`) or
                the keyword `"auto"` to let the platform pick. The pattern
                rejects leading zeros; the server enforces the full 802.1Q
                range (`1`–`4094`, rejecting reserved `0` and `4095`).
              example: auto
        mtu:
          type: integer
          minimum: 68
          maximum: 65535
          description: Maximum transmission unit.
        dhcpEnabled:
          type: boolean
          description: Whether DHCP is enabled on this network.
        dnsServers:
          type: array
          description: DNS resolver addresses.
          items:
            type: string
            example: 4.2.2.1
        tags:
          type: object
          description: User-defined metadata labels for this network.
          additionalProperties:
            type: string
    NetworkCreateRequestInfiniBand:
      type: object
      description: 'InfiniBand network create request. Selected when `type: infiniband`.'
      additionalProperties: false
      required:
        - type
        - infiniband
      properties:
        id:
          type: string
          description: Name of the resource. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. If not specified, the server will generate a name.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: gpu-fabric
        displayName:
          type: string
          description: Optional human-friendly display name for the network.
        description:
          type: string
          description: An optional description of this resource.
        type:
          type: string
          const: infiniband
          description: Fabric kind discriminator — always `infiniband` for this branch.
        infiniband:
          type: object
          description: InfiniBand-specific attributes.
          additionalProperties: false
          properties:
            pkey:
              type: string
              pattern: ^0x[0-9a-fA-F]+$
              description: |
                InfiniBand partition key in hex (e.g. `0x1234`). Optional —
                may be allocated by the platform from a configured range
                when omitted (UFO). Ignored on NICo (partition name is
                authoritative).
              example: '0x1234'
            partition:
              type: string
              minLength: 1
              description: |
                Partition name. References an admin-defined InfiniBand
                Partition resource in the region. Required on NICo;
                optional on UFO (server-enforced — the contract does not
                gate by provider).
              example: gpu-training-ib
            index0:
              type: boolean
              description: Store the PKey at index 0.
            ipOverIb:
              type: boolean
              description: PKey participates in IP-over-InfiniBand multicast.
        tags:
          type: object
          description: User-defined metadata labels for this network.
          additionalProperties:
            type: string
    NetworkCreateRequestNVLink:
