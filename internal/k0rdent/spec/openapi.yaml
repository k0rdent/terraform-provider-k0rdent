  /v1/regions/{region}/projects/{project}/compute/clusters/{clusterId}/kubeconfigs:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: clusterId
        in: path
        required: true
        schema:
          type: string
        description: Unique cluster identifier
    get:
      operationId: listKubeconfigs
      summary: List kubeconfigs (deprecated)
      deprecated: true
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        **Deprecated.** `GET .../clusters/{clusterId}/kubeconfig` returns only the
        ready-to-use kubeconfig body (or `404` while none is ready yet) — it
        carries no `status` or `failureReason`. This collection is where a caller
        inspects issuance status: the current attempt's `Kubeconfig` entry
        (`active` or `failed`, with `failureReason` when applicable) plus any
        earlier failed attempts, and keeps working for that purpose.

        Returns only `active` and `failed` kubeconfigs. An in-flight `pending`
        issuance and a `revoked` config are both excluded, so a caller that has
        just requested one will not find that row here until it activates.

        Because this operation is deprecated, it does not take the `offset`/`limit`
