    patch:
      operationId: updateInstanceGroup
      summary: Update mutable fields on an instance group
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Update mutable fields: `displayName` and `description` (synchronous, `200`), and `securityGroups` (asynchronous, `202` — see that response). `securityGroups` cannot be combined with the synchronous fields in one request (that is `422`), so each valid request takes exactly one of the `200` or `202` paths. `id`, `clusterType`, `nodePools`, and `sshAccess` are immutable and are rejected with `409 CONFLICT_IMMUTABLE` if present in the body. Unknown keys are rejected with `400 INVALID_ARGUMENT`.
      tags:
        - instance-groups
      x-visibility:
        - internal
        - public
      x-status: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceGroupUpdateRequest'
      responses:
        '200':
          description: Instance group updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceGroup'
        '202':
          description: |
            Accepted — returned when the body carried `securityGroups`. That binding
            is rendered onto every NetworkBundle the group owns, which the platform
            cannot do synchronously, so the group is returned in `updating` and
            settles to `active` (or `failed`) on its own once the re-render
            completes. Poll `GET .../instance-groups/{id}` and wait for a settled
            `state`.

            This PATCH is admitted only from a settled state (`active`/`failed`). A
            `securityGroups` change on a group that is already `creating`, `updating`
            or `deleting` is refused with `409 CONFLICT_IN_USE` — including a group
            left `updating` by an earlier `securityGroups` change that is still
            rendering. Two direct `securityGroups` PATCHes therefore do not queue
            behind one another: wait for the group to settle and retry.

            The "waits rather than refused" serialization is a property of the shared
            render sequence, not of this endpoint. A re-render triggered while the
            group is still settled joins the render already in flight rather than
            starting a competing one; in particular a change to one of the group's
            VPCs (`POST .../networking/vpcs/{id}`) re-renders the same bundles and
            does NOT move the group transitional, so it always coalesces this way.
            The group's `updating` window can span both that render and this one.

            Every other field on this PATCH is synchronous and returns `200`, while a
            request carrying `securityGroups` returns `202`. The two cannot be
            combined in one request — that is `422` — so each valid request takes
            exactly one success path (`200` or `202`) rather than an ambiguous mix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceGroup'
        '400':
          description: 'Bad request — malformed JSON or an unknown field in the body. `details[].reason` is `INVALID_ARGUMENT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflict, with a distinct `details[].reason` per cause:

            - `CONFLICT_IMMUTABLE` — an immutable field (`id`, `clusterType`,
              `nodePools`, `sshAccess`) was present in the body.
            - `CONFLICT_VERSION` — a concurrent writer modified the row between this
              PATCH's read and write. The synchronous `displayName`/`description`
              path is optimistic-version checked, so the later write loses.
            - `CONFLICT_IN_USE` — a `securityGroups` change was refused; recovery
              depends on the cause. If the group is not in a settled state (it is
              `creating`, `updating` or `deleting`), poll until it settles to
              `active`/`failed` and retry. If the group was modified concurrently,
              re-read it and retry. If a requested security group began deleting
              between resolve and write, drop that group from the request before
              retrying — polling the instance group will not change the outcome.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Validation failure — no mutable field supplied, a field exceeds its length bound, or `securityGroups` was combined with a synchronous field in one request. `details[].reason` is `INVALID_ARGUMENT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteInstanceGroup
      summary: Delete an instance group
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Delete a group and release all its hosts (each performing the mandatory OS wipe). Deletion is asynchronous and two-phase: the group must be in `active`, `failed`, or `creating`. From `active`/`failed` the request transitions the group to `deleting` and starts the teardown workflow, and the row is removed only once that workflow is observed to finish.
        Deleting a `creating` group instead cancels its in-flight create; once that settles (normally to `failed`), the group is automatically torn down the rest of the way — a second DELETE call is normally not needed, though this may take longer than deleting an already-settled group. A manual DELETE issued again during this window is harmless: a `204` while the group is still `creating` (the cancel-mark request re-matches), or a `409` once the auto-chain has moved the row to `deleting`.
        Deleting a group in `updating` or `deleting` returns `409 CONFLICT_IN_USE`.
        From `active`/`failed`, credentials distributed to the group are revoked before the delete starts; if revocation fails, nothing changes and the delete must be retried.
        Deleting a `failed` group returns `503` when a node pool's reservation can only be recovered from the group's workflow history and either that history cannot be read right now, or the reservation recovered from it cannot be recorded on the group. The group is left in `failed` (any reservation already recovered and recorded stays recorded), and the delete should be retried.
      tags:
        - instance-groups
      x-visibility:
        - internal
        - public
      x-status: mvp
      responses:
        '204':
          description: 'Delete accepted. From `active`/`failed`, the group transitions to `deleting` and the teardown workflow is started; the group is NOT removed yet. Until that workflow is observed to finish, a follow-up GET returns `200` with `state: deleting`; thereafter it returns `404`. If the workflow fails, the group settles to `failed` and delete may be retried. From `creating`, the group stays in `creating` while its create is cancelled; a follow-up GET shows `state: creating`, then briefly `state: failed`, then `404` once the automatic follow-up teardown completes.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflict — the group is in `updating` or `deleting` and cannot be deleted yet. `details[].reason` is `CONFLICT_IN_USE`. Clients SHOULD retry after the group reaches `active` or `failed`.

            Also returned, with `details[].reason` `CONFLICT_IN_USE`, when the group's credentials are being changed and cannot be revoked yet; the group is unchanged, so retry after `Retry-After`.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          headers:
            Retry-After:
              description: Whole seconds to wait before retrying; present only when credential revocation is temporarily blocked.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Service unavailable, including when the group's credentials could not be revoked; the group is unchanged, so retry the delete.
          headers:
            Retry-After:
              description: Whole seconds to wait before retrying; present only when a retry interval is known.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/regions/{region}/projects/{project}/compute/instance-groups/{id}/scale:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique instance group identifier
    post:
      operationId: scaleInstanceGroup
      summary: Scale instance group node pools up or down
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Change host counts on one or more of the group's node pools and dispatch the
        asynchronous workflow for the request's direction: `instance-group-scale-up`
        adds servers to each pool's existing reservation and provisions the new
        hosts; `instance-group-scale-down` removes the named instances' hosts from
        their reservation and hands them back to the available pool.

        **A shrink needs more authority than a grow.** Growing a pool is an update;
        shrinking one destroys instances and hands their servers back, so it
        additionally requires the permission that governs removal — the same one
        the group''s deprovision and `DELETE` carry. A caller who may resize a pool
        but not remove from it can grow and will be refused `403` on a shrink.


        **The body states its direction by which field it carries**, and the two are
        mutually exclusive: supply exactly one. `nodePools[]` grows pools, each
        entry an absolute desired count (not a delta). `instancesToDelete` shrinks
        them. Supplying both, or neither, is `422` — there is no single honest
        response for a request that does both. The request is also rejected with
        `422` when duplicate pool slugs are supplied, a slug is unknown, a `size` is
        below what its pool holds, or a pool has no bound infrastructure
        reservation; and with `409` when the group is not in the settled `active`
        state — i.e. another lifecycle operation (create, update, delete, or a
        concurrent scale) is already in flight, or the group is `failed`. The
        accepted scale atomically moves the group to `updating` and returns its
        snapshot.


        **A shrink names hosts, never counts.** `instancesToDelete` is the entire
        scale-down request: each instance names its own pool, and each pool's new
        size is derived as the hosts it holds minus the instances named from it, so
        neither pool nor size is supplied. This is why a `size` below what a pool
        holds is refused rather than treated as a shrink — it would say how MANY
        hosts to remove without saying WHICH, and the platform does not choose
        hosts on a tenant's behalf.


        Only an instance whose host is settled `not_provisioned` can be removed —
        there is nothing running on it to destroy. An instance in any other state
        refuses the WHOLE request with `INSTANCES_NOT_DEPROVISIONED` (below) and
        nothing is written. Destroy what runs on those hosts first with
        `POST .../instance-groups/{id}/deprovision`, which keeps them claimed, then
        scale down to hand them back.


        The cluster type's `nodeCountMin` is NOT re-checked here. It is a floor on
        hosts that RUN the pool, enforced where one stops running — the deprovision
        above — so by the time an instance can be removed its pool has already
        satisfied it. Re-checking against the new size would also refuse the case
        the floor exists to permit: retiring a pool whose hosts were all
        legitimately deprovisioned.


        **Draining a pool releases its reservation.** Naming every host a pool
        holds releases the pool's reservation along with them, and the pool
        settles at size `0`. A later scale-up re-reserves hosts for it, unless the
        instance group's usage counts against organization limits: there a drained
        pool cannot be grown again (`RESERVATION_RELEASED` below), so drain a pool
        only when the group is finished with it. To remove the group itself, use
        `DELETE`.


        **`desiredCount` is yours.** Only this endpoint and create ever set a pool's
        desired size; no failure path, settle or background job rewrites it. A
        scale that fails therefore leaves the size you asked for on the record,
        with `readyCount + notReadyCount` reporting what the pool actually holds.


        **Correcting a pool's desired size.** While a pool's `desiredCount` and the
        hosts its reservation HOLDS — `readyCount + notReadyCount`, not `readyCount`
        alone — disagree, it cannot be scaled: a target computed from a size you
        never confirmed is a guess. A pool whose counts AGREE but that still has a
        host provisioning is a different refusal, `POOL_HOSTS_NOT_PROVISIONED`
        below, and needs no correction. Send a `nodePools[]` request whose `size`
        equals the number of hosts the pool's reservation currently holds (the
        `409` names it): that is accepted, sets `desiredCount` to it, provisions
        nothing, leaves the group `active`, and makes the pool scalable again. It is
        not a scale-down — no host is released — and a request mixing this
        correction with a real scale of another pool is refused with `422`.


        That size may be `0`, when the pool's reservation answers holding no hosts.
        Recording it is the way out of a failed scale-up. The pool is then empty. An
        empty pool cannot be grown by extending its reservation (`POOL_EMPTY`); a
        pool whose reservation has been released, including one drained by a
        scale-down to `0`, is re-reserved by a scale-up instead, unless the instance
        group's usage counts against organization limits.
      tags:
        - instance-groups
      x-visibility:
        - internal
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceGroupScaleRequest'
      responses:
        '200':
          description: |
            Scale accepted; instance group snapshot in the `updating` state. On a
            scale-down the named instances report `state: deleting` until their
            hosts leave the reservation, after which their ids stop resolving.

            ALSO returned by the desired-size correction described above, where the
            group stays `active`: nothing is provisioned or released, so no workflow
            runs and no state changes — only the named pools' `desiredCount` is set
            to what they already hold. Check `state` to tell the two apart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The group is not in a scalable state, the scale does not fit the quota,
            a named instance cannot be removed, or a pool's infrastructure
            reservation cannot back a scale.

            Another lifecycle operation (create, update, delete, or a concurrent
            scale) already in flight rejects the scale with no `reason` — scale is
            admitted only from the settled `active` state, so a `creating`,
            `updating`, `deleting`, or `failed` group is rejected. A previous size
            change (or the create itself) still settling its quota accounting, a
            window of a few seconds after the group turns `active`, also answers a
            reason-less 409; retry shortly and the same request is admitted.

            `QUOTA_EXCEEDED`: the servers this scale adds would exceed a
            node-count quota limit at the organization or the project scope (the
            limits are independent gates). `error.reason` is `QUOTA_EXCEEDED` and
            `error.details[]` carries one entry per refused dimension with
            `dimension`, `requested` (the aggregate node-count increase asked for
            across the request's pools), `admissible` (the largest such increase
            that would have been admitted), `bindingScope` and `scopes` — see
            `Error`. Both are increases, not target sizes: the request's pool
            `size` values are absolute, so to fit the client reduces the aggregate
            increase to at most `admissible` and re-derives its targets (a pool at
            10 with requested 3 and admissible 1 can scale to 11, not to 1). The
            target sizes are not persisted and nothing is written; retrying
            without freeing capacity, without reducing the increase, or without
            raising the binding limit returns the same result. A request that only
            confirms a pool's held size provisions nothing and is never
            quota-refused, and neither is a scale-down — it releases node-count
            accounting for the servers it hands back rather than consuming any.

            `QUOTA_UNASSIGNED`: the organization holds no quota limits
            while the platform requires them (a default profile is
            designated), so a scale that adds servers is refused before any limit
            is measured. `error.reason` is `QUOTA_UNASSIGNED` with no `details[]`.
            Retrying returns the same result until an operator gives the
            organization limits, by applying a profile or setting them directly.

            `INSTANCES_NOT_DEPROVISIONED`: a scale-down named an instance whose host
            is not settled `not_provisioned`, so there is still something running on
            it. The WHOLE request is refused and nothing is written. The message
            names every offending instance with its current state, in request order,
            and ends with what to do about each kind: destroy what runs on them
            first with `POST .../instance-groups/{id}/deprovision`; wait for an
            instance already `provisioning` or `deprovisioning` to settle; drop one
            already `deleting`, whose host is leaving anyway; retry one reporting
            `unknown`, whose host state could not be established.

            A pool whose infrastructure reservation cannot back the scale is
            distinguished by `details[].reason`:

            - `RESERVATION_RELEASED` — the reservation has been released, so the
              pool holds no hosts. Its instances are cleared and its counts reset to
              0 as part of this response. A scale-up re-reserves the pool's hosts
              instead of returning this; it is returned for a request that leaves
              the pool at 0, to report the clean-up (scale the pool up to reserve
              hosts again), and for a scale-up in an instance group whose usage
              counts against organization limits, whose released pool cannot be
              grown (create a new instance group).
            - `RESERVATION_DRIFTED` — the infrastructure service does not know the
              reservation this pool references, so the two services disagree about
              the pool. Nothing is changed. The block clears once they agree again;
              otherwise an administrator has to reconcile them.
            - `POOL_EMPTY` — the pool holds no hosts, so there is no initialized
              reservation to extend, and its reservation has not been released (a
              released one, including that of a pool drained by a scale-down to
              `0`, is re-reserved instead, see `RESERVATION_RELEASED`). Raised
              either from the recorded counts (`desiredCount` is `0` and it has no
              instances: it was created at size `0`, so it never held a
              reservation, or its reservation is live but holds nothing), or from
              the reservation itself answering that it holds nothing.
              Materializing hosts into such a pool is not supported yet.
              Requesting size `0` to record the pool's real size is still
              accepted. Only the pool named in the request is checked, so an
              empty pool does not block a scale of its siblings.
            - `POOL_COUNT_MISMATCH` — the pool's `desiredCount` disagrees with the
              number of hosts its reservation HOLDS (`readyCount` + `notReadyCount`,
              which counts hosts in any state, not only provisioned ones), usually
              after a scale that failed. The message names that number; send it as
              `size` to set the desired size to it, then scale from there. A pool
              whose counts agree but whose hosts are not all provisioned is
              `POOL_HOSTS_NOT_PROVISIONED` below, not this.
            A reservation that is still SETTLING — mid-acquire, mid-release, or
            parked after a failure — cannot release hosts, so a scale-down against
            it is refused with no `details[].reason` and a message naming the two
            states it is in. It clears on its own; retry once the pool's
            reservation reports `reserved`.

            - `POOL_HOSTS_NOT_PROVISIONED` — a scale-UP found the pool holding a
              host that has not finished provisioning; growing waits for it, so the
              original fault is not buried under new provisioning. A host that
              cannot recover is removed with a scale-down, which is the one request
              this does not block: a shrink is gated on the instances it NAMES
              being settled `not_provisioned`, never on the pool's other hosts.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: |
            A scale-down named an instance that has already been removed. Ids are
            never reused, so this is distinct from `404`: the id named a real
            instance of this project and no longer resolves to one. Re-sending a
            shrink that already landed is the ordinary way to meet it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          # Scale carries no sshAccess/cloud-config, so 413 here is only the shared
          # 1 MiB request-body cap (readJSONStrict), not a rendered-payload limit.
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          description: |
            This deployment cannot verify the hosts a scale-down would release, so
            shrinking is unavailable on it. Growing is unaffected.
            `details[].reason` is `NOT_IMPLEMENTED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            A pool's size could not be confirmed, so the scale base is unknown: the
            infrastructure service is unreachable, or it answered with a member that
            has no server name. Nothing is written. Retry — unlike the `409`s above,
            this condition does clear on its own. A reservation that ANSWERS holding
            no hosts is not this: that size is confirmed, and it is reported as
            `POOL_EMPTY`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: |
            The state transition was persisted but the scale workflow could not be
            started (e.g. an upstream dependency was unreachable); the reconciler converges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
