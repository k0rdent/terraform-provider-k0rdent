            to the same `ref`; an `accessLevel` of `ro`, which cannot be granted, or
            one outside the enum; a `mountPath` that is not a clean absolute POSIX
            path; more than 64 `consumers`; a consumer list whose resolved
            addresses coalesce into more than 256 access rules; or a `capacityGiB`
            above the `maxCapacityGiB` the class sets on one allocation — the
            ceiling binds the resulting size, not the increment.

            A group that cannot be resolved is a `422` and never a `404`: the
            addressed resource is the store, and the store was found.

            An expand carries the same storage `details[0].reason` as a create when the store's class cannot place the increment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: The capacity change could not be checked against the quota; nothing was changed, retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: 503
                  message: service unavailable
                  requestId: 0f6b1a2c-3d4e-4f50-8a9b-1c2d3e4f5a6b
                  details:
                    - reason: UNAVAILABLE
                      message: service unavailable
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    delete:
      operationId: deleteFileStore
      summary: Delete file store
      description: |
        **Visibility:** `internal` · `public` (x-visibility)


        Delete a file store and the data on it.
        Teardown is asynchronous: the operation returns `204` immediately and the store flips to `state: deleting`. On a plain delete, poll `GET .../storage/file-stores/{id}` until it returns `404` to confirm the capacity has been released. An `active` store that still lists `consumers` is refused with `409`: clear them with a PATCH first. A store is also refused while a change to it is still being applied: wait until `reconciling` is false and retry. A re-check of a missing export refuses it for a few minutes with `reconciling` already false: back off and retry. There is no job resource and no `202`.
        A teardown that fails settles the store back to `deleting` with the cause in `statusReason` and the platform re-drives it, so keep polling rather than re-issuing the `DELETE`: the capacity stays committed until the teardown lands.
        A store that never reached the backend — one whose provisioning failed before any backing object was created — is removed synchronously: the `204` is final and the next `GET` returns `404` without a teardown pass.
        `force=true` is the operator escape hatch for a store whose backend is permanently unreachable. It removes the record without contacting the backend, so any backing object is left behind for manual cleanup. It is refused on a store that is still `creating`.
      tags:
        - file-stores
      x-visibility:
        - internal
        - public
      x-status: mvp
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |2
             Operator-only escape hatch. When `true`, the store record is removed without contacting the storage backend and without waiting for teardown, so any backing object and its data are left in place for manual cleanup. Intended for a store whose backend is permanently unreachable and which a plain `DELETE` therefore cannot converge. Refused with `409` while the store is `creating`. It skips the consumer check, so listed grants do not block it.
            It also purges a store that is already `deleting`, cutting in on a teardown that is still running: the record disappears while the workflow may still be deleting the backing object, and whatever that workflow does not finish is left behind. A plain `DELETE` on a `deleting` store is the idempotent `204` instead, so reach for `force` here only when the running teardown is known not to converge.
      responses:
        '204':
          description: |
            Delete accepted; the store has flipped to `state: deleting` and
            teardown proceeds in the background.

            With `force=true`, or for a store that never reached the backend, the
            record is already gone and the next `GET` returns `404`; a forced purge still holds the capacity until `confirm-removal`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflict, with `details[].reason: CONFLICT_IN_USE` — the store cannot
            be deleted right now. Only `active` and `failed` are deletable.

            - The store is still `creating`. Deleting it would race the in-flight
              provisioning and leave the backing object behind with nothing owning
              it. Poll until the store reaches `active` or `failed`, then delete.
              This applies to `force=true` as well: a purge must not race an
              in-flight create.
            - A concurrent write moved the store out of a deletable state between
              the existence check and the delete.
            - The store is `failed` for a reason that teardown cannot clear —
              storage is unconfigured or unreachable for the region — and that
              failure is less than 15 minutes old. Retrying inside that cooldown
              would restart a pass that cannot converge. Fix the region's storage
              configuration and retry once the cooldown has elapsed, or remove the
              record with `force=true`, accepting that any backing object is left
              behind. The cooldown runs from the moment the store last changed, so
              the `Retry-After` header carries what remains of it at the time of the
              refusal. The store's `etag` is unchanged by a refused delete.
            - The store is `failed` after a create whose rollback could not remove
              the object it had already applied, and no namespace was recorded for
              it, so teardown has nothing to address. Deleting the record would
              report a store that never reached the backend when the opposite is
              true. Locate the object from the worker log for the store's execution
              and remove it by hand, then purge the record with `force=true`.
            - The store is `active` but carries no recorded namespace, so its
              backing object provably exists and teardown cannot address it.
              Deleting the record would leave that object unreferenced. Remove it
              by hand, then purge the record with `force=true`.
            - The store is `active` and still lists `consumers`, whose access
              teardown would revoke. Clear them with `PATCH {"consumers": []}`,
              then delete, or purge with `force=true`.
            - The store is `active` and a change to it is still being applied
              (`reconciling: true`), or its empty `exportLocations` are being re-read
              (for a few minutes, with `reconciling: false`). Wait for
              `reconciling: false` after a change, back off and retry during a
              re-check, or purge with `force=true`.

            A store already `deleting` is NOT a conflict: the repeated DELETE is an
            idempotent `204`. Re-read the store and retry once it settles.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          headers:
            Retry-After:
              description: |
                Whole seconds remaining in the delete-retry cooldown. Always at
                least `1`.

                Present only on the cooldown cause above; the other causes of
                this `409` carry no deadline to publish and send no header. Not
                marked required for that reason. The cooldown is measured from the
                moment the store last changed, so a concurrent write to the store
                moves the deadline out and this value is a hint, not a guarantee.
              schema:
                type: integer
                minimum: 1
                example: 847
              example: 847
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
