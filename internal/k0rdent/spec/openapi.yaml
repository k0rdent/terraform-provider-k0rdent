            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Conflict. `details[].reason` is `CONFLICT_IN_USE` when the peering is
            not in a deletable state — an operation is already in flight
            (`creating` or `deleting`).

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          description: |
            The peering was moved to `deleting` but its delete workflow could not be
            dispatched. The reconciler converges it from its deadline; poll rather
            than retrying, which would conflict on the in-flight state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
