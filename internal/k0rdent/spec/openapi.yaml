            counterpart's peering is a different project's resource and is left in
            place, where it stops carrying traffic. Clearing it is that project's
            call, either through this operation or as part of deleting the owner of
            the VPC it names as its own local side.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The VPC or peering named in the path does not exist in this project.
            Also returned for a peering removed WITHOUT an explicit delete, when
            the cluster or instance group owning its `localVpc` was deleted — a
            client polling a peering must treat `404` as a legitimate outcome, not
            only as a consequence of its own delete.
