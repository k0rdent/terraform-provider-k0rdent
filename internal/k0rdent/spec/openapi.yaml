        The group is materialized asynchronously. This operation returns `201` with the resource body in `state: creating`; poll `GET .../networking/security-groups/{id}` until `state` is `active`, at which point the rules are in force. There is no job resource to poll and no `202` — the asynchrony is carried by the `state` field.
