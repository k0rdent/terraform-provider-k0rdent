            Total networks in the project matching the active `vpc`, `type` and `owner` filters, so `ceil(totalCount / limit)` is the page count for the current filter. Counts all three network kinds (`evpn`, `infiniband`, `nvlink`) — they are one collection, and the `type` filter narrows both the page and this total identically.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    NetworkSchema:
      type: object
      description: |
        Cluster-wide network shape. Declares the fabric VPCs, logical networks and
        subnets every cluster of this ClusterType will materialize. Local ids on
        entries are referenced from per-pool `networkAttachment`.
      additionalProperties: false
      required:
        - vpcs
        - networks
      properties:
        vpcs:
          type: array
          description: |
            Fabric VPCs. Each selects a UFO fabric backend; every network
            references exactly one by id via `networks[].vpc`.
          minItems: 1
          items:
            $ref: '#/components/schemas/NetworkSchemaVpc'
        networks:
          type: array
          description: Fabric domains (L2 broadcast, InfiniBand PKey, NVLink partition).
          minItems: 1
          items:
            $ref: '#/components/schemas/NetworkSchemaNetwork'
        subnets:
          type: array
          description: |
            L3 prefixes attached to ethernet networks. Each subnet pins an
            AddressPool from which a CIDR is allocated at cluster creation.
          items:
            $ref: '#/components/schemas/NetworkSchemaSubnet'
    NetworkSchemaEVPN:
      type: object
      description: 'Ethernet (EVPN) fabric domain. Selected when `type: evpn`.'
      additionalProperties: false
      required:
        - id
        - vpc
        - type
        - evpn
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: Local id within this schema. Referenced by `networkAttachment` cross-refs.
          example: mgmt
        vpc:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local `id` of the `vpcs[]` entry this network belongs to. Selects the
            fabric backend that reconciles this network.
          example: fabric
        type:
          type: string
          const: evpn
          description: Fabric kind discriminator — always `evpn` for this branch.
        evpn:
          type: object
          description: EVPN-specific attributes.
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - l2vpn
                - l3vpn
              description: |
                EVPN service type, matching the UFO Network `type`: `l2vpn` for an
                L2 EVPN fabric, `l3vpn` for an L3 EVPN fabric.
        vlan:
          type: object
          description: VLAN attributes.
          additionalProperties: false
          properties:
            id:
              type: string
              pattern: ^(auto|[1-9][0-9]{0,3})$
              description: |
                VLAN id — an integer literal as a string (e.g. `"100"`) or
                the keyword `"auto"` to let the platform pick. The pattern
                rejects leading zeros; the server enforces the full 802.1Q
                range (`1`–`4094`, rejecting reserved `0` and `4095`).
              example: auto
        mtu:
          type: integer
          minimum: 68
          maximum: 65535
          description: Maximum transmission unit.
        dhcpEnabled:
          type: boolean
          description: Whether DHCP is enabled on this network.
        dnsServers:
          type: array
          description: DNS resolver addresses.
          items:
            type: string
            example: 4.2.2.1
    NetworkSchemaInfiniBand:
      type: object
      description: 'InfiniBand fabric domain. Selected when `type: infiniband`.'
      additionalProperties: false
      required:
        - id
        - vpc
        - type
        - infiniband
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: Local id within this schema. Referenced by `networkAttachment` cross-refs.
          example: gpu-fabric
        vpc:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local `id` of the `vpcs[]` entry this network belongs to. Selects the
            fabric backend that reconciles this network.
          example: fabric
        type:
          type: string
          const: infiniband
          description: Fabric kind discriminator — always `infiniband` for this branch.
        infiniband:
          type: object
          description: InfiniBand-specific attributes.
          additionalProperties: false
          properties:
            pkey:
              type: string
              pattern: ^0x[0-9a-fA-F]+$
              description: |
                InfiniBand partition key in hex (e.g. `0x1234`). Optional —
                may be allocated by the platform from a configured range
                when omitted (UFO). Ignored on NICo (partition name is
                authoritative).
              example: '0x1234'
            partition:
              type: string
              minLength: 1
              description: |
                Partition name. References an admin-defined InfiniBand
                Partition resource in the region. Required on NICo;
                optional on UFO (server-enforced — the contract does not
                gate by provider).
              example: gpu-training-ib
            index0:
              type: boolean
              description: Store the PKey at index 0.
            ipOverIb:
              type: boolean
              description: PKey participates in IP-over-InfiniBand multicast.
    NetworkSchemaNVLink:
      type: object
      description: 'NVLink fabric domain. Selected when `type: nvlink`.'
      additionalProperties: false
      required:
        - id
        - vpc
        - type
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: Local id within this schema. Referenced by `networkAttachment` cross-refs.
          example: gpu-nvlink
        vpc:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local `id` of the `vpcs[]` entry this network belongs to. Selects the
            fabric backend that reconciles this network.
          example: fabric
        type:
          type: string
          const: nvlink
          description: Fabric kind discriminator — always `nvlink` for this branch.
        nvlink:
          type: object
          description: |
            Optional NVLink attributes. Omit the block entirely to have the fabric bind
            the partition itself — the materialized Network then carries only its vpc and
            type.
          additionalProperties: false
          properties:
            partition:
              type: string
              minLength: 1
              description: Partition name. References an admin-defined NVLink Logical Partition resource in the region.
              example: gpu-training-nvl
    NetworkSchemaNetwork:
      description: |
        A logical fabric domain referenced by per-pool networkAttachment.
        `type` discriminates between three kinds: ethernet (`evpn`) carries the
        optional `vlan`/`mtu`/`dhcpEnabled`/`dnsServers` attributes;
        specialised-fabric (`infiniband`, `nvlink`) carries the corresponding
        sub-block instead. Each `type` maps to a full, mutually-exclusive branch
        schema (`additionalProperties: false`), so the discriminator resolves a
        single concrete network kind — an evpn network cannot carry infiniband /
        nvlink attributes, and vice-versa.
      oneOf:
        - $ref: '#/components/schemas/NetworkSchemaEVPN'
        - $ref: '#/components/schemas/NetworkSchemaInfiniBand'
        - $ref: '#/components/schemas/NetworkSchemaNVLink'
      discriminator:
        propertyName: type
        mapping:
          evpn: '#/components/schemas/NetworkSchemaEVPN'
          infiniband: '#/components/schemas/NetworkSchemaInfiniBand'
          nvlink: '#/components/schemas/NetworkSchemaNVLink'
    NetworkSchemaRef:
      type: string
      pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
      minLength: 1
      maxLength: 26
      description: |-
        Local `id` of an entry in the parent `ClusterType.networkSchema`
        (`vpcs[]`, `networks[]`, or `subnets[]`, depending on the field). Capped at
        26 chars so the materialized `{cluster.uid}-{schemaEntryId}` object id
        fits in the 63-char limit.
    NetworkSchemaSubnet:
      type: object
      description: |
        An L3 prefix attached to an ethernet network. Supply either a fixed
        `cidr` (applied verbatim as a UFO Subnet, no AddressPool carve) or
        `addressPool` + `prefixLength` (CIDR allocated from the pool at cluster
        creation). The two modes are mutually exclusive.
      additionalProperties: false
      required:
        - id
        - network
      allOf:
        - if:
            required:
              - cidr
          then:
            not:
              anyOf:
                - required:
                    - addressPool
                - required:
                    - prefixLength
                - required:
                    - gateway
          else:
            required:
              - addressPool
              - prefixLength
            not:
              required:
                - addressAllocator
      properties:
        id:
          $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local id within this schema. Referenced by `networkAttachment`
            cross-refs.
          example: mgmt
        network:
          $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local `id` of an entry in `networks[]`. The referenced network
            must have `type: evpn`.
          example: mgmt
        cidr:
          type: string
          description: |
            Fixed IPv4 CIDR for this subnet (e.g. `10.0.0.0/8`), in canonical
            form (host bits zero). When set, the platform materializes a UFO
            Subnet with this CIDR directly — no AddressPool / SubnetAllocation
            carve. Mutually exclusive with `addressPool` / `prefixLength`.
            Typical for rail-optimised P2P fabrics that need a known large
            prefix. The prefix length must be `/1`–`/32`, the same range
            `prefixLength` accepts; `/0` is not a subnet.
          example: 10.0.0.0/8
          pattern: ^((25[0-5]|2[0-4]\d|[01]?\d?\d)\.){3}(25[0-5]|2[0-4]\d|[01]?\d?\d)/(3[0-2]|[12]\d|[1-9])$
        addressPool:
          type: string
          format: uri-reference
          description: |
            URI of the regional AddressPool to allocate the CIDR from. Must
            resolve in the ClusterType's region. Required when `cidr` is
            omitted; forbidden when `cidr` is set.
          example: /v1/regions/us-texas-1/networking/address-pools/pool-mgmt-v4
        prefixLength:
          type: integer
          minimum: 1
          maximum: 32
          description: |
            Desired allocation prefix length. Normally must lie within the
            referenced AddressPool's `[minPrefixLength, maxPrefixLength]`. `/31`
            is the IPv4 point-to-point case (RFC 3021). `/32` is a single-host
            subnet — e.g. a control-plane VIP subnet referenced by a
            ClusterType's `k8s.controlPlane.vipSubnet` — and requires an AddressPool
            whose `maxPrefixLength` allows `32`. Required with `addressPool`;
            forbidden when `cidr` is set.
          example: 24
        gateway:
          type: boolean
          description: |
            When `true` and the parent AddressPool is routable, the
            materialized Subnet's gateway is auto-populated with the last
            usable host address (broadcast − 1). Pool-allocated subnets only:
            rejected alongside a fixed `cidr`, which performs no pool carve to
            derive the address from.

            Setting it to `false` leaves the carved Subnet with no gateway, so a
            `gatewayFromSubnet` reference to that subnet is rejected at create. Such
            a reference needs a target that has a gateway: a pool-allocated subnet
            that has not turned it off, or a fixed-`cidr` subnet with
            `addressAllocator.backend: rail-optimised`, where the P2P allocator
            derives one per rail.
        excludeRanges:
          type: array
          description: |
            IPs or ranges inside the allocated CIDR to exclude from host
            allocation. Supported forms: single IP (`10.0.0.4`), CIDR
            (`10.0.0.0/29`), or hyphen-delimited range (`10.0.0.10-10.0.0.20`).

            Accepted but not yet honoured on either subnet mode: the cluster and
            instance-group paths do not forward this field, and the
            `SubnetAllocation` CRD prunes it on admission. Unlike `gateway` it is
            not rejected on a fixed `cidr`, because the UFO `Subnet` does carry
            `spec.exclude_ranges` — the field is unwired, not inapplicable.
          items:
            type: string
            example: 10.0.0.10-10.0.0.20
        addressAllocator:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaSubnetAddressAllocator'
          description: |
            P2P address allocation stamped onto the materialized UFO Subnet
            (`spec.addressAllocator`). Optional; when omitted, UFO uses its
            default (`backend: flat`).

            Requires a fixed `cidr` and is rejected alongside `addressPool`:
            the field exists only on the UFO `Subnet` resource, so it can be
            set only where the platform applies a Subnet directly. The
            pool-allocated path creates the Subnet through a
            `SubnetAllocation`, which carries no such field.
    NetworkSchemaSubnetAddressAllocator:
      type: object
      description: |
        P2P address allocation configuration forwarded to the materialized UFO
        Subnet's `spec.addressAllocator`. When omitted, UFO defaults
        `backend` to `flat`.
      additionalProperties: false
      allOf:
        - if:
            required:
              - backend
            properties:
              backend:
                const: rail-optimised
          then:
            required:
              - gpuPlatform
      properties:
        backend:
          type: string
          description: |
            P2P allocator backend. Defaults to `flat` when omitted (UFO default).
            `rail-optimised` requires `gpuPlatform`.
          enum:
            - flat
            - noop
            - rail-optimised
          example: rail-optimised
        gpuPlatform:
          type: string
          description: |
            GPU platform whose P2P IP-encoding rules apply. Required when
            `backend` is `rail-optimised`; ignored by other backends.
          enum:
            - H100
            - H200
            - B200
            - GB200
            - B300
            - GB300
          example: B200
    NetworkSchemaVpc:
      type: object
      description: |
        A fabric VPC. Selects the UFO fabric backend that reconciles this VPC, every
        network that references it (via `networks[].vpc`), and those networks' subnets.
        Materialized as a UFO Vpc whose `spec.backend` is this entry's `backend`.
      additionalProperties: false
      required:
        - id
        - backend
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/NetworkSchemaRef'
          description: |
            Local id within this schema. Referenced by `networks[].vpc`.
          example: fabric
        backend:
          type: string
          minLength: 1
          description: |
            UFO fabric backend that reconciles this VPC — the `spec.backend` on the
            materialized UFO Vpc. Must name a fabric backend configured and enabled
            in the region's fabric operator (e.g. `nico`, `verity`). Required; there
            is no default.
          example: nico
    NetworkUpdateRequest:
      type: object
      description: |
        Request to update a network. Only `displayName`, `description` and `tags`
        are mutable. The fabric `type` and its per-type parameters (`evpn`, `vlan`,
        `infiniband`, `nvlink`, `mtu`, `dhcpEnabled`, `dnsServers`) are immutable
        after creation and are rejected if present.
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: Updated human-friendly display name for the network.
        description:
          type: string
          description: Updated description of this resource.
        tags:
          type: object
          description: Updated user-defined metadata labels for this network.
          additionalProperties:
            type: string
    NodeMacAddressFromAnnotation:
      type: object
      description: |
        Source for a network interface MAC address — read from an annotation
        on a node-side object (Cluster API `Machine` or `BareMetalHost`).
      additionalProperties: false
      required:
        - object
        - annotation
      properties:
        object:
          type: string
          enum:
            - machine
            - baremetalhost
          description: Which node-side object carries the annotation.
        annotation:
          type: string
          minLength: 1
          description: Annotation key whose value holds the MAC address.
          example: net_interface_mgmt_0_mac
    NodePool:
      type: object
      description: |-
        One node pool of an InstanceGroup: the pool's identity, bound machineType,
        held reservation, and its three host counts — `desiredCount` (asked for),
        `readyCount` (usable now) and `notReadyCount` (attached but not usable). See
        `desiredCount` for how they relate.

        Both halves in one object: what was ASKED for and where the pool GOT to. The
        create and scale requests name `desiredCount` `size`; it is the same number.

        The pool's individual hosts are NOT listed here. They are Instances in their
        own right — list them with
        `GET /compute/instances?nodePoolUuid={id}`.
      required:
        - nodePool
        - desiredCount
      properties:
        nodePool:
          type: string
          description: Source `ClusterTypeNodePool` id (slug) — the pool name.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: role-a
        id:
          type: string
          format: uuid
          description: Server-generated unique identifier for the pool.
          readOnly: true
        machineType:
          type: string
          format: uri-reference
          description: URI of the infrastructure MachineType bound to this pool.
          example: /v1/regions/us-texas-1/infrastructure/machine-types/role-a
        reservationId:
          type: string
          format: uuid
          description: >-
            Infrastructure reservation most recently held for this pool. Absent until the pool is first reserved; it stays after the reservation is released, and a later scale-up may reserve under the same id.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        desiredCount:
          type: integer
          format: int32
          description: |-
            Number of hosts REQUESTED for this pool. The tenant's number: only a create or a scale changes it, so a pool that asked for 6 and got 4 keeps saying 6 until the next request.

            This and the two counts below are the three numbers that describe a pool, and they answer different questions:

            * `desiredCount` — what was ASKED for. Always present.
            * `readyCount` — how many hosts are provisioned and usable NOW.
            * `notReadyCount` — how many are attached but not usable yet, or on their

              way out.


            `readyCount + notReadyCount` is the pool's REAL size — the hosts it actually holds — so `desiredCount − (readyCount + notReadyCount)` is the shortfall: hosts asked for that the pool never got. A non-zero shortfall is a normal state, not an inconsistency; it is what a scale that found no candidate hosts leaves behind. The two counts are omitted together when the live read cannot answer, so a shortfall is only computable when both are present.
          example: 1
        readyCount:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: |-
            Number of this pool's hosts that have finished provisioning AND are not being moved off it — a host still `provisioned` but already being released counts under `notReadyCount`, so a teardown shows its hosts leaving instead of reporting them ready until they disappear.

            Read LIVE from the pool's RESERVATION in the infrastructure service, which is the only thing that knows: this service records which hosts a pool holds, never whether they are usable. **Absent when that read is unavailable, when the reservation is unknown to the infrastructure service, when it is attributed to a different project, when the pool has no reservation yet, and on most write responses** — create, update, delete and an accepted scale return the group without enriching it. The ONE exception is the desired-size correction: it answers `200` from the same read path a `GET` uses, so it does carry both counts, which is what lets a caller confirm the size it just recorded. Never reported as `0` in place of a read that did not answer, and never substituted from stored data, because a stored row proves a host was recorded rather than ready.

            A reservation that ANSWERS while holding no hosts reports `0`, not absence. Released, still acquiring, or simply empty — the reservation's own state accounts for it, so `0` is the true count rather than a guess. That is the whole reason these come from the reservation and not from a server listing: a listing returns only hosts still attached to a reservation, so released, unknown and unreadable are one answer there.

            Little is lost by the omission: a scale against the same pool is refused too, though not always with the same status — `503` when the pool's size cannot be confirmed, `409` when the reservation has been released or is unknown to the infrastructure service.
          example: 1
        notReadyCount:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: |-
            Number of this pool's hosts that are NOT ready — acquiring, failed, mid-transition, or provisioned but already being moved off the pool. Same source and same absence rule as `readyCount`.

            `readyCount + notReadyCount` is the pool's real size, and therefore the `size` a scale request must name to correct a `desiredCount` that has diverged from it — including `0`, which records that the pool's reservation holds nothing. Correcting to `0` leaves the pool empty, and an empty pool cannot be grown yet. Per-host detail is at `GET /compute/instances?nodePool=…`, whose `state` says what each one is doing. See `desiredCount` for how the three numbers relate.
          example: 0
        instanceRefs:
          type: array
          readOnly: true
          description: |-
            Every instance this pool holds, as an id and the server it occupies, when the request asked for them with `includeInstanceRefs=true`. `[]` when the pool holds none, so an empty array means "none" and absence never does.

            Absent when the caller did not ask — and also when `showDeleted=true` turned this embed on and the response would then exceed the limit below. An embed enabled as a convenience is DROPPED rather than made to fail the read it was meant to enrich; one the caller named is refused with `422` instead. So absence means "you did not ask for this, or asking for history did not extend to it".

            The server slug is included because the instance id alone does not say which machine — a bare list of ids would send every caller straight back for the servers.

            The cheap half of the embed: both fields come from this service's own rows in a single query, with no call to the infrastructure service, so they are neither slowed nor omitted by that service being unreachable. What they cannot tell you is what each host is DOING — that needs `includeInstances` and the live read behind it. Complete rather than paged, and bounded by a response-wide limit — above which the array is never silently shortened: the request is refused with `422` if the caller asked for this embed, and the embed is dropped if `showDeleted` enabled it.
          items:
            type: object
            required:
              - id
              - serverSlug
            properties:
              id:
                type: string
                pattern: ^inst-[0-9a-f]{32}$
                description: The instance's id — what `GET /compute/instances/{id}` takes.
                example: inst-8f14e45fceea467a9f1f9e1a2b3c4d5e
              serverSlug:
                type: string
                description: The infrastructure server this instance occupies.
                example: server-42bc614f
        instances:
          type: object
          readOnly: true
          description: |-
            A page of this pool's instances in full, when the request asked for them with `includeInstances=true`.

            The same envelope `GET /compute/instances` returns, deliberately: a caller decodes one shape whether it read them inline or followed the listing. The objects are identical to that endpoint's, because they are produced by the same code — including the per-instance rule that a host which cannot be attributed to its instance reports `state: unknown` and publishes nothing about the hardware. `degraded` means the host itself reported a problem, which is a different condition and the only one `inStates=degraded` finds.

            A PAGE, not the membership: a nested array cannot be paged, so an unbounded one would make this response unbounded. Follow `nextPageToken` on `GET /compute/instances?nodePoolUuid={id}` to continue — the token is minted from the ordering that endpoint pages by, so it resumes rather than restarts.

            **Repeat the parent request's deletion mode when you spend the token.** A group read with `showDeleted=true` embeds tombstones, but the instances listing hides them by default — so continuing with `?nodePoolUuid={id}` alone resumes into a narrower set than the first page came from, and the continuation looks short or empty for no visible reason. Send `?nodePoolUuid={id}&showDeleted=true` to continue such a page. The token itself carries only position, not the deletion mode.

            **Absent when the live host read could not answer** — for EVERY pool, and never a partial page. A page that carried only the members needing no read would be indistinguishable from a complete one, and its `nextPageToken` would skip the members that were dropped, so a caller following it would miss them permanently and silently. Absence is the only honest answer.

            Also absent, as `instanceRefs` is, when `showDeleted=true` turned this embed on and the response budget would not hold it. An embed the caller NAMED is refused with `422` instead of being dropped.

            Unlike the single Instance endpoints, which fail with `503` because there the instance IS the response, a group read has its own content and does not fail over an enrichment — the same rule `readyCount` already follows.
            `instanceRefs` is unaffected, because it needs no host read. When both are requested, it still names every instance the pool holds — including tombstoned ones — so the membership survives an outage that costs the full objects. A caller that needs the host detail should read the instances listing, which reports the outage properly.
          properties:
            instances:
              type: array
              items:
                $ref: '#/components/schemas/Instance'
            nextPageToken:
              type: string
              description: Absent when the embed holds the pool's whole membership.
        reservationPhase:
          type: string
          readOnly: true
          enum:
            - acquiring
            - reserved
          description: Current reservation phase while the owning InstanceGroup is in flight.
        hostsFired:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: |
            Cumulative number of hosts fired for provisioning as part of the
            current operation, including any that were already ready before it
            started. For example, a scale-up from 10 to 20 hosts reports 20 here,
            not the 10 newly added. Compare against `desiredCount` to gauge overall
            progress.
    NodePoolRole:
      type: string
      enum:
        - worker
        - control-plane
      description: |
        Role of a node pool. `control-plane` pools host the cluster's control
        plane components; `worker` pools host application workloads. Standalone
        Control Plane (SCP) topologies require exactly one `control-plane` pool.
    NotificationEvent:
      type: object
      description: |-
        The CloudEvents envelope POSTed to a webhook subscriber's URL. Mirrors the
        server's cloudevents.Event: `id`, `source`, `specversion`, `type`, `tenant` and
        `region` are always present; the rest appear only when set on the event.

        The signature in `X-K0r-Signature` does NOT cover these bytes alone: it is
        computed over the send timestamp, a literal `.`, and then the raw bytes of this
        document exactly as transmitted. The header carries that timestamp and one or
        more signatures, and a delivery sent during a signing-secret rotation carries
        one per secret. Do not implement verification from this description — the full
        procedure, including the freshness window and the multi-signature rule, is
        under "Verifying a delivery" on `createWebhookSubscription`.

        What matters here is the bytes: a subscriber must verify against the body it
        received, not against a re-serialised copy — parsing and re-encoding JSON can
        reorder keys or change whitespace and will produce a different signature.
      required:
        - id
        - source
        - specversion
        - type
        - tenant
        - region
      properties:
        id:
          type: string
          description: >-
            CloudEvents event id. With `source` this is the delivery identity pair, and it is stable across retries of the same event — dedupe on the pair.
          example: 01HZXQ8N4C7V2K9M3R5T6W8Y0A
        source:
          type: string
          description: CloudEvents source that emitted the event.
          example: /k0rdent/organizations
        specversion:
          type: string
          description: CloudEvents specification version.
          example: '1.0'
        type:
          type: string
          description: Event type, used to match a subscription's `event_types` filter.
          example: com.k0rdent.organization.provisioned
        tenant:
          type: string
          description: >-
            Organization the event belongs to (CloudEvents extension attribute). Partitions every event.
          example: vendor
        region:
          type: string
          description: Region the event originated in (CloudEvents extension attribute).
          example: us-texas-1
        subject:
          type: string
          description: Optional CloudEvents subject — the resource the event concerns.
          example: /organizations/vendor
        time:
          type: string
          format: date-time
          description: Optional CloudEvents timestamp for when the event occurred.
        datacontenttype:
          type: string
          description: Media type of `data`.
          example: application/json
        dataschema:
          type: string
          description: Optional URI of the schema `data` conforms to.
        correlationid:
          type: string
          description: >-
            Optional cross-step trace identifier (CloudEvents extension attribute), carried through a multi-step workflow.
        actor:
          type: string
          description: >-
            Identifies the principal who performed the action this event describes (CloudEvents extension attribute). Usually a platform id (usr_* user, sa_* service account, pak_* API key, svc:* service), but NOT limited to those: a principal minted without a platform subject id is reported by its raw JWT subject, so treat this as an opaque identifier rather than a value to prefix-match on. Absent for a system-initiated event, and whenever no single actor was recorded.
          example: usr_a1b2c3
        actortype:
          type: string
          enum:
            - user
            - service_account
            - automation
            - operator-staff
            - system
          description: >-
            Classification of `actor` (CloudEvents extension attribute). Spelled without a separator because CloudEvents extension names are restricted to lowercase alphanumerics — the REST representations of this field use `actor_type`. Supplied by the producer rather than inferred by the reader. `system` means no identifiable principal, and implies `actor` is absent; the converse does not hold.
        severity:
          type: string
          enum:
            - informational
            - warning
            - critical
          description: >-
            Severity of the notification the event produced (CloudEvents extension attribute). Resolved by the platform from the event type's catalog rating, not supplied by the caller (only a KOF firing alert's own severity is read; see NotificationSeverity). Present only on delivered webhook bodies; the finer `priority` carries the same level in four steps. Maps as low/normal → `informational`, high → `warning`, critical → `critical`.
          example: warning
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - critical
          description: >-
            Resolved delivery priority (CloudEvents extension attribute), the finer-grained partner of `severity`. Present only on delivered webhook bodies; absent for a delivery enqueued before this field existed.
          example: high
        scope:
          type: string
          enum:
            - platform
            - organization
            - project
          description: >-
            Whose event this is (CloudEvents extension attribute), taken from the event type's notification catalog entry when the delivery is sent. `platform` events are about provider-owned infrastructure and are only ever delivered to the provider's own subscriptions. Absent only on a provider delivery whose event type is no longer in the catalog.
        project:
          type: string
          maxLength: 63
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          description: >-
            Slug of the project the event concerns (CloudEvents extension attribute). Absent when no project was recorded: the event concerns no single project, or it was recorded before events carried their project, in which case it may concern one. An organization's webhook subscriptions receive the organization's events whichever project they name, so a receiver that serves one project filters on this field.
          example: gpu-team
        data:
          description: >-
            Event payload. Shape depends on `type`; treat it as opaque unless the specific event type is known. An organization's subscriptions receive only the fields its event type defines for customers; any other field the producing service sent is left out. An event type with no customer fields arrives with an empty object.
    Operation:
      type: object
      description: |
        Reference to the resource's current or last lifecycle operation, so a
        caller can see how an act it requested is progressing without inferring
        it from the lifecycle fields.

        Distinct from `state`, which describes the resource itself. `reason` and
        `message` mirror the resource's own failure code and diagnostic
        (`stateReason`/`stateMessage` on a cluster) so the operation can be read
        from one object.

        Absent on a resource that has never run an operation.
      additionalProperties: false
      required:
        - executionId
        - status
      properties:
        executionId:
          type: string
          readOnly: true
          description: |
            Identifier of this operation, stable for its whole lifetime.
        status:
          type: string
          readOnly: true
          enum:
            - running
            - cancelling
            - failed
            - cancelled
            - succeeded
          description: |
            Outcome of the operation. `cancelled` is reported separately from
            `failed`, since either leaves the resource's own `state` failed.

            `cancelling` is a still-running operation for which a cancel has been
            requested: the resource stays in its transitional `state` until the
            operation settles, at which point this becomes `cancelled`, or
            `succeeded` if the run completed before the cancel took effect.

            Not a stop condition for a poller: a resource force-failed by the
            watchdog can still converge afterwards, moving this back to
            `succeeded`.
        reason:
          allOf:
            - $ref: '#/components/schemas/StateReason'
          readOnly: true
          description: Operation reason machine-readable code.
        message:
          type: string
          readOnly: true
          description: |
            Human-friendly detail about the operation. Present independently of
            `reason`: a running operation can carry progress detail with no
            reason set.
        startedAt:
          type: string
          x-go-type: time.Time
          format: date-time
          readOnly: true
          description: |
            When this operation began. Absent on a resource whose last operation
            predates this field.
        completedAt:
          type: string
          x-go-type: time.Time
          format: date-time
          readOnly: true
          description: |
            When this operation ended. Absent while `status` is `running`, and
            also on a resource whose last operation predates this field — so
            absence alone does not mean the operation is still in flight; read
            `status` for that.
        progress:
          allOf:
            - $ref: '#/components/schemas/OperationProgress'
          readOnly: true
          description: Stage summary; present only on get-by-id with `includeStages=true`.
        stages:
          type: array
          readOnly: true
          description: Ordered stages of the operation, projected from its workflow execution so they may lag `status`; present only on get-by-id with `includeStages=true`.
          items:
            $ref: '#/components/schemas/OperationStage'
    OperationProgress:
      type: object
      description: Summary of an operation's stages, counted by stage status.
      additionalProperties: false
      required:
        - completed
        - total
        - percentComplete
        - counts
      properties:
        current:
          type: string
          readOnly: true
          description: Key of the in-progress stage, else the failed stage, else the first pending stage after the last started one; absent when none applies.
        completed:
          type: integer
          minimum: 0
          readOnly: true
          description: Number of stages that are done or skipped.
        total:
          type: integer
          minimum: 0
          readOnly: true
          description: Number of stages in the operation.
        percentComplete:
          type: integer
          minimum: 0
          maximum: 100
          readOnly: true
          description: Share of stages done or skipped, as a whole percentage rounded down.
        counts:
          type: object
          additionalProperties: false
          readOnly: true
          description: Number of stages in each status.
          required:
            - done
            - inProgress
            - pending
            - failed
            - skipped
          properties:
            done:
              type: integer
              minimum: 0
              description: Stages that finished.
            inProgress:
              type: integer
              minimum: 0
              description: Stages currently running.
            pending:
              type: integer
              minimum: 0
              description: Stages not yet started.
            failed:
              type: integer
              minimum: 0
              description: Stages that failed.
            skipped:
              type: integer
              minimum: 0
              description: Stages not needed for this operation.
    OperationStage:
      type: object
      description: One caller-facing stage of an operation, in execution order.
      additionalProperties: false
      required:
        - key
        - label
        - status
      properties:
        key:
          type: string
          readOnly: true
          description: Stable machine-readable stage identifier, e.g. `reserving-hardware`.
        label:
          type: string
          readOnly: true
          description: Human-friendly stage name.
        status:
          type: string
          readOnly: true
          enum:
            - pending
            - in_progress
            - done
            - failed
            - skipped
          description: Status of the stage.
        startedAt:
          type: string
          x-go-type: time.Time
          format: date-time
          readOnly: true
          description: When the stage began; absent while it is pending.
        completedAt:
          type: string
          x-go-type: time.Time
          format: date-time
          readOnly: true
          description: When the stage ended; absent until it is done, failed or skipped.
        detail:
          type: string
          readOnly: true
          description: Human-friendly detail about the stage's current status.
    Organization:
      type: object
      description: Customer organization (tenant)
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/global/organizations/vendor
        uid:
          type: string
          format: uuid
          description: Server-generated UUID.
          readOnly: true
        id:
          type: string
          description: Name of the resource. Provided by the client when the resource is created, or generated by the server if not specified. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. Cannot be changed after the resource is created.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: vendor
        displayName:
          type: string
          description: Optional human-friendly display name for the organization.
        description:
          type: string
          description: An optional description of this resource.
        contactEmail:
          type: string
          format: email
          description: >-
            Optional primary contact email for the organization. Omitted when unset — the key is absent rather than null, so a consumer must treat "no contactEmail key" as "not set".
          example: ops@vendor.example.com
        status:
          type: string
          description: |
            Current lifecycle state of the organization. Transitions are governed by the
            organizations service state machine; only specific routes can move the org
            between states.

            States:
              - `active`: operational; all operations allowed.
              - `suspended`: paused by platform admin; intended to be read-only (mutation enforcement at the middleware layer is a deferred follow-up).
              - `disabled`: terminal. Org has been closed and cannot be reactivated.
              - `provisioning`: async create in progress; lifecycle managed by the workflow.
              - `failed`: async create failed; can be retried by re-issuing the create request.
              - `deleting`: cascading delete in progress; entered via `DELETE /v1/regions/global/organizations/{id}` and driven by the cascading-delete workflow.
              - `deleted`: terminal tombstone written by the cascading-delete workflow on success. Rows in this state are also soft-deleted (`deleted_at IS NOT NULL`) and therefore not returned by GET or LIST endpoints; the value is documented here only to describe the full state-machine domain.
          enum:
            - active
            - suspended
            - disabled
            - provisioning
            - failed
            - deleting
            - deleted
          readOnly: true
          example: active
        version:
          type: integer
          format: int32
          readOnly: true
          description: >-
            Optimistic-concurrency counter, incremented on every successful update. Always present on read responses.
          example: 3
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Free-form key/value labels attached to the organization. Always present on read responses; may be an empty object.
        executionId:
          type: string
          readOnly: true
          description: |
            The workflow execution ID for an in-progress or recently-failed
            provisioning attempt. Populated when status is `provisioning`. Absent
            when status transitions to `active`. Preserved when status is `failed`
            so operators can query the workflow service for failure details, and
            overwritten when a retry kicks off a new workflow.
          example: wf_exec_01HZX
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Server-set creation timestamp.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Server-set last-update timestamp.
        memberCount:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: >-
            Number of members associated with the organization. Present only on the GET-detail and LIST responses; omitted from create/update/transition responses, which do not compute it.
        pendingInviteCount:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: >-
            Number of outstanding (pending, non-expired) invitations for the organization. Present only on the GET-detail and LIST responses; omitted from create/update/transition responses, which do not compute it.
    OrganizationDetail:
      type: object
      description: |-
        An organization as returned by the GET-detail route
        (`GET /v1/regions/global/organizations/{id}`), which is the only response
        that carries `projectSummary`.

        This schema exists so the distinction is structural rather than prose. The
        server has two types: `Organization`, which has no project-summary field, and
        `OrganizationDetail`, which embeds it and is constructed only by the GET-detail
        handler. Modelling that as one schema with an optional property meant every
        generated example — including the ones on the LIST response — advertised a
        field those responses can never return.
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          required:
            - projectSummary
          properties:
            projectSummary:
              $ref: '#/components/schemas/ProjectSummary'
    OrganizationPage:
      type: object
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        totalCount:
          $ref: '#/components/schemas/PageTotalCount'
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    PageLimit:
      type: integer
      format: int32
      description: |-
        The `limit` applied to this response, echoed as applied. Out-of-range input is rejected rather than clamped, so this always equals the `limit` the request sent, or the default when the request omitted it.

        Present only on the `offset`/`limit` path; absent on the deprecated `pageToken` path.
    PageOffset:
      type: integer
      format: int32
      description: |-
        The `offset` applied to this response, echoed as applied. Out-of-range input is rejected rather than clamped, so this always equals the `offset` the request sent.

        A client has reached the end of the list when `offset + (number of items returned) >= totalCount`.

        Present only on the `offset`/`limit` path; absent on the deprecated `pageToken` path.
    PageTotalCount:
      type: integer
      format: int64
      description: |-
        Total items matching the request's active filters, search, and the caller's authorization scope. This is the FILTERED total, not the size of the unfiltered collection, so `ceil(totalCount / limit)` is the page count for the current filter.

        Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path — a response from that path omits the field rather than reporting `0`, so a client must not read a missing `totalCount` as an empty collection.
    PciDevice:
      type: object
      description: >-
        One PCI network or InfiniBand device from the server's inventory, keyed by its PCI slot. Sourced from the NICo Machine metadata. Field names are snake_case — this is the stored inventory-layout payload surfaced verbatim.
      required:
        - slot
        - device_category
      properties:
        slot:
          type: string
          description: PCI slot (domain:bus:device.function) — the device key.
          example: "0000:94:00.0"
        device_category:
          type: string
          description: Device class.
          enum:
            - ethernet
            - infiniband
        vendor:
          type: string
          example: Mellanox Technologies
        device:
          type: string
          example: MT43244 BlueField-3 integrated ConnectX-7 network controller
        description:
          type: string
        path:
          type: string
          description: Kernel device path.
        numa_node:
          type: integer
          format: int32
        mac_address:
          type: string
          description: Ethernet MAC address (ethernet devices only).
          example: "60:5E:65:0E:41:4A"
        guid:
          type: string
          description: InfiniBand GUID (infiniband devices only).
        is_dpu:
          type: boolean
          description: >-
            True when the device is a DPU port, set regardless of device_category: ethernet ports are matched by a DPU-bound machineInterface MAC or a BlueField/DPU model name; InfiniBand ports (a DPU in InfiniBand mode) are matched by model name only.
        is_primary_dpu:
          type: boolean
          description: >-
            True for the primary DPU port, identified by a MAC match to the primary DPU-bound machineInterface. MAC-derived, so only ever set on ethernet ports (InfiniBand ports carry a GUID, no MAC, and are never flagged primary).
    Project:
      type: object
      description: Project resource grouping within organization
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/global/organizations/my-org/projects/proj-a1b2c3d4
        uid:
          type: string
          format: uuid
          description: Server-generated UUID.
          readOnly: true
        id:
          type: string
          description: Name of the resource. Provided by the client when the resource is created, or generated by the server if not specified. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. Cannot be changed after the resource is created.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: proj-a1b2c3d4
        displayName:
          type: string
          description: Optional human-friendly display name for the project.
        description:
          type: string
          description: An optional description of this resource.
        region:
          type: string
          description: |
            The region the project is locked to, set when the project is created and
            never changed. The project's compute, networking, and storage routes
            (`/v1/regions/{region}/projects/{project}/...`) answer only in this
            region; any other region refuses them with **409** and reason
            `PROJECT_REGION_MISMATCH`.

            Absent only for a project created before a region was required, until
            the operator assigns one.
          readOnly: true
          example: region1
        status:
          type: string
          enum:
            - active
            - suspended
            - disabled
            - deleting
          description: |
            Current lifecycle state of the project.

            `deleting` means a delete has been accepted and the project's Kubernetes
            namespace is being torn down. The project is still returned by GET and
            LIST while in this state, its identifier stays reserved, and it accepts no
            new work — a cluster create in a `deleting` project is rejected with 409.
            It leaves this state only when the teardown reports completion, after
            which the project is gone (404) and its identifier is available again.

            The terminal `deleted` state is never observable: a finalized project is
            excluded from every read, so it cannot appear here and cannot be used as a
            `status` filter.
          readOnly: true
          example: active
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        organizationId:
          type: string
          description: Parent organization ID
    ProjectCreateRequest:
      type: object
      description: Request to create a new project
      required:
        - region
      properties:
        id:
          type: string
          description: Name of the resource. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. If not specified, the server will generate a name.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: proj-a1b2c3d4
        displayName:
          type: string
          description: Optional human-friendly display name for the project.
        description:
          type: string
          description: An optional description of this resource.
        region:
          type: string
          description: |
            The region the project is locked to. Must be the `id` of a region with
            `hostsProjects: true` in `GET /v1/regions`; a missing region, an unknown
            value, and a region that does not host projects are rejected with **422**.
            Every region of type `regional` hosts projects. `global` does only on a
            deployment that runs compute under it, which `GET /v1/regions` reports on
            the `global` entry. It cannot be changed after the project is created.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: region1
    ProjectPage:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        totalCount:
          $ref: '#/components/schemas/PageTotalCount'
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    ProjectSummary:
      type: object
      readOnly: true
      description: |-
        Aggregate project counts and a lightweight project list for an organization.
        Returned only on the organization GET-detail response, as part of
        OrganizationDetail. Mirrors the server's ProjectSummary.

        Always present on that response: the server field is not omitted when empty, so
        an organization with no projects reports zero counts and an empty list rather
        than omitting the key.
      required:
        - totalCount
        - activeCount
        - projects
      properties:
        totalCount:
          type: integer
          format: int32
          minimum: 0
          description: Total number of projects in the organization.
        activeCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of projects currently in the active state.
        projects:
          type: array
          description: >-
            Preview list of the organization's projects, capped by the server at 5 entries. This is a preview, not a pageable listing: `totalCount` may exceed the number of entries here, and there is no cursor. Use `GET /v1/regions/global/organizations/{orgId}/projects` to enumerate them all.
          items:
            $ref: '#/components/schemas/ProjectSummaryItem'
    ProjectSummaryItem:
      type: object
      description: >-
        Lightweight project reference carried in an organization's project summary. Mirrors the server's ProjectSummaryItem.
      required:
        - id
        - displayName
        - status
      properties:
        id:
          type: string
          description: Project identifier (slug).
          example: proj-a1b2c3d4
        displayName:
          type: string
          description: Human-readable project name.
        status:
          type: string
          enum:
            - active
            - suspended
            - disabled
            - deleting
          description: |
            Current lifecycle state of the project.

            `deleting` means a delete has been accepted and the project's Kubernetes
            namespace is being torn down. A project in this state is still listed, its
            identifier stays reserved, and it accepts no new work. The terminal
            `deleted` state is never observable — a finalized project is excluded from
            every read.
          example: active
    ProjectUpdateRequest:
      type: object
      description: Request to update project settings. At least one field must be provided. A project's `region` cannot be changed; a request that includes it is rejected with 409 and reason `CONFLICT_IMMUTABLE`.
      minProperties: 1
      properties:
        displayName:
          type: string
          description: Updated human-friendly display name for the project.
        description:
          type: string
          description: Updated project description
    QuotaEnforcementAcknowledgement:
      type: object
      description: The `metadata` of the `details[]` entry whose `reason` is `QUOTA_ENFORCEMENT_ACKNOWLEDGEMENT_REQUIRED`. Review the report, then repeat the request with `acknowledgedBlockedScopes` set to `blockedScopes`.
      required:
        - dimension
        - blockedScopes
        - report
      properties:
        dimension:
          type: string
          description: The quota dimension whose enforcement is being switched on.
          example: node_count
        blockedScopes:
          type: integer
          format: int64
          minimum: 0
          description: The live number of scopes at or over their limit on the dimension, which switching enforcement on would start refusing. This is the count to acknowledge.
          example: 2
        report:
          type: string
          description: Path of the near/over-limit report that lists those scopes.
          example: /v1/regions/global/organizations/quota-usage?dimension=node_count&threshold=100
    QuotaRefusal:
      type: object
      description: The `metadata` of each `details[]` entry whose `reason` is `QUOTA_EXCEEDED`. One entry is written per refused quota dimension. What `requested` and `admissible` count differs per operation, so see the operation's 409 description.
      required:
        - dimension
        - requested
        - admissible
      properties:
        dimension:
          type: string
          description: The quota dimension that did not fit.
          example: node_count
        requested:
          type: integer
          format: int32
          minimum: 0
          description: The amount the request asked for in that dimension.
          example: 3
        admissible:
          type: integer
          format: int32
          minimum: 0
          description: The largest amount in that dimension that would have been admitted, the smallest headroom across the gating scopes.
          example: 2
        bindingScope:
          type: string
          description: The scope whose limit binds, `tenant` for the organization or `project`. Absent when no scope is identified.
          enum:
            - tenant
            - project
        scopes:
          type: array
          description: Every scope that gates the dimension, one entry each. Absent when no scope is identified.
          items:
            $ref: '#/components/schemas/QuotaRefusalScope'
    QuotaRefusalScope:
      type: object
      description: One scope that gates a refused quota dimension, with its limit, the usage counted against it and the room left. A refusal lists every gating scope, so a project limit tighter than the organization's is visible next to the organization's own headroom.
      required:
        - scope
        - targetId
        - limit
        - used
        - headroom
      properties:
        scope:
          type: string
          description: 'The admission level: `tenant` is the organization, `project` a project inside it. Same values as `bindingScope` on the refusal.'
          enum:
            - tenant
            - project
        targetId:
          type: string
          description: Public identifier (slug) of the scope's target, the organization slug for `tenant` and the project slug for `project`.
          example: acme
        limit:
          type: integer
          format: int32
          minimum: 0
          description: The scope's effective limit on the dimension.
          example: 5
        used:
          type: integer
          format: int32
          minimum: 0
          description: Usage already counted against the limit.
          example: 0
        headroom:
          type: integer
          format: int32
          minimum: 0
          description: The amount this scope would still admit, the limit less the usage, floored at 0.
          example: 5
    QuotaViewScope:
      type: object
      description: One admission scope's view of a quota dimension. A request is admitted only if it fits at every scope, so each scope's limit is an independent gate.
      required:
        - scope
        - targetId
        - overLimit
      properties:
        scope:
          type: string
          enum:
            - tenant
            - project
          description: 'The admission level: `tenant` is the organization, `project` a project inside it. Same values as `bindingScope` and as the QUOTA_EXCEEDED refusal''s `scopes[].scope`.'
          example: tenant
        targetId:
          type: string
          description: The organization or project identifier the scope belongs to.
          example: acme
        limit:
          type: integer
          format: int64
          minimum: 0
          description: The scope's cap, in the dimension's unit. Absent when the scope does not cap the dimension (unlimited at this scope).
          example: 5
        profileId:
          type: string
          description: The quota profile this scope's limit was copied from. Absent when the limit was set directly or the scope has no limit for the dimension. A profile that has since been deleted is still named.
          example: qp-a1b2c3d4
        used:
          type: integer
          format: int64
          minimum: 0
          description: Usage recorded at this scope, summed across regions; 0 when nothing is recorded. Present only when the dimension is enforced.
          example: 2
        headroom:
          type: integer
          format: int64
          minimum: 0
          description: Remaining under this scope's limit (limit minus used, floored at 0). Present only when limit is present and the dimension is enforced.
          example: 3
        overLimit:
          type: boolean
          description: True when usage exceeds this scope's limit, which happens when a limit is lowered below current usage. New admissions at this scope are refused until usage falls back under the limit. Always false for a dimension that is not enforced.
          example: false
    RefreshTokenGrant:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum:
            - refresh_token
        refresh_token:
          type: string
          description: |
            A refresh token returned in a prior successful token response from this
            endpoint.

            Optional on the wire: browser clients omit it and instead send
            the httpOnly `k0r_refresh_token` cookie set by the login callback (and
            rotated on each refresh) — the server reads the cookie when this field is
            absent. Non-browser callers (no cookie jar, e.g. a CLI or a server-side
            relay) send it here. The request is rejected only when neither the field
            nor the cookie is present. Relaxing this from required is
            backward-compatible: callers that always send it are unaffected.
        scope_narrowing:
          $ref: '#/components/schemas/ScopeNarrowing'
    Region:
      type: object
      description: >-
        A platform deployment region for discovery (GET /v1/regions). Read-only: regions are operator-declared topology, surfaced so a client can learn which values are valid in the {region} URL segment. Modeled on AWS DescribeRegions.
      required:
        - id
        - type
        - hostsProjects
      properties:
        id:
          type: string
          description: >-
            Region identifier — the value a caller places in the {region} URL segment (e.g. /v1/regions/{id}/compute/...).
          example: us-texas-1
        type:
          type: string
          description: >-
            Whether this is a regional location or the global control-plane tier (the literal `global` segment). It does not say whether a project can be created here: `hostsProjects` does.
          enum:
            - regional
            - global
          example: regional
        hostsProjects:
          type: boolean
          description: >-
            Whether a project can be created in this region, that is, whether `ProjectCreateRequest.region` accepts its `id`. True for a `regional` region, unless its id is not a valid region id, which the Helm chart refuses to render. For `global` it is true only on a deployment that runs compute under `global` (the single-cluster, all-in-one install) and false everywhere else, where `global` is the control-plane tier alone. A client that offers a choice of project region lists the entries where this is true, not the entries of type `regional`.
          example: true
    RegionPage:
      type: object
      required:
        - regions
      properties:
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
    Role:
      type: object
      description: |
        RBAC role definition.
      required:
        - id
        - uid
        - displayName
        - permissions
        - scopes
        - createdAt
        - version
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/global/organizations/org-x4y5z6/iam/roles/role-a2b3c4
        uid:
          type: string
          description: Server-generated UUID.
          format: uuid
          readOnly: true
        id:
          type: string
          description: Name of the resource. Provided by the client when the resource is created, or generated by the server if not specified. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. Cannot be changed after the resource is created.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: role-a2b3c4
        displayName:
          type: string
          description: Human-readable display name for the role.
          minLength: 1
          maxLength: 255
          example: Compute Viewer
        description:
          type: string
          description: Human-readable role description
        permissions:
          type: array
          items:
            type: string
          description: List of permissions granted by this role
        scopes:
          type: array
          items:
            type: string
            enum:
              - platform
              - org
              - project
          minItems: 1
          uniqueItems: true
          description: Binding tiers at which this role may be applied. Immutable after creation. Built-in roles may include `platform`; a custom role cannot be created with it, though custom roles created before this restriction may still report it.
        createdAt:
          type: string
          format: date-time
          description: Role creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Role last update timestamp
        version:
          type: integer
          format: int32
          readOnly: true
          description: >-
            Optimistic-concurrency counter. Returned as the strong `ETag` on GET and must be echoed via `If-Match` when updating the role (see PATCH). Bumped on every successful update.
          example: 3
    RolePage:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total roles matching the active filters and the caller's authorization scope. This is the FILTERED total, not the size of the unfiltered collection, so `ceil(totalCount / limit)` is the page count for the current filter.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          type: integer
          format: int32
          description: >-
            The `offset` applied to this response. Present only on the `offset`/`limit` path. A client has reached the end of the list when `offset + len(roles) >= totalCount`.
        limit:
          type: integer
          format: int32
          description: >-
            The `limit` applied to this response. Present only on the `offset`/`limit` path.
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    RotateWebhookSubscriptionSecretResult:
      type: object
      required:
        - id
        - signing_secret
        - secret_version
        - previous_secret_expires_at
        - rotated_at
      properties:
        id:
          type: string
          format: uuid
        signing_secret:
          type: string
          description: >-
            The new signing secret. Store it — it is never returned again.
        secret_version:
          type: integer
          minimum: 2
          description: >-
            The subscription's new secret_version, incremented by this rotation. A subscription that has never been rotated is at 1, so this is always at least 2.
          example: 2
        previous_secret_expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When the previous secret stops being accepted — 24 hours after this rotation. Null when overlap was false, which is how you confirm the previous secret was discarded rather than parked.
        rotated_at:
          type: string
          format: date-time
          description: When this rotation was applied.
    ScopeNarrowing:
      type:
        - object
        - 'null'
      description: |
        Optional narrowing for the minted access token. The token can only get
        narrower than the credential, never wider.

        Narrow to one organization or one project with `scope` and `scopeId`,
        to a subset of roles with `roles`, or both. At least one is required;
        an empty object is rejected with `400`. `null` is the same as leaving
        the field out.

        - `scope: organization` keeps only that organization. Its organization
          and project roles are kept.
        - `scope: project` keeps only that project and the organization that
          contains it. That organization's own roles are kept as well; list
          `roles` to cap them too. The credential needs a role bound on the
          project itself: access that comes only from an organization role is
          refused with `403`, so narrow to the organization instead.
        - `roles` caps the roles at every level (organization, project and
          platform) to the listed roles. A listed role is kept where the
          credential holds it or a higher role in the same family, for example
          `iam-viewer` under `iam-admin`.
        - Platform roles are dropped unless they are listed in `roles`.

        A request for an organization, project or role the credential does not
        hold is refused with `403`, rather than returning a token with only the
        overlap.

        Any field other than `scope`, `scopeId` and `roles` is refused with
        `400`, so a misspelled field cannot quietly widen the token.

        An API key's token is always held to the key's own scope, with or
        without `scope_narrowing`, and a narrowing applies on top of that. An
        organization-scoped key can name its own organization or a project in
        it; a project-scoped key can name only that project; a platform key can
        name any. Anything else is a `403`, even when the key's owner could
        reach it.

        On `refresh_token`, only the access token is narrowed: the refresh token
        keeps the session's full access, so a later refresh without
        `scope_narrowing` returns a full access token. A refused `refresh_token`
        request leaves the refresh token usable.
      additionalProperties: false
      properties:
        scope:
          type: string
          enum:
            - organization
            - project
          description: |
            The level to narrow to. Required together with `scopeId`.
        scopeId:
          type: string
          maxLength: 63
          pattern: '^([a-z]([-a-z0-9]*[a-z0-9])?|proj_[a-z0-9]+(_[a-z0-9]+)*)$'
          description: |
            The organization or project slug to narrow to. Required together
            with `scope`. A project may also be named by its legacy `proj_*`
            key; an organization only by its slug.
          example: proj-abc123
        roles:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            maxLength: 64
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |
            Roles to keep. Omit to keep every role held in the narrowed scope
            (platform roles are still dropped). Each listed role must end up in
            the narrowed token at some level, organization, project or platform,
            or the request is refused with `403`.
          example:
            - compute-viewer
            - iam-viewer
    SecurityGroup:
      type: object
      description: |
        A project-scoped, named set of ingress and egress filter rules that can be
        applied to compute instances. The group is the unit of both authoring and
        visibility: the client edits the group — its metadata and its nested
        `rules` object — and the platform reconciles the fabric to match. There is
        no separate rule resource and no rules subresource, so "what does this
        group allow" is answered by one `GET`.

        Rules live under `rules.ingress` and `rules.egress`; direction is implied by
        which list a rule sits in. Rules are stateless by default — return traffic
        must be permitted explicitly — with one automatic exception on the `nico`
        fabric, where an egress rule naming a protocol and a destination port range
        but no source port range is made stateful. See `SecurityGroupRule`.

        The object is declarative-friendly: writable fields describe the desired
        state and read-only fields report the observed state. A create or update
        returns immediately with the resource body; poll the object until `state` is
        `active`. There is no job resource to poll and no `202`.
      required:
        - id
        - uid
        - selfLink
        - rules
        - ruleCount
        - state
        - tags
        - createdAt
        - updatedAt
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/networking/security-groups/sg-0h2wq6dt5m8pjzk3xn4vbr7fcy
        uid:
          type: string
          format: uuid
          description: |
            Server-generated UUID. Stable for the lifetime of the resource and never
            reused, so it is the durable handle to record in external systems; `id`
            and `displayName` are for humans.
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        id:
          type: string
          description: |
            Name of the resource. Provided by the client when the resource is
            created, or generated by the server if not specified. Must be 1-63
            characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the
            first character must be a lowercase letter, and all following characters
            must be lowercase letters, digits, or hyphens, with the last character
            being a letter or digit. Unique within the project among live groups and
            cannot be changed after the resource is created.

            A group mid-teardown does not release its `id`: it sits at
            `state: deleting` and a create reusing that `id` is refused with `409`
            until teardown completes.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: sg-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Optional human-friendly display name. Free text, not unique, and not used for lookup.
          example: Training cluster edge
        description:
          type: string
          description: An optional description of this resource.
        ownerKind:
          type: string
          description: |
            Set when the platform owns this group rather than the tenant. `vpc` marks
            a VPC's default group: created with the VPC and attached to it, detachable
            from the VPC, but never deletable and never modifiable — its rules are
            platform-managed, so `PATCH` on it is refused with `409` — and removed only
            when its VPC is. Absent on the tenant-created groups, which is the common
            case.

            An owned group is attachable only to the resource named by `ownerId`. A
            VPC's default may be re-attached to that VPC (which is how you keep it
            alongside your own groups), and is refused with `422` on any other VPC, on
            a cluster and on an instance group. On a cluster or instance group it would
            also be redundant: a VPC's groups already reach that resource's
            attachments through the VPC itself.

            Only VPCs on the `nico` fabric backend get one. That is the one backend
            with a security-group construct behind it, and the only one where
            attaching is permitted at all, so a default group elsewhere would be an
            undeletable object nothing could attach or enforce.

            Its rules are seeded once, from the subnet prefixes in the VPC at
            creation, and are not refreshed afterwards. Nothing is lost by that: a
            VPC's networks and subnets come from the cluster type it was created
            from and cannot be added to or removed for the life of the cluster.
          readOnly: true
          enum:
            - vpc
        ownerId:
          type: string
          format: uuid
          description: Unique identifier of the owning resource (the VPC's `uid` when `ownerKind` is `vpc`).
          readOnly: true
          example: ad9e7bf7-973b-4063-a309-8f2da3d56046
        rules:
          description: |
            The desired ordered rule lists for this group, nested as `ingress` and
            `egress`. This is the whole of the group's filtering behaviour — there is
            no rule resource to create or delete separately, and an update replaces
            the object wholesale rather than patching entries. To add or remove one
            rule, send the current object with that entry added or removed.

            Within each list, evaluation is first-match in list order (see
            `SecurityGroupRules`). Ingress and egress are independent.

            Both lists empty is legal and is the default for a group created without
            rules: it matches nothing and therefore filters nothing. A group is
            applied to instances whether or not it carries rules, so an empty group
            is a placeholder, not an error.
          allOf:
            - $ref: '#/components/schemas/SecurityGroupRules'
        ruleCount:
          type: integer
          format: int32
          description: |
            Number of rules currently in the group. Derived from
            `rules.ingress.length + rules.egress.length` and never stored or
            accepted on write, so it always equals the sum of both list lengths on
            the same read.

            It is here for the list endpoint, where it lets a client rank or filter
            groups by size without walking every embedded rule array, and for a
            cheap assertion that an update landed the rule set it intended.

            It is also the number the per-group limit is enforced on: a write is
            rejected when it would push this above 256. See `SecurityGroupRules`.

            No `maximum` is declared, deliberately. The limit binds writes from the
            release that introduced it; a group created before it could hold more,
            and this field has to be able to report that honestly rather than
            describe a group the server will not serve.
          readOnly: true
          minimum: 0
          example: 4
        tags:
          type: object
          description: |
            Freeform user-defined key/value tags on this resource. Always present;
            `{}` when none were set.
          additionalProperties: true
        state:
          type: string
          description: |
            Observed lifecycle state. `creating` while the group is first being
            materialized, `active` once it is in force, `updating` while an edit is
            being applied, `deleting` during teardown, and `failed` if the platform
            gave up — inspect `statusReason` in that case. Set by the server and not
            writable.

            A `POST` returns `201` with `state: creating` and a `DELETE` returns
            `204` with the group moved to `deleting`; the asynchrony is carried
            entirely by this field rather than by a `202` and a job resource. Poll
            the group until `state` is `active`, or until `GET` returns `404` after
            a delete.
          readOnly: true
          enum:
            - creating
            - active
            - updating
            - deleting
            - failed
          example: active
        statusReason:
          type: string
          description: |
            Diagnostic explaining the current `state`, typically populated when
            `state` is `failed`. Debug-only: the wording is not stable across
            releases and must not be parsed by clients. Use `state` for control flow
            and the HTTP error envelope's `details[].reason` for machine-readable
            causes.

            Also carries lint-level advisories on an otherwise healthy group — the
            one emitted today names any rules whose `sourcePrefix` and
            `destinationPrefix` are different address families, since those can never
            match traffic. A stored failure message always wins: the advisory appears
            only when the field would otherwise be empty, so `statusReason` being set
            does not by itself imply `state` is `failed`.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: Timestamp at which the resource was accepted by the platform.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last modification to the resource, including server-driven state transitions.
          readOnly: true
    SecurityGroupAttachment:
      type: object
      description: |
        One resource holding the security group.

        An identity and a kind, not a copy of the resource. `displayName` and `state`
        are carried so a list of attachments renders without a `GET` per entry;
        everything else about the holder — its own `securityGroups` binding, its
        timestamps, its configuration — is read from its own resource.

        There is no `selfLink`, matching `EffectiveSecurityGroup`: `kind` plus `id`
        resolve to a URL without the caller having to guess what the id names.

        Neither `region` nor `project` is repeated per entry. Every holder is in the
        same region and project as the group it holds — the platform will not bind a
        group across that boundary, and this operation reports only holders inside it
        — so they are always the ones from the request path.
      additionalProperties: false
      required:
        - kind
        - id
        - uid
        - state
      properties:
        kind:
          type: string
          description: |
            What sort of resource this is. The same vocabulary
            `security-groups-effective` uses for `objectKind`, because the set of
            things that can hold a binding is the set of things that can have one.

            It also tells the caller which collection `id` belongs to:
            `cluster` → `.../compute/clusters/{id}`, `instance_group` →
            `.../compute/instance-groups/{id}`, `vpc` → `.../networking/vpcs/{id}`.
          enum:
            - cluster
            - instance_group
            - vpc
          example: cluster
        id:
          type: string
          description: The holder's `id`, as its own resource reports it.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: c-abc
        uid:
          type: string
          format: uuid
          description: |
            The holder's server-generated UUID. Stable and never reused, so it is the
            durable handle to record against this attachment; `id` is for humans and
            for URLs.
          example: 761fd6c2-be41-419e-a3f7-8ff8c11a7495
        displayName:
          type: string
          description: |
            The holder's display name, when it has one, and absent when it does not.

            A holder whose display name is stored as an empty string is reported the
            same way as one that has none — both are simply absent. The two are NOT
            distinguished here, matching how every other resource in this contract
            reports `displayName`. A client that needs to tell them apart must read
            the holder's own resource.
          example: Training cluster
        state:
          type: string
          description: |
            The holder's observed lifecycle state, lower-cased, as its own resource
            reports it. Its enum is that resource's, not this one's, so it is left
            open here rather than pinned to an intersection that would have to change
            whenever a holder gains a state.

            Worth reading rather than ignoring: a holder in `deleting` stops holding
            the group when its teardown completes, with nobody detaching anything, so
            an attachment that blocks a delete today may simply disappear.
          example: active
    SecurityGroupAttachments:
      type: object
      description: |
        Every live resource holding one security group: its VPCs, its clusters and
        its instance groups, in one list.

        The inverse of `security-groups-effective`. Both exist because the binding is
        stored on the HOLDER — `Cluster.securityGroups`, `InstanceGroup.securityGroups`
        and `VPC.securityGroups` — so a group's own resource cannot say who points at
        it, and neither direction can be derived from the other.

        For a tenant-defined group it is also the `DELETE` conflict made readable. A
        `DELETE` on such a group while attached is refused with `409` and
        `details[].reason: CONFLICT_IN_USE`, naming the holders in prose; this is the
        same set, from the same lookup, in a shape a client can act on — so a UI can
        show what is blocking a delete before one is attempted, and offer the detach
        for each entry.

        That equivalence does NOT hold for a platform-managed VPC default group. Its
        `DELETE` is refused as `CONFLICT_IMMUTABLE` before holders are consulted, so
        it names none, while this operation still reports the owning VPC. The entry is
        accurate — that VPC does hold the group — but it is not a detachable blocker.
        See the operation description.

        A READ, with no life beyond the instant it was served: a holder can attach or
        detach immediately afterwards. An empty `attachments` means nothing held the
        group when it was asked, not that a `DELETE` will succeed.

        The group is not echoed back. It is named in the request path, and everything
        else about it — `uid`, `state`, `rules`, ownership — is read from
        `GET .../networking/security-groups/{id}`, the one place that answers "what is
        this group". This is a plain subresource collection, shaped like a group's
        `members` or a cluster type's `versions`, not a wrapper around the group.

        It is still an object rather than a bare array, so a filter or a page token
        could be added later without breaking every client.
      additionalProperties: false
      required:
        - attachments
      properties:
        attachments:
          type: array
          description: |
            The holders, ordered VPCs first, then clusters, then instance groups, and
            by `id` within each kind. Stable across calls, so a client can diff two
            reads without sorting.

            Always present; `[]` when nothing holds the group, which is the answer for
            a freshly created group and the state a `DELETE` requires. It is not an
            error and not a `404`.

            Only LIVE holders appear. A soft-deleted VPC or cluster, and an instance
            group already tearing down, are excluded — they no longer block the
            group's own teardown, so reporting them would name resources a caller can
            neither see nor detach.

            Only holders in the group's own region and project appear, which is every
            holder there can be — a security group is project-scoped and cannot be
            attached outside its project.
          items:
            $ref: '#/components/schemas/SecurityGroupAttachment'
    SecurityGroupCreateRequest:
      type: object
      description: |
        Request to create a security group in a project. The client declares the
        group's metadata and, optionally, the rules it starts with; the platform
        materializes the group asynchronously and reports progress on the resource's
        `state`.

        A group created with no rules matches nothing and filters nothing, which is
        the intended default: author the rules now, or add them later by updating
        the group.

        Server-owned fields (`selfLink`, `uid`, `ruleCount`, `state`,
        `statusReason`, `version`, `systemTags`, `createdAt`, `updatedAt`) are not
        accepted; sending them is rejected with `400` under
        `additionalProperties: false`.
      additionalProperties: false
      properties:
        id:
          type: string
          description: |
            Name of the resource. Must be 1-63 characters long and match the pattern
            [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase
            letter, and all following characters must be lowercase letters, digits,
            or hyphens, with the last character being a letter or digit. If not
            specified, the server will generate a name. Supplying it makes a retried
            create safe: a repeat with the same `id` is rejected with `409` instead
            of creating a second group. There is no separate idempotency key header.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: sg-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Optional human-friendly display name for the group. Free text; not unique and not used for lookup.
          example: Training cluster edge
        description:
          type: string
          description: An optional description of this resource.
        rules:
          description: |
            Optional nested rule set to author at creation. Same shape as the
            group's `rules` field (`ingress` and `egress` lists). Omit it, or send
            both lists empty, to create a group that filters nothing until rules are
            added later.

            Rules are validated as a set before the group is accepted, so one bad
            entry fails the whole create with `422` rather than producing a group
            with a partial rule set.
          allOf:
            - $ref: '#/components/schemas/SecurityGroupRules'
        tags:
          type: object
          description: Freeform user-defined key/value tags to set on the group.
          additionalProperties: true
    SecurityGroupPage:
      type: object
      required:
        - securityGroups
      properties:
        securityGroups:
          type: array
          description: The matching security groups, ordered by creation time descending.
          items:
            $ref: '#/components/schemas/SecurityGroup'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total security groups in the project matching the active `state` filter, so `ceil(totalCount / limit)` is the page count for the current filter. Tombstoned groups are excluded from the count exactly as they are from the page.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    SecurityGroupRule:
      type: object
      description: |
        One filter rule in a `SecurityGroup`'s nested `rules.ingress` or
        `rules.egress` list. Direction is implied by which list the rule sits in —
        there is no `direction` field on the rule itself. A rule matches traffic for
        one `protocol` between two CIDR prefixes, optionally narrowed to port ranges,
        and either permits or denies it.

        Rules are stateless by default: return traffic must be permitted explicitly
        with a matching rule in the opposite direction list.

        **One automatic exception.** On the `nico` fabric the platform enables
        `statefulEgress`, which makes an EGRESS rule stateful when it names a
        `protocol` and a `destinationPortRange` but NO `sourcePortRange`. Return
        traffic for the flows such a rule permits is allowed back without a matching
        ingress rule. The qualifying shape is therefore narrow — an egress `tcp` or
        `udp` rule with a destination port and an unpinned source port, which is the
        ordinary way a client-side rule is written. Everything else stays stateless:
        every ingress rule, every egress rule that pins `sourcePortRange`, and every
        rule on `icmp`, `icmp6` or `any`, since those cannot carry ports at all.

        There is no field for this on the rule and none on the group — it is a
        property of the enforcement, not of the declaration, and it is not reported
        back per rule.

        A rule is not an addressable resource: it has no id of its own and there is
        no rules subresource. The group's `rules` object is the desired state and is
        replaced wholesale on update, which keeps "what does this group allow" a
        single read of a single object.

        Within a direction list, evaluation is first-match in list order (see
        `SecurityGroupRules`). There is no per-rule priority field — position in the
        array is the only ordering signal.

        There is no remote-security-group reference in this model — a rule always
        names two literal prefixes. Both are required: a rule that constrains only
        one side is written by sending the wide-open prefix (`0.0.0.0/0` or `::/0`)
        on the other, so the intent is always visible in the rule rather than
        implied by an omission.
      additionalProperties: false
      required:
        - protocol
        - action
        - sourcePrefix
        - destinationPrefix
      properties:
        name:
          type: string
          description: |
            Optional human-friendly label for this rule. Free text, not unique, and
            not used for lookup or for ordering. List position within
            `rules.ingress` / `rules.egress` is the only ordering signal (first-match
            evaluation). It exists so a rule set stays readable when it grows past
            the point where the prefixes alone explain the intent.
          maxLength: 253
          example: allow-https
        protocol:
          type: string
          description: |
            IP protocol the rule matches. `any` matches every protocol and is the
            way to express a blanket permit or deny. `icmp6` is the IPv6 spelling
            and is distinct from `icmp` — a rule written for one does not match the
            other.

            Only `tcp` and `udp` are port-bearing. `sourcePortRange` and
            `destinationPortRange` are rejected on `icmp`, `icmp6` and `any` with
            `422` and `details[].reason: INVALID_ARGUMENT`, rather than being
            accepted and ignored: a rule that reads as port-scoped but is not would
            be a security surprise.

            Lowercase on the wire; an uppercase spelling is rejected with `422` and
            `details[].reason: INVALID_ARGUMENT` rather than normalized.
          enum:
            - tcp
            - udp
            - icmp
            - icmp6
            - any
          example: tcp
        action:
          type: string
          description: |
            What to do with traffic this rule matches. `permit` allows it, `deny`
            drops it. Lowercase on the wire; an uppercase spelling is rejected with
            `422` and `details[].reason: INVALID_ARGUMENT` rather than normalized.
          enum:
            - permit
            - deny
          example: permit
        sourcePrefix:
          type: string
          description: |
            Source address range the rule matches, as an IPv4 or IPv6 prefix in CIDR
            notation. Required. Use `0.0.0.0/0` or `::/0` to match any source.

            The host bits must be zero: `192.168.1.0/24` is accepted and
            `192.168.1.1/24` is rejected with `422` and
            `details[].reason: INVALID_ARGUMENT` rather than silently normalized to
            the network address, because that spelling is far more often a typo than
            an intent. The address family is not required to match
            `destinationPrefix` at the schema level, but a rule that mixes families
            matches nothing.
          minLength: 1
          maxLength: 43
          example: 0.0.0.0/0
        destinationPrefix:
          type: string
          description: |
            Destination address range the rule matches, as an IPv4 or IPv6 prefix in
            CIDR notation. Required, and validated exactly as `sourcePrefix` is:
            host bits must be zero. Use `0.0.0.0/0` or `::/0` to match any
            destination.
          minLength: 1
          maxLength: 43
          example: 10.5.44.0/24
        sourcePortRange:
          type: string
          description: |
            Source ports the rule matches, as a single port (`"80"`) or an inclusive
            range (`"80-81"`). A string, not an integer or an object, on both read
            and write — a single port is `"80"` and never `80`.

            Optional; omit it to match any source port. Valid only when `protocol`
            is `tcp` or `udp`: supplying it alongside `icmp`, `icmp6` or `any` is
            rejected with `422` and `details[].reason: INVALID_ARGUMENT`.

            Each bound must be between `0` and `65535`, and the low bound must not
            exceed the high bound. `"80-80"` is accepted and is equivalent to
            `"80"`; the platform reports the normalized spelling it stored.
          pattern: ^[0-9]{1,5}(-[0-9]{1,5})?$
          example: '1024-65535'
        destinationPortRange:
          type: string
          description: |
            Destination ports the rule matches, as a single port (`"80"`) or an
            inclusive range (`"80-81"`). Same string wire format, same bounds and
            the same protocol restriction as `sourcePortRange`: valid only for `tcp`
            and `udp`, rejected with `422` on `icmp`, `icmp6` and `any`.

            Omit it to match any destination port.
          pattern: ^[0-9]{1,5}(-[0-9]{1,5})?$
          example: '443'
    SecurityGroupRules:
      type: object
      description: |
        Nested ingress and egress rule lists for a `SecurityGroup`. Direction is
        implied by which list a rule sits in — there is no `direction` field on
        individual rules.

        Both lists are always present on read (possibly empty). On write, omit a
        list or send an empty array to leave that direction with no rules. There is
        no rule resource to create or delete separately, and an update replaces the
        whole `rules` object wholesale rather than patching entries.

        Evaluation within each list is **first-match in list order**: the platform
        walks `ingress` (or `egress`) from index 0 and applies the action of the
        first rule that matches the packet. Later overlapping rules do not override
        earlier ones. A broad `deny` of `0.0.0.0/0` before a narrower `permit` for
        one port therefore denies that port; put the narrower `permit` first if it
        should win. Order is preserved end-to-end (API → database list position →
        UFO CRD arrays). The two directions are independent — ingress and egress
        never compete with each other.

        **A group carries at most 256 rules in total**, counted as
        `ingress.length + egress.length` — the same number reported as
        `SecurityGroup.ruleCount`. The budget is shared between the two directions
        rather than allotted per direction, so a group may hold 256 ingress rules
        and no egress rules, or any split summing to 256. A create or update over
        the limit is rejected with `422` naming the total and both list lengths.

        The limit is deliberately NOT declared as a schema constraint, for two
        reasons. A per-list `maxItems` would be necessary but not sufficient — two
        lists of 200 each satisfy it and are still rejected on their sum of 400 — so
        it could not replace the server-side check. And this schema is shared by the
        read model: a group created before the limit existed may hold more, and a
        numeric bound here would make every read of that group fail strict client
        validation instead of reporting what it actually holds. The limit binds
        writes; reads stay honest.

        The limit is on the group, but the pressure comes from where groups end up.
        The rules that filter one network interface are those of every group
        attached to its cluster (or instance group) *plus* those of every group
        attached to the VPC it connects to — at most 16 groups from each binding.
        The per-group limit is what keeps that combined set within the fabric's own
        ceiling on rules per interface.
      additionalProperties: false
      required:
        - ingress
        - egress
      properties:
        ingress:
          type: array
          description: |
            Ordered rules that filter traffic arriving at the instance. First-match
            in list order within this array. An empty list is legal and matches
            nothing on the ingress side.

            No `maxItems` is declared; the limit is the 256-rule total across both
            lists, enforced on write. See the schema description above.
          items:
            $ref: '#/components/schemas/SecurityGroupRule'
        egress:
          type: array
          description: |
            Ordered rules that filter traffic leaving the instance. First-match in
            list order within this array. An empty list is legal and matches nothing
            on the egress side.

            No `maxItems` is declared; the limit is the 256-rule total across both
            lists, enforced on write. See the schema description above.
          items:
            $ref: '#/components/schemas/SecurityGroupRule'
    SecurityGroupUpdateRequest:
      type: object
      description: |
        Partial update of a security group. Only the fields present in the body are
        changed, and at least one *updatable* field — `displayName`, `description`,
        `rules` or `tags` — must be supplied; an empty body is rejected with `400`.
        Returns the full resource.

        Identity (`id`) is fixed for the life of the group. Everything else the
        tenant controls is here.

        `rules` is replaced wholesale by the nested object you send — it is the
        desired state, not a patch. To add a rule, send the current object plus the
        new entry; to remove one, send the current object without it. Sending both
        lists empty clears the rule set, leaving a group that filters nothing.
        Omitting `rules` entirely leaves the existing rule set untouched, which is
        how the two "empty" cases are told apart.

        No concurrency token. This PATCH is last-write-wins, matching cluster types
        and instance groups: two concurrent edits do not conflict and the later one
        stands. `additionalProperties: false` still applies, so a body that carries a
        `version` field is rejected with `400` rather than ignored.
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          description: Replace the human-friendly display name. Send an empty string to clear it.
          example: Training cluster edge (2026 run)
        description:
          type: string
          description: Replace the free-text description. Send an empty string to clear it.
        rules:
          description: |
            The desired nested rule set (`ingress` and `egress`), replacing the
            group's current rules in full. Send the group's existing rules alongside
            any new ones to avoid dropping them by omission; send both lists empty
            to clear the set.

            The object is validated as a whole before anything is applied, so one
            rejected entry leaves the group's current rules in place.
          allOf:
            - $ref: '#/components/schemas/SecurityGroupRules'
        tags:
          type: object
          description: |
            Replace the freeform user-defined tags on this resource. The map is
            replaced wholesale, not merged; send an empty object to clear every tag.
          additionalProperties: true
    ServiceAccount:
      type: object
      description: |
        Service account for machine-to-machine and infrastructure access.
        Service accounts are independent principals with their own identity
        and role bindings. They are scoped to a level in the resource
        hierarchy (organization, folder, or project) and survive the
        off-boarding of the user who created them.

        Authentication uses client_id (on this resource) combined with a
        client_secret (from a credential sub-resource) via the
        grant_type=client_credentials flow.

        Only tenant administrators can create and manage service accounts.
      required:
        - id
        - uid
        - displayName
        - clientId
        - scope
        - scopeId
        - status
        - createdAt
        - createdBy
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/global/organizations/org-example/iam/service-accounts/sa-pipeline-prod
        uid:
          type: string
          format: uuid
          description: Server-generated UUID. Immutable.
          readOnly: true
        id:
          type: string
          description: |
            Resource identifier. Provided by the client at creation or
            server-generated if omitted. New accounts require the `sa-`
            prefix — sa-[a-z0-9]+(-[a-z0-9]+)*, at most 63 characters.
            Immutable after creation. The read-side pattern stays
            permissive because accounts created before the prefix requirement
            may carry prefixless ids.
          pattern: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
          minLength: 1
          maxLength: 63
          example: sa-pipeline-prod
        displayName:
          type: string
          description: Human-readable display name for the service account.
          minLength: 1
          maxLength: 255
          example: Production CI/CD Pipeline
        description:
          type: string
          description: Optional description of the service account's purpose.
          maxLength: 1024
        clientId:
          type: string
          description: |
            Unique client identifier for OAuth2 client_credentials flow.
            Server-generated, immutable. Used together with a credential's
            client_secret to authenticate at the token endpoint.
          readOnly: true
          example: sa-pipeline-prod@myorg.iam
        scope:
          type: string
          enum:
            - organization
            - folder
            - project
          description: |
            The level in the resource hierarchy this service account
            operates within:
              - organization: access across all folders and projects
                (subject to assigned roles).
              - folder: access across all projects under the specified
                folder (subject to assigned roles).
              - project: restricted to a single project.

            Subject to org-level policy constraints.
          example: project
        scopeId:
          type: string
          description: |
            Resource identifier corresponding to the scope level:
              - organization scope: the organization ID.
              - folder scope: a folder ID.
              - project scope: a project ID.
          example: proj-abc123
        roles:
          type: array
          items:
            type: string
          description: |
            Role bindings assigned directly to this service account.
            Unlike API keys, service account roles are not inherited
            from a user — they are explicitly granted. Each role must
            be a valid org-defined role slug.

            The assigning administrator can only grant roles they
            themselves hold within the service account's scope (scope-down
            principle). Effective privileges are bounded by the scope.
          example:
            - compute.deployer
            - storage.writer
        status:
          type: string
          enum:
            - active
            - disabled
          description: |
            Current service account status.
              - active: credentials can be used to mint tokens.
              - disabled: all credentials are unusable for minting and the
                service account's outstanding access tokens are revoked.
                Can be re-enabled via PATCH, which only restores
                minting — it does not revive previously-revoked tokens.
          readOnly: true
          example: active
        createdBy:
          type: string
          description: |
            User ID of the tenant administrator who created this
            service account.
          readOnly: true
          example: usr-admin-001
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the service account was created.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last metadata change.
          readOnly: true
        activeCredentialCount:
          type: integer
          description: |
            Number of active (non-expired) credentials on this service
            account. Maximum of 5 credentials allowed.
          readOnly: true
          example: 2
    ServiceAccountCredential:
      type: object
      description: |
        A credential (client_secret) belonging to a service account.
        Multiple credentials can exist simultaneously for a single
        service account, enabling zero-downtime secret rotation:
        create a new credential, deploy it, then delete the old one.

        The client_secret value is returned only at creation time
        and cannot be retrieved again.

        Maximum of 5 active credentials per service account.
      required:
        - id
        - uid
        - serviceAccountId
        - status
        - createdAt
        - createdBy
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/global/organizations/org-example/iam/service-accounts/sa-pipeline-prod/credentials/cred-7c2e9b4a1f6d4e8b8a3c5d0f9e1b2a64
        uid:
          type: string
          format: uuid
          description: Server-generated UUID. Immutable.
          readOnly: true
        id:
          type: string
          description: |
            Credential identifier. Server-generated, immutable.
          pattern: ^cred[-_][0-9a-f]{32}$
          readOnly: true
          example: cred-7c2e9b4a1f6d4e8b8a3c5d0f9e1b2a64
        serviceAccountId:
          type: string
          description: |
            The parent service account this credential belongs to.
          readOnly: true
          example: sa-pipeline-prod
        status:
          type: string
          enum:
            - active
            - expired
          description: |
            Current credential status.
              - active: can be used to authenticate.
              - expired: past expiresAt. Terminal; cannot be re-enabled.

            The platform sets `expired` shortly after `expiresAt` passes, not
            at the instant it passes: a background sweep transitions lapsed
            credentials on an interval, so a credential that has just passed
            `expiresAt` can still report `active` briefly.

            That lag never affects behaviour, only this field. A credential
            past `expiresAt` cannot authenticate and does not count toward the
            5-active-credential limit from the moment it lapses, whatever this
            field currently says. Treat `expiresAt` as authoritative when you
            need an exact answer, and this field as the readable summary.

            Note: if the parent service account is disabled, all its
            credentials are effectively unusable regardless of their
            individual status, and the service account's outstanding
            access tokens are revoked. Deleting an individual
            credential, by contrast, does not revoke its outstanding
            tokens — they expire within the access-token lifetime.
          readOnly: true
          example: active
        expiresAt:
          type: string
          format: date-time
          description: |
            Credential expiration timestamp. If not set at creation, the
            owning organization's default service-account credential
            lifetime applies (30 days unless configured otherwise). Never
            later than the organization's maximum lifetime (180 days unless
            configured otherwise) at creation time.
        createdBy:
          type: string
          description: |
            User ID of the administrator who created this credential.
          readOnly: true
          example: usr-admin-001
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the credential was created.
          readOnly: true
        lastUsedAt:
          type: string
          format: date-time
          description: |
            Timestamp of the last successful token mint using this
            credential. Null if never used.
          readOnly: true
        lastUsedIp:
          type: string
          description: IP address from which this credential was last used.
          readOnly: true
          example: 203.0.113.42
    ServiceAccountCredentialPage:
      type: object
      required:
        - credentials
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccountCredential'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total credentials matching the active filters and the caller's authorization scope. This is the FILTERED total, not the size of the unfiltered collection, so `ceil(totalCount / limit)` is the page count for the current filter.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          type: integer
          format: int32
          description: >-
            The `offset` applied to this response. Present only on the `offset`/`limit` path. A client has reached the end of the list when `offset + len(credentials) >= totalCount`.
        limit:
          type: integer
          format: int32
          description: >-
            The `limit` applied to this response. Present only on the `offset`/`limit` path.
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    ServiceAccountPage:
      type: object
      required:
        - serviceAccounts
      properties:
        serviceAccounts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total service accounts matching the active filters and the caller's authorization scope. This is the FILTERED total, not the size of the unfiltered collection, so `ceil(totalCount / limit)` is the page count for the current filter.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          type: integer
          format: int32
          description: >-
            The `offset` applied to this response. Present only on the `offset`/`limit` path. A client has reached the end of the list when `offset + len(serviceAccounts) >= totalCount`.
        limit:
          type: integer
          format: int32
          description: >-
            The `limit` applied to this response. Present only on the `offset`/`limit` path.
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    ShareType:
      type: object
      description: |
        A class of file storage offered in the region, named by what it
        does rather than by what provides it. `ShareType` is the tenant's entire
        selector for storage: a file store references one by `id`, and the platform
        decides which backing storage satisfies it.

        The catalog is operator-curated — a class has a lifecycle and a `state`,
        and there is no way for a tenant to create or modify a class. Which
        classes exist can differ between regions, so the list is read per region
        rather than cached globally.
      required:
        - id
        - selfLink
        - displayName
        - state
        - reconciling
        - etag
        - createdAt
        - updatedAt
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/storage/share-types/high-speed
        id:
          type: string
          description: |
            Identifier of the class, and the value a file store sets as its
            `shareType`. Named by capability — `general`, `high-speed` — never
            after a vendor, product or array. Stable: a class id is not reused
            for a different capability.
          readOnly: true
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: high-speed
        displayName:
          type: string
          description: Human-friendly name for the class, suitable for a picker in a console.
          readOnly: true
          example: High-speed NFS
        capabilities:
          type: object
          description: |
            Capability facts about the class, as flat string key/value pairs —
            for example `protocol=nfs` or `tier=performance`. Intended for
            display and for coarse client-side filtering; the set of keys is not
            fixed and clients must ignore keys they do not recognize.

            Values are drawn from a capability vocabulary only. Vendor names,
            model numbers and array identifiers never appear here, so a client
            cannot infer the backing hardware from this map and must not attempt
            to.
          readOnly: true
          additionalProperties:
            type: string
          example:
            protocol: nfs
            tier: performance
        description:
          type: string
          description: Free-text description of the class.
          readOnly: true
        backendRef:
          type: string
          description: Opaque id of the storage system this class is served from; operator configuration, so it is present only for a caller holding `compute.storage.read`, and absent on a class no backend has been bound to.
          readOnly: true
          example: sb-a1b2c3d4
        maxCapacityGiB:
          type: integer
          format: int64
          minimum: 1
          description: Ceiling on a single allocation ordered from this class, in GiB. Absent means the class sets no ceiling of its own.
          readOnly: true
          example: 4096
        placement:
          allOf:
            - $ref: '#/components/schemas/ShareTypePlacement'
          description: Operator configuration, present only for a caller holding `compute.storage.read` and absent on seeded classes.
        reconciling:
          type: boolean
          description: True while the class's placement object is still being applied; a settled class is `false`.
          readOnly: true
        state:
          type: string
          description: 'Lifecycle state of the class. `deleting` is declared but not currently reachable: a delete tombstones the class in the same transaction that removes it.'
          enum:
            - creating
            - active
            - deleting
            - failed
          readOnly: true
          example: active
        stateMessage:
          type: string
          description: 'The same debug-only `<code> (ref: <executionId>)` value `statusReason` carries; neither field is parseable nor safe to equality-match. Absent when there is nothing to report.'
          readOnly: true
        statusReason:
          type: string
          description: 'The same debug-only `<code> (ref: <executionId>)` value `stateMessage` carries; the `ref` varies per execution, so neither field is parseable nor safe to equality-match. Absent when there is nothing to report.'
          readOnly: true
        createdBy:
          type: string
          description: Identity that created the class; operator configuration, so it is present only for a caller holding `compute.storage.read`.
          readOnly: true
        etag:
          type: string
          description: Current revision of the class, echoed on an update to make it conditional.
          readOnly: true
          example: '"3"'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Last-modification timestamp.
          readOnly: true
    ShareTypePage:
      type: object
      properties:
        shareTypes:
          type: array
          description: The share types offered in the region, ordered by `id` ascending.
          items:
            $ref: '#/components/schemas/ShareType'
        totalCount:
          type: integer
          format: int64
          example: 42
          description: |-
            Total share types offered in the region — classes naming a live storage backend — so `ceil(totalCount / limit)` is the page count. This list takes no filters.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    ShareTypePlacement:
      type: object
      description: Placement configuration the class is served under, keyed by what it does rather than by the system that provides it.
      additionalProperties: false
      required:
        - rootExport
        - dataPlanePools
      properties:
        rootExport:
          type: string
          maxLength: 960
          pattern: ^/([^/\x00-\x1f\x7f]+(/[^/\x00-\x1f\x7f]+)*)?$
          description: Absolute export root every store on this class is created under. Fixed at creation, because the rendered placement rule consumes it.
          example: /k0rdent
        protocols:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: Export protocols the class serves. Fixed at creation.
          items:
            type: string
            enum:
              - nfs
              - nfs4
          example:
            - nfs
        mountOptions:
          type: string
          maxLength: 255
          description: Mount options published alongside the backend's data-plane address. Fixed at creation, because the rendered rule is immutable once applied.
          example: vers=4.1,hard
        managementAccessRanges:
          type: array
          maxItems: 256
          description: IPv4 addresses, CIDR blocks or inclusive ranges granted administrative access. Fixed at creation.
          items:
            type: string
            minLength: 1
            maxLength: 96
          example:
            - 10.4.4.0/24
        dataPlanePools:
          type: array
          minItems: 1
          maxItems: 256
          description: Pre-configured data-plane address pools granted access to every export on this class. Fixed at creation.
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - permission
            properties:
              id:
                type: integer
                format: int64
                minimum: 1
                description: Numeric id of the data-plane address pool on the storage system.
              permission:
                type: string
                enum:
                  - rw
                  - ro
                description: Access level the pool is granted on the exports.
          example:
            - id: 4
              permission: rw
        tenantCapacity:
          type: object
          description: Ceiling of the backing tenant, which is shared per project namespace on this class. Fixed at creation.
          additionalProperties: false
          properties:
            softLimitGiB:
              type: integer
              format: int64
              minimum: 1
              maximum: 8589934591
              description: Usage above which the storage system reports the tenant as over its soft limit.
            hardLimitGiB:
              type: integer
              format: int64
              minimum: 1
              maximum: 8589934591
              description: Usage the storage system refuses to exceed; must not be below `softLimitGiB`.
            notifySoftLimit:
              type: boolean
              description: Whether crossing the soft limit raises a notification on the storage system.
    SshUser:
      type: object
      description: >-
        SSH access for one Linux user: the username, one or more authorized PUBLIC keys, given inline or as `ssh_public_key` credential references (private keys are never stored or generated), an optional sudo grant, and an optional display name. Rendered into a cloud-init `users[]` entry on every provisioned node.
      required:
        - username
      allOf:
        - if:
            required:
              - sshPublicKeyCredentials
          then:
            not:
              required:
                - sshPublicKeys
          else:
            required:
              - sshPublicKeys
      properties:
        username:
          type: string
          pattern: '^[a-z_][a-z0-9_-]{0,31}$'
          description: Linux username to provision. Must match `^[a-z_][a-z0-9_-]{0,31}$`.
          example: ops
        sshPublicKeys:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 16384
          description: >-
            One or more SSH public keys (each an `authorized_keys` line) authorized to log in as this user — e.g. the app user's key plus several admins'. Each element must hold exactly one key. Only modern algorithms are accepted: `ssh-ed25519`, `ecdsa-sha2-nistp256/384/521`, `ssh-rsa` (>= 2048 bits), and the `sk-` FIDO security-key variants. SSH certificates, `ssh-dss`, and other legacy types are rejected. Set exactly one of `sshPublicKeys` or `sshPublicKeyCredentials`. On cluster and instance-group create, keys supplied here are registered as managed SSH public-key credentials and returned (and re-read) as `sshPublicKeyCredentials` references.
          example:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID... app@example
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID... admin@example
        sshPublicKeyCredentials:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            format: uri-reference
            pattern: '^/v1/regions/[^/]+/projects/[^/]+/credentials/mcred-[0-9A-TV-Za-tv-z]{26}$'
          description: Self-links of `ssh_public_key` credentials in the request's region and project, resolved at provisioning; exclusive with `sshPublicKeys`.
          example:
            - /v1/regions/us-texas-1/projects/proj-a1b2c3d4/credentials/mcred-01J9Z3X4Y5W6V7T8S9R0QPNMKH
        sudo:
          type: string
          maxLength: 4096
          description: Optional sudo fragment granting privileges to the user.
          example: ALL=(ALL) NOPASSWD:ALL
        displayName:
          type: string
          maxLength: 255
          description: Optional human-friendly name for this SSH access entry.
          example: ops-team
    StateReason:
      type: string
      description: Machine-readable cause of the current lifecycle `state`; stable and safe to branch on, unlike the free-text `statusReason`. Absent when no failure is recorded.
      readOnly: true
      enum:
        - INSUFFICIENT_CAPACITY
        - INVALID_CONFIGURATION
        - RESERVATION_FAILED
        - TIMEOUT
        - CANCELLED
        - INTERNAL
      example: INSUFFICIENT_CAPACITY
    Subnet:
      type: object
      description: |
        An L3 subnet within a network: a CIDR prefix allocated from an
        AddressPool. A subnet is either tenant-writable — the client supplies
        `addressPool`, `prefixLength`, and optionally `excludeRanges` (plus an
        `allocateGateway` flag on the create request), and the platform
        allocates the `cidr` and resolves the `gateway` asynchronously — or
        cluster-provisioned and read-only (`clusterId` set): the latter is
        materialized by the cluster lifecycle from the ClusterType's
        `networkSchema` and hangs off the parent cluster-provisioned network;
        `POST` under a cluster-provisioned network and tenant `DELETE` of a
        cluster-provisioned subnet both return `409`. L2 fabric attributes live
        on the parent Network; only L3 / IP allocation is modelled here.
      required:
        - prefixLength
        - excludeRanges
        - systemTags
        - tags
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/networking/networks/net-0h2wq6dt5m8pjzk3xn4vbr7fcy/subnets/sn-0h2wq6dt5m8pjzk3xn4vbr7fcy
        uid:
          type: string
          description: Server-generated UUID.
          format: uuid
          readOnly: true
        id:
          type: string
          description: Name of the resource. Provided by the client when the resource is created, or generated by the server if not specified. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. Cannot be changed after the resource is created.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: sn-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Optional human-friendly display name for the subnet.
        description:
          type: string
          description: An optional description of this resource.
        network:
          type: string
          format: uri-reference
          description: URI of the parent network. Server-populated from the request path.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/networking/networks/net-0h2wq6dt5m8pjzk3xn4vbr7fcy
        addressPool:
          type: string
          format: uri-reference
          description: |
            URI of the regional AddressPool the CIDR is allocated from. Must
            resolve in the network's region. Immutable after creation. Present on
            tenant-writable subnets; absent on cluster-provisioned subnets
            (`clusterId` set), whose CIDR is allocated by the cluster lifecycle
            rather than a tenant-referenced pool.
          example: /v1/regions/us-texas-1/networking/address-pools/pool-mgmt-v4
        prefixLength:
          type: integer
          minimum: 1
          maximum: 32
          description: |
            Allocation prefix length. Must lie within the referenced
            AddressPool's `[minPrefixLength, maxPrefixLength]`. `/31` is the
            2-host point-to-point case (RFC 3021) and `/32` the single-host
            case (e.g. a control-plane VIP subnet); a `/0` is not an
            allocatable subnet, hence the `/1` floor. Immutable after creation.
          example: 24
        excludeRanges:
          type: array
          description: |
            IPs or ranges inside the allocated CIDR to exclude from host
            allocation. Supported forms: single IP (`10.0.0.4`), CIDR
            (`10.0.0.0/29`), or hyphen-delimited range (`10.0.0.10-10.0.0.20`).
            Always present; `[]` when none are excluded (the server echoes an empty
            array, never `null` and never omitted).
          items:
            type: string
            example: 10.0.0.10-10.0.0.20
        ipVersion:
          type: string
          description: IP family of the allocated CIDR. Currently IPv4-only.
          readOnly: true
          enum:
            - IPV4
          example: IPV4
        cidr:
          type: string
          description: |
            Allocated CIDR block (e.g. `10.0.1.0/24`). Server-allocated from
            the AddressPool; empty until `state=active`.
          readOnly: true
          example: 10.0.1.0/24
        gateway:
          type: string
          description: |
            Resolved gateway address. Server-populated when the parent
            AddressPool is routable and the create request set
            `allocateGateway: true` — the last usable host address of the
            allocated CIDR (e.g. `.254` for a `/24`). Empty otherwise.
          readOnly: true
          example: 10.0.1.254
        state:
          type: string
          description: Observed lifecycle state. `creating` while CIDR allocation is in flight, `active` once allocated, `deleting` during teardown, `failed` if allocation errored.
          readOnly: true
          enum:
            - creating
            - active
            - deleting
            - failed
        stateMessage:
          type: string
          readOnly: true
          description: Debug-only diagnostic for the current `state`; supersedes the deprecated `statusReason`, not stable across releases and not for verbatim display.
        statusReason:
          type: string
          description: Human-readable diagnostic shown when `state=failed` or a recoverable warning is active. Debug-only; not a stable client-parseable code.
          readOnly: true
          deprecated: true
        stateReason:
          allOf:
            - $ref: '#/components/schemas/StateReason'
          readOnly: true
          description: Machine-readable cause of a `failed` state; the stable counterpart to the free-text `statusReason`.
        clusterId:
          type: string
          description: |
            UID of the cluster that provisioned this subnet. Present only on
            read-only, cluster-provisioned subnets (materialized by the
            cluster-create workflow from the ClusterType networkSchema); absent on
            tenant-writable subnets. When present, the subnet is immutable via the
            tenant API — `DELETE` returns `409`.
          readOnly: true
        schemaEntryId:
          type: string
          description: |
            Identifier of the `ClusterType.networkSchema` subnet entry this subnet
            materializes. Present only on cluster-provisioned subnets.
          readOnly: true
        systemTags:
          type: object
          additionalProperties:
            type: string
          description: Server-owned tags. Always present; `{}` when there are none.
          readOnly: true
        tags:
          type: object
          additionalProperties:
            type: string
          description: |
            User-defined metadata labels for this subnet. Always present; `{}` when
            none were set.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    SubnetCreateRequest:
      type: object
      description: |
        Request to create a tenant subnet within a network. The client supplies
        the `addressPool` to allocate from and the desired `prefixLength`; the
        platform allocates the `cidr` asynchronously, and — when `allocateGateway`
        is set and the pool is routable — resolves the `gateway`. The `cidr` is
        server-allocated and must not be supplied.
      additionalProperties: false
      required:
        - addressPool
        - prefixLength
      properties:
        id:
          type: string
          description: Name of the resource. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. If not specified, the server will generate a name.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: sn-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Optional human-friendly display name for the subnet.
        description:
          type: string
          description: An optional description of this resource.
        addressPool:
          type: string
          format: uri-reference
          description: |
            URI of the regional AddressPool to allocate the CIDR from. Must
            resolve in the network's region.
          example: /v1/regions/us-texas-1/networking/address-pools/pool-mgmt-v4
        prefixLength:
          type: integer
          minimum: 1
          maximum: 32
          description: |
            Desired allocation prefix length. Must lie within the referenced
            AddressPool's `[minPrefixLength, maxPrefixLength]`. `/31` is the
            2-host point-to-point case (RFC 3021) and `/32` the single-host
            case (e.g. a control-plane VIP subnet); a `/0` is not an
            allocatable subnet, hence the `/1` floor.
          example: 24
        allocateGateway:
          type: boolean
          description: |
            When `true` and the parent AddressPool is routable, the
            materialized subnet's `gateway` is auto-populated with the last
            usable host address of the allocated CIDR.
        excludeRanges:
          type: array
          description: |
            IPs or ranges inside the allocated CIDR to exclude from host
            allocation. Supported forms: single IP (`10.0.0.4`), CIDR
            (`10.0.0.0/29`), or hyphen-delimited range (`10.0.0.10-10.0.0.20`).
          items:
            type: string
            example: 10.0.0.10-10.0.0.20
        tags:
          type: object
          additionalProperties:
            type: string
          description: User-defined metadata labels for this subnet.
    SubnetPage:
      type: object
      required:
        - subnets
      properties:
        subnets:
          type: array
          items:
            $ref: '#/components/schemas/Subnet'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total subnets in THIS network, so `ceil(totalCount / limit)` is the page count for this network alone. It is scoped to the `networkId` in the path, not to the project — a project's other networks are not counted here.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    TenantQuotaView:
      type: object
      description: 'Quota view for an organization or a project: one row per quota dimension that some scope limits, or that is enforced and has recorded usage (a dimension limited nowhere and not enforced has no row), combining the limits held at every applicable scope with the usage recorded by the quota enforcement engine. `scopes` lists those scopes, broadest first: the organization (`tenant`) always, then the project on the project view when the project holds limits of its own (a project without one is bounded by its organization alone). `headroom` and `bindingScope` say how much more fits and which scope is binding. A dimension the admission check does not refuse on (nothing charges it, or its enforcement is switched off) reports enforced false and omits used and headroom at every scope: its limits are recorded but nothing refuses past them. profile names the quota profile that set every limit at the view''s own target, and is absent when that target has no limits or no single profile set them all; each scope''s profileId says where its limit came from.'
      required:
        - dimensions
      properties:
        profile:
          type: object
          description: Reference to the quota profile that set every limit at the view's own target (the organization on getTenantQuota, the project on getProjectQuota). Absent when that target holds no limits, when any of its limits was set directly or by more than one profile, or when the profile has since been deleted. Identity fields only; the profile's full spec is operator-facing.
          required:
            - id
            - displayName
          properties:
            id:
              type: string
              description: Identifier of the quota profile the limits were copied from.
              example: qp-a1b2c3d4
            displayName:
              type: string
              description: Human-readable profile name for UI labeling.
              example: Standard
        dimensions:
          type: array
          description: Per-dimension quota rows, sorted by dimension name.
          items:
            type: object
            required:
              - dimension
              - unit
              - enforced
              - scopes
              - overLimit
            properties:
              dimension:
                type: string
                description: Quota dimension key (e.g. node_count, cpu_cores).
                example: node_count
              unit:
                type: string
                description: Unit of every limit, used and headroom figure in this row. listQuotaDimensions publishes the full set.
                example: nodes
              enforced:
                type: boolean
                description: Whether the admission check refuses past the dimension's limits, which holds when the platform charges it (so the engine's record for it is real) and an operator has switched its enforcement on. When false the limits (if any) are recorded but not enforced, and used and headroom are omitted.
                example: true
              scopes:
                type: array
                description: The scopes that apply to the target, broadest first.
                items:
                  $ref: '#/components/schemas/QuotaViewScope'
              headroom:
                type: integer
                format: int64
                minimum: 0
                description: The smallest headroom across the scopes that cap the dimension (how much more fits). Absent when no scope caps it or the dimension is not enforced.
                example: 3
              bindingScope:
                type: string
                enum:
                  - tenant
                  - project
                description: The scope `headroom` came from. On a tie the narrower scope binds, as the admission check decides. Absent exactly when headroom is absent.
                example: tenant
              overLimit:
                type: boolean
                description: True when usage exceeds at least one scope's limit (see scopes[].overLimit).
                example: false
              limit:
                type: integer
                format: int64
                deprecated: true
                description: '**Deprecated:** use `scopes`. The organization (`tenant`) scope''s limit, kept for one release. Absent when the organization holds no limit for this dimension.'
                example: 100
              used:
                type: integer
                format: int64
                minimum: 0
                deprecated: true
                description: '**Deprecated:** use `scopes`. Usage recorded at the organization (`tenant`) scope, kept for one release. Present only when enforced is true.'
                example: 42
              remaining:
                type: integer
                format: int64
                minimum: 0
                deprecated: true
                description: '**Deprecated:** use `headroom` or `scopes[].headroom`. The organization (`tenant`) scope''s headroom, kept for one release. On the project view it does not account for the project''s own limit.'
                example: 58
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: |
            Self-contained JWT access token. Contains claims for
            sub, iss, aud, exp, iat, jti, tenant_id, scope,
            scope_id, roles, and principal_type.
        token_type:
          type: string
          enum:
            - Bearer
          description: Token type. Always "Bearer".
        expires_in:
          type: integer
          description: Token lifetime in seconds.
          example: 900
        refresh_token:
          type: string
          description: |
            Refresh token for obtaining new access tokens without
            re-authentication. Returned (rotated) on the `refresh_token` grant;
            not issued for `api_key` or `client_credentials`. For a
            browser/cookie-sourced refresh the rotated token is delivered via the
            k0r_refresh_token Set-Cookie header and omitted from this body;
            body-sourced (non-browser) callers receive it here.
    UpgradeClusterRequest:
      type: object
      description: |
        Request to rebind a cluster to the immediate next version of its bound
        ClusterType (the same ClusterType — switching to a different one is not
        supported). Upgrade only ever advances one version at a time — never a
        multi-version jump. `clusterTypeVersionId` is optional; omitted resolves
        to the cluster's own next AVAILABLE version, skipping over any draft or
        deprecated version in between (NOT simply the next version number, and
        NOT the ClusterType's latest `available` version). Rejected with `404`
        when the target version does not belong to the cluster's bound
        ClusterType; with `422` when the target is not `available`, has no `k8s`
        configuration (BMaaS-only), is not strictly newer than the cluster's
        current version (upgrade is forward-only), is more than one available
        version ahead of the cluster's current version, or — when omitted — the
        cluster is already bound to its head's highest available version (no next
        version to resolve to); and with `409` when the cluster is not in an
        upgradable state.
      additionalProperties: false
      properties:
        clusterTypeVersionId:
          type: string
          format: uuid
          description: |
            Target ClusterType version id — must be the cluster's immediate next
            version. Omit to resolve to that next version automatically.
    VPC:
      type: object
      description: |
        VPC resource — a project-scoped, isolated networking domain. VPCs today are created by the cluster-create or instance-group-create workflow from the bound `ClusterType.networkSchema.vpcs[]`; `ownerKind` + `ownerId` identify the resource that owns the VPC. Create, topology update and delete stay materialization-owned — there is no tenant create/PATCH/DELETE for a VPC — but the security-group binding is tenant-writable via `POST .../networking/vpcs/{id}`. Networks belonging to this VPC reference it via the fabric backend and are surfaced under `GET /networking/networks`.
      required:
        - id
        - uid
        - selfLink
        - region
        - projectId
        - state
        - securityGroups
        - systemTags
        - createdAt
        - updatedAt
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/networking/vpcs/vpc-0h2wq6dt5m8pjzk3xn4vbr7fcy
        uid:
          type: string
          format: uuid
          description: Server-generated unique identifier.
          readOnly: true
          example: ad9e7bf7-973b-4063-a309-8f2da3d56046
        id:
          type: string
          description: Resource name. Pattern `[a-z]([-a-z0-9]*[a-z0-9])?`, 1-63 chars.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: vpc-0h2wq6dt5m8pjzk3xn4vbr7fcy
        displayName:
          type: string
          description: Human-friendly display name.
          example: fabric-nico
        region:
          type: string
          description: Region the VPC belongs to.
          readOnly: true
          example: us-texas-1
        projectId:
          type: string
          description: Project the VPC belongs to.
          readOnly: true
          example: proj-a1b2c3d4
        schemaEntryId:
          type: string
          description: Id of the `networkSchema.vpcs[]` entry the VPC was materialized from.
          readOnly: true
          example: vpc-nico
        backend:
          type: string
          description: Fabric backend serving the VPC (mirrors `networkSchema.vpcs[].backend`).
          readOnly: true
          example: nico
        ufoCrName:
          type: string
          description: Derived UFO Vpc CR name the workflow applied. Surfaced so operators can correlate this row with the `networks.vpc` string on the cluster-materialized Network rows attached to this VPC.
          readOnly: true
          example: vpc-761fd6c2-vpc-nico
        ownerKind:
          type: string
          description: Kind of resource that owns the VPC.
          readOnly: true
          enum:
            - cluster
            - instance_group
        ownerId:
          type: string
          format: uuid
          description: Unique identifier of the owning resource.
          readOnly: true
          example: 761fd6c2-be41-419e-a3f7-8ff8c11a7495
        state:
          type: string
          description: |
            Observed lifecycle state. `active` is the settled, enforced state.
            `updating` means a security-group binding change has been accepted and is
            being rendered onto the owner's NetworkBundles — the binding in
            `securityGroups` is what the API will converge on, not necessarily what the
            fabric enforces yet. `failed` means the render did not land; see
            `stateMessage`. `creating` and `deleting` belong to the VPC's own
            materialization and teardown.
          readOnly: true
          enum:
            - creating
            - active
            - updating
            - deleting
            - failed
        stateMessage:
          type: string
          description: |
            Human-readable detail accompanying `state: failed` — why the last
            security-group render did not land. Cleared when a change settles cleanly.
            Diagnostic only: not a stable, client-parseable code. Absent when there is
            no detail.
          readOnly: true
        securityGroups:
          type: array
          description: |
            Ids of the security groups attached to this VPC, in the order they were
            last set by `POST .../networking/vpcs/{id}`. Always present.

            A new VPC starts with its DEFAULT group attached (`ownerKind: vpc` on the
            group), which permits traffic between the VPC's own subnet prefixes and
            permits all egress. That is what makes intra-VPC communication work and
            inter-VPC communication not work without any tenant action.

            The default group can be REPLACED like any other entry: attach your own
            group and the default drops out of the binding. What cannot happen is a VPC
            with NO group — sending an empty list reinstates the default rather than
            clearing the binding, and the default then appears here explicitly. The
            group itself survives being replaced, is not deletable, and is not
            modifiable: its rules are platform-managed, so `PATCH` on it is refused.

            These groups are rendered onto the NetworkBundles of the cluster or
            instance group that owns this VPC, AFTER that owner's own groups — so an
            interface inside this VPC filters on the owner's groups first, then these.
            Changing the binding re-applies the owner's bundles, which is why the
            owner briefly goes transitional after a write here.

            A group attached to BOTH this VPC and its owner is rendered once, at the
            owner's position. The duplicate is dropped rather than repeated, so the
            rendered attachment reports the filter set honestly and the group keeps the
            precedence its owner binding gives it.

            Only a VPC on the `nico` fabric backend can carry security groups — it is
            the one backend with a security-group construct behind it. On any other
            backend this list is always empty and attaching is refused with `409`,
            rather than recording a binding the fabric would never apply.

            Order is significant and round-trips what was written: this list reaches the
            fabric as sent, after the owner's own groups. (Rule order *within* a
            security group is significant too — see `SecurityGroupRules`.)
          items:
            type: string
            pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          example:
            - sg-a1b2c3
            - sg-d4e5f6
        systemTags:
          type: object
          description: Server-owned tags. Always present; `{}` when there are none.
          additionalProperties:
            type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 creation timestamp.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 last-modification timestamp.
          readOnly: true
    VPCPage:
      type: object
      required:
        - vpcs
      properties:
        vpcs:
          type: array
          items:
            $ref: '#/components/schemas/VPC'
        totalCount:
          type: integer
          format: int64
          description: |-
            Total VPCs in the project matching the active owner filters (`clusterId`, `instanceGroupId`, `owner`, `ownerKind`, `ownerId`), so `ceil(totalCount / limit)` is the page count for the current filter.

            Present only on the `offset`/`limit` path, and omitted when the caller passes `includeTotal=false`. Absent on the deprecated `pageToken` path.
        offset:
          $ref: '#/components/schemas/PageOffset'
        limit:
          $ref: '#/components/schemas/PageLimit'
        nextPageToken:
          type: string
          deprecated: true
          description: |-
            **Deprecated:** use `offset`, `limit`, and `totalCount`.

            Opaque cursor for the next page. Echo it as `pageToken` to fetch the following page. The key is ABSENT when this is the last page — the server omits it rather than returning an empty string — so a consumer must treat a missing `nextPageToken` as "no more results", not as an error or an unset field.

            Emitted only on the deprecated `pageToken` path; absent when the request used `offset`/`limit`.
    VPCPeering:
      type: object
      description: |
        One SIDE of a VPC peering, created under the VPC it belongs to.
        A peering is symmetric but is declared independently by each side: the project owning `localVpc` creates this resource, and the project owning `remoteVpc` creates its own mirrored peering pointing back. Traffic flows only once BOTH sides exist — until then the peering is half-open, which is a normal state and not an error.
        Consequently `state: active` means this side's declaration is in place, NOT that traffic flows. This API surfaces only the peerings your project created; a counterpart's peering naming one of your VPCs as its remote is that project's own resource and is not listed here, so whether the far side has been declared must be confirmed out of band.
        A peering is also removed WITHOUT an explicit delete when the cluster or instance group owning its `localVpc` is deleted — that VPC ceases to exist, so its peerings go with it. Note this covers only the local side: if the REMOTE VPC's owner is deleted, this peering survives, still listed and still `active`, now naming a VPC that is gone, and no longer carrying traffic. It is yours to clear — the platform will not remove it on the strength of the other project's delete. Either delete it directly, or let the teardown of your own `localVpc`'s owner take it; it does not block that teardown.
        The two VPCs may live in different projects, and may be owned by a cluster or an instance group. They must be in the same region.
      properties:
        selfLink:
          type: string
          format: uri-reference
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/networking/vpcs/vpc-0h2wq6dt5m8pjzk3xn4vbr7fcy/peerings/vpcpeer-3n7kq5wx2m9pjzd8vb4hfcyt60
        uid:
          type: string
          format: uuid
          description: Server-generated unique identifier.
          readOnly: true
          example: 8f14e45f-ceea-467a-9e0a-1b2c3d4e5f60
        id:
          type: string
          description: Resource name. Pattern `[a-z]([-a-z0-9]*[a-z0-9])?`, 1-63 chars.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: vpcpeer-3n7kq5wx2m9pjzd8vb4hfcyt60
        displayName:
          type: string
          description: Human-friendly display name.
          example: interconnect to team-b
        description:
          type: string
          description: Free-form description.
        region:
          type: string
          description: Region the peering belongs to. Both VPCs are in this region.
          readOnly: true
          example: us-texas-1
        projectId:
          type: string
          description: Project that owns this side of the peering.
          readOnly: true
          example: proj-a1b2c3d4
        localVpc:
          type: string
          format: uri-reference
          description: URI of the VPC this peering was created under. Always in this resource's own project.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/networking/vpcs/vpc-0h2wq6dt5m8pjzk3xn4vbr7fcy
        remoteVpc:
          type: string
          format: uri-reference
          description: URI of the counterpart VPC. May be in a different project — the URI is project-scoped, so it identifies the owning project as well. The example shows a same-project peering; a cross-project one differs only in the project segment.
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/networking/vpcs/vpc-5r8kq2nxw7m3pjzd4vb6hfcyt0
        state:
          type: string
          description: |
            Observed lifecycle state of THIS side. `active` means this side's UFO
            declaration is applied — it does not imply the counterpart exists or that
            traffic flows.
          readOnly: true
          enum:
            - creating
            - active
            - deleting
            - failed
        stateMessage:
          type: string
          description: Debug-only diagnostic for the current `state`, not stable across releases and not for verbatim display. Generic by design, and absent when there is nothing to report. This resource carries no deprecated `statusReason` field — it starts on the successor.
          readOnly: true
        systemTags:
          type: object
          description: Server-owned tags.
          additionalProperties:
            type: string
          readOnly: true
        tags:
          type: object
          description: User-owned tags, settable at creation.
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 creation timestamp.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 last-modification timestamp.
          readOnly: true
    VPCPeeringCreateRequest:
      type: object
      description: |
        Request to declare THIS side of a VPC peering. The local VPC comes from the request path; only the counterpart is supplied.
        Creating this resource does not by itself establish connectivity: the project owning `remoteVpc` must independently create its own mirrored peering pointing back at your VPC. Until it does, the peering is half-open.
        Every server-owned field on `VPCPeering` — each one marked `readOnly` there — is rejected rather than ignored, as is any unknown key, under `additionalProperties: false`. A peering read from a `GET` therefore cannot be posted back unmodified: send only the properties listed below.
        Stated as a class rather than a list on purpose. Two earlier revisions enumerated the fields and both drifted — once when `statusReason` became `stateMessage`, once by omitting `region` and `projectId` — each time leaving a `400` unwarned on the exact round-trip this paragraph exists to warn about.
      additionalProperties: false
      required:
        - remoteVpc
      properties:
        id:
          type: string
          description: Optional resource name; generated when omitted. Pattern `[a-z]([-a-z0-9]*[a-z0-9])?`, 1-63 chars, unique within the project.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: peer-to-team-b
        displayName:
          type: string
          description: Human-friendly display name.
          example: interconnect to team-b
        description:
          type: string
          description: Free-form description.
        remoteVpc:
          type: string
          format: uri-reference
          description: |
            URI of the counterpart VPC:
            `/v1/regions/{region}/projects/{project}/networking/vpcs/{id}`.

            Must resolve to an existing, `active` VPC in the SAME region as the local
            VPC, and must not be the local VPC itself. The project segment may differ
            from your own — no permission on that project is required, because
            declaring this side is not by itself sufficient to establish the peering.

            The example shows a same-project peering; a cross-project one differs only
            in the project segment.
          example: /v1/regions/us-texas-1/projects/proj-a1b2c3d4/networking/vpcs/vpc-5r8kq2nxw7m3pjzd4vb6hfcyt0
        tags:
          type: object
          description: User-owned tags.
          additionalProperties:
            type: string
    VPCPeeringPage:
      type: object
      required:
        - peerings
      properties:
        peerings:
          type: array
          items:
            $ref: '#/components/schemas/VPCPeering'
        nextPageToken:
          type: string
    VPCSecurityGroupsRequest:
      type: object
      description: |
        Request to set the security groups attached to a VPC.

        **Replace, not merge.** The list sent becomes the VPC's whole binding: ids
        present are attached, ids previously attached and now absent are detached.
        Re-sending the same body converges on the same state, so a retry is safe.

        **A VPC always carries at least one group.** Sending `[]` does NOT leave the
        VPC unfiltered — it reinstates the VPC's platform-managed default group, and
        the response echoes that group like any other binding. So a tenant who clears
        their own groups can see what they are now filtered by, instead of reading an
        empty list and assuming nothing applies. A VPC with no default group to fall
        back to refuses `[]` with `409`.

        To move off the default, attach your own group: the default is replaced like
        any other entry. It survives being replaced and is still not deletable.

        `securityGroups` is required. Omitting the field is rejected with `422` rather
        than being read as "change nothing", so a misspelled or dropped field can
        never silently change a VPC's security posture.

        **The binding reaches the fabric through the VPC's owner, but the VPC
        reports the outcome.** These groups are rendered onto the NetworkBundles of
        the cluster or instance group that materialized the VPC. The POST returns
        `202` with this VPC in `updating`; poll THIS VPC's `state` (not the owner)
        until it settles `active`, or `failed` with `stateMessage` if the render did
        not land. The owner itself is not moved transitional by this call. See the
        `securityGroups` field on `VPC`.
      additionalProperties: false
      required:
        - securityGroups
      properties:
        securityGroups:
          type: array
          description: |
            Ids of the security groups to attach, replacing any current attachment.
            Every id must name a security group that exists in the same project;
            an unknown id fails the whole request with `422` and no partial binding
            is written. Duplicates are rejected rather than collapsed. Order is
            significant and round-trips: the list reaches the fabric as sent, after
            the groups of the cluster or instance group that owns this VPC, which
            therefore take precedence over these.

            This VPC's OWN default group may be named here, and doing so is how you
            keep the platform-managed floor while adding groups of your own: attaching
            only your own groups drops the default out of the binding. Sending `[]`
            reinstates the default on its own.

            Another VPC's default group is refused with `422`. Its rules are derived
            from that VPC's subnet prefixes, so on this VPC they would describe the
            wrong network's perimeter — and it is removed when its own VPC is, which
            would silently shrink this VPC's filter set. A default group is attachable
            only to the VPC that owns it.

            At most 16 groups, matching the limit on a cluster's and an instance
            group's binding. The two limits add up rather than compete: the rules
            filtering one network interface are those of every group on this VPC
            *plus* those of every group on the cluster or instance group that owns
            it. Sized together with the 256-rule per-group limit so that combined
            set stays within the fabric's own ceiling on rules per interface.
          maxItems: 16
          items:
            type: string
            description: Security group `id` (not `uid`).
            pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
            minLength: 1
            maxLength: 63
          example:
            - sg-a1b2c3
            - sg-d4e5f6
    WebhookDelivery:
      type: object
      required:
        - id
        - status
        - attempts
        - created_at
        - retry_scheduled
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - delivered
            - failed
          description: >-
            Delivery status of this webhook row. The underlying column is the shared `notifications.delivery_status` type, but the webhook delivery worker only ever writes these three: `queued` (awaiting an attempt), `delivered` (a 2xx), or `failed` (retrying or dead-lettered — use `retry_scheduled` to tell them apart). The other values of the shared type (sent, bounced, complained, suppressed, read) are email-only and never appear here.
        attempts:
          type: integer
          description: How many POST attempts have been made.
        response_code:
          type: integer
          description: HTTP status from the subscriber on the last attempt, when one was received.
        last_error:
          type: string
          description: Error from the last failed attempt, when any.
        created_at:
          type: string
          format: date-time
        settled_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the delivery reached a terminal state (delivered or dead-lettered).
        next_attempt_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the next retry is scheduled, when one is.
        retry_scheduled:
          type: boolean
          description: >-
            True when this is a failed delivery with a retry still pending (not yet settled). A failed delivery with `retry_scheduled: false` has been dead-lettered and needs the endpoint owner to act.
    WebhookDeliveryPage:
      type: object
      required:
        - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        next_cursor:
          type: string
          description: Present when more results exist; pass it back as `cursor`.
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        secret_version:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        rotated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When the signing secret was last rotated. Null if it never has been.
        previous_secret_expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When the current rotation overlap window closes, after which the previous signing secret stops being accepted. Reported only while the window is still open; null when no rotation is in progress, when the last rotation was an immediate cutover, or once the window has lapsed.
        last_success_at:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When this endpoint last accepted a delivery (2xx). Null if it never has. A health roll-up so an operator can scan the list without opening each endpoint's delivery history.
        consecutive_failures:
          type: integer
          description: >-
            Number of terminal (dead-lettered) delivery failures since `last_success_at` — a delivery still being retried is not counted. Zero for a healthy endpoint; a later success resets it.
        failing_since:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When the current run of failures began (the oldest terminal failure since the last success). Null when `consecutive_failures` is 0. Pair with it to tell a brief blip from an endpoint that has been down for days.
    WebhookSubscriptionPage:
      type: object
      required:
        - subscriptions
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
    WorkerDefaults:
      type: object
      description: |
        Defaults applied to every worker pool rendered from this ClusterType.
        Top-level fields mirror `K0sWorkerConfigTemplate.spec.template.spec.*`
        (the CABPK worker bootstrap shape, same shape as
        `K0sControlPlane.spec.k0sConfigSpec`) so they forward verbatim into
        the rendered worker CR. Per-pool overrides on `Cluster.nodePools[]`
        or `ClusterTypeNodePool` replace or merge with these defaults
        according to the controller's merge policy.

        Mode-agnostic — both HCP and standalone control planes attach
        workers via `K0sWorkerConfigTemplate`. Node-level k0s knobs
        expressed as CLI flags (`--taints=`, `--labels=`,
        `--disable-components=`, …) are carried in `args` rather than
        duplicated as structured fields, matching the upstream surface.

        Schema is open: unknown keys are accepted and passed through.
        Version-snapshotted: snapshotted onto each ClusterTypeVersion;
        updates create a new immutable version.
      properties:
        downloadURL:
          type: string
          description: |
            Full URL the controller will fetch the k0s worker binary from.
            Forwarded to
            `K0sWorkerConfigTemplate.spec.template.spec.downloadURL`. Leave
            empty for k0sproject upstream defaults. The control-plane
            counterpart is
            `controlPlaneBootstrapConfig.standalone.downloadURL`
            (standalone-only; HCP control planes use a container image
            instead).
          example: https://internal.mirror/k0s/v1.32.8+k0s.0/k0s-v1.32.8+k0s.0-amd64
        args:
          type: array
          description: |
            Default k0s worker CLI args. Forwarded to
            `K0sWorkerConfigTemplate.spec.template.spec.args` on every
            rendered template (merged with per-pool overrides). Use this
            for any worker-binary flag — including `--labels=<csv>` and
            `--taints=<csv>` (the contract intentionally does not split
            labels/taints into separate structured fields, to stay close
            to the upstream CLI surface; `labels` below remains for k8s
            `MachineDeployment` metadata, not for k0s `--labels`).
          items:
            type: string
          example:
            - --taints=gpu=true:NoSchedule
            - --labels=node-role.kubernetes.io/gpu-worker=true
        useSudo:
          type: boolean
          description: |
            Default for every worker pool: when `true`, the bootstrap
            user-data wraps each `preK0sCommands` / `postK0sCommands`
            entry with `sudo` before execution. Set `false` (or omit) for
            images that already run cloud-init steps as root.
            Chart-rendering knob, not a
            `K0sWorkerConfigTemplate.spec.template.spec` field.
          default: false
          example: false
        preK0sCommands:
          type: array
          description: |
            Default commands run before the worker k0s process starts.
            Forwarded to
            `K0sWorkerConfigTemplate.spec.template.spec.preK0sCommands`.
            Takes priority over the deprecated `preStartCommands` when
            both are set.
          items:
            type: string
        postK0sCommands:
          type: array
          description: |
            Default commands run after the worker k0s process starts.
            Forwarded to
            `K0sWorkerConfigTemplate.spec.template.spec.postK0sCommands`.
            Takes priority over the deprecated `postStartCommands` when
            both are set.
          items:
            type: string
        preStartCommands:
          type: array
          deprecated: true
          description: |
            Deprecated pre-v1beta2 alias for `preK0sCommands`. Kept for
            backward compatibility with ClusterTypes created before the
            k0smotron v1beta2 migration; ignored when `preK0sCommands` is
            also set. New ClusterTypes should use `preK0sCommands`.
          items:
            type: string
        postStartCommands:
          type: array
          deprecated: true
          description: |
            Deprecated pre-v1beta2 alias for `postK0sCommands`. Kept for
            backward compatibility with ClusterTypes created before the
            k0smotron v1beta2 migration; ignored when `postK0sCommands` is
            also set. New ClusterTypes should use `postK0sCommands`.
          items:
            type: string
        files:
          type: array
          description: |
            Default files written to every worker host during bootstrap.
            Forwarded to `K0sWorkerConfigTemplate.spec.template.spec.files`.
            Shape matches `MachineTypeFile.yaml`.
          items:
            $ref: '#/components/schemas/MachineTypeFile'
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Default Kubernetes labels applied to every worker pool's
            `MachineDeployment` **resource** metadata (forwarded to
            `MachineDeployment.metadata.labels`; merged with per-pool
            labels). These label the CAPI resource, not the workload
            nodes.

            Distinct from k0s node labels (`--labels=<csv>` on the worker
            binary), which become Kubernetes **node** labels visible to
            schedulers and selectors. Supply node labels via `args`
            (`--labels=...`); supply CAPI resource labels here. An
            assembly bug that conflates the two will silently land
            MachineDeployment labels on nodes (or vice versa) — keep them
            separate.
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with the current state of a resource.
        Common causes include attempting to create a resource with an
        identifier that already exists, or performing a state transition
        that is not permitted (e.g., re-enabling an expired API key,
        rotating a disabled key).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            duplicateId:
              summary: Resource ID already exists
              value:
                error:
                  code: 409
                  message: "A resource with id 'my-deploy-key' already exists."
            invalidStateTransition:
              summary: Invalid state transition
              value:
                error:
                  code: 409
                  message: "Cannot rotate a disabled API key. Re-enable it first."
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeout:
      description: |
        Gateway timeout. The server, while acting as a gateway, did not receive a
        timely response from an upstream dependency. Retries with backoff are
        appropriate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: |
        Request body exceeds the 1 MB per-handler cap enforced by
        `http.MaxBytesReader` inside the service's `readJSON` helper. The
        response carries the standard error envelope; no further body parsing
        occurs once the limit is hit.

        FIRST FAULT WINS. The cap raises only once a read crosses it, so a body
        that is oversized AND invalid in some other way may be reported as that
        other fault — a body opening with an unrecognised field, for instance,
        is refused for the field before enough of it has been read to trip the
        limit. Every such answer is still a 4xx naming the more specific
        problem; the cap exists to bound the work a request can cause, not to
        take precedence over faults found earlier. Do not treat the absence of
        a 413 as evidence that a body was within the limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProjectRegionMismatch:
      description: |
        The request conflicts with the current state of a resource.

        On every operation under `/v1/regions/{region}/projects/{project}`, this
        includes a project locked to a different region than the one in the URL:
        the error carries reason `PROJECT_REGION_MISMATCH`. A project's region is
        set once and is immutable thereafter, so retrying the same URL returns the
        same result; address the project's own region, which the project read
        returns. The message does not name that region.

        The check runs once the caller is authorized for the project, before the
        operation reads or changes anything, and needs the project's region from
        the platform. When that lookup fails, a `POST` returns 503 and a `GET`,
        `PATCH` or `DELETE` proceeds without the check. A project created before
        regions were required, and not yet assigned one, is not checked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            projectRegionMismatch:
              summary: Project is locked to another region
              value:
                error:
                  code: 409
                  message: "project \"my-project\" is not in region \"region2\""
                  reason: PROJECT_REGION_MISMATCH
    ServiceUnavailable:
      description: |
        Service unavailable. The server is temporarily unable to handle the
        request because a required dependency is not configured (e.g., an upstream
        dependency is not wired up) or cannot be reached. Distinct from 504
        Gateway Timeout, which signals a transient upstream stall.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        Too many requests. The caller exceeded a per-account rate limit enforced by
        the auth service: a fixed number of requests per window, counted
        per account rather than per client address.

        The limit is counted against the identifier in the request body — the email
        address for `login/initiate`, the `client_id` for a `client_credentials`
        grant, the API key for an `api_key` grant — so it constrains an attacker
        spreading attempts for one account across many addresses, which a per-address
        limit cannot see. A separate per-address limit is applied independently at the
        gateway and can also produce a `429` on these paths.

        This response deliberately carries no information about the identifier used.
        The limit is applied before any account lookup, so the status, body, and
        headers are identical whether or not the account, client, or key exists — a
        `429` is not a signal that an account is real.

        Retry after the interval given in the `Retry-After` header when one is
        present. Requests sent before then still count against the window, so
        retrying early delays recovery rather than hastening it. A client that finds
        no `Retry-After` should back off on its own schedule.
      headers:
        Retry-After:
          description: |
            Whole seconds until the caller's current window resets. Always at least
            `1`.

            Present on a per-account `429` from the API itself, and absent from a
            per-address `429` raised at the gateway — the gateway deliberately
            publishes neither a reset instant nor a remaining budget on these
            unauthenticated paths, since either lets a caller pace just under the
            threshold instead of tripping a `429`. Not marked required for that
            reason: both kinds of `429` are reachable on these operations, so a
            client must treat the header as optional.
          schema:
            type: integer
            minimum: 1
            example: 42
          example: 42
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: 429
              message: rate_limit_exceeded
              requestId: 4f8c1e02-9a3b-4d17-8f21-6c0b5a7e9d34
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Unprocessable entity (validation or invalid state)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
