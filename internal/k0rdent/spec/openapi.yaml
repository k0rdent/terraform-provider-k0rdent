      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: vpcId
        in: path
        required: true
        schema:
          type: string
        description: Unique VPC identifier
    get:
      operationId: listVPCPeerings
      summary: List VPC peerings
      description: |
        **Visibility:** `internal` · `public` (x-visibility)


        List the peerings your project created under this VPC.
        A counterpart project's peering that names this VPC as its `remoteVpc` is that project's own resource and is NOT returned here, so this list does not show whether a peering has been reciprocated.
      tags:
        - vpc-peerings
      x-visibility:
        - internal
        - public
      parameters:
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of VPC peerings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPCPeeringPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectRegionMismatch'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createVPCPeering
      summary: Create VPC peering
      description: |
        **Visibility:** `internal` · `public` (x-visibility)


        Declare THIS side of a peering between the VPC in the path and the VPC named by `remoteVpc`. The peering starts in `state: creating` and converges to `active` once the declaration is applied to the fabric.
        A 201 means your side is declared, not that traffic flows. The project owning `remoteVpc` must independently create its own mirrored peering pointing back; until both sides exist the peering is half-open, which is a normal state and is not reported as an error.
        Both VPCs must be `active` and in the same region.
      tags:
        - vpc-peerings
      x-visibility:
        - internal
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VPCPeeringCreateRequest'
      responses:
        '201':
          description: VPC peering declared (this side)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPCPeering'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The VPC named in the path does not exist in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Conflict. `details[].reason` is `CONFLICT_IN_USE` when this VPC is
            already peered to the same remote VPC in this direction — note the
            reverse direction is a DISTINCT peering and does not conflict — or when
            a peering with the same `id` already exists in the project, or when a
            VPC you can already read is not settled `active`: the local VPC, or a
            `remoteVpc` in your OWN project.

            Two callers declaring the SAME direction at the same moment are resolved
            by waiting, never by a retryable `503`: the loser blocks until the
            winner's transaction ends and is then given that transaction's durable
            outcome. If the winner committed, that outcome is the `409` described
            above — the direction is taken, and re-sending cannot change it. If the
            winner rolled back, the direction was never taken and the loser's create
            succeeds with `201`. Which one it is cannot be known before the winner
            ends, which is why the wait is not cut short and reported as contention.

            A `remoteVpc` in ANOTHER project is never REJECTED here. Every rejection
            there collapses into the `422` below, inactive included, so that one
            project cannot probe another's lifecycle state — see that response for
            why. So a client that branches on `409` to detect an inactive remote
            will never see that branch taken across a project boundary: the case it
            is testing for arrives as `422` instead.

            The duplicate-direction conflict above is the one arm a cross-project
            `remoteVpc` does reach, because the direction cannot be known without
            resolving the counterpart. It follows that re-sending a request that
            already succeeded distinguishes a live counterpart VPC from a deleted or
            inactive one — the same thing a first successful `201` reveals, and the
            same accepted consequence of requiring no permission on the counterpart's
            project. A duplicate `id` does NOT reach it: that collision is in your
            own project and is answered before `remoteVpc` is looked at, so it cannot
            be used to probe ids you do not already peer with.

            Only a CROSS-project `remoteVpc` is ordered after it, though. Everything
            decidable without reaching across a boundary is answered first and keeps
            its own reason, even when the `id` is taken as well: the VPC in the path
            (`404` if absent), a `remoteVpc` naming that same VPC (`422`, a VPC
            cannot peer with itself), and a `remoteVpc` in your OWN project (`422`
            absent, `409` not settled `active`). A duplicate `id` never masks any of
            those.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Unprocessable. `remoteVpc` is not a well-formed VPC URI, is in a
            different region, is the local VPC itself (a VPC cannot peer with
            itself), or names a VPC that cannot be used as an endpoint.

            The first three name their reason: each is a property of the string the
            caller sent, and reporting it back leaks nothing.

            The last depends on WHOSE project `remoteVpc` names. When it is your own
            project, the reason is specific — the VPC is absent (`422`) or not
            settled `active` (`409`) — because you can already read all of that on
            your own routes.

            When it names ANOTHER project, every rejection collapses into one
            message: "does not exist" and "exists but is not `active`" become
            indistinguishable. That resolve crosses a boundary you hold no rights
            on, so telling them apart would let one project probe another's VPC ids
            and lifecycle state. Do not write a client that branches on which of the
            two happened across projects — it cannot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            The create lost a race for the VPC in the path, because that VPC is
            being modified concurrently — most often its owning cluster or instance
            group is being deleted. Usually that is the bounded wait on the VPC
            expiring; a serialization failure or a deadlock is reported here too,
            since all three mean another writer had the row first rather than that
            anything is broken. Do not read this status as "the wait timed out"
            specifically — the operator-side log carries the SQLSTATE, the response
            deliberately does not.

            NOTHING was written: no peering was created, so unlike the `504` below
            this is safe to retry as-is. Expect the retry to return the durable
            answer rather than a second `503`: if the VPC's owner really was being
            deleted, that answer is `404`.

            The body is deliberately generic — 5xx messages do not describe server
            state — so retry on the status, not on the message. A short backoff is
            enough: the wait this bounds is a single transaction, not an outage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: |
            The peering row was committed but its create workflow could not be
            dispatched. The peering exists in `creating` and the reconciler settles
            it from its deadline; poll rather than retrying the POST, which would
            conflict on the same direction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
