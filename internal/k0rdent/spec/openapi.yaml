      summary: Set VPC security groups
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        **Visibility:** `internal` · `public` (x-visibility)


        Set (replace) the security groups attached to this VPC.

        `POST` on the item URL rather than `PATCH` because this is a
        set-the-binding action with replace semantics, not a partial merge of VPC
        fields: the body carries exactly one field and the list sent becomes the
        entire binding. An empty list reinstates the VPC's platform-managed default
        group rather than clearing the binding — a VPC always carries at least one
        group — and the response echoes that group explicitly.

        `202` with the VPC in `updating`, not `200`: the binding is written and
        echoed in the body, but it is not yet enforced. The groups are rendered onto
        the NetworkBundles of the cluster or instance group that owns this VPC under
        a workflow. Poll THIS VPC's `state` — `active` once the render landed, or
        `failed` with `stateMessage` if it did not. The owner is not moved
        transitional by this call; a lost callback is settled by the reconciler.

        Only a VPC on the `nico` fabric backend accepts security groups; on any
        other backend this returns `409`.

        Create, update and delete of a VPC remain materialization-owned. This POST
        is the only tenant-writable VPC operation: it changes the security-group
        binding, not the VPC's identity or topology.
      tags:
        - vpcs
      x-visibility:
        - internal
        - public
      x-status: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VPCSecurityGroupsRequest'
      responses:
        '202':
          description: |
            Accepted. The binding is committed and echoed in `securityGroups`, but
            it is NOT yet enforced: the groups are rendered onto the NetworkBundles
            of the cluster or instance group that owns this VPC, which happens under
            a workflow.

            The VPC returns with `state: updating`. Poll it to learn the outcome —
            `active` once the render landed, or `failed` with `stateMessage` if it
            did not. A VPC left `updating` by a lost callback or a dead workflow is
            settled by the reconciler, so the state always reaches a terminal value.
            A second binding change while this VPC is still `updating` is refused
            with `409` rather than queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPC'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflict, with a distinct `details[].reason` per cause:

            - `CONFLICT_IMMUTABLE` — the VPC is on a fabric backend other than
              `nico`. Only that backend has a security-group construct, so a
              binding here would be recorded and never enforced; it is refused
              rather than accepted as a posture the fabric cannot deliver.
            - `CONFLICT_IN_USE` — one of:
              - the VPC is being deleted, so it cannot accept a new binding;
              - it already has a binding change in flight (`state: updating`) — a
                second change is refused rather than layered on a render that is
                running, so wait for the VPC to settle and retry;
              - `[]` was sent but the VPC has no platform-managed default group to
                fall back to, so clearing tenant groups would leave it unfiltered;
              - the VPC was modified concurrently, or a security group in the
                request began deleting between resolve and write — re-read and retry.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Semantic validation failure, with `details[].reason:
            INVALID_ARGUMENT`. For example: `securityGroups` omitted, an id that
            does not name a security group in this project (every unknown id is
            named in the message), a duplicate id, a malformed id, or more than
            16 entries. No partial binding is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
