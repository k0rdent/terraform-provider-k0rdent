            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveSecurityGroups'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No object of that `objectKind` with that `objectId` exists in the
            caller's project. An object belonging to another project is reported the
            same way, deliberately: confirming existence across a tenant boundary
            would leak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/ProjectRegionMismatch'
        '422':
          description: |
