  /v1/regions/{region}/projects/{project}/compute/instances:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
    get:
      operationId: listInstances
      summary: List instances
      description: |-
        **Visibility:** `internal` · `public` (x-visibility)

        List the project's instances — the provisioned hosts of its InstanceGroups
        and Clusters.

        Every instance has exactly one owner, an InstanceGroup or a Cluster, and
        publishes that owner's uid and id. Instances are materialized when their
        owner is created or scaled up, so there is no create operation: to add
        hosts, scale the owning InstanceGroup or Cluster node pool.

        A parent can be named by uid or by id (slug) — both are published on every
        instance. Filters combine with AND, so naming the same parent two ways that
        disagree returns nothing.

        Every row carries the host's current state — lifecycle status, health,
        inventory and current network configuration — read from the infrastructure
        service in one batched request while serving this call. `limit` (and the
        deprecated `pageSize`) is capped to the size of that batch, 200, so this is
        unconditional: there is no degraded page.

        Supply `offset` and `limit` to page by position and receive `totalCount`;
        the deprecated `pageToken`/`pageSize` cursor keeps working for existing
        clients, and a request carrying neither stays on it. Both styles walk the
        instances in the same order (by `uid`), and `totalCount` counts the
        instances matching every active filter. An offset is a position, so an
        instance materialized or deleted between two requests can make a row
        repeat or be skipped across pages. See `inStates` for how it behaves on
        the offset style.

        That read is a dependency, not an enrichment. When the infrastructure
        service cannot be reached the listing fails with `503` rather than returning
        rows that only look complete.
      tags:
        - instances
      x-visibility:
        - internal
        - public
      x-status: mvp
      parameters:
        - $ref: '#/components/parameters/Offset'
        - name: limit
          in: query
          required: false
          description: |-
            Maximum number of instances to return in one page, capped at 200 for this operation because every instance in a page is read from the infrastructure service in a single batched request. Values outside the accepted range are rejected with 422 rather than clamped, so the page size applied is always the page size requested.

            The offset style (`offset`, `limit`, `includeTotal`) and the deprecated cursor style (`pageToken`, `pageSize`) are mutually exclusive. Supplying any parameter from both styles in one request is rejected with 422.
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/PageToken'
        - name: pageSize
          in: query
          required: false
          deprecated: true
          description: |-
            **Deprecated.** Page sizing is being replaced by `limit`.

            Maximum number of results per page, capped at 200 for this operation because every instance in a page is read from the infrastructure service in a single batched request. `0` applies the default page size.

            These bounds are ENFORCED, not clamped: a value above the maximum, a negative one, or one that is not an integer is rejected with `422`. Clamping would answer with a page the caller did not ask for and no way to tell.
          schema:
            type: integer
            default: 50
            minimum: 0
            maximum: 200
        - name: instanceGroupUuid
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Return only instances belonging to this InstanceGroup.
        - name: instanceGroupId
          in: query
          required: false
          schema:
            type: string
          description: |-
            Return only instances belonging to the InstanceGroup with this id (slug) —
            the same value each instance reports as `instanceGroupId`, so a listing can
            be narrowed without first looking the group's uid up. A slug naming no
            group is an empty page, not an error.

            An id is unique among LIVE groups only: a deleted group keeps its row but
            releases the id, so a later group may be created with the same one. With
            `showDeleted=true` this filter then spans every group that held it. A uid
            is never reused, so `instanceGroupUuid` always names exactly one.
        - name: clusterUuid
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Return only instances belonging to this Cluster.
        - name: clusterId
          in: query
          required: false
          schema:
            type: string
          description: |-
            Return only instances belonging to the Cluster with this id — the same
            value each instance reports as `clusterId` and the one
            `GET .../compute/clusters/{id}` takes. An id naming no cluster is an empty
            page, not an error. An instance has ONE owner, so combining this with
            `instanceGroupId` or `instanceGroupUuid` matches nothing.

            An id is unique among LIVE clusters only: a deleted cluster keeps its row
            but releases the id, so a later cluster may be created with the same one.
            With `showDeleted=true` this filter then spans every cluster that held it.
            A uid is never reused, so `clusterUuid` always names exactly one.
        - name: nodePoolUuid
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |-
            Return only instances belonging to this node pool. The pool reference is
            shared by both owners, so this needs no cluster/group variant.
        - name: nodePool
          in: query
          required: false
          schema:
            type: string
          description: |-
            Return only instances provisioned into a node pool with this id (slug).
            Pool slugs come from the ClusterType, so on its own this matches across
            every cluster and group of the project that has a pool by that name;
            combine it with `instanceGroupId` or `clusterId` for one owner's pool.
        - name: reservationUuid
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Return only instances held by this infrastructure reservation.
        - name: instanceId
          in: query
          required: false
          description: |-
            Return only the named instances. Repeat the parameter once per id (`instanceId=a&instanceId=b`), OR semantics, ANDed with the other filters.

            For a caller that already holds a set of ids — a group read with `includeInstanceRefs=true` hands it one per pool — and would otherwise issue one GET each. A malformed id is rejected with `422` rather than dropped: an ignored value would silently widen the request.

            Here an id is an ARGUMENT, so a malformed one is the caller's query to fix. In the item route's PATH the same string is a NAME and answers `404` instead. Both verdicts are deliberate — see the `id` parameter on `GET /compute/instances/{id}`.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              pattern: ^inst-[0-9a-f]{32}$
        - name: serverSlug
          in: query
          required: false
          description: >-
            Return only the instances occupying the named servers. Repeat the parameter once per slug, OR semantics, ANDed with the other filters. Same identifier and the same spelling as `serverSlug` on `GET /infrastructure/servers`.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: showDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |-
            Include deleted instances. Off by default, so an ordinary listing shows only what the project currently holds.

            A deleted instance carries `state: deleted`, a `deletedAt`, and the stored record — no host state is read for it, so the host-derived fields are present but empty. Two consequences worth planning for: `serverSlug` is NO LONGER UNIQUE in the page, because a host re-provisioned into the same pool produces a new instance each time and every generation is returned; and tombstones are never reaped, so a long-lived group can return far more history than live instances.
        - name: inStates
          in: query
          required: false
          description: |-
            Return only the instances in any of these states — the values `state` publishes, not the infrastructure service's host vocabulary. Repeat the parameter once per state (`inStates=degraded&inStates=unknown`), OR semantics, ANDed with the other filters. An unrecognized value is rejected with `422`; a silently empty `200` is indistinguishable from a project with none in that state.

            Answered by a query where that is exact: the requested state is expanded into the host states it is derived from and resolved against the infrastructure service, so the page is cut on rows that already match. Only `degraded` takes that path.

            Every other state is read and filtered instead, and is correspondingly slower on a large project. `running` and `not_provisioned` derive from a host's SETTLED state, and this API falls back to that settled state when the infrastructure service reports a transition it does not yet name — so a host mid-unknown-transition is `running` here while the infrastructure service would answer it under the transition. Narrowing on the query would drop exactly those instances. The result is the same either way; only the cost differs.

            **`inStates=deleted` turns `showDeleted` on for you.** Only a deleted instance is in that state, so asking for it IS asking for tombstones and there is nothing to infer wrongly. Mixed sets behave as written: `inStates=deleted&inStates=running` returns both. Like `unknown`, it is resolved on this side rather than pushed down — a tombstone's server was released, so no host state identifies one.

            **`inStates=unknown` is slower for a different reason.** An instance is also `unknown` when its host cannot be attributed to it, which is a disagreement between the two services — invisible to the infrastructure service, and able to sit on a host reporting itself perfectly healthy. That cannot be resolved by a query, so a request including `unknown` reads pages and filters them.

            On the deprecated cursor style, a page may return FEWER rows than `pageSize` while `nextPageToken` is still set: the final verdict is applied after each page is read. A short page is not the end of the list — follow the token until it is absent.

            On the offset style, `offset` and `totalCount` are exact: the instances matching every other filter are read and judged first, and the page is cut from the ones that match. That read is bounded at 5000 instances: when more than that remain after every other filter (and after the state's own narrowing, where it applies), the request is rejected with `422` — narrow it with an owner, pool, reservation, `serverSlug` or `instanceId` filter. Deleted instances count toward the bound when they are included. Every page holds exactly `limit` items except the last.

            Because the total is exact, the offset style answers `503` rather than a short total when the infrastructure service's answer is incomplete — part of the host read failed, or the reservation read did — and `504` when judging the instances takes longer than the request allows (about 30 seconds); narrow the request the same way.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - not_provisioned
                - provisioning
                - running
                - degraded
                - stopping
                - stopped
                - deprovisioning
                - deleting
                - deleted
                - unknown
      responses:
        '200':
          description: List of instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstancePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ProjectRegionMismatch'
        '422':
          description: |-
            Validation failure — malformed `pageToken`, a uuid filter that is not a uuid, an `instanceId` that is not an `inst-` id, an `inStates` value this resource does not publish, a `showDeleted` that is not a boolean, a `pageSize` that is not an integer or is out of range, or a PRESENT BUT BLANK `pageSize`, `instanceId`, `serverSlug` or `inStates`. A bad filter is refused rather than dropped, because an ignored one silently widens the page — and a blank value is a caller whose variable interpolated empty, not a caller asking for everything. `details[].reason` is `INVALID_ARGUMENT`.

            Also returned for the offset parameters: an `offset` below `0` or above `2147483647`, a `limit` outside `1`-`200`, an `includeTotal` that is not `true` or `false`, any request mixing the offset style with the deprecated cursor style, or an offset-style `inStates` request that leaves more than 5000 instances to judge after its other filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/regions/{region}/projects/{project}/compute/instances/{id}:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^inst-[0-9a-f]{32}$
        description: |-
          The instance's server-generated id. The same identity the response publishes as `uid`, spelled as a slug.

          In the PATH an id is a NAME. One that cannot name a row of this project — malformed, never existed, or another project's — answers `404`, and the three are deliberately indistinguishable, because telling them apart would disclose instances the caller may not see. A deprovisioned instance answers `410` instead (`200` with `showDeleted=true`): that id did name a row, and ids are never reused.

          As a FILTER value on `GET /compute/instances` the same string is an ARGUMENT, not a name, and a malformed one is `422` there — a dropped filter value would silently widen the page. The two verdicts are deliberate; see `instanceId` on that operation.
    get:
      operationId: getInstance
      summary: Get instance details
      description: |-
        **Visibility:** `internal` · `public` (x-visibility)

        Retrieve one instance: its identity and API context — which owner and node
        pool it belongs to, and which host it is — plus that host's current state:
        lifecycle status, health, inventory and network configuration, all read
        from the infrastructure service while serving this request.

        The owner is an InstanceGroup or a Cluster, never both: the response carries
        `instanceGroupUuid`/`instanceGroupId` or `clusterUuid`/`clusterId`, and
        `nodePoolUuid`/`nodePool` either way.

        Nothing about the host is stored or cached here, so no field on this
        response is older than the request itself.

        That read is a dependency, not an enrichment: an Instance IS a host, so when
        the infrastructure service cannot be reached the request fails with `503`
        rather than returning a stored skeleton dressed as an instance.

        A host the infrastructure service does not know, or one held by a different
        reservation, is a property of THIS instance rather than an outage: the
        response is `200` with `state: unknown` and a `stateMessage` saying which.
        Unknown rather than degraded — the machine may be perfectly healthy, we
        simply cannot confirm it is this instance's, and `degraded` is reserved for
        a host that reported a problem of its own.
      tags:
        - instances
      x-visibility:
        - internal
        - public
      x-status: mvp
      parameters:
        - name: showDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Return the instance even if it has been deleted. Without it, a deleted instance answers `410`; with it, the same instance answers `200` carrying `state: deleted`, a `deletedAt`, and the stored record. No host state is read for it: the host-derived fields are present but empty, never populated. See `Instance.state`.
      responses:
        '200':
          description: Instance details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectRegionMismatch'
        '410':
          description: >-
            The instance existed and has been deleted. Distinct from `404`, which means no instance of this project has ever had that id — an id is never reused, so `410` is stable information rather than a transient state. Retry with `showDeleted=true` to read the tombstone itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`showDeleted` is not a boolean. Refused rather than read as false: silently defaulting would answer `410` for an instance the caller asked to see, which is indistinguishable from the tombstone not being readable. `details[].reason` is `INVALID_ARGUMENT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/regions/{region}/projects/{project}/compute/instances/{id}/{action}:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^inst-[0-9a-f]{32}$
        description: >-
          The instance's server-generated id, as `GET .../instances/{id}` takes it. An id that cannot name a row answers `404` rather than `422`, since to a caller that is indistinguishable from an instance already deprovisioned.
      - name: action
        in: path
        required: true
        description: Power action to perform on the server this instance currently occupies.
        schema:
          type: string
          enum:
            - powerOn
            - powerOff
            - powerCycle
            - gracefulShutdown
            - gracefulRestart
            - forceRestart
    post:
      operationId: executeInstancePowerAction
      summary: Execute an instance power action
      description: |-
        **Visibility:** `internal` · `public` (x-visibility)

        The tenant-facing sibling of infrastructure's operator-only
        `POST .../infrastructure/servers/{id}/{action}`: resolve this instance to
        the server it currently occupies and forward the same single-machine power
        dispatch — including its existing request-deduplication window — that
        endpoint already uses.

        Restricted to the six single-machine power verbs. `resetBmc` and
        `identify` remain operator-only and are not in this vocabulary, and
        neither is any rack/tray/NVLink-domain/site-scoped action — none exists as
        a tenant-reachable capability anywhere in this API.

        The occupied-server acknowledgement infrastructure's own action endpoint
        takes is not a field here: a tenant's instance is by construction its own
        occupied server, so this always forwards it satisfied.

        The dispatch is asynchronous — `202` means submitted, not settled — and a
        verification failure (the instance's recorded server cannot currently be
        confirmed as its own) rejects the request outright rather than acting on
        an unverified target.

        KNOWN GAP: `202` is the terminal, caller-visible outcome this endpoint
        ever reports for a SUCCEEDED action — there is no follow-up confirming the
        physical machine actually reached the requested state, since the underlying
        hardware controller exposes no power-state or task-status signal to poll.
        This is an accepted, deliberate interim deviation, not a silent omission,
        and will be revisited if a real settlement signal becomes available.

        A FAILED action is different: infrastructure does learn when the
        hardware controller refuses the request, is unreachable after retries,
        or the dispatch workflow itself fails, and relays it — see
        `lastPowerActionError` on the instance.

        A second power action against the same instance's server is rejected
        `409` if one was already accepted within a guard interval — see the `409`
        response below. The pre-existing
        short (60-second) request-deduplication window still runs underneath the
        guard interval, but only matters as the operative mechanism when the
        guard interval is configured off. With the guard interval enabled (the
        default), the guard interval — not the deduplication window — decides
        whether a second request is accepted or rejected.

        Every rejection this endpoint
        itself raises (`400`, `404`, `409`) carries a stable, machine-readable
        `details[0].reason` alongside its human-readable message; `401` and `403`
        come from the platform's authentication and authorization layer and use
        its generic envelope with no `details` entry. Where this endpoint
        forwards to infrastructure's own action endpoint, the reason is relayed
        as-is, so a tenant sees the same classification an operator calling that
        endpoint directly would; the message is this endpoint's own, never
        infrastructure's operator-facing text. See the `404` and `409` responses
        for the specific reasons.
      tags:
        - instances
      x-visibility:
        - internal
        - public
      x-status: mvp
      responses:
        '202':
          description: Action accepted. The dispatch is asynchronous; the response reflects the instance's state at submission, not settlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Either the instance itself does not exist, or infrastructure no longer knows the host this instance's recorded server names — `details[0].reason` = `POWER_TARGET_UNREACHABLE` (the "unreachable machine" class) for the latter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Either the instance's recorded server cannot currently be verified as its own (no valid target to act on — `reason` = `RESERVATION_DRIFTED`), or a power action was already accepted against that server within the guard interval — `reason` = `POWER_ACTION_IN_FLIGHT`, or (rarely) `POWER_TARGET_UNIDENTIFIED` if infrastructure does not yet know this server's hardware identity, or `POWER_ACTION_UNSUPPORTED` if the server has no power-control path at all (its infrastructure provider offers none) — permanent for that server, so retrying does not help. An in-flight conflict carries the estimated remaining wait in both `details[0].metadata.retryAfterSeconds` and the `Retry-After` header; retry after the interval elapses.
            Also returned, with top-level `reason` = `PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          headers:
            Retry-After:
              description: |
                Estimated whole seconds remaining in the guard interval. Present
                only on a `POWER_ACTION_IN_FLIGHT` conflict, relayed from
                infrastructure's own response; the same value as
                `details[0].metadata.retryAfterSeconds`. Absent for the other
                `409` causes (`RESERVATION_DRIFTED`, `POWER_TARGET_UNIDENTIFIED`,
                `POWER_ACTION_UNSUPPORTED`), which carry no deadline to publish.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/regions/{region}/projects/{project}/compute/instance-groups:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
    get:
      operationId: listInstanceGroups
      summary: List instance groups
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        List BMaaS instance groups in the project, ordered by `id`.

        Supply `offset` and `limit` to page by position and receive `totalCount`; the deprecated `pageToken`/`pageSize` cursor keeps working for existing clients, and a request carrying neither stays on it. Both styles walk the groups in the same `id` order, and `totalCount` counts the groups the `showDeleted` setting selects. An offset is a position, so a group created or deleted between two requests can make a row repeat or be skipped across pages.

        The embed budgets below bound ONE response, so they apply to each offset page exactly as they do to each cursor page; a smaller `limit` is the lever for both.
      tags:
        - instance-groups
      x-visibility:
        - internal
        - public
      x-status: mvp
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
        - name: showDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |-
            Include deleted instance groups. Off by default.

            A deleted group carries `state: deleted`, a `deletedAt`, and what this service stores: its pools with the size that was asked for, and the instances it held. **Both `includeInstanceRefs` and `includeInstances` are turned on automatically**, so asking for tombstones answers "what was in this group" rather than returning groups with nothing in them.

            Embedding the instances in full costs a deleted group nothing. That embed is normally the expensive one because it carries a live per-host read, and a deleted instance never makes one — it is served entirely from this service's own rows. The embedded objects are identical to what `GET /compute/instances?showDeleted=true` returns for the same rows: same `state: deleted`, same `deletedAt`, same `serverSlug`, same absent host block. Live groups in the same page still pay the ordinary embed cost.

            For the same reason, deleted instances do not count against the limit on how many instances one response may embed — that limit bounds the live read. They DO count against the refs limit, which bounds response size.

            An embed this flag turned on is OMITTED when the response would exceed its budget; it does not fail the read. Nothing reaps tombstones, so a group rebuilt often enough crosses the refs limit on its own, and refusing there would make `showDeleted` permanently unusable for that project with no parameter to drop — at `limit=1` (or `pageSize=1`) there is no smaller page to ask for. An embed you requested EXPLICITLY is still refused with `422`, because you named it. Either way the complete membership is available from `GET /compute/instances?instanceGroupId=&showDeleted=true`, which pages.

            What a deleted group does NOT carry is `readyCount`/`notReadyCount`: those are read from its reservation, which was released and may now be held by another project.

            Listing only. `GET .../instance-groups/{id}` cannot serve a deleted group: a group id is caller-suppliable and is free to be reused once the group is deleted, so several tombstones may share one and the id names no single row.
        - name: includeInstanceRefs
          in: query
          required: false
          description: |-
            Add `nodePools[].instanceRefs` — every instance each pool holds, as an id and the server it occupies.

            Cheap: one extra query against this service's own rows, with no call to the infrastructure service, so it neither slows the read nor disappears when that service is unreachable. Answered whole rather than paged. It says WHICH hosts a pool holds, not what each is doing — for that, use `includeInstances`.

            Refused with `422` when the response would carry more refs than it allows; narrow the request or use `GET /compute/instances?instanceGroupId=`.
          schema:
            type: boolean
            default: false
        - name: includeInstances
          in: query
          required: false
          description: |-
            Add `nodePools[].instances` — a page of each pool's instances in full, in the same envelope `GET /compute/instances` returns.

            Expensive: full instances carry live host state, so this makes the read depend on the infrastructure service. That dependency is BEST-EFFORT — if the live read cannot answer, the embed is absent and the rest of the response is unaffected. The group read never becomes a `503` over it.

            A page per pool, not the whole membership. Refused with `422` when the response would embed more instances than it allows; request fewer groups per page, or use `GET /compute/instances?instanceGroupId=`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of instance groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceGroupPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ProjectRegionMismatch'
        '422':
          description: |-
            Validation failure — a malformed `pageToken`, a `pageSize` that is not an integer, is out of range, or is present and blank, a boolean parameter (`showDeleted`, `includeInstanceRefs`, `includeInstances`) that is not a boolean (a blank value included: that is an interpolation which came out empty, not an absent parameter), or a response that would carry more embedded refs or instances than an embed YOU ASKED FOR allows. Narrow the request, or use `GET /compute/instances?instanceGroupId=`. An embed that only `showDeleted` turned on is omitted instead of refused — see that parameter. `details[].reason` is `INVALID_ARGUMENT`.

            Also returned for the offset parameters: an `offset` below `0` or above `2147483647`, a `limit` outside `1`-`500`, an `includeTotal` that is not `true` or `false`, or any request mixing the offset style with the deprecated cursor style.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createInstanceGroup
      summary: Create an instance group
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Create a BMaaS instance group from a `clusterType` and a size per node pool. Async: the group is persisted in `state: creating` and the materialization workflow is started; the group settles to `active` (or `failed`) once the service observes that workflow finish.
      tags:
        - instance-groups
      x-visibility:
        - internal
        - public
      x-status: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceGroupCreateRequest'
      responses:
        '201':
          description: 'Instance group creation initiated. The group is returned in `state: creating`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceGroup'
        '400':
          description: Bad request — malformed body, invalid `sshAccess`, a `sshPublicKeyCredentials` reference outside the request's region and project, or an inline `sshPublicKeys` entry the credentials service refuses (for example, one carrying `authorized_keys` options or a comment longer than 256 bytes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            Three deterministic conflicts, none of which creates an instance-group
            row (a duplicate `id` can still have taken a short-lived quota hold that
            is released asynchronously):

            - An instance group with the same `id` already exists in the project.
              `details[].reason` is `CONFLICT_DUPLICATE`.
            - `QUOTA_EXCEEDED`: the create would exceed a node-count
              quota limit at the organization or the project scope; the limits are
              independent gates and the request must fit at both. Instance groups
              consume the same servers as clusters and count against the same
              `node_count` dimension. `error.reason` is `QUOTA_EXCEEDED` and
              `error.details[]` carries one entry per refused dimension with
              `dimension`, `requested` (the sum of the requested pool sizes),
              `admissible` (the largest node count that would have been admitted),
              `bindingScope` (`tenant` or `project`) and `scopes` (every gating
              scope's `limit`, `used` and `headroom`) — see `Error`. Retrying
              without freeing capacity, asking for `admissible` or less, or raising
              the binding limit returns the same result.
            - `QUOTA_UNASSIGNED`: the organization holds no quota limits
              while the platform requires them (a default profile is
              designated), so the create is refused before any limit is measured.
              `error.reason` is `QUOTA_UNASSIGNED` with no `details[]`. Retrying
              returns the same result until an operator gives the organization
              limits, by applying a profile or setting them directly.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                quotaExceeded:
                  summary: Organization limit refuses the group's node count
                  value:
                    error:
                      code: 409
                      message: "conflict: instance group create would exceed the quota: node_count: requested 4, 1 admissible (tenant limit binding)"
                      requestId: 0f6b1a2c-3d4e-4f50-8a9b-1c2d3e4f5a6b
                      reason: QUOTA_EXCEEDED
                      details:
                        - reason: QUOTA_EXCEEDED
                          message: "node_count: requested 4, 1 admissible (tenant limit binding)"
                          metadata:
                            dimension: node_count
                            requested: 4
                            admissible: 1
                            bindingScope: tenant
                            scopes:
                              - scope: tenant
                                targetId: acme
                                limit: 5
                                used: 4
                                headroom: 1
        '413':
          # A valid sshAccess set (within maxItems/maxLength) can still render
          # cloud-init past the node cloud-config limit; rejected at create rather
          # than silently truncated during provisioning.
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: 'Validation failure (missing/empty `clusterType` or `nodePools`, an unknown node pool, a `size` outside the pool''s bounds, a deprecated ClusterType, etc.). `details[].reason` is `INVALID_ARGUMENT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
