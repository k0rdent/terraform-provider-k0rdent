openapi: 3.1.0
info:
  title: K0rdent AI API
  version: 1.3.0
  description: |
    OpenAPI specification for the K0rdent AI GPU-as-a-Service platform.
    **Custom Extensions:**
    - `x-visibility`: Documentation audience — `internal` (operator-facing only), `public` (customer-facing only), or `[internal, public]` (both). It records who an operation is documented for and does not gate access. Treat the value as a SET: both orderings of the two-value form occur, so compare membership rather than the literal string.
    - `x-internal`: Derived by the bundler, not authored. Emitted as `true` on exactly those operations whose `x-visibility` is `internal` and nothing else, because `x-visibility` is a k0rdent extension that no standard renderer understands while `x-internal` is the convention they filter on. An operation marked `[internal, public]` is public and is NOT flagged.
    - `x-status`: Implementation status — `mvp`, `tbd`, `blocked`, `stretch`.
    - `x-maturity`: Stability — `alpha`, `beta`, or `stable`; the document default is `alpha`. Resolved by nearest declaration down operation → schema → field, with parameters and response headers inheriting their operation, so an unannotated field under a `beta`/`stable` schema inherits that level unless it declares a lower one. A shared schema's own level is a promise about that schema; an operation that uses it can still be less mature. A deprecated (`deprecated: true`) `beta`/`stable` element also carries `x-deprecated-since`, `x-sunset`, and `x-deprecated-reason`.
    **Pagination:** Cursor-based using `pageToken` and `pageSize` query parameters.
    **Error Model:** Standard `{ error: { code, message, details[] } }` envelope.
servers:
  - url: https://api.k0rdent.ai
    description: K0rdent AI API Gateway
security:
  - bearerAuth: []
tags:
  - name: cluster-types
    description: ClusterType catalog template management
  - name: clusters
    description: Kubernetes cluster management
  - name: kubeconfigs
    description: Kubeconfig issuance and management
  - name: instances
    description: VM and baremetal instance lifecycle
  - name: networks
    description: Network configuration and topology
  - name: vpcs
    description: Project-scoped isolated networking domains
  - name: security-groups
    description: Project-scoped security groups — named, ordered sets of ingress/egress filter rules applied to compute instances
  - name: vpc-peerings
    description: Connectivity between two VPCs, declared independently by each side
  - name: address-pools
    description: Regional admin-owned IP prefix pools referenced by ClusterType.networkSchema.subnets[].addressPool
  - name: instance-groups
    description: BMaaS simple-mode instance groups — provision bare-metal hosts from a ClusterType, sized per node pool
  - name: organizations
    description: Organization (tenant) management
  - name: projects
    description: Project resource grouping
  - name: regions
    description: Platform deployment region discovery (read-only)
  - name: share-types
    description: File-store capability classes offered in a region — the tenant's only storage selector, named by capability rather than by vendor
  - name: file-stores
    description: Declarative shared-filesystem objects for bare-metal consumers — capacity plus the consumer list that grants and attaches access, reconciled by the platform
  - name: notifications
    description: Notifications & event platform — inbox, live stream, webhooks, preferences, event query
  - name: quota
    description: Tenant quota view — per-dimension limits, usage, and remaining headroom for the caller's organization
  - name: roles
    description: RBAC role definitions
  - name: token
    description: |
      Generate access token via multiple grant types (api_key, client_credentials, refresh_token).
  - name: serviceaccounts
    description: |
      Manage service accounts for machine-to-machine and infrastructure
      access. Service accounts are independent principals with their own
      identity, role bindings, and credentials. They survive user
      off-boarding and are managed exclusively by tenant administrators.
paths:
  /v1/regions/{region}/compute/cluster-types:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
    get:
      operationId: listClusterTypes
      summary: List ClusterTypes
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        List all ClusterTypes available in the region, newest first. Deprecated
        types are excluded unless `includeDeprecated=true`.

        Supply any of `offset`, `limit` or `includeTotal` to page by position and
        receive `totalCount`, which counts the ClusterTypes the same
        `includeDeprecated` setting lists. This is the only way to read past the
        first page. Without those parameters the list returns its first page only,
        sized by the deprecated `pageSize`; the deprecated `pageToken` has never
        been implemented here and is rejected with 400 on its own, or with 422
        alongside an offset-style parameter.
      tags:
        - cluster-types
      x-visibility:
        - internal
        - public
      parameters:
        - name: includeDeprecated
          in: query
          schema:
            type: boolean
            default: false
          description: Include deprecated ClusterTypes in the response.
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of ClusterTypes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTypePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/{region}/compute/cluster-types/{id}:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ClusterType slug (e.g. ct-0h2wq6dt5m8pjzk3xn4vbr7fcy).
    get:
      operationId: getClusterType
      summary: Get ClusterType
      description: |-
        **Visibility:** `internal` · `public` (x-visibility)

        Get a ClusterType by slug. Always resolves to the head's literal latest version, whatever its status (draft/available/deprecated) — the same version `POST .../versions` most recently created. This is distinct from Cluster/InstanceGroup creation's default (unpinned) resolution, which binds to the latest `available` version instead.
      tags:
        - cluster-types
      x-visibility:
        - internal
        - public
      responses:
        '200':
          description: ClusterType at its literal latest version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/{region}/compute/cluster-types/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ClusterType slug (e.g. ct-0h2wq6dt5m8pjzk3xn4vbr7fcy).
    get:
      operationId: listClusterTypeVersions
      summary: List ClusterType versions
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        List the version history of a ClusterType, ordered oldest-first. The
        optional `status` query parameter filters to one lifecycle status; an
        unrecognized value is rejected with `422` rather than returning an empty
        list.

        Supply any of `offset`, `limit` or `includeTotal` to page through the
        history and receive `totalCount`, which counts this ClusterType's versions matching the same
        `status`. A request with no paging parameter returns the whole history,
        as it always has. This list has no cursor style; `pageToken` and
        `pageSize` are ignored unless sent alongside an offset-style parameter,
        which is rejected with `422`.
      tags:
        - cluster-types
      x-visibility:
        - internal
        - public
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ClusterTypeVersionStatus'
          description: Filter to versions with this lifecycle status. Omit to return every version.
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
      responses:
        '200':
          description: List of version summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTypeVersionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/{region}/compute/cluster-types/{id}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ClusterType slug (e.g. ct-0h2wq6dt5m8pjzk3xn4vbr7fcy).
      - name: versionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID of the specific version to retrieve.
    get:
      operationId: getClusterTypeVersion
      summary: Get ClusterType version
      description: |-
        **Visibility:** `internal` · `public` (x-visibility)

        Get a specific immutable version snapshot of a ClusterType.
      tags:
        - cluster-types
      x-visibility:
        - internal
        - public
      responses:
        '200':
          description: Full ClusterType body at the requested historical version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/{region}/projects/{project}/compute/clusters:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
    get:
      operationId: listClusters
      summary: List Kubernetes clusters
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        "Cluster CRUD API: manage clusters";
        Retrieve list of all Kubernetes clusters in the project.

        Results are ordered newest-first, by creation time descending, with ties
        broken by the cluster `id`. Both are immutable, so the order is stable
        across pages and the same request returns the same sequence every time.
        The `state`, `health` and `search` filters narrow the result set without
        changing that order.

        `pageToken` is opaque: pass the `nextPageToken` from the previous response
        back verbatim, and do not construct, parse, or modify it. A token that is
        malformed, tampered with, or minted under a different ordering is rejected
        with 422 rather than being interpreted as some other position. Because the
        cursor carries values rather than a row reference, deleting the cluster a
        token points at does not invalidate it. A cluster created after a traversal
        started sorts above the positions already visited, so it never duplicates or
        displaces an existing row on a later page; it appears at the top of a fresh
        list instead. (Creation time is assigned when the create transaction begins,
        so a cluster whose creation commits after a page was served may not appear
        in that traversal at all — start a fresh list to see it.)

        Supply `offset` and `limit` to page by position and receive `totalCount`;
        the deprecated `pageToken`/`pageSize` cursor keeps working for existing
        clients, and a request carrying neither stays on it. Both styles walk the
        collection in the same newest-first order, and `totalCount` counts the
        clusters matching the active `state`, `health` and `search` filters. Unlike
        the cursor, an offset is a position: a cluster created or deleted between
        two requests shifts every later row by one, so a row can repeat or be
        skipped across pages.
      tags:
        - clusters
      x-visibility:
        - internal
        - public
      parameters:
        - name: includeInstanceRefs
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |-
            Embed each node pool's instances as `{id, serverSlug}` in
            `nodePools[].instanceRefs`. This service's own rows in one query, with no
            call to the infrastructure service.

            The limit is on the WHOLE response, not one cluster, so a listing of large
            clusters reaches it sooner than a single read does: over it is a `422`, and
            the lever is a smaller `limit` (or `pageSize`) — or
            `GET /compute/instances?clusterId=`, which pages over one cluster's hosts
            instead.
        - name: includeInstances
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |-
            Embed a page of each node pool's instances in full, in
            `nodePools[].instances`. Needs a live read of every host, so it is
            omitted for every pool when the infrastructure service cannot answer —
            a cluster read never fails over an enrichment.

            Each pool embeds one page; the limit is on the whole response, so it
            counts those pages across every cluster the listing returns. Over it is a
            `422`, and the lever is a smaller `limit` (or `pageSize`) — or
            `GET /compute/instances?clusterId=`, which pages over one cluster's hosts
            instead.
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeTotal'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          required: false
          description: >-
            Optional case-insensitive substring match against the cluster's id (slug) and displayName. Omitting it returns the unfiltered list. LIKE metacharacters (% _ \) are matched literally. Combines with `state` and `health` (logical AND) and never widens the caller's visible set.
          schema:
            type: string
            maxLength: 255
        - name: state
          in: query
          required: false
          description: |
            Filter by cluster lifecycle `state`. Combines with `health`
            using logical AND. `deleted` is intentionally not accepted: tombstoned
            clusters are excluded from live reads, so the filter would always match
            zero rows and is rejected with 422. An unknown value is also rejected
            with 422. Omitting it returns clusters in any live state.
          schema:
            type: string
            enum:
              - creating
              - updating
              - deleting
              - active
              - failed
        - name: health
          in: query
          required: false
          description: |
            Filter by canonical `health.state`. Combines with `state` using
            logical AND. Matches the read-time materialized health: a cluster whose
            health has gone stale, that has never been observed, or whose `state` is
            `creating` or `deleting` matches `health=unknown` (and not its last
            observed value). An unknown value is rejected with 422. Omitting it
            returns clusters of any health.
          schema:
            type: string
            enum:
              - healthy
              - degraded
              - unhealthy
              - unknown
      responses:
        '200':
          description: List of clusters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ProjectRegionMismatch'
        '422':
          description: |
            Validation failure: a `state` or `health` value outside its enum (or
            `state=deleted`), a `search` longer than 255 characters, a malformed
            `pageToken`, a boolean embed flag that is not a boolean, or a response
            that would exceed an embed's budget.


            Also returned for the offset parameters: an `offset` below `0` or above
            `2147483647`, a `limit` outside `1`-`500`, an `includeTotal` that is not
            `true` or `false`, or any request mixing the offset style with the
            deprecated cursor style.


            Only the offset-parameter failures and a malformed embed flag carry
            `details[].reason: INVALID_ARGUMENT`; the filter, `pageToken` and
            embed-budget failures carry an error message without `details`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createCluster
      summary: Create Kubernetes cluster
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        "Cluster CRUD API: manage clusters"; Create a new Kubernetes cluster. Async operation.
      tags:
        - clusters
      x-visibility:
        - internal
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateRequest'
      responses:
        '201':
          description: Cluster creation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          description: Bad request — malformed body, invalid `sshAccess`, or a `sshPublicKeyCredentials` reference outside the request's region and project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Resource not found: the ClusterType, an AddressPool its network schema
            references, or the project. A project is also found missing when the
            cluster's organization is looked up from it for placement (see 503).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Three deterministic state conflicts and one transient one, none of
            which writes anything:

            - `QUOTA_EXCEEDED`: the create would exceed a
              node-count or `storage_gib` quota limit at the organization or the project scope; the
              limits are independent gates and the request must fit at both.
              `error.reason` is `QUOTA_EXCEEDED` and `error.details[]` carries one
              entry per refused dimension with `dimension`, `requested`,
              `admissible` (the largest amount of that dimension that would have been admitted),
              `bindingScope` (`tenant` or `project`) and `scopes` (every gating
              scope's `limit`, `used` and `headroom`). Retrying without freeing
              capacity, asking for `admissible` or less, or raising the binding
              limit returns the same result.
            - `QUOTA_UNASSIGNED`: the organization holds no quota limits
              while the platform requires them (a default profile is
              designated), so the create is refused before any limit is measured.
              `error.reason` is `QUOTA_UNASSIGNED` with no `details[]`. Retrying
              returns the same result until an operator gives the organization
              limits, by applying a profile or setting them directly.
            - The target project is being deleted. No `reason`. Retrying
              can never succeed — a project leaves `deleting` only for a terminal
              state.
            - `CONFLICT_VERSION`: placing the hosted control plane of a cluster
              whose ClusterType references an HCPConfig lost, several times in a
              row, to concurrent changes of that HCPConfig or of the Control
              Platforms that could host it. Retry the create.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                quotaExceeded:
                  summary: Project limit binds before the organization's
                  value:
                    error:
                      code: 409
                      message: "conflict: cluster create would exceed the quota: node_count: requested 3, 2 admissible (project limit binding)"
                      requestId: 0f6b1a2c-3d4e-4f50-8a9b-1c2d3e4f5a6b
                      reason: QUOTA_EXCEEDED
                      details:
                        - reason: QUOTA_EXCEEDED
                          message: "node_count: requested 3, 2 admissible (project limit binding)"
                          metadata:
                            dimension: node_count
                            requested: 3
                            admissible: 2
                            bindingScope: project
                            scopes:
                              - scope: tenant
                                targetId: acme
                                limit: 5
                                used: 0
                                headroom: 5
                              - scope: project
                                targetId: web
                                limit: 2
                                used: 0
                                headroom: 2
        '413':
          # A valid sshAccess set (within maxItems/maxLength) can still render
          # cloud-init past the node cloud-config limit; rejected at create rather
          # than silently truncated during provisioning.
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: |
            Validation failed or invalid state, or the cluster's control plane
            cannot be placed.

            A cluster whose ClusterType references an HCPConfig is placed inside
            the create; when no host can take its control plane, the create is
            refused before anything is created, with top-level `reason:
            INSUFFICIENT_CAPACITY` and one `details[]` entry, also
            `INSUFFICIENT_CAPACITY`, with a generic message. Retry later. The
            hosted control plane does not count against quota.

            Operators holding `compute.controlplatforms.read` get one `details[]`
            entry per candidate Control Platform instead, naming it in `metadata`
            with its reason (`PlacementReason`), in Control Platform id order;
            with no candidate, a single `HCPCONFIG_NOT_ACCEPTED` entry naming none.
            A ClusterType without an HCPConfig is never refused this way.

            **Not yet applied:** a create that would be placed is refused with 422
            (no `reason`) and writes nothing: hosted control planes are not yet
            deployed on the Control Platform they are placed on. The refusals
            above are served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            A dependency is unavailable; retry later. This includes placement:
            when a candidate Control Platform restricts `allowedOrganizations` and
            the request does not carry the cluster's organization, it is looked up
            from the project, and a lookup that is not configured or cannot answer
            refuses the create.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/regions/{region}/projects/{project}/compute/clusters/{id}:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique cluster identifier
    get:
      operationId: getCluster
      summary: Get cluster details
      description: |
        **Visibility:** `internal` · `public` (x-visibility)


        Retrieve cluster details, health status, and endpoint information.
      tags:
        - clusters
      x-visibility:
        - internal
        - public
      parameters:
        - name: includeInstanceRefs
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |-
            Embed each node pool's instances as `{id, serverSlug}` in
            `nodePools[].instanceRefs`. This service's own rows in one query, with no
            call to the infrastructure service. Over the response limit is a `422`.
        - name: includeInstances
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |-
            Embed a page of each node pool's instances in full, in
            `nodePools[].instances`. Needs a live read of every host, so it is
            omitted for every pool when the infrastructure service cannot answer —
            a cluster read never fails over an enrichment. Over the response limit
            is a `422`.
        - name: includeStages
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include `operation.progress` and `operation.stages` for the cluster's current or last operation.
      responses:
        '200':
          description: Cluster details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectRegionMismatch'
        '422':
          description: 'Validation failure — the response would carry more embedded refs or instances than it allows, or `includeInstanceRefs` or `includeInstances` was present and not a boolean (a blank value included: that is an interpolation that came out empty, not an absent parameter). For the budget, narrow the request or use `GET /compute/instances?clusterId=`. `details[].reason` is `INVALID_ARGUMENT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateCluster
      summary: Update cluster configuration
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        "Cluster CRUD API"; Update cluster configuration: display name, description, tags, storage ceiling, or security groups. Node counts are not changed here; use `scaleCluster`, and a request carrying `nodePools` is refused with `422`.
      tags:
        - clusters
      x-visibility:
        - internal
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdateRequest'
      responses:
        '200':
          description: Cluster updated; a `storage.ceilingGiB` is applied to the running cluster asynchronously and retried until it lands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '202':
          description: |
            Accepted — returned when the body carried `securityGroups`. That binding
            is rendered onto every NetworkBundle the cluster owns, which the platform
            cannot do synchronously, so the cluster is returned in `UPDATING` and
            settles to `ACTIVE` on its own once the re-render completes. Poll
            `GET .../clusters/{id}` and wait for a settled `state`.

            A cluster's re-renders are serialized: one runs at a time, so a change
            arriving while another is still rendering waits for it rather than being
            refused. This includes a change to one of the cluster's VPCs
            (`POST .../networking/vpcs/{id}`), which re-renders the same bundles.
            `UPDATING` therefore covers "queued" as well as "rendering", and the time
            to settle can span both.

            Every other field on this PATCH is synchronous and returns `200`, while a
            request carrying `securityGroups` returns `202`. The two cannot be
            combined in one request — that is `422` — so each valid request takes
            exactly one of the `200` or `202` paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            An immutable field (`id`, `clusterType`) was present in the request
            body, or a concurrent writer modified the cluster between this PATCH's
            internal read and write. `details[].reason` is `CONFLICT_IMMUTABLE`
            or `CONFLICT_VERSION` respectively.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.

            - A `storage` raise on a cluster that is not `ACTIVE` answers this `409` without a reason; one whose quota accounting is still settling or whose ceiling changed concurrently answers the same and can be retried shortly.
            - `QUOTA_EXCEEDED` — a `storage.ceilingGiB` raise would exceed a `storage_gib` limit; `requested` and `admissible` are increases in GiB, see `Error`.
            - `QUOTA_UNASSIGNED` — a `storage.ceilingGiB` raise while the organization holds no quota limits and a default is designated; see `Error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed, including a `storage.ceilingGiB` outside 1..1048576 or below the current ceiling, `storage` combined with `securityGroups`, or a body that carries `nodePools` (alone or with other fields; nothing is applied). Node counts change only through `scaleCluster`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: 422
                  message: storage.ceilingGiB cannot be lowered from 1024 to 512
                  requestId: 0f6b1a2c-3d4e-4f50-8a9b-1c2d3e4f5a6b
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: A `storage` raise on a quota-accounted cluster could not be checked against the quota; nothing was changed, retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: 503
                  message: service unavailable
                  requestId: 0f6b1a2c-3d4e-4f50-8a9b-1c2d3e4f5a6b
    delete:
      operationId: deleteCluster
      summary: Delete Kubernetes cluster
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        "Cluster CRUD API"; Delete cluster and trigger cleanup of nodes and IP resources.
        Credentials distributed to the cluster are revoked before the delete starts; if revocation fails, nothing changes and the delete must be retried.
      tags:
        - clusters
      x-visibility:
        - internal
        - public
      responses:
        '204':
          description: Cluster deletion initiated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Cluster is not in a settled state (`active` or `failed`), so a delete
            cannot be started. The message names the blocking state, the state
            delete requires, and the remedy: a `creating` or `updating` cluster
            must be cancelled first (`POST .../clusters/{id}/cancel`), and a
            `deleting` cluster is already terminating.

            On the backing Cluster of a managed Control Platform (operator-only),
            also `details[].reason: CONFLICT_IN_USE` while any hosted control plane
            is placed on that Control Platform. Otherwise the delete also removes
            the Control Platform, so it also needs `compute.controlplatforms.delete`
            (403 otherwise). **Not yet applied:** the `CONFLICT_IN_USE` refusal and
            the permission check are declared ahead of their implementation; the
            Control Platform's removal is applied.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.

            Also returned when the cluster's credentials are being changed and cannot be revoked yet; the cluster is unchanged, so retry after `Retry-After`.
          headers:
            Retry-After:
              description: Whole seconds to wait before retrying; present only when credential revocation is temporarily blocked.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Service unavailable, including when the cluster's credentials could not be revoked; the cluster is unchanged, so retry the delete.
          headers:
            Retry-After:
              description: Whole seconds to wait before retrying; present only when a retry interval is known.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/regions/{region}/projects/{project}/compute/clusters/{id}/scale:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique cluster identifier
    post:
      operationId: scaleCluster
      summary: Scale cluster node pools
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Change node counts on one or more materialized node pools and dispatch
        the asynchronous scale workflow — `cluster-deployment-scale-up` when the
        request grows pools, `cluster-deployment-scale-down` when it shrinks them.
        A scale-down selects which machines to remove (preferring not-Ready ones),
        deletes them at the CAPI level, and releases the freed servers from the
        reservation.

        Each `nodePools[]` entry supplies an absolute desired count (not a
        delta). Only the pools listed are affected; any pool omitted is left
        unchanged, and a request may target a single pool. A single request must
        move all the pools it lists in one direction. The request is rejected
        with `422` when duplicate pool ids are supplied, a
        pool id is unknown, any target equals the pool's settled `nodeCount`
        (nothing to scale), any target falls outside the bound ClusterType's
        configured node-count bounds (`nodeCountMin`/`nodeCountMax`, each enforced
        only when set — a pool with no `nodeCountMin` may scale to 0), the request
        mixes increases and
        decreases, or a pool has no bound infrastructure reservation
        (control-plane pools have none and cannot be scaled here); and with
        `409` when the cluster is not in the settled `active` state — i.e.
        another lifecycle operation (create, update, delete, or a concurrent
        scale) is already in flight, or the cluster is `failed`. The accepted
        scale atomically moves the cluster to `updating` and returns the
        in-flight snapshot.

        Returns the current cluster snapshot with in-flight targets in
        `nodePools[].targetNodeCount`. Poll `GET .../clusters/{id}` or the
        status stream until `targetNodeCount` is cleared.
      tags:
        - clusters
      x-visibility:
        - internal
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterScaleRequest'
      responses:
        '200':
          description: Scale accepted; cluster snapshot with in-flight targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Four distinct conflict cases on every cluster, and two more on the
            backing Cluster of a managed Control Platform (below):

            - The cluster is not in a scalable state — another lifecycle operation
              (create, update, delete, or a concurrent scale) is already in flight.
              Scale is admitted only from the settled `active` state; a `creating`,
              `updating`, `deleting`, or `failed` cluster is rejected here. No
              `reason`.
            - A previous size change (or the create itself) is still settling its
              quota accounting — a window of a few seconds after the cluster turns
              `active`. Retry shortly; the same request is then admitted. No
              `reason`.
            - `QUOTA_EXCEEDED`: a scale-up would exceed a
              node-count quota limit at the organization or the project scope (the
              limits are independent gates). `error.reason` is `QUOTA_EXCEEDED`
              and `error.details[]` carries one entry per refused dimension with
              `dimension`, `requested` (the aggregate node-count increase asked
              for across the request's pools), `admissible` (the largest such
              increase that would have been admitted), `bindingScope` and
              `scopes` — see `Error`. Both are increases, not target sizes: the
              request's pool targets are absolute, so to fit the client reduces
              the aggregate increase to at most `admissible` and re-derives its
              targets (a cluster at 4 nodes with requested 3 and admissible 1
              can scale to 5, not to 1). The target counts are not persisted and
              nothing is written; retrying without freeing capacity, without
              reducing the increase, or without raising the binding limit
              returns the same result. A scale-down is never quota-refused: the
              freed capacity is returned once the scale settles.
            - `QUOTA_UNASSIGNED`: the organization holds no quota limits
              while the platform requires them (a default profile is
              designated), so a scale-up is refused before any limit is
              measured. A scale-down is not refused.
              `error.reason` is `QUOTA_UNASSIGNED` with no `details[]`. Retrying
              returns the same result until an operator gives the organization
              limits, by applying a profile or setting them directly.

            On the backing Cluster of a managed Control Platform (operator-only),
            with the codes in `details[].reason` only and no top-level reason:

            - A scale-down whose remaining workers would not carry the placed
              hosted control planes: too little capacity
              (`INSUFFICIENT_CAPACITY`); fewer Ready, schedulable workers than the
              largest placed replica count, counted per HCPConfig over the workers
              carrying its `DoNotSchedule` topology keys (`TOO_FEW_NODES`); or not
              enough workers without etcd volumes to remove
              (`NODES_HOLD_ETCD_VOLUMES`, with how many can be removed and how many
              were asked in `metadata`). The message says how much capacity is in
              use and by how many control planes. Workers holding etcd volumes are
              never chosen for removal.
            - A scale-up above the region's limit on nodes per Control Platform,
              when set (`ADMISSION_LIMIT_REACHED`).

            **Not yet applied:** these backing-Cluster refusals are declared ahead of their
            implementation.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          description: |
            Target counts were persisted but the scale workflow could not
            be started (e.g. an upstream dependency was unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/regions/{region}/projects/{project}/compute/clusters/{clusterId}/kubeconfig:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: clusterId
        in: path
        required: true
        schema:
          type: string
        description: Unique cluster identifier
    get:
      operationId: getClusterKubeconfig
      summary: Get a ready-to-use kubeconfig for a cluster
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Returns a kubeconfig for the cluster, carrying a short-lived OIDC token
        minted for **you**, the calling principal, at request time.

        A cluster has exactly one kubeconfig, so this endpoint takes no kubeconfig
        identifier. It is the canonical spelling; the
        `.../kubeconfigs/{id}` and `.../kubeconfigs/{id}/download` operations are
        deprecated aliases that resolve to the same resource.

        The token reflects your own current org/project role membership, so two
        people calling this on the same cluster receive different access, and a
        role change takes effect on your next call. The stored kubeconfig resource
        grants nothing on its own; it is not a credential and does not need to be
        treated as a secret.

        The token is short-lived (the identity provider's access-token lifetime,
        typically ~15 minutes) and does not refresh: the returned file is a static
        kubeconfig, not one wired to an exec credential plugin. Call this endpoint
        again to get a working one. Because the body is a bearer credential it is
        returned with `Cache-Control: no-store`; do not cache or share it.

        Returns `404` when the cluster has no kubeconfig yet — one is created
        automatically when a cluster becomes active, so this is a transient state
        during provisioning. Returns `503` when the platform cannot currently mint
        a token.

        An API key receives a kubeconfig capped to the key's own roles rather than
        its owner's.

        A caller whose access comes from platform-scope roles and who holds no role
        in the cluster's organization or project gets `403`: provider-side roles
        alone do not grant access to a tenant cluster.

        `503` means the platform could not check membership or mint a token, not
        that access was refused. That includes a request for which the platform
        could not determine the organization that owns the project, since a token
        narrowed by project alone would still carry the caller's roles in every
        other organization they belong to.
      tags:
        - kubeconfigs
      x-visibility:
        - internal
        - public
      responses:
        '200':
          description: Kubeconfig body
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectRegionMismatch'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/regions/{region}/projects/{project}/compute/clusters/{id}/upgrade:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique cluster identifier
    post:
      operationId: upgradeCluster
      summary: Upgrade a cluster to a newer ClusterType version
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Rebinds a cluster to the immediate next version of its bound ClusterType
        (same ClusterType; switching to a different one is not supported, and a
        multi-version jump is not supported — upgrade always advances exactly
        one version) and dispatches the asynchronous `cluster-deployment-upgrade`
        workflow, which rebuilds and applies the target's ClusterDeployment chart
        config and cluster template directly. Node counts, reservations, and
        network topology are untouched (they are invariant within one ClusterType
        across versions).

        The cluster moves to `updating` while the single config is patched and
        reconciled. On success it returns to `active` with `clusterType` at the
        requested target. On failure it settles `failed` with `clusterType`
        unchanged at its pre-upgrade version, since nothing new ever landed. A
        `failed` cluster is **not** retryable via this call (upgrade is admitted
        only from `active`); reaching a version further ahead requires one
        UpgradeCluster call per step.

        A cluster with a hosted control plane is upgraded the same way, and its
        control plane keeps the settings its ClusterType's HCPConfig sets.
        **Not yet applied:** declared ahead of its implementation.
      tags:
        - clusters
      x-visibility:
        - internal
        - public
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeClusterRequest'
      responses:
        '200':
          description: Upgrade accepted; cluster snapshot with the in-flight target version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The cluster is not in an upgradable state. Upgrade is admitted only
            from the settled `active` state — a `creating`, `updating`, or
            `deleting` cluster (another lifecycle operation already in flight)
            is rejected, and so is a `failed` cluster (a prior mid-chain upgrade
            failure is not retryable via this call).

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          description: |
            The target version was staged but the upgrade workflow could not be
            started (e.g. an upstream dependency was unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/regions/{region}/projects/{project}/compute/clusters/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique cluster identifier
    post:
      operationId: cancelCluster
      summary: Cancel the in-flight cluster operation
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        Request that the operation the cluster is currently running be stopped. The
        cancel does not change the cluster's `state`: it asks the engine execution to
        stop and marks the operation cancelling, leaving the cluster in its
        transitional `state` while the run winds down. When the run ends the cluster
        settles the usual way: normally `failed` with `stateReason` `CANCELLED`
        (`operation.status` `cancelled`), also when the run ignores the stop and the
        watchdog force-fails it; but a run that completes before the stop takes
        effect settles `active` instead (`operation.status` `succeeded`). Wait for
        either settled state before deleting; a `DELETE` issued while the cluster is
        still cancelling is refused with `409`.

        Admitted only while an operation is in flight: the cluster must be
        `creating` or `updating`. The engine execution is asked to stop first; if
        that request cannot be delivered the cancel fails (`5xx`) and the cluster is
        left unchanged, so the caller can retry. Once the stop has been requested the
        cluster is returned in its transitional `state` with `operation.status`
        `cancelling`, and the response is `202`.

        The request body pins the operation to cancel: `executionId` must match the
        operation currently in flight, as read from the cluster's
        `operation.executionId`. This makes a cancel acted on a stale view safe — if
        the cluster has settled and begun a different operation since it was read,
        the cancel is refused rather than stopping the newer operation.

        Retrying the cancel — the same `executionId` on a cluster that has since
        settled `failed` with `operation.status` `cancelled` — returns `200` with
        that settled cluster, so the operation is idempotent; a cancel that lost to
        completion leaves nothing to cancel, so its retry is refused with `409` like
        any other settled cluster. Cancelling is rejected
        with `409` when the cluster is otherwise settled with nothing in flight
        (`active`, or `failed` from a different cause or operation), or is `deleting`,
        which has no cancel, or when `executionId` does not match the operation now
        in flight; the message names the blocking state. A missing or empty body is
        rejected with `400`. A cluster that has already been deleted is not found and
        returns `404`, like any unknown cluster.
      tags:
        - clusters
      x-visibility:
        - internal
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelClusterRequest'
      responses:
        '202':
          description: |
            Cancel accepted; the stop was requested and the operation is marked
            cancelling. The cluster is returned in its transitional `state`
            (`creating` or `updating`) with `operation.status` `cancelling`. Poll
            the cluster until it settles: normally `failed` with `operation.status`
            `cancelled`, or `active` with `operation.status` `succeeded` if the run
            completed before the stop took effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '200':
          description: |
            Returned when retrying a cancel that already succeeded — the same
            `executionId` on a cluster that has since settled to `failed` with
            `operation.status` `cancelled`. The settled cluster is returned, so the
            operation is idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such cluster in this project — either it never existed or it has
            already been deleted (a deleted cluster is not readable, so cancel
            reports it as not found rather than a conflict).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The cancel could not be applied to the requested operation:

            - the cluster is settled with nothing in flight — `active`, or `failed`
              from a different cause or operation than the requested `executionId`
              (a `cancelled` cluster retried with the matching `executionId` returns
              `200`, not `409`) — or it is `deleting`, which has no cancel; or
            - `executionId` does not match the operation now in flight — the cluster
              has settled and begun a different operation, or a wrong id was supplied
              (`details[].reason` is `CONFLICT_VERSION`). Re-read the cluster and
              retry against its current operation.

            The message names the blocking state and what is required.

            Also returned, with top-level `reason: PROJECT_REGION_MISMATCH`, when the project is locked to a different region than the one in the URL. A project's region is immutable once set, so address the project's own region instead of retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          description: |
            The stop could not be requested from the orchestration backend (e.g.
            it was unreachable). Nothing was changed — the cluster is
            left in its transitional state — so the request is safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
